    return BOARD_MAX_SIDE_PX / Math.max(maxFt, BOARD_MIN_EXTENT_FT);
}

// Pixel geometry for every board row: per-stop x (shared scale, anchor at 0),
// the baseline extents (padded to the minimum), and the terminal x.
// Compact rows (no pattern) carry no track.
function boardGeometry(rows) {
    const trackable = (r) => r && (r.kind === "track" || r.kind === "service") && r.pattern;
    const layouts = (rows || []).map(r => trackable(r) ? rowLayout(r.pattern, Math.max(0, r.anchorIdx | 0)) : null);
    const scale = boardScale(layouts.filter(Boolean));
    return {
        scale,
        rows: (rows || []).map((r, i) => {
            const l = layouts[i];
            if (!l || !r) return { row: r, hasTrack: false };
            const aIdx = Math.max(0, r.anchorIdx | 0);
            const stops = l.signed.map((v, j) => {
                const s = r.pattern.stops[j] || {};
                return { id: s.id, name: s.name, x: v * scale,
                         anchor: j === aIdx, terminal: j === l.termIdx };
            });
            return {
                row: r, hasTrack: true, mode: l.mode, stops,
                negPx: Math.max(l.negFt * scale, BOARD_MIN_EXTENT_PX),
                posPx: Math.max(l.posFt * scale, BOARD_MIN_EXTENT_PX),
                termX: stops[l.termIdx] ? stops[l.termIdx].x : 0,
                termId: stops[l.termIdx] ? stops[l.termIdx].id : ""
            };
        })
    };
}

// Piece 8: project an arbitrary (lat, lon) — a live vehicle sample — onto a
// row's track axis. Same convention as rowLayout: signed feet from the
// anchor along the path rowLayout used (the published shape in mode
// "shape", the ordered stop chain in mode "stops"); positive = past the
// anchor, negative = the approach side where approaching buses sit. Also
// returns `off`, the perpendicular distance (ft) from the sample to that
// path, so callers can reject samples that are really on a parallel road or
// a different branch of the same route.
function pointOnTrack(pattern, anchorIdx, mode, lat, lon) {
    if (!pattern || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
    const aIdx = Math.max(0, anchorIdx | 0);
    const useShape = mode === "shape" && pattern.shape && pattern.shape.length >= 2;
    let src = useShape ? pattern.shape : pattern.stops;
    if (useShape) src = src.filter(p => p && Number.isFinite(p.lat) && Number.isFinite(p.lon));
    if (src.length < 2) return null;
    const refPt = src.find(p => Number.isFinite(p.lat) && Number.isFinite(p.lon)) || src[0];
    const ref = { lat: refPt.lat, lon: refPt.lon };
    const cum = [0];
    for (let i = 1; i < src.length; i++) {
        const leg = Number.isFinite(src[i - 1].lat) && Number.isFinite(src[i].lat)
            ? distance(src[i - 1].lat, src[i - 1].lon, src[i].lat, src[i].lon, "f") : 0;
        cum.push(cum[i - 1] + leg);
    }
    const nearest = (pl, pn) => {
        const p = localXY({ lat: pl, lon: pn }, ref);
        let best = null;
        for (let i = 1; i < src.length; i++) {
            const a = localXY(src[i - 1], ref), b = localXY(src[i], ref);
            const dx = b.x - a.x, dy = b.y - a.y;
            const L2 = dx * dx + dy * dy;
            let t = L2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2 : 0;
            // off = perpendicular distance to the segment's LINE (unclamped
            // t), so a sample axially past an endpoint — a bus that has run
            // past the terminal — is not misread as off-route; the arc below
            // still uses the clamped t.
            const off = L2
                ? Math.abs((p.y - a.y) * dx - (p.x - a.x) * dy) / Math.sqrt(L2)
                : Math.hypot(p.x - a.x, p.y - a.y);
            const tc = Math.max(0, Math.min(1, t));
            const qx = a.x + tc * dx, qy = a.y + tc * dy;
            const d2 = (qx - p.x) * (qx - p.x) + (qy - p.y) * (qy - p.y);
            if (!best || d2 < best.d2)
                best = { d2, off, arc: cum[i - 1] + tc * (cum[i] - cum[i - 1]) };
        }
        return best ? { arc: best.arc, off: best.off } : null;
    };
    const n = nearest(lat, lon);
    if (!n) return null;
    const aStop = pattern.stops[aIdx];
    // In shape mode the anchor's arc is its projection on the shape — exactly
    // what trackArcs/projArcOnShape used to place the stop dots, so the
    // marker shares their scale; in stops mode the anchor IS a chain vertex.
    const anchorArc = useShape
        ? (aStop && Number.isFinite(aStop.lat) ? (nearest(aStop.lat, aStop.lon) || { arc: 0 }).arc : 0)
        : cum[aIdx] || 0;
    return { ft: n.arc - anchorArc, off: n.off };
}

// ── Board drawing (plan §3) ──────────────────────────────────────────
// One HTML row per pattern: a route badge, the final destination below it,
// then the ETAs (the first emphasized, the rest ascending), all left-aligned.
// The "View all stops" disclosure reveals the ordered stop list.

// "3 min" / "Due" — a zero-minute prediction reads "Due" (plan §2).
function fmtEta(min) {
    const m = Math.max(0, Math.round(min));
    return m === 0 ? "Due" : `${m} min`;
}

// The first ETA emphasized, the later ones muted after it
// ("6 min then 14 min, 29 min"). With no prediction but a scheduled arrival,
// show that clock time with a "not seen" suffix instead.
function boardEtasHtml(mins, scheduled, departedAt) {
    if (departedAt) {
        const ago = Math.max(0, Math.round((Date.now() - departedAt) / 60000));
        return `<span class="board-eta-first">Departed</span>`
            + (ago ? ` <span class="board-eta-rest">${ago} min ago</span>` : "");
    }
    const list = (mins || []).slice(0, 8);
    if (!list.length) {
        if (scheduled)
            return `<span class="board-eta-first">${esc(fmtScheduleTime(scheduled.at))}</span>`
                + ` <span class="board-eta-rest">not seen</span>`;
        return `<span class="board-eta-rest">no arrival or departure</span>`;
    }
    let h = `<span class="board-eta-first">${esc(fmtEta(list[0]))}</span>`;
    if (list.length > 1)
        h += `<span class="board-eta-rest">then ${list.slice(1).map(m => esc(fmtEta(m))).join(", ")}</span>`;
    return h;
}

// Piece 11: which rows the user expanded in the "View all stops" disclosure.
// The board re-renders every 30 s, so the open rows are remembered by key.
const expandedStops = new Set();
const rowKey = (r) => `${r.route}\u0000${String(r.dirNum ?? "")}\u0000${r.dest || ""}${r.departed ? "\u0000departed" : ""}`;

// One row's header: a route badge (white on the route color), the final
// destination below it, then the ETA list, all left-aligned from the badge.
// Track rows also carry the stop-list chevron on the route badge (piece 11).
function boardRowHead(row, color, g, k, scheduled) {
    const dest = (row.kind === "track" || row.kind === "service")
        ? (row.dest ? esc(row.dest) : "")
        : esc(row.dest || row.dir || "");
    const departed = !!row.departed;
    const arriving = !departed && row.mins && row.mins.length && row.mins[0] <= 1;
    const arrivingIcon = row.metro ? "fa-train-subway" : "fa-bus";
    const arrivingStyle = ` style="color:${color}"`;
    const statusIcon = departed
        ? `<i class="fa-solid fa-arrow-right-from-bracket bus-status departed" title="Departed" aria-label="Departed"></i>`
        : arriving
            ? `<i class="fa-solid ${arrivingIcon} bus-status arriving"${arrivingStyle} title="Arriving" aria-label="Arriving"></i>`
            : "";
    const badgeText = row.metro ? metroLineName(row.route) : row.route;
    const hasList = (g && g.hasTrack && (g.stops || []).length >= 2) ||
        (row.metro && row.toCode);
    const chevron = hasList
        ? ` <i class="fa-solid fa-chevron-down bt-chevron" aria-hidden="true"></i>`
        : "";
    const badgeClass = `row-badge${row.metro ? " metro-line" : busBadgeClass()}${departed ? " hollow" : ""}${hasList ? " bt-allstops" : ""}`;
    const badgeTag = hasList ? "button" : "span";
    const badgeAttrs = hasList
        ? ` type="button" class="${badgeClass}" aria-expanded="${expandedStops.has(k)}"`
        : ` class="${badgeClass}"`;
    const badgeInner = `${esc(badgeText)}${chevron}`;
    const hollowColor = row.metro ? color
        : (busTextColor(row.route) === "#000" ? "#000" : color);
    const badge = departed
        ? `<${badgeTag}${badgeAttrs} style="color:${hollowColor};border-color:${color}">${badgeInner}</${badgeTag}>`
        : `<${badgeTag}${badgeAttrs} style="background:${color};color:${row.metro ? "#fff" : busTextColor(row.route)}">${badgeInner}</${badgeTag}>`;
    return `<div class="board-head">`
        + `<span class="row-badge-wrap">${badge}</span>`
        + `<div class="row-mainline">`
        + (dest ? `<span class="board-dest">${dest}</span>` : `<span class="board-dest">Destination unavailable</span>`)
        + statusIcon
        + `</div>`
        + ((row.mins && row.mins.length) || (g && g.hasTrack) || scheduled || departed
            ? `<span class="board-etas">${boardEtasHtml(row.mins, scheduled, row.departedAt)}</span>` : "")
        + `</div>`;
}

// The whole board as HTML: one row block per pattern (badge, destination,
// ETAs, and the optional stop list). The caller wraps the result in the
// shared scroll container.
function boardHtml(geom, rows) {
    let out = "";
    for (let i = 0; i < (rows || []).length; i++) {
        const row = rows[i], g = geom.rows[i];
        const color = routeColor(row.route);
        row.anchorId = (row.anchorPatStop || {}).id || row.anchorId;
        const k = rowKey(row);
        const open = expandedStops.has(k);
        // No live prediction for this row? Fall back to the stop's next
        // scheduled arrival, matched by route (+ direction). Departed rows
        // keep their own status instead.
        const scheduled = (!row.departed && (!row.mins || !row.mins.length))
            ? (row.scheduled || nextScheduledFor(row.anchorId, row.route, row.dirNum, row.dest))
            : null;
        // Piece 11: the ordered stop list behind the badge chevron.
        // No numeric index; each stop is a button that re-anchors the board.
        const list = g && g.hasTrack && (g.stops || []).length >= 2
            ? `<ul class="bt-stoplist"${open ? "" : " hidden"}>`
              + g.stops.map(s => {
                  const mark = s.anchor ? ` <b class="bt-mark">your stop</b>`
                     : s.terminal ? ` <b class="bt-mark">terminal</b>` : "";
                  return `<li class="bt-stop-item" role="button" tabindex="0" data-stop="${esc(s.id)}">`
                      + `${favStarHtml("bus", s.id, s.name, row.route)}`
                      + `<span class="bt-stop-name">${esc(stopName(s.name) || "#" + s.id)} <small>(${esc(s.id)})</small>${mark}</span>`
                      + `<span class="fav-conns" data-conn="${esc(s.id)}" data-conn-kind="bus"></span></li>`;
                }).join("") + `</ul>`
            : "";
        const rowClass = row.departed ? " is-departed" : (scheduled ? " is-scheduled" : "");
        out += `<div class="board-row${rowClass}" data-rowkey="${encodeURIComponent(k)}">`
            + `${boardRowHead(row, color, g, k, scheduled)}${list}</div>`;
    }
    return `<div class="board">${out}</div>`;
}

// ════════════════════════════════════════════════════════════════════
// Flow
// ════════════════════════════════════════════════════════════════════

function makeStop(id, name, lat, lon) {
    return { StopID: id, Name: name, Lat: lat, Lon: lon, Distance: null, Routes: [], Arrivals: [], Departed: [], ArrivalsAt: 0, Error: null };
}

// One shared object per nearby stop, so predictions fetched for a secondary
// section survive re-renders and match what that stop shows when selected.
function nearbyStopObj(n) {
    const id = String(n.id);
    let s = stops.find(x => String(x.StopID) === id) || nearbyStopObjs.get(id);
    if (!s) {
        s = makeStop(id, n.name || null, n.lat, n.lon);
        nearbyStopObjs.set(id, s);
    }
    if (!s.Name && n.name) s.Name = n.name;
    if (s.Lat == null && n.lat != null) s.Lat = n.lat;
    if (s.Lon == null && n.lon != null) s.Lon = n.lon;
    if (n.routes) s.Routes = n.routes;
    return s;
}

// Full (re)load: resolve the stop list, paint the stop names immediately, then
// fetch its arrivals in the background and repaint when they land.
async function runFlow() {
    if (busy) return;                    // don't stack flows when buttons are clicked
    busy = true;
    try {
        resetPick();                     // a new flow starts from the session's list (any picked stop is undone)
        noteSelectionChange();           // void the old counterpart + any in-flight refresh
        scrollPageTop();
        // Boston has no fixed default stop: start from downtown when there is
        // no saved Home bookmark and no URL/search point.
        if (!stopListFromURL && !searchPoint && isBoston()
            && !(shortcuts.home && shortcuts.home.id)) {
            searchPoint = { lat: cityHome().lat, lon: cityHome().lon };
        }
        if (stopListFromURL && !forceNearby) {
            // ?busstop= given: use it as-is, ignore lat/lon (as documented).
            // Coordinates stay null — the arrivals list never needs them,
            // and the stop directory (the jStops dump) is the coord source.
            stops = stopListFromURL.map(id => makeStop(id, null, null, null));
        } else if (!searchPoint) {
            // First load (or a cleared view): the saved home shortcut if one
            // exists, otherwise the default 20010 stop. Coordinates come from
            // the directory once it has loaded.
            const home = shortcuts.home;
            stops = home && home.id
                ? [makeStop(String(home.id), home.name || null, null, null)]
                : [defaultStopRec()];
        } else {
            // ?lat&lon URL point: find stops near the search point
            const center = isBoston() ? cityCfg().metroCenter : DC_CENTER;
            const d = distance(center.lat, center.lon, searchPoint.lat, searchPoint.lon, "m");
            const at = d > 50 ? center : searchPoint;     // far from the city → search its center
            const where = isBoston() ? "downtown Boston" : "the Whitehouse";
            gStatus.textContent = `${d.toFixed(1)} mi to ${where}` + (at === center ? " (searching city center)" : "") + " …";
            const raw = await fetchStopsNear(at.lat, at.lon, gRadius);
            // Distance is measured from the point we actually searched —
            // NOT from the HOME default, so the URL-point view is honest.
            stops = raw
                .map(s => {
                    const stop = makeStop(s.StopID, s.Name, s.Lat, s.Lon);
                    stop.Distance = distance(at.lat, at.lon, s.Lat, s.Lon, "f");
                    stop.Routes = s.Routes || [];
                    return stop;
                })
                .sort((a, b) => a.Distance - b.Distance);   // sorted; one array, so no index drift
            if (!stops.length) {
                gStatus.textContent = `No stops within ${gRadius} m — try ?radius=600`;
                stops = [];
            }
        }
        // ?busstop= deep link: prefill the entry field with the FIRST listed
        // stop before the first paint, so the initial anchor is correct even
        // while arrivals are still loading. ✕ returns to the nearby search
        // (forceNearby, since the URL would otherwise pick the same stop).
        if (stopListFromURL && stopListFromURL.length && !forceNearby && !pickedStop && stops[0]) {
            const s = stops[0];
            pickedStop = s.StopID;
            acStop.setPicked(true);
        }
        // Paint the stop names immediately; arrivals are fetched in the
        // background and repaint when they land.
        renderLines();
        refreshPredictions().catch(() => {});
    } catch (e) {
        // Stops lookup failed (bad key / network): keep whatever is shown.
        gStatus.textContent = `Could not reach ${isBoston() ? "MBTA" : "WMATA"}: ${e.message}`;
    } finally {
        busy = false;
        scheduleRefresh();
    }
}

// ════════════════════════════════════════════════════════════════════
// Metro rail
// ════════════════════════════════════════════════════════════════════

function normalizeMetroStation(s) {
    const lines = [s.LineCode1, s.LineCode2, s.LineCode3, s.LineCode4].filter(Boolean);
    return { Code: String(s.Code || ""), Name: s.Name || "",
             Lat: Number(s.Lat), Lon: Number(s.Lon), Lines: lines, distFt: null };
}

function loadMetroRoutes() {
    if (!isBoston()) return Promise.resolve(null);
    if (metroRoutesCache) return Promise.resolve(metroRoutesCache);
    if (metroRoutesLoad) return metroRoutesLoad;
    metroRoutesLoad = mbtaGet("/routes", { "filter[type]": "0,1", "page[limit]": 50 })
        .then(({ data, error }) => {
            if (error) throw error;
            const map = {};
            for (const r of (data && data.data) || []) {
                map[r.id] = {
                    name: /^Green-/.test(r.id)
                        ? "Green " + (r.attributes.short_name || r.id.replace(/^Green-/, ""))
                        : (r.attributes.short_name || r.id),
                    color: r.attributes.color || "5d4037",
                    destinations: r.attributes.direction_destinations || []
                };
            }
            metroRoutesCache = map;
            return map;
        })
        .finally(() => { metroRoutesLoad = null; });
    return metroRoutesLoad;
}

function loadMetroStations() {
    if (metroStationsCache) return Promise.resolve(metroStationsCache);
    if (metroStationsLoad) return metroStationsLoad;
    if (isBoston()) {
        metroStationsLoad = (async () => {
            const lines = await loadMetroRoutes();
            const found = new Map();
            await Promise.all(Object.keys(lines).map(async line => {
                const { data, error } = await mbtaGet("/stops", {
                    "filter[route]": line,
                    "filter[location_type]": 1,
                    "page[limit]": 300
                });
                if (error) return;
                for (const s of (data && data.data) || []) {
                    let st = found.get(s.id);
                    if (!st) {
                        st = {
                            Code: s.id, Name: s.attributes.name || "",
                            Lat: Number(s.attributes.latitude),
                            Lon: Number(s.attributes.longitude),
                            Lines: [], distFt: null
                        };
                        found.set(s.id, st);
                    }
                    if (!st.Lines.includes(line)) st.Lines.push(line);
                }
            }));
            metroStationsCache = [...found.values()]
                .filter(s => s.Code && Number.isFinite(s.Lat) && Number.isFinite(s.Lon));
            const order = Object.keys(lines);
            for (const st of metroStationsCache)
                st.Lines.sort((a, b) => order.indexOf(a) - order.indexOf(b));
            return metroStationsCache;
        })().finally(() => { metroStationsLoad = null; });
        return metroStationsLoad;
    }
    metroStationsLoad = apiGet("/Rail.svc/json/jStations", {})
        .then(({ data, error }) => {
            if (error) throw error;
            metroStationsCache = ((data && data.Stations) || [])
                .map(normalizeMetroStation)
                .filter(s => s.Code && Number.isFinite(s.Lat) && Number.isFinite(s.Lon));
            return metroStationsCache;
        })
        .finally(() => { metroStationsLoad = null; });
    return metroStationsLoad;
}

function metroRefPoint() {
    if (searchPoint) return searchPoint;
    const st = anchorStop();
    if (st && st.Lat != null && st.Lon != null)
        return { lat: Number(st.Lat), lon: Number(st.Lon) };
    return isBoston() ? cityCfg().metroCenter : HOME;
}

function populateMetroSelect(stations) {
    if (!gMetroSelect) return;
    gMetroSelect.innerHTML = stations.slice()
        .sort((a, b) => String(a.Name).localeCompare(String(b.Name)))
        .map(s => `<option value="${esc(s.Code)}">${esc(stopName(s.Name) || s.Code)}</option>`)
        .join("");
    if (metroAnchor) gMetroSelect.value = metroAnchor.Code;
}

// Switch mode and update the chrome. Deliberately starts no data flow, so a
// caller can pick the destination first and then run exactly one flow.
function applyMode(next) {
    if (next !== "bus" && next !== "metro") return false;
    const changed = next !== mode;
    mode = next;
    writeModeCookie();
    shortcuts = readShortcutCookie();
    updateShortcutNav();
    if (changed) {
        expandedStops.clear();
        gBoardHeader.innerHTML = "";
        gLinesScroll.innerHTML = "";
        gLinesNote.textContent = "";
        showBoardView();
        scrollPageTop();
    }
    return changed;
}

function setMode(next) {
    if (next !== "bus" && next !== "metro") return;
    if (next === mode) return;
    applyMode(next);
    if (mode === "bus") {
        if (allStopsCache) populateBusRoutes(allStopsCache);
        runFlow();
    } else { metroAnchorCode = null; runMetro(); }
}

// City switching: every city has its own data caches, favorites, and
// Home/Work bookmarks. Called from Settings and from "Near me".
function clearCityCaches() {
    allStopsCache = null;
    stopDirLoad = null;
    dirNameIndex = null;
    busRouteDirectory = null;
    busRouteLoad = null;
    busRouteMbtaIds = {};
    busRouteColors = {};
    metroStationsCache = null;
    metroStationsLoad = null;
    metroRoutesCache = null;
    metroRoutesLoad = null;
    metroLive = {};
    metroLiveError = {};
    metroSchedule = {};
    metroAnchor = null;
    metroNearby = [];
    metroAnchorCode = null;
    for (const k of Object.keys(metroPathCache)) delete metroPathCache[k];
    for (const k of Object.keys(routeDetailsCache)) delete routeDetailsCache[k];
    for (const k of Object.keys(stopScheduleCache)) delete stopScheduleCache[k];
    nearbyStopObjs.clear();
    expandedStops.clear();
    stopConnections.clear();
    favBusFilterToken++;
    stops = [];
    pickedStop = null;
    pickedStopObj = null;
    searchPoint = null;
    forceNearby = false;
    boardToken++;
}

function setCity(next, opts) {
    if (!CITIES[next]) return;
    if (next === city) {
        if (gCitySelect) gCitySelect.value = city;
        return;
    }
    city = next;
    writeCityCookie();
    favorites = readFavorites();
    if (isBoston() && !favorites.length) {
        favorites = [defaultFavorite()];
        writeFavorites();
    }
    shortcuts = readShortcutCookie();
    clearCityCaches();
    screenHistory = [];
    currentScreen = null;
    historyGuard = false;
    updateBackButton();
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = null;
    nextRefreshAt = 0;
    gBoardHeader.innerHTML = "";
    gLinesScroll.innerHTML = "";
    gLinesNote.textContent = "";
    if (gCitySelect) gCitySelect.value = city;
    updateShortcutNav();
    tickClock();
    if (!opts || !opts.keepPanel) {
        favNearToken++;
        closeFavPanel();
    }
    renderBookmarkList("fav");
}

async function runMetro() {
    gLinesNote.textContent = "loading Metro stations…";
    try {
        const all = await loadMetroStations();
        populateMetroSelect(all);
        const ref = metroRefPoint();
        let anchor = metroAnchorCode ? all.find(s => s.Code === metroAnchorCode) : null;
        if (!anchor) {
            anchor = all.slice().sort((a, b) =>
                distance(ref.lat, ref.lon, a.Lat, a.Lon, "f") -
                distance(ref.lat, ref.lon, b.Lat, b.Lon, "f"))[0];
        }
        if (!anchor) { gLinesNote.textContent = "no Metro stations found"; return; }
        setMetroAnchor(anchor.Code);
    } catch (e) {
        gStatus.textContent = `Could not load Metro: ${e.message}`;
        gLinesNote.textContent = "Metro data unavailable";
    }
}

function setMetroAnchor(code) {
    const all = metroStationsCache || [];
    const anchor = all.find(s => s.Code === String(code));
    if (!anchor) return;
    showBoardView();
    metroAnchorCode = anchor.Code;
    metroAnchor = Object.assign({}, anchor, { distFt: 0 });
    enterScreen({ type: "board", mode: "metro", id: anchor.Code, name: anchor.Name || "" });
    if (gMetroSelect) gMetroSelect.value = anchor.Code;
    expandedStops.clear();
    scrollPageTop();
    metroNearby = all.filter(s => s.Code !== anchor.Code)
        .map(s => Object.assign({}, s, {
            distFt: distance(anchor.Lat, anchor.Lon, s.Lat, s.Lon, "f")
        }))
        .filter(s => s.distFt <= METRO_NEARBY_FT)
        .sort((a, b) => a.distFt - b.distFt)
        .slice(0, 3);
    renderMetro();
    refreshMetro();
}

function metroMin(v) {
    if (v === "BRD" || v === "ARR") return 0;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
}

async function fetchMbtaMetroLive(codes) {
    const { data, error } = await mbtaGet("/predictions", {
        "filter[stop]": codes.join(","),
        "filter[route_type]": "0,1",
        "include": "route,trip,stop",
        "page[limit]": 300
    });
    if (error) throw error;
    const inc = mbtaIncluded(data);
    const by = {};
    for (const c of codes) by[c] = [];
    for (const p of (data && data.data) || []) {
        const a = p.attributes || {};
        const at = Date.parse(a.departure_time || a.arrival_time || "");
        if (!Number.isFinite(at)) continue;
        const rels = p.relationships || {};
        const stopRel = rels.stop && rels.stop.data;
        const stop = inc.get("stop:" + (stopRel && stopRel.id));
        const parent = stop && stop.relationships && stop.relationships.parent_station
            && stop.relationships.parent_station.data;
        const code = (parent && parent.id) || (stopRel && stopRel.id);
        if (!by[code]) continue;
        const routeRel = rels.route && rels.route.data;
        const route = inc.get("route:" + (routeRel && routeRel.id));
        const tripRel = rels.trip && rels.trip.data;
        const trip = inc.get("trip:" + (tripRel && tripRel.id));
        const heads = (trip && trip.attributes && trip.attributes.headsign) ||
            ((route && route.attributes && (route.attributes.direction_destinations || [])[a.direction_id]) || "");
        by[code].push({
            min: Math.max(0, Math.round((at - Date.now()) / 60000)),
            route: (routeRel && routeRel.id) || "",
            dir: heads, heads, dirNum: String(a.direction_id == null ? "" : a.direction_id),
            vehicle: null, trip: (tripRel && tripRel.id) || null
        });
    }
    for (const c of codes) by[c].sort((a, b) => a.min - b.min);
    return by;
}

async function fetchMetroLive(codes) {
    if (isBoston()) return fetchMbtaMetroLive(codes);
    const { data, error } = await apiGet(
        "/StationPrediction.svc/json/GetPrediction/" + codes.join(","), {});
    if (error) throw error;
    const by = {};
    for (const t of (data && data.Trains) || []) {
        const min = metroMin(t.Min);
        const code = String(t.LocationCode || "");
        const line = String(t.Line || "").toUpperCase();
        const dest = t.DestinationName || t.Destination || "";
        if (min == null || !code || !line || line === "NO" || /no passenger/i.test(dest))
            continue;
        (by[code] || (by[code] = [])).push({
            min, route: line,
            dir: dest, heads: dest,
            dirNum: t.Group != null ? String(t.Group) : "",
            vehicle: null, trip: null
        });
    }
    for (const code of Object.keys(by)) by[code].sort((a, b) => a.min - b.min);
    return by;
}

function metroRowsFor(station, skipFirst) {
    const now = Date.now();
    let live = metroLive[station.Code] || [];
    if (skipFirst && live.length) {
        const next = live.reduce((best, t) =>
            !best || t.min < best.min ? t : best, null);
        const key = t => t.route + "|" + (t.dirNum || "") + "|" + t.heads;
        live = live.filter(t => key(t) !== key(next));
    }
    const rows = [];
    const groups = new Map();
    for (const t of live) {
        const key = t.route + "|" + (t.dirNum || "") + "|" + t.heads;
        let r = groups.get(key);
        if (!r) {
            r = { kind: "compact", route: t.route, dirNum: t.dirNum || "",
                  dest: t.heads, mins: [], first: 0, metro: true,
                  fromCode: station.Code, toCode: metroDestCode(t.heads) };
            groups.set(key, r);
            rows.push(r);
        }
        r.mins.push(t.min);
    }
    for (const r of rows) {
        r.mins.sort((a, b) => a - b);
        r.first = r.mins[0];
    }
    const liveHeads = rows.map(r => ({ route: r.route, heads: normHeads(r.dest) }));
    const sched = (metroSchedule[station.Code] || [])
        .filter(d => d.at >= now).sort((a, b) => a.at - b.at);
    const schedGroups = new Map();
    for (const d of sched) {
        const dh = normHeads(d.heads);
        if (liveHeads.some(l => l.route === d.route &&
            metroHeadsMatch(l.heads, dh))) continue;
        const key = d.route + "|" + dh;
        const prev = schedGroups.get(key);
        if (!prev || d.at < prev.scheduled.at)
            schedGroups.set(key, {
                kind: "service", route: d.route, dirNum: d.dirNum || "",
                dest: d.heads, mins: [], first: 0, metro: true,
                fromCode: station.Code, toCode: metroDestCode(d.heads),
                scheduled: { at: d.at }
            });
    }
    rows.push(...schedGroups.values());
    sortRowsBySoonest(rows, station.Code, now);
    return rows;
}

function metroDestCode(name) {
    const stations = metroStationsCache || [];
    const hit = stations.find(s => metroHeadsMatch(s.Name, name));
    return hit ? hit.Code : "";
}

async function fetchMetroPath(from, to, line) {
    const key = from + "|" + to + "|" + (line || "");
    if (metroPathCache[key]) return metroPathCache[key];
    if (metroPathInflight[key]) return metroPathInflight[key];
    const p = (isBoston()
        ? fetchMbtaMetroPath(from, to, line)
        : apiGet("/Rail.svc/json/jPath", { FromStationCode: from, ToStationCode: to })
            .then(({ data, error }) => {
                if (error) throw error;
                return (data && data.Path) || [];
            }))
        .then(path => {
            metroPathCache[key] = path;
            return path;
        })
        .finally(() => { delete metroPathInflight[key]; });
    metroPathInflight[key] = p;
    return p;
}

// Boston: use a representative trip for the line/direction whose ordered
// stops contain both the boarding station and the destination.
async function fetchMbtaMetroPath(from, to, line) {
    const { data: rp, error } = await mbtaGet("/route_patterns", {
        "filter[route]": line
    });
    if (error) throw error;
    for (const p of (rp && rp.data) || []) {
        const tripId = p.relationships && p.relationships.representative_trip &&
            p.relationships.representative_trip.data.id;
        if (!tripId) continue;
        const { data: tr, error: e2 } = await mbtaGet(`/trips/${tripId}`, {
            include: "stops"
        });
        if (e2 || !tr) continue;
        const inc = new Map(((tr.included) || [])
            .filter(i => i.type === "stop").map(s => [s.id, s]));
        const rel = tr.data.relationships && tr.data.relationships.stops;
        const ids = [];
        for (const x of ((rel && rel.data) || [])) {
            const s = inc.get(x.id);
            const p = s && s.relationships && s.relationships.parent_station
                && s.relationships.parent_station.data;
            const id = p ? p.id : x.id;
            if (ids[ids.length - 1] !== id) ids.push(id);
        }
        const a = ids.indexOf(from), b = ids.indexOf(to);
        if (a < 0 || b < 0) continue;
        const slice = a <= b ? ids.slice(a, b + 1) : ids.slice(b, a + 1).reverse();
        return slice.map(id => {
            const st = (metroStationsCache || []).find(s => s.Code === id);
            return {
                StationCode: id,
                StationName: (st && st.Name) || allStopsName(id) || id
            };
        });
    }
    return [];
}

async function refreshBoardStopConnections() {
    const nodes = [...gLinesScroll.querySelectorAll(".fav-conns[data-conn]")];
    await Promise.all(nodes.map(async el => {
        const conns = await fetchStopConnections(
            el.dataset.connKind || "bus", el.dataset.conn);
        if (el.parentNode) el.innerHTML = connectionBadgesHtml(conns);
    }));
}

async function loadMetroStops(ul) {
    const from = ul.dataset.metroFrom, to = ul.dataset.metroTo;
    if (!from || !to) { ul.innerHTML = ""; return; }
    ul.dataset.loaded = "1";
    ul.innerHTML = `<li class="bt-stop-item">loading stops…</li>`;
    try {
        const line = ul.dataset.line || "";
        const path = await fetchMetroPath(from, to, line);
        const conns = new Map();
        await Promise.all(path.map(async p => {
            conns.set(p.StationCode, await fetchStopConnections("metro", p.StationCode));
        }));
        ul.innerHTML = path.map(p => {
            const mark = p.StationCode === from ? ` <b class="bt-mark">your stop</b>`
                : p.StationCode === to ? ` <b class="bt-mark">terminal</b>` : "";
            const badges = connectionBadgesHtml(conns.get(p.StationCode));
            return `<li class="bt-stop-item" role="button" tabindex="0" data-stop="${esc(p.StationCode)}">`
                + `${favStarHtml("metro", p.StationCode, p.StationName, line)}`
                + `<span class="bt-stop-name">${esc(stopName(p.StationName))} <small>(${esc(p.StationCode)})</small>${mark}</span>`
                + (badges ? `<span class="fav-conns">${badges}</span>` : "")
                + `</li>`;
        }).join("");
    } catch (e) {
        ul.innerHTML = `<li class="bt-stop-item">could not load stops</li>`;
    }
}

function metroHeadsMatch(a, b) {
    const A = normHeads(a), B = normHeads(b);
    if (!A || !B) return false;
    if (A === B || A.includes(B) || B.includes(A)) return true;
    const n = Math.min(6, A.length, B.length);
    return n >= 5 && A.slice(0, n) === B.slice(0, n);
}

function renderMetro() {
    const station = metroAnchor;
    if (!station) {
        gBoardHeader.innerHTML = "";
        gLinesScroll.innerHTML = "";
        gLinesNote.textContent = "no Metro station selected";
        return;
    }
    const now = Date.now();
    const live = (metroLive[station.Code] || []).slice().sort((a, b) => a.min - b.min);
    const nextSched = (metroSchedule[station.Code] || [])
        .filter(d => d.at >= now).sort((a, b) => a.at - b.at)[0] || null;
    const headSt = {
        StopID: station.Code, Name: station.Name, Metro: true,
        Lines: station.Lines || [],
        MetroScheduledNext: nextSched
            ? { at: nextSched.at, route: nextSched.route, heads: nextSched.heads }
            : null,
        Error: metroLiveError[station.Code] || null
    };
    gBoardHeader.innerHTML = heroCardHtml(headSt, live);
    const rowsHtml = (rows) => rows.map(r => {
        const key = rowKey(r);
        const open = expandedStops.has(key);
        const list = r.metro && r.toCode
            ? `<ul class="bt-stoplist"${open ? "" : " hidden"}`
              + ` data-metro-from="${esc(r.fromCode || "")}" data-metro-to="${esc(r.toCode)}"`
              + ` data-line="${esc(r.route || "")}">`
              + (open ? `<li class="bt-stop-item">loading stops…</li>` : "")
              + `</ul>`
            : "";
        return `<div class="board-row${r.scheduled ? " is-scheduled" : ""}"`
            + ` data-rowkey="${encodeURIComponent(key)}">`
            + boardRowHead(r, metroLineColor(r.route), null, key, r.scheduled)
            + list + `</div>`;
    }).join("");
    const mainRows = metroRowsFor(station, true);
    const mainHtml = mainRows.length
        ? `<div class="main-board"><div class="board">${rowsHtml(mainRows)}</div></div>`
        : "";
    let nearbyHtml = "";
    for (const stn of metroNearby) {
        const dist = stn.distFt == null ? ""
            : (stn.distFt < 5280 ? `${Math.round(stn.distFt)} ft away`
                                 : `${(stn.distFt / 5280).toFixed(1)} mi away`);
        nearbyHtml += `<div class="nearby-stop-card nearby-metro" role="button" tabindex="0" data-metro="1" data-stop="${esc(stn.Code)}">`
            + `<span class="hero-line-band" style="background:${metroLineColor((stn.Lines || [])[0] || "")}"></span>`
            + `<div class="nearby-card-head"><div class="nearby-card-main">`
            + `<div class="nearby-card-title">${esc(stopName(stn.Name) || stn.Code)}</div>`
            + `<div class="nearby-card-sub">${esc([dist, "#" + stn.Code].filter(Boolean).join(" · "))}</div>`
            + `</div></div></div>`;
        const rows = metroRowsFor(stn);
        if (rows.length)
            nearbyHtml += `<div class="nearby-board"><div class="board">${rowsHtml(rows)}</div></div>`;
    }
    gLinesScroll.innerHTML = mainHtml + nearbyHtml;
    gLinesNote.textContent = "";
    if (gLinesScroll.querySelectorAll) {
        gLinesScroll.querySelectorAll(".bt-stoplist[data-metro-from]").forEach(ul => {
            if (!ul.hidden && !ul.dataset.loaded) loadMetroStops(ul);
        });
    }
}

async function refreshMetro() {
    if (metroRefreshInFlight) { metroRefreshQueued = true; return; }
    metroRefreshInFlight = true;
    try {
        const stations = [metroAnchor, ...metroNearby].filter(Boolean);
        if (!stations.length) return;
        const codes = [...new Set(stations.map(s => s.Code))];
        const liveP = fetchMetroLive(codes)
            .then(live => { metroLive = live; metroLiveError = {}; })
            .catch(e => { for (const c of codes) metroLiveError[c] = e; });
        const schedP = ensureMetroSchedule(codes)
            .then(sched => { metroSchedule = sched; })
            .catch(() => {});
        await liveP;
        if (mode !== "metro") return;
        lastRefreshAt = Date.now();
        renderMetro();
        tickClock();
        scheduleRefresh();
        await schedP;
        if (mode !== "metro") return;
        renderMetro();
    } finally {
        metroRefreshInFlight = false;
        if (metroRefreshQueued) {
            metroRefreshQueued = false;
            if (mode === "metro") refreshMetro();
        }
    }
}

function refreshActive() {
    return mode === "metro" ? refreshMetro() : refreshPredictions();
}

// ── Rail GTFS schedules (for "not seen" departures) ───────────────────
// The rail GTFS static zip is downloaded once per page session; schedule
// rows are cached per station/day.
let metroGtfs = null;
let metroGtfsLoad = null;
const metroScheduleCache = {};
const GTFS_LINES = { RED: "RD", BLUE: "BL", ORANGE: "OR",
                     SILVER: "SV", GREEN: "GR", YELLOW: "YL" };

function gtfsCsvFields(line) {
    const out = [];
    let cur = "", quoted = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (quoted) {
            if (c === '"') {
                if (line[i + 1] === '"') { cur += '"'; i++; }
                else quoted = false;
            } else cur += c;
        } else if (c === '"') quoted = true;
        else if (c === ",") { out.push(cur); cur = ""; }
        else cur += c;
    }
    out.push(cur);
    return out;
}

function zipU32(dv, off) {
    return dv.getUint32(off, true);
}

async function inflateRaw(bytes) {
    if (typeof DecompressionStream !== "function") return null;
    const ds = new DecompressionStream("deflate-raw");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzipEntries(buf) {
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
        if (zipU32(dv, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("bad zip");
    const count = dv.getUint16(eocd + 10, true);
    let p = zipU32(dv, eocd + 16);
    const entries = {};
    for (let i = 0; i < count; i++) {
        if (zipU32(dv, p) !== 0x02014b50) break;
        const method = dv.getUint16(p + 10, true);
        const compSize = zipU32(dv, p + 20);
        const nameLen = dv.getUint16(p + 28, true);
        const extraLen = dv.getUint16(p + 30, true);
        const commentLen = dv.getUint16(p + 32, true);
        const localOff = zipU32(dv, p + 42);
        const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nameLen));
        p += 46 + nameLen + extraLen + commentLen;
        const lNameLen = dv.getUint16(localOff + 26, true);
        const lExtraLen = dv.getUint16(localOff + 28, true);
        const dataStart = localOff + 30 + lNameLen + lExtraLen;
        entries[name] = { method, comp: new Uint8Array(buf, dataStart, compSize) };
    }
    return entries;
}

async function gtfsText(entries, name) {
    const e = entries[name];
    if (!e) return "";
    if (e.method === 0) return new TextDecoder().decode(e.comp);
    const raw = await inflateRaw(e.comp);
    return raw ? new TextDecoder().decode(raw) : "";
}

function gtfsTimeToMs(hms) {
    const parts = String(hms || "").split(":").map(Number);
    if (parts.length < 2 || parts.some(n => !Number.isFinite(n))) return NaN;
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime() + ((parts[0] * 3600 + parts[1] * 60 + (parts[2] || 0)) * 1000);
}

async function loadMetroGtfs() {
    if (metroGtfs) return metroGtfs;
    if (metroGtfsLoad) return metroGtfsLoad;
    metroGtfsLoad = (async () => {
        const res = await fetch(`${WMATA_API}/gtfs/rail-gtfs-static.zip?api_key=${encodeURIComponent(API_KEY)}`);
        if (!res.ok) throw new Error("GTFS " + res.status);
        const entries = await unzipEntries(await res.arrayBuffer());
        const [tripsText, stopTimesText, calText] = await Promise.all([
            gtfsText(entries, "trips.txt"),
            gtfsText(entries, "stop_times.txt"),
            gtfsText(entries, "calendar_dates.txt")
        ]);
        const d = new Date();
        const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
        const active = new Set();
        for (const line of calText.split("\n")) {
            if (!line.trim()) continue;
            const f = gtfsCsvFields(line);
            if (f[1] !== ymd) continue;
            if (f[2] === "1") active.add(f[0]);
            else if (f[2] === "2") active.delete(f[0]);
        }
        const trips = new Map();
        for (const line of tripsText.split("\n")) {
            if (!line.trim()) continue;
            const f = gtfsCsvFields(line);
            if (!active.has(f[1])) continue;
            trips.set(f[2], {
                route: GTFS_LINES[f[0]] || f[0],
                heads: f[3] || "",
                dir: f[4] || ""
            });
        }
        return { stopTimesText, trips };
    })()
      .then(g => { metroGtfs = g; return g; })
      .finally(() => { metroGtfsLoad = null; });
    return metroGtfsLoad;
}

async function ensureMetroSchedule(codes) {
    if (isBoston()) return {};   // Boston uses live MBTA predictions only
    const d = new Date();
    const day = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    if (codes.every(c => metroScheduleCache[c] && metroScheduleCache[c].day === day)) {
        const out = {};
        for (const c of codes) out[c] = metroScheduleCache[c].departures;
        return out;
    }
    const gtfs = await loadMetroGtfs();
    const codeSet = new Set(codes);
    const by = {};
    for (const c of codes) by[c] = [];
    const now = Date.now(), horizon = now + 4 * 3600 * 1000;
    for (const line of gtfs.stopTimesText.split("\n")) {
        if (!line) continue;
        const f = line.split(",");
        if (f.length < 4) continue;
        const m = /^(?:PF|PLF)_([A-Z][0-9]{2})_/.exec(f[3]);
        if (!m || !codeSet.has(m[1])) continue;
        const trip = gtfs.trips.get(f[0]);
        if (!trip) continue;
        const at = gtfsTimeToMs(f[2] || f[1]);
        if (!Number.isFinite(at) || at < now || at > horizon) continue;
        by[m[1]].push({ at, route: trip.route, heads: trip.heads, dirNum: trip.dir });
    }
    const out = {};
    for (const c of codes) {
        by[c].sort((a, b) => a.at - b.at);
        metroScheduleCache[c] = { day, departures: by[c] };
        out[c] = by[c];
    }
    return out;
}


// Re-fetch bus predictions for the stops currently shown, plus the confirmed
// across-the-street counterpart. Promise.all so the render happens once after
// every request has settled, including failures.
let refreshInFlight = false, refreshQueued = false;

async function refreshPredictions() {
    // Plan §4 coalescing: a timer tick, a tab return, and a selection change
    // can land together — they collapse into one request set per endpoint.
    if (refreshInFlight) { refreshQueued = true; return; }
    refreshInFlight = true;
    const v = selectionVersion;      // captured up front for the stale-result guard
    try {
        const toFetch = new Map();              // StopID → stop object
        for (const s of shownStops()) toFetch.set(String(s.StopID), s);
        if (acrossStop) toFetch.set(String(acrossStop.StopID), acrossStop);
        // Nearby sections need their own live predictions too; otherwise the
        // same stop looks different as the anchor vs a secondary section.
        const anchor = anchorStop();
        if (anchor) {
            for (const n of nearbyStops(anchor)) {
                const stp = nearbyStopObj(n);
                toFetch.set(String(stp.StopID), stp);
            }
        }
        if (!toFetch.size) return;
        let saw429 = false;
        await Promise.all([
            ...[...toFetch.values()].map(async (stop) => {
                try {
                    const { name, predictions } = await fetchPredictions(stop.StopID);
                    if (name && !stop.Name) stop.Name = name;      // ?busstop= mode learns names here
                    const at = Date.now();
                    updateDeparted(stop, predictions, at);
                    stop.Arrivals = predictions;
                    stop.ArrivalsAt = at;
                    stop.Error = null;
                } catch (e) {
                    stop.Arrivals = [];
                    stop.Error = e;                                 // rendered as a muted row
                    if (e.rateLimited) saw429 = true;
                }
            }),
            // Schedule fallback for rows with no live prediction. Cached per
            // stop/day; failures never block the predictions render.
            ...[...toFetch.keys()].map(id => ensureStopSchedule(id)),
        ]);
        rateLimited = saw429;          // → next refresh is delayed (self-throttling)
        lastRefreshAt = Date.now();
        // Plan §4: a stale result must not land after a new selection —
        // the new selection's own refresh wins; this one only re-arms the cycle.
        if (v !== selectionVersion) {
            scheduleRefresh();
            return;
        }
        if (mode !== "bus") { scheduleRefresh(); return; }
        // Keep the board moving on every tick.
        renderLines();
        scheduleRefresh();             // re-arm: the 30-second cycle continues after every tick
        tickClock();                   // reflect this update + the new countdown at once
        gStatus.textContent = rateLimited
            ? "API rate limit hit, slowing refresh"
            : (stops.length ? "" : gStatus.textContent);
    } finally {
        refreshInFlight = false;
        if (refreshQueued) {
            refreshQueued = false;
            // A selection change during the cycle queued its own refresh; run
            // that now against the new selection instead of waiting a tick.
            refreshPredictions();
        }
    }
}

// Periodic refresh: predictions only (the stop list itself rarely changes).
// After a 429 the interval stretches 5× to be polite to the shared key.
function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = null;
    if (!refreshEnabled) { nextRefreshAt = 0; return; }
    const wait = rateLimited ? 5 * REFRESH_MS : REFRESH_MS;
    nextRefreshAt = Date.now() + wait;
    refreshTimer = setTimeout(() => {
        refreshTimer = null;
        refreshActive();
    }, wait);
}

// Background tabs get throttled timers; refresh promptly when we come back.
document.addEventListener("visibilitychange", () => {
    const haveData = mode === "metro" ? !!metroAnchor : stops.length > 0;
    if (document.visibilityState === "visible" && refreshEnabled && !busy && haveData) {
        if (Date.now() - lastRefreshAt > REFRESH_MS / 2) {
            refreshActive();
        } else {
            scheduleRefresh();
        }
    }
});

// ════════════════════════════════════════════════════════════════════
// Rendering
// ════════════════════════════════════════════════════════════════════

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
}

// Stop names use "+" in the WMATA feed; display it as " and ".
function stopName(name) {
    return String(name || "").replace(/\s*\+\s*/g, " and ");
}

// The stops the board tracks. No pick: the nearby / ?busstop= list.
// With a pick: just that stop — resolved from the list when it's there, or
// materialized from the stop directory when the user picked a stop that is
// not in the list (it is then live-tracked like any other).
function shownStops() {
    if (!pickedStop) return stops;
    // A ?busstop= deep link keeps every requested ID in the tracked set
    // until the user explicitly picks another stop (pickedStopObj is set by
    // that pick; the URL prefill leaves it null).
    if (stopListFromURL && !forceNearby && !pickedStopObj) return stops;
    if (pickedStopObj) return [pickedStopObj];
    const inList = stops.find(s => s.StopID === pickedStop);
    return inList ? [inList] : stops;
}

// Re-anchor on a stop and put its name in the entry field. Home/work/
// favorite shortcuts all funnel through here.
async function gotoStop(id, name) {
    searchPoint = null;                 // explicit stop, not a nearby search
    forceNearby = false;
    id = String(id);
    const st = (allStopsCache || []).find(s => String(s.StopID) === id)
        || stops.find(s => String(s.StopID) === id)
        || makeStop(id, name || null, null, null);
    acStop.showPick(st);
    selectStop(id);
    if (!allStopsCache) {
        try {
            await loadStopDirectory();
            const dir = (allStopsCache || []).find(s => String(s.StopID) === id);
            if (dir && String(pickedStop) === id) acStop.showPick(dir);
        } catch (e) { /* the board retries the directory on its next paint */ }
    }
    updateShortcutNav();
}

function updateShortcutNav() {
    const noun = mode === "metro" ? "station" : "stop";
    for (const slot of SHORTCUT_SLOTS) {
        const btn = gShortcutBtns[slot];
        if (!btn) continue;
        if (slot === "fav") {
            btn.title = favorites.length
                ? `All favorites (${favorites.length})` : "All favorites";
            btn.setAttribute("aria-label", btn.title);
            continue;
        }
        const saved = shortcuts[slot];
        const label = shortcutLabel(slot);
        if (saved && saved.id) {
            const name = stopName(saved.name) || `#${saved.id}`;
            btn.title = `${label}: ${name}`;
            btn.setAttribute("aria-label", `Go to ${label}: ${name}`);
        } else if (slot === "home") {
            btn.title = mode === "metro" ? "Nearest Metro station" : `Home stop (${DEFAULT_STOP_ID})`;
            btn.setAttribute("aria-label", btn.title);
        } else {
            btn.title = `No ${label} ${noun} saved`;
            btn.setAttribute("aria-label", btn.title);
        }
    }
}

function goShortcut(slot) {
    if (mode === "metro") {
        const saved = shortcuts[slot];
        if (saved && saved.id) { metroAnchorCode = saved.id; runMetro(); return; }
        if (slot === "home") { metroAnchorCode = null; runMetro(); return; }
        gStatus.textContent = `No ${shortcutLabel(slot)} station saved — open a station and tap its ${shortcutLabel(slot).toLowerCase()} icon.`;
        return;
    }
    const saved = shortcuts[slot];
    if (saved && saved.id) { gotoStop(saved.id, saved.name); return; }
    if (slot === "home") { gotoStop(DEFAULT_STOP_ID, null); return; }
    gStatus.textContent = `No ${shortcutLabel(slot)} stop saved — open a stop and tap its ${shortcutLabel(slot).toLowerCase()} icon.`;
}

function nearestByDistance(list, lat, lon) {
    let best = null, bestDist = Infinity;
    for (const s of list || []) {
        if (s.Lat == null || s.Lon == null) continue;
        const d = distance(lat, lon, Number(s.Lat), Number(s.Lon), "f");
        if (d < bestDist) { bestDist = d; best = s; }
    }
    return best;
}

function goCurrentLocation() {
    if (!navigator || !navigator.geolocation) {
        gStatus.textContent = "Geolocation not supported by this browser";
        return;
    }
    gStatus.textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        searchPoint = { lat, lon };
        try {
            if (mode === "metro") {
                const stations = await loadMetroStations();
                const hit = nearestByDistance(stations, lat, lon);
                if (!hit) { gStatus.textContent = "No Metro station found"; return; }
                setMetroAnchor(hit.Code);
            } else {
                const all = await loadStopDirectory();
                const hit = nearestByDistance(all, lat, lon);
                if (!hit) { gStatus.textContent = "No bus stop found"; return; }
                selectStop(hit.StopID);
            }
            gStatus.textContent = "";
        } catch (e) {
            gStatus.textContent = `Could not find the nearest stop: ${e.message}`;
        }
    }, () => {
        gStatus.textContent = "Turn on location sharing.";
    }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
}

function openSelectedInMaps() {
    let lat, lon, name;
    if (mode === "metro") {
        if (!metroAnchor) { gStatus.textContent = "No Metro station selected"; return; }
        lat = metroAnchor.Lat; lon = metroAnchor.Lon; name = metroAnchor.Name;
    } else {
        const st = anchorStop();
        if (!st || st.Lat == null || st.Lon == null) {
            gStatus.textContent = "No mapped location for the selected stop";
            return;
        }
        lat = st.Lat; lon = st.Lon; name = st.Name;
    }
    const ua = navigator.userAgent || "";
    const coords = `${encodeURIComponent(lat)},${encodeURIComponent(lon)}`;
    const label = encodeURIComponent(stopName(name) || `${lat},${lon}`);
    if (/Android/.test(ua)) {
        // geo: lets Android open the user's default maps app (Maps, Waze, etc.).
        window.location.href = `geo:${coords}?q=${coords}(${label})`;
        return;
    }
    const url = /iPhone|iPad|iPod|Macintosh/.test(ua)
        ? `https://maps.apple.com/?ll=${coords}&q=${label}`
        : `https://www.google.com/maps/search/?api=1&query=${coords}`;
    window.open(url, "_blank", "noopener");
}

// ── Add Favorite picker ──────────────────────────────────────────────
function loadBusRouteDirectory() {
    if (busRouteDirectory) return Promise.resolve(busRouteDirectory);
    if (busRouteLoad) return busRouteLoad;
    if (isBoston()) {
        busRouteLoad = mbtaGet("/routes", { "filter[type]": 3, "page[limit]": 500 })
            .then(({ data, error }) => {
                if (error) throw error;
                const seen = new Set();
                busRouteMbtaIds = {};
                busRouteColors = {};
                busRouteDirectory = ((data && data.data) || []).map(r => {
                    const id = String(r.attributes.short_name || r.id).toUpperCase();
                    busRouteMbtaIds[id] = r.id;
                    if (r.attributes.color) busRouteColors[id] = r.attributes.color;
                    return {
                        id,
                        name: r.attributes.long_name || r.id,
                        desc: r.attributes.long_name || r.attributes.description || ""
                    };
                }).filter(r => r.id && !seen.has(r.id) && seen.add(r.id))
                  .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
                return busRouteDirectory;
            })
            .finally(() => { busRouteLoad = null; });
        return busRouteLoad;
    }
    busRouteLoad = apiGet("/Bus.svc/json/jRoutes", {})
        .then(({ data, error }) => {
            if (error) throw error;
            busRouteDirectory = ((data && data.Routes) || [])
                .map(r => ({ id: String(r.RouteID || "").toUpperCase(),
                             name: r.Name || "",
                             desc: r.LineDescription || r.Name || "" }))
                .filter(r => r.id)
                .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            return busRouteDirectory;
        })
        .catch(() => {
            const m = new Map();
            for (const s of allStopsCache || [])
                for (const r of s.Routes || []) {
                    const id = String(r || "").toUpperCase();
                    if (id && !m.has(id)) m.set(id, { id, name: id, desc: "" });
                }
            busRouteDirectory = [...m.values()]
                .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            return busRouteDirectory;
        })
        .finally(() => { busRouteLoad = null; });
    return busRouteLoad;
}

function favGotoHtml(kind, id, name, label) {

}

// Bus stop-name filter: at 3+ characters, routes are expanded to just the
// stops whose names match. The directory loads lazily; the caller re-renders
// when it lands.
function stopsByRouteForQuery(q) {
    if (!q || q.length < 3 || !allStopsCache) return null;
    const by = new Map();
    for (const s of allStopsCache) {
        if (!String(s.Name || "").toLowerCase().includes(q)) continue;
        for (const r of s.Routes || []) {
            const id = String(r).toUpperCase();
            if (!id) continue;
            if (!by.has(id)) by.set(id, new Map());
            by.get(id).set(String(s.StopID), s);
        }
    }
    const out = new Map();
    for (const [id, stops] of by) {
        out.set(id, [...stops.values()].sort((a, b) =>
            String(a.Name || "").localeCompare(String(b.Name || ""))));
    }
    return out;
}

function favBusStopRow(s, route) {
    return `<div class="fav-stop">${favStarHtml("bus", s.StopID, s.Name, route)}`
        + `${favGotoHtml("bus", s.StopID, s.Name, stopName(s.Name) || "#" + s.StopID)}</div>`;
}

// The "selected stop" control shown in Boston's ordered route lists.
function favSelectHtml(kind, id, name, route) {

        ? String(pickedStop) === String(id)
        : String(metroAnchorCode) === String(id);

        + ` data-fav-name="${esc(name || "")}" data-fav-route="${esc(route || "")}"`

        + `<i class="fa-${selected ? "solid fa-circle-check" : "regular fa-circle"}" aria-hidden="true"></i>`
        + `</button>`;
}

// Connecting bus routes / metro lines at a stop, cached per page load.
const stopConnections = new Map();

async function fetchStopConnections(kind, id) {
    const key = kind + ":" + String(id);
    if (stopConnections.has(key)) return stopConnections.get(key);
    const out = { bus: [], metro: [] };
    try {
        if (isBoston()) {
            if (!Object.keys(busRouteColors).length)
                await loadBusRouteDirectory().catch(() => null);
            const { data } = await mbtaGet("/routes", { "filter[stop]": String(id) });
            for (const r of (data && data.data) || []) {
                const type = r.attributes.type;
                if (type === 3) out.bus.push(String(r.attributes.short_name || r.id).toUpperCase());
                else if (type === 0 || type === 1) out.metro.push(String(r.id));
            }
        } else if (kind === "metro") {
            const st = (metroStationsCache || []).find(s => String(s.Code) === String(id));
            out.metro = st ? (st.Lines || []).slice() : [];
        } else {
            const st = (allStopsCache || []).find(s => String(s.StopID) === String(id));
            out.bus = ((st && st.Routes) || []).map(r => String(r).toUpperCase());
        }
    } catch (e) { /* show no connections on failure */ }
    out.bus = [...new Set(out.bus)].slice(0, 6);
    out.metro = [...new Set(out.metro)].slice(0, 6);
    // Don't cache an empty DC result before its directory has loaded.
    const missingDc = !isBoston() && ((kind === "metro" && !metroStationsCache) ||
        (kind !== "metro" && !allStopsCache));
    if (!missingDc) stopConnections.set(key, out);
    return out;
}

function connectionBadgesHtml(conns) {
    if (!conns) return "";
    const bus = (conns.bus || []).map(r => favBadgeHtml("bus", r));
    const metro = (conns.metro || []).map(l => favBadgeHtml("metro", l));
    return [...bus, ...metro].join(" ");
}

async function loadStopConnections(rows) {
    const map = new Map();
    await Promise.all(rows.map(async s => {
        const id = String(s.StopID || s.id || "");
        if (!id) return;
        map.set(id, await fetchStopConnections(s.kind || "bus", id));
    }));
    return map;
}

function favOrderedRow(kind, id, name, route, conns) {

    return `<div class="fav-stop">${favSelectHtml(kind, id, name, route)}`

}

function favOrderedBusRow(s, route, conns) {

// Ordered stops for a Boston route: one representative trip per direction,
// read from the trip's ordered `stops` relationship.
async function mbtaTripStops(tripId, useParent) {
    if (!tripId) return [];
    const { data: tr, error } = await mbtaGet(`/trips/${tripId}`, { include: "stops" });
    if (error || !tr) return [];
    const inc = new Map(((tr.included) || [])
        .filter(i => i.type === "stop").map(s => [s.id, s]));
    const rel = tr.data.relationships && tr.data.relationships.stops;
    const out = [], seen = new Set();
    for (const x of ((rel && rel.data) || [])) {
        const s = inc.get(x.id);
        const p = useParent && s && s.relationships && s.relationships.parent_station
            && s.relationships.parent_station.data;
        const id = p ? p.id : x.id;
        if (seen.has(id)) continue;
        seen.add(id);
        const station = useParent && (metroStationsCache || []).find(st => st.Code === id);
        out.push({
            StopID: id,
            Name: (station && station.Name) ||
                (s && s.attributes && s.attributes.name) || allStopsName(id) || id
        });
    }
    return out;
}

function heroRouteListHtml(stops, kind, route, anchor, connsMap) {
    if (!stops.length) return `<div class="fav-empty">no stops available</div>`;
    // Only the next stops: start at the selected stop and run toward the
    // trip's destination.
    const at = stops.findIndex(s => String(s.StopID || s.id) === String(anchor));
    const list = at >= 0 ? stops.slice(at) : stops;
    return list.map(s => {
        const id = String(s.StopID || s.id || "");
        const name = s.Name || s.name || "";
        const mark = id === String(anchor) ? ` <b class="bt-mark">your stop</b>` : "";
        const conns = connsMap && connsMap.get(id);
        const badges = conns ? connectionBadgesHtml(conns) : "";
        return `<div class="fav-stop">${favSelectHtml(kind, id, name, route)}`
            + `${favStarHtml(kind, id, name, route)}`
            + `${favGotoHtml(kind, id, name, stopName(name) || "#" + id)}`
            + (badges ? `<span class="fav-conns">${badges}</span>` : "")
            + `${mark}</div>`;
    }).join("");
}

async function loadHeroRouteStops(btn) {
    const ds = btn.dataset || {};
    const route = ds.heroRoute || "";
    const anchor = ds.heroAnchor || "";
    if (isBoston()) {
        if (ds.heroTrip) {
            const stops = await mbtaTripStops(ds.heroTrip, ds.heroKind === "metro");
            if (stops.length) return stops;
        }
        const groups = await fetchMbtaRouteStops(route, ds.heroKind === "metro");
        if (!groups.length) return [];
        const heads = normHeads(ds.heroHeads || "");
        const g = groups.find(x => {
            const n = normHeads(x.name || "");
            return n && (n.includes(heads) || heads.includes(n));
        }) || groups[0];
        return (g.stops || []).map(s => ({ StopID: s.StopID, Name: s.Name }));
    }
    if (ds.heroKind === "metro") {
        if (!ds.heroTo) return [];
        const path = await fetchMetroPath(anchor, ds.heroTo, "");
        return path.map(p => ({ StopID: p.StationCode, Name: p.StationName }));
    }
    const details = await fetchRouteDetails(route);
    const dirs = (details && details.directions) || [];
    const heads = normHeads(ds.heroHeads || "");
    const dir = dirs.find(d => d.byId && d.byId[String(anchor)] && normHeads(d.heads) === heads)
        || dirs.find(d => d.byId && d.byId[String(anchor)])
        || dirs[0];
    return ((dir && dir.stops) || []).map(s => ({ StopID: s.id, Name: s.name }));
}

async function toggleHeroRouteStops(btn) {
    const card = btn.closest ? btn.closest(".hero-card") : null;
    const box = card && card.nextElementSibling;
    if (!box || !box.classList || !box.classList.contains("hero-route-stops")) return;
    const open = box.hidden;
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) { box.hidden = true; return; }
    box.hidden = false;
    if (box.dataset.loaded) return;
    box.dataset.loaded = "1";
    box.innerHTML = `<div class="fav-empty">loading stops…</div>`;
    let stops = [];
    try { stops = await loadHeroRouteStops(btn); } catch (e) { stops = []; }
    const kind = btn.dataset.heroKind;
    const anchor = btn.dataset.heroAnchor;
    const at = stops.findIndex(s => String(s.StopID || s.id) === String(anchor));
    const shown = at >= 0 ? stops.slice(at) : stops;
    let conns = new Map();
    try {
        conns = await loadStopConnections(shown.map(s =>
            Object.assign({}, s, { kind })));
    } catch (e) { /* no badges */ }
    box.innerHTML = heroRouteListHtml(shown, kind, btn.dataset.heroRoute,
        anchor, conns);
}

async function fetchMbtaRouteStops(routeKey, useParent) {
    const routeId = busRouteMbtaIds[routeKey] || routeKey;
    const { data: rp, error } = await mbtaGet("/route_patterns", {
        "filter[route]": routeId
    });
    if (error) throw error;
    const patterns = ((rp && rp.data) || []).filter(p =>
        p.relationships && p.relationships.route &&
        p.relationships.route.data.id === routeId);
    const byDir = new Map();
    for (const p of patterns) {
        const dir = p.attributes.direction_id;
        const cur = byDir.get(dir);
        if (!cur || (p.attributes.canonical && !cur.attributes.canonical))
            byDir.set(dir, p);
    }
    const groups = [];
    for (const [dir, p] of [...byDir.entries()].sort((a, b) => a[0] - b[0])) {
        const tripId = p.relationships.representative_trip &&
            p.relationships.representative_trip.data.id;
        if (!tripId) continue;
        const stops = await mbtaTripStops(tripId, !!useParent);
        if (stops.length)
            groups.push({ dir, name: p.attributes.name || "", stops });
    }
    return groups;
}

let favBusFilterToken = 0;
let favBusDebounce = 0;

// Boston: routes are expanded from stop-name matches. MBTA has no cheap
// stop→routes index, so resolve the first 25 matching stops in parallel.
async function renderFavBusRoutesMbta(raw) {
    if (!gFavBusRoutes) return;
    const token = ++favBusFilterToken;
    const q = raw.toLowerCase();
    if (q && !allStopsCache) {
        loadStopDirectory()
            .then(() => {
                if (gFavBusFilter && gFavBusFilter.value.trim() === raw &&
                    !gFavBusRoutes.querySelector(".fav-stops:not([hidden])"))
                    renderFavBusRoutesMbta(raw);
            })
            .catch(() => {});
    }
    const byStop = new Map();
    if (q.length >= 3 && allStopsCache) {
        const matched = allStopsCache
            .filter(s => String(s.Name || "").toLowerCase().includes(q))
            .slice(0, 25);
        await Promise.all(matched.map(async s => {
            const { data } = await mbtaGet("/routes", {
                "filter[stop]": s.StopID, "filter[type]": 3
            });
            for (const r of (data && data.data) || []) {
                const key = String(r.attributes.short_name || r.id).toUpperCase();
                if (!byStop.has(key)) byStop.set(key, new Map());
                byStop.get(key).set(s.StopID, {
                    StopID: s.StopID, Name: s.Name, Routes: [key]
                });
            }
        }));
    }
    if (token !== favBusFilterToken) return;
    const routes = (busRouteDirectory || []).filter(r => !q ||
        r.id.toLowerCase().includes(q) ||
        r.desc.toLowerCase().includes(q) ||
        r.name.toLowerCase().includes(q) ||
        byStop.has(r.id));
    gFavBusRoutes.innerHTML = routes.length ? routes.map(r => {
        const matches = byStop.has(r.id)
            ? [...byStop.get(r.id).values()]
                .sort((a, b) => String(a.Name || "").localeCompare(String(b.Name || "")))
            : [];
        const expanded = matches.length > 0;
        return `<button type="button" class="fav-route" data-fav-route="${esc(r.id)}" aria-expanded="${expanded ? "true" : "false"}">`
            + `<span class="fav-badge${busBadgeClass()}" style="background:${routeColor(r.id)};color:${busTextColor(r.id)}">${esc(r.id)}</span>`
            + `<span class="fav-desc">${esc(r.desc || "Bus route")}</span>`
            + `<i class="fa-solid fa-chevron-down bt-chevron" aria-hidden="true"></i></button>`
            + `<div class="fav-stops" data-fav-stops="bus" data-route="${esc(r.id)}"`
            + `${expanded ? ` data-loaded="1"` : " hidden"}>`
            + (expanded ? matches.map(s => favBusStopRow(s, r.id)).join("") : "")
            + `</div>`;
    }).join("") : `<div class="fav-empty">no matching bus routes</div>`;
}

function renderFavBusRoutes(query) {
    if (!gFavBusRoutes) return;
    const raw = String(query || "").trim();
    const q = raw.toLowerCase();
    if (isBoston()) return renderFavBusRoutesMbta(raw);
    favBusFilterToken++;
    if (q && !allStopsCache) {
        loadStopDirectory()
            .then(() => {
                if (gFavBusFilter && gFavBusFilter.value.trim() === raw &&
                    !gFavBusRoutes.querySelector(".fav-stops:not([hidden])"))
                    renderFavBusRoutes(raw);
            })
            .catch(() => {});
    }
    const byStop = stopsByRouteForQuery(q);
    const routes = (busRouteDirectory || []).filter(r => !q ||
        r.id.toLowerCase().includes(q) ||
        r.desc.toLowerCase().includes(q) ||
        r.name.toLowerCase().includes(q) ||
        !!(byStop && byStop.has(r.id)));
    gFavBusRoutes.innerHTML = routes.length ? routes.map(r => {
        const matches = byStop ? (byStop.get(r.id) || []) : [];
        const expanded = matches.length > 0;
        return `<button type="button" class="fav-route" data-fav-route="${esc(r.id)}" aria-expanded="${expanded ? "true" : "false"}">`
            + `<span class="fav-badge${busBadgeClass()}" style="background:${routeColor(r.id)};color:${busTextColor(r.id)}">${esc(r.id)}</span>`
            + `<span class="fav-desc">${esc(r.desc || "Bus route")}</span>`
            + `<i class="fa-solid fa-chevron-down bt-chevron" aria-hidden="true"></i></button>`
            + `<div class="fav-stops" data-fav-stops="bus" data-route="${esc(r.id)}"`
            + `${expanded ? ` data-loaded="1"` : " hidden"}>`
            + (expanded ? matches.map(s => favBusStopRow(s, r.id)).join("") : "")
            + `</div>`;
    }).join("") : `<div class="fav-empty">no matching bus routes</div>`;
}

async function renderFavMetroLines() {
