        + `<span class="fav-badge line" style="background:${metroLineColor(line)}">${esc(metroLineName(line))}</span>`
        + `<span class="fav-desc">${esc(metroLineName(line))} Line</span>`
        + `<i class="fa-solid fa-chevron-down bt-chevron" aria-hidden="true"></i></button>`
        + `<div class="fav-stops" data-fav-stops="metro" data-line="${line}" hidden></div>`
    ).join("");
}

// The master favorites list is shared by both modes: bus favorites first,
// then subway favorites, each group sorted by name. Home and Work are
// separate special bookmarks and never appear here.
function favBadgeHtml(kind, route) {
    const r = String(route || "");
    if (kind === "metro") {
        return `<span class="fav-badge line" style="background:${metroLineColor(r)}">`
            + `${esc(r ? metroLineName(r) : "Metro")}</span>`;
    }
    return `<span class="fav-badge${busBadgeClass()}"`
        + ` style="background:${routeColor(r)};color:${busTextColor(r)}">`
        + `${esc(r || "Bus")}</span>`;
}

function favRowHtml(f) {
    return `<div class="fav-stop">${favBadgeHtml(f.kind, f.route)}`
        + `${favStarHtml(f.kind, f.id, f.name, f.route)}`
        + `${favGotoHtml(f.kind, f.id, f.name, stopName(f.name) || "#" + f.id)}</div>`;
}

function sortedFavorites() {
    const rank = { bus: 0, metro: 1 };
    return favorites.slice().sort((a, b) =>
        (rank[a.kind] ?? 2) - (rank[b.kind] ?? 2) ||
        String(a.name || "").localeCompare(String(b.name || "")));
}

function renderFavorites() {
    if (!gFavFavList) return;
    const list = sortedFavorites();
    gFavFavList.innerHTML = list.length ? list.map(favRowHtml).join("")
        : `<div class="fav-empty">no favorites yet — tap a star to save one</div>`;
}

// ── Main-panel bookmark list (Home / Work / Favorites) ───────────────
function shortcutRoute(kind, id) {
    if (kind === "metro") {
        const st = (metroStationsCache || []).find(s => String(s.Code) === String(id));
        return st ? (st.Lines || [])[0] || "" : "";
    }
    const st = (allStopsCache || []).find(s => String(s.StopID) === String(id));
    return st ? (st.Routes || [])[0] || "" : "";
}

// Home/Work: that slot's bus stop and Metro station (both modes). Favorites:
// the master list. Bus entries always come before Metro.
function bookmarkRows(slot) {
    if (slot === "fav") {
        return sortedFavorites().map(f =>
            ({ kind: f.kind, id: String(f.id), name: f.name || "", route: f.route || "" }));
    }
    const rows = [];
    for (const kind of ["bus", "metro"]) {
        const saved = readShortcutsFor(kind)[slot];
        if (!saved || !saved.id) continue;
        const id = String(saved.id);
        rows.push({ kind, id, name: saved.name || "",
                    route: saved.route || shortcutRoute(kind, id) });
    }
    return rows;
}

function nextArrivalHtml(kind, next) {
    const verb = heroVerbHtml(kind === "metro");
    if (!next) return `${verb} <span class="text-muted">no arrival or departure</span>`;
    const color = kind === "metro" ? metroLineColor(next.route) : routeColor(next.route);
    const label = kind === "metro" ? metroLineName(next.route) : next.route;
    return `${verb} <span class="row-badge${kind === "metro" ? " metro-line" : busBadgeClass()}"`
        + ` style="background:${color};color:${kind === "metro" ? "#fff" : busTextColor(next.route)}">${esc(label)}</span> `
        + `${esc(next.heads || next.dir || "")}`
        + ` <span class="bt-next-eta">${esc(fmtEta(next.min))}</span>`;
}

// Match the selected-stop hero card: dark panel, name + ID, next arrival.
// Home / Work buttons shown beside the favorite star on every summary card.
function bmSlotHtml(row, slot) {
    const saved = readShortcutsFor(row.kind)[slot];
    const on = !!(saved && String(saved.id) === String(row.id));
    const label = shortcutLabel(slot);
    const text = on ? `Clear ${label} bookmark` : `Save as ${label}`;
    const icon = slot === "home" ? "house" : "briefcase";
    return `<button type="button" class="board-shortcut bm-slot${on ? " active" : ""}"`
        + ` data-bookmark-slot="${slot}" data-fav-kind="${esc(row.kind)}"`
        + ` data-fav-id="${esc(row.id)}" data-fav-name="${esc(row.name || "")}"`
        + ` data-fav-route="${esc(row.route || "")}"`
        + ` aria-pressed="${on ? "true" : "false"}" title="${text}" aria-label="${text}">`
        + `<i class="fa-solid fa-${icon}" aria-hidden="true"></i>`
        + `</button>`;
}

function bookmarkCardHtml(row) {
    const label = stopName(row.name) || "#" + row.id;
    const band = row.kind === "metro"
        ? `<span class="hero-line-band" data-band="${esc(row.kind)}:${esc(row.id)}"`
          + ` style="background:${metroLineColor(row.route)}"></span>`
        : `<span class="hero-line-band bus-band" data-band="${esc(row.kind)}:${esc(row.id)}"`
          + `${busBandAttr(row.route)}></span>`;
    return `<div class="hero-card bookmark-card hero-${esc(row.kind)}" data-bookmark-kind="${esc(row.kind)}"`
        + ` data-bookmark-id="${esc(row.id)}" data-bookmark-name="${esc(row.name || "")}"`
        + ` data-bookmark-route="${esc(row.route || "")}"`
        + ` role="button" tabindex="0" title="Go to ${esc(label)}">`
        + band
        + `<div class="board-shortcuts">`
        + `${bmSlotHtml(row, "home")}${bmSlotHtml(row, "work")}`
        + `${favStarHtml(row.kind, row.id, row.name, row.route)}</div>`
        + `<div><span class="board-stopname">${esc(label)}</span>`
        + (row.name ? `<span class="board-stopid">#${esc(row.id)}</span>` : "")
        + `</div>`
        + `<div class="board-next" data-for="${esc(row.kind)}:${esc(row.id)}">loading arrivals…</div>`
        + `</div>`;
}

let bookmarkSlot = null;
let bookmarkToken = 0;

async function fillBookmarkArrivals(rows, token) {
    await Promise.all(rows.map(async row => {
        let html, next = null;
        try {
            if (row.kind === "metro") {
                const by = await fetchMetroLive([row.id]);
                const list = (by[row.id] || []).slice().sort((a, b) => a.min - b.min);
                next = list[0] || null;
                html = nextArrivalHtml(row.kind, next);
            } else {
                const { predictions } = await fetchPredictions(row.id);
                const list = (predictions || []).slice().sort((a, b) => a.min - b.min);
                next = list[0] || null;
                html = nextArrivalHtml(row.kind, next);
            }
        } catch (e) {
            html = `<span class="text-muted">arrivals unavailable</span>`;
        }
        if (token !== bookmarkToken || !gBookmarkList) return;
        const el = gBookmarkList.querySelector(
            `.board-next[data-for="${row.kind}:${row.id}"]`);
        if (el) el.innerHTML = html;
        if (row.kind === "metro" && next) {
            const band = gBookmarkList.querySelector(
                `.hero-line-band[data-band="${row.kind}:${row.id}"]`);
            if (band) band.style.background = metroLineColor(next.route);
        } else if (row.kind === "bus" && next) {
            const band = gBookmarkList.querySelector(
                `.hero-line-band[data-band="${row.kind}:${row.id}"]`);
            if (band) band.style.setProperty("--bus-band-color", routeColor(next.route));
        }
    }));
}

// ── Screen history (last 10 views) ───────────────────────────────────
const SCREEN_HISTORY_MAX = 10;
let screenHistory = [];
let currentScreen = null;
let historyGuard = false;

function screenKey(s) {
    if (!s) return "";
    return [s.type, s.slot || "", s.mode || "", s.id || ""].join(":");
}

function screenLabel(s) {
    if (!s) return "previous screen";
    if (s.type === "bookmarks")
        return s.slot === "fav" ? "Favorites" : shortcutLabel(s.slot);
    return s.name || (s.id ? `#${s.id}` : "previous stop");
}

function updateBackButton() {
    if (!gBackBtn) return;
    const prev = screenHistory[screenHistory.length - 1];
    gBackBtn.disabled = !prev;
    const label = prev ? `Back to ${screenLabel(prev)}` : "Back";
    gBackBtn.title = label;
    gBackBtn.setAttribute("aria-label", label);
}

function enterScreen(screen) {
    if (historyGuard || !screen) return;
    if (currentScreen && screenKey(currentScreen) === screenKey(screen)) {
        currentScreen = screen;
        updateBackButton();
        return;
    }
    if (currentScreen) {
        screenHistory.push(currentScreen);
        if (screenHistory.length > SCREEN_HISTORY_MAX) screenHistory.shift();
    }
    currentScreen = screen;
    updateBackButton();
}

async function goBack() {
    if (!screenHistory.length) return;
    const prev = screenHistory.pop();
    historyGuard = true;
    try {
        if (prev.type === "bookmarks") {
            closeFavPanel();
            await renderBookmarkList(prev.slot);
        } else if (prev.type === "board") {
            await gotoFavorite(prev.mode, prev.id, prev.name || "");
        }
        currentScreen = prev;
    } finally {
        historyGuard = false;
        updateBackButton();
    }
}

async function renderBookmarkList(slot) {
    if (isBoston()) {
        await Promise.all([
            loadMetroRoutes().catch(() => null),
            loadBusRouteDirectory().catch(() => null)
        ]);
    }
    bookmarkSlot = slot;
    enterScreen({ type: "bookmarks", slot });
    const token = ++bookmarkToken;
    const label = slot === "fav" ? "Favorites" : shortcutLabel(slot);
    if (gBookmarkTitle) gBookmarkTitle.textContent = label;
    const rows = bookmarkRows(slot);
    if (gBookmarkList) {
        gBookmarkList.innerHTML = rows.length ? rows.map(bookmarkCardHtml).join("")
            : `<div class="fav-empty">no ${slot === "fav" ? "favorites" : label.toLowerCase() + " bookmark"} saved yet</div>`;
    }
    if (gBookmarkView) gBookmarkView.hidden = false;
    if (gViewArrivals) gViewArrivals.hidden = true;
    scrollPageTop();
    if (rows.length) fillBookmarkArrivals(rows, token);
}

function showBoardView() {
    bookmarkSlot = null;
    bookmarkToken++;
    if (gBookmarkView) gBookmarkView.hidden = true;
    if (gViewArrivals) gViewArrivals.hidden = false;
}

// The three bookmark icons always show their view — selecting one never
// hides it. Choosing another icon switches the list.
function showBookmarkList(slot) {
    closeFavPanel();
    renderBookmarkList(slot);
}

function syncFavStars() {
    const scope = [gFavPanel, gBookmarkList, gLinesScroll, gBoardHeader].filter(Boolean);
    for (const root of scope) root.querySelectorAll(".fav-star").forEach(star => {
        const on = isFavorite(star.dataset.favKind, star.dataset.favId);
        star.classList.toggle("active", on);
        star.setAttribute("aria-pressed", on ? "true" : "false");
        star.title = on ? "Remove favorite" : "Add favorite";
        star.innerHTML = `<i class="fa-${on ? "solid" : "regular"} fa-star" aria-hidden="true"></i>`;
    });
    syncHeaderShortcuts();
}
// "Near me": bus stops and Metro stations within 1,000 ft of the device's
// current position, nearest first.
const NEAR_ME_FT = 1000;
const NEAR_ME_M = 305;           // WMATA jStops radius is meters
let favNearToken = 0;

function getUserPosition() {
    return new Promise(resolve => {
        if (!navigator || !navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
            pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
            () => resolve(null),
            { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
    });
}

async function populateNearMe() {
    if (!gFavNearList) return;
    const token = ++favNearToken;
    gFavNearList.innerHTML = `<div class="fav-empty">locating…</div>`;
    const pos = await getUserPosition();
    if (token !== favNearToken) return;
    if (!pos) {
        gFavNearList.innerHTML = `<div class="fav-empty">location unavailable — allow location access and try again</div>`;
        return;
    }
    // "Near me" selects the city automatically from the device location.
    const targetCity = nearestCity(pos.lat, pos.lon);
    if (targetCity !== city) setCity(targetCity, { keepPanel: true });
    try {
        const [busStops, stations] = await Promise.all([
            fetchStopsNear(pos.lat, pos.lon, NEAR_ME_M),
            loadMetroStations()
        ]);
        if (token !== favNearToken) return;
        const rows = [];
        for (const s of busStops || []) {
            const d = distance(pos.lat, pos.lon, s.Lat, s.Lon, "f");
            if (d > NEAR_ME_FT) continue;
            rows.push({
                kind: "bus", id: s.StopID, name: s.Name,
                route: (s.Routes || [])[0] || "", dist: d
            });
        }
        for (const s of stations || []) {
            const d = distance(pos.lat, pos.lon, s.Lat, s.Lon, "f");
            if (d > NEAR_ME_FT) continue;
            rows.push({
                kind: "metro", id: s.Code, name: s.Name,
                route: (s.Lines || [])[0] || "", dist: d
            });
        }
        rows.sort((a, b) => a.dist - b.dist);
        gFavNearList.innerHTML = rows.length ? rows.map(r =>
            `<div class="fav-stop">${favBadgeHtml(r.kind, r.route)}`
            + `${favStarHtml(r.kind, r.id, r.name, r.route)}`
            + `${favGotoHtml(r.kind, r.id, r.name, stopName(r.name) || "#" + r.id)}`
            + `<small class="fav-dist">${Math.round(r.dist)} ft</small></div>`
        ).join("") : `<div class="fav-empty">nothing within 1,000 ft</div>`;
    } catch (e) {
        gFavNearList.innerHTML = `<div class="fav-empty">could not load nearby stops</div>`;
    }
}

async function populateFavStops(container, kind, key) {
    if (container.dataset.loaded) return;
    container.dataset.loaded = "1";
    container.innerHTML = `<div class="fav-empty">loading stops…</div>`;
    try {
        if (kind === "bus") {
            if (isBoston()) {
                const groups = await fetchMbtaRouteStops(key);
                let conns = new Map();
                if (groups.length) {
                    const rows = groups.flatMap(g => g.stops)
                        .map(s => ({ StopID: s.StopID, kind: "bus" }));
                    conns = await loadStopConnections(rows);
                }
                container.innerHTML = groups.length ? groups.map(g =>
                    `<div class="fav-dir-label">${esc(g.name || ("Direction " + g.dir))}</div>`
                    + g.stops.map(s => favOrderedBusRow(s, key, conns.get(String(s.StopID)))).join("")
                ).join("") : `<div class="fav-empty">no stops for this route</div>`;
                return;
            }
            let list;
            const all = await loadStopDirectory();
            list = (all || [])
                .filter(s => (s.Routes || []).some(r => String(r).toUpperCase() === key));
            list = list.sort((a, b) => String(a.Name || "").localeCompare(String(b.Name || "")));
            container.innerHTML = list.length ? list.map(s =>
                `<div class="fav-stop">${favStarHtml("bus", s.StopID, s.Name, key)}${favGotoHtml("bus", s.StopID, s.Name, stopName(s.Name) || "#" + s.StopID)}</div>`
            ).join("") : `<div class="fav-empty">no stops for this route</div>`;
        } else {
            const all = await loadMetroStations();
            const list = (all || [])
                .filter(s => s.Lines.includes(key))
                .sort((a, b) => String(a.Name || "").localeCompare(String(b.Name || "")));
            container.innerHTML = list.length ? list.map(s =>
                `<div class="fav-stop">${favStarHtml("metro", s.Code, s.Name, key)}${favGotoHtml("metro", s.Code, s.Name, stopName(s.Name) || s.Code)}</div>`
            ).join("") : `<div class="fav-empty">no stations on this line</div>`;
        }
    } catch (e) {
        container.innerHTML = `<div class="fav-empty">could not load stops</div>`;
    }
}

function closeFavPanel() {
    if (gFavPanel) {
        gFavPanel.hidden = true;
        gFavPanel.querySelectorAll(".fav-body, .fav-stops").forEach(b => { b.hidden = true; });
        gFavPanel.querySelectorAll(".fav-header, .fav-route").forEach(h =>
            h.setAttribute("aria-expanded", "false"));
    }
    if (gAddFavBtn) gAddFavBtn.setAttribute("aria-expanded", "false");
}

// A favorite name navigates: switch mode first (without starting a competing
// flow), then anchor exactly once on the chosen stop/station.
async function gotoFavorite(kind, id, name) {
    closeFavPanel();
    showBoardView();
    if (kind === "metro") {
        if (mode !== "metro") applyMode("metro");
        await loadMetroStations();
        setMetroAnchor(id);
        return;
    }
    if (mode !== "bus") applyMode("bus");
    if (!stops.length) await runFlow();
    await gotoStop(id, name);
}

if (gAddFavBtn) gAddFavBtn.addEventListener("click", () => {
    if (!gFavPanel.hidden) { closeFavPanel(); return; }
    gFavPanel.hidden = false;
    gAddFavBtn.setAttribute("aria-expanded", "true");
});
if (gFavBusFilter) gFavBusFilter.addEventListener("input", () => {
    clearTimeout(favBusDebounce);
    favBusDebounce = setTimeout(() => renderFavBusRoutes(gFavBusFilter.value), 250);
});
if (gFavPanel) gFavPanel.addEventListener("click", async e => {
    const select = e.target.closest ? e.target.closest(".fav-select") : null;
    if (select && select.dataset.favId) {
        e.preventDefault();
        e.stopPropagation();
        await gotoFavorite(select.dataset.favKind, select.dataset.favId, select.dataset.favName);
        return;
    }
    const star = e.target.closest ? e.target.closest(".fav-star") : null;
    if (star) {
        e.preventDefault();
        e.stopPropagation();
        const kind = star.dataset.favKind;
        const id = star.dataset.favId;
        toggleFavorite(kind, id, star.dataset.favName, star.dataset.favRoute);
        const on = isFavorite(kind, id);
        star.classList.toggle("active", on);
        star.setAttribute("aria-pressed", on ? "true" : "false");
        star.title = on ? "Remove favorite" : "Add favorite";
        star.innerHTML = `<i class="fa-${on ? "solid" : "regular"} fa-star" aria-hidden="true"></i>`;
        updateShortcutNav();
        if (gFavFavBody && !gFavFavBody.hidden) renderFavorites();
        if (bookmarkSlot === "fav") renderBookmarkList("fav");
        syncFavStars();
        return;
    }
    const go = e.target.closest ? e.target.closest(".fav-goto") : null;
    if (go && go.dataset.favId) {
        e.preventDefault();
        await gotoFavorite(go.dataset.favKind, go.dataset.favId, go.dataset.favName);
        return;
    }
    const route = e.target.closest ? e.target.closest(".fav-route") : null;
    if (route) {
        const stops = route.nextElementSibling;
        if (!stops || !stops.classList.contains("fav-stops")) return;
        const open = stops.hidden;
        if (open) {
            if (route.dataset.favRoute)
                await populateFavStops(stops, "bus", route.dataset.favRoute);
            else if (route.dataset.favLine)
                await populateFavStops(stops, "metro", route.dataset.favLine);
            stops.hidden = false;
        } else {
            stops.hidden = true;
        }
        route.setAttribute("aria-expanded", open ? "true" : "false");
        return;
    }
    const header = e.target.closest ? e.target.closest(".fav-header") : null;
    if (!header) return;
    const which = header.dataset.favPanel;
    const body = which === "favorites" ? gFavFavBody
        : which === "near" ? gFavNearBody
        : which === "bus" ? gFavBusBody
        : which === "metro" ? gFavMetroBody : gFavSettingsBody;
    const open = body.hidden;
    if (open) {
        try {
            if (which === "favorites") {
                renderFavorites();
            } else if (which === "near") {
                populateNearMe();
            } else if (which === "bus") {
                await loadBusRouteDirectory();
                renderFavBusRoutes(gFavBusFilter ? gFavBusFilter.value : "");
                // Stop names are part of the filter; warm the directory so
                // the first stop-name query matches without a pause.
                loadStopDirectory()
                    .then(() => {
                        if (gFavBusBody && !gFavBusBody.hidden)
                            renderFavBusRoutes(gFavBusFilter ? gFavBusFilter.value : "");
                    })
                    .catch(() => {});
            } else if (which === "metro") {
                await loadMetroStations();
                await renderFavMetroLines();
            }
            body.hidden = false;
        } catch (err) {
            body.innerHTML = `<div class="fav-empty">could not load</div>`;
            body.hidden = false;
        }
    } else {
        body.hidden = true;
    }
    header.setAttribute("aria-expanded", open ? "true" : "false");
});
if (gBookmarkList) gBookmarkList.addEventListener("click", async e => {
    const slotBtn = e.target.closest ? e.target.closest(".bm-slot") : null;
    if (slotBtn) {
        e.preventDefault();
        e.stopPropagation();
        toggleBookmarkCardSlot(slotBtn.dataset.favKind, slotBtn.dataset.favId,
            slotBtn.dataset.favName, slotBtn.dataset.favRoute,
            slotBtn.dataset.bookmarkSlot);

    }
    const star = e.target.closest ? e.target.closest(".fav-star") : null;
    if (star) {
        e.preventDefault();
        toggleFavorite(star.dataset.favKind, star.dataset.favId,
            star.dataset.favName, star.dataset.favRoute);

        if (bookmarkSlot === "fav") renderBookmarkList("fav");
        if (gFavFavBody && !gFavFavBody.hidden) renderFavorites();

        return;
    }
    const go = e.target.closest ? e.target.closest(".bookmark-card") : null;
    if (go && go.dataset.bookmarkId) {
        e.preventDefault();
        await gotoFavorite(go.dataset.bookmarkKind, go.dataset.bookmarkId, go.dataset.bookmarkName);
    }
});
if (gBookmarkList) gBookmarkList.addEventListener("keydown", e => {

// Repaint the hero card's Home / Work / Favorite buttons from saved state.
function syncHeaderShortcuts() {
    if (!gBoardHeader) return;
    const kind = mode === "metro" ? "metro" : "bus";
    const st = kind === "metro" ? metroAnchor : anchorStop();
    const id = st ? String(kind === "metro" ? st.Code : st.StopID) : "";
    if (!id) return;
    gBoardHeader.querySelectorAll(".board-shortcut").forEach(b => {
        const s = b.dataset && b.dataset.shortcut;
        if (!s) return;
        if (s === "fav") {
            const on = isFavorite(kind, id);
            const text = on ? "Remove favorite" : "Add to favorites";
            b.classList.toggle("active", on);
            b.setAttribute("aria-pressed", on ? "true" : "false");
            b.title = text;
            b.setAttribute("aria-label", text);
            return;
        }
        const on = !!(shortcuts[s] && String(shortcuts[s].id) === id);
        const label = shortcutLabel(s);
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.title = on ? `Saved as ${label} — click to clear`
            : `Save this ${kind === "metro" ? "station" : "stop"} as ${label}`;
        b.setAttribute("aria-label", b.title);
    });
}

// Home and Work save/clear their single special bookmark in the header. The
// star toggles membership in the master favorites list, so it matches the
// star's color everywhere else.
gBoardHeader.addEventListener("click", e => {
    const routeBtn = e.target.closest ? e.target.closest(".hero-route-toggle") : null;
    if (routeBtn) {
        e.preventDefault();
        toggleHeroRouteStops(routeBtn);
        return;
    }
    const pick = e.target.closest ? e.target.closest(".fav-select") : null;
    if (pick && pick.dataset.favId) {
        e.preventDefault();
        gotoFavorite(pick.dataset.favKind, pick.dataset.favId, pick.dataset.favName);
        return;
    }
    const favStar = e.target.closest ? e.target.closest(".fav-star") : null;
    if (favStar) {
        e.preventDefault();
        toggleFavorite(favStar.dataset.favKind, favStar.dataset.favId,
            favStar.dataset.favName, favStar.dataset.favRoute);
        updateShortcutNav();
        if (bookmarkSlot === "fav") renderBookmarkList("fav");
        syncFavStars();
        return;
    }
    const go = e.target.closest ? e.target.closest(".fav-goto") : null;
    if (go && go.dataset.favId) {
        e.preventDefault();
        gotoFavorite(go.dataset.favKind, go.dataset.favId, go.dataset.favName);
        return;
    }
    const share = e.target.closest ? e.target.closest(".board-share") : null;
    if (share) { openSelectedInMaps(); return; }
    const btn = e.target.closest ? e.target.closest(".board-shortcut") : null;
    if (!btn || !btn.dataset) return;
    const slot = btn.dataset.shortcut;
    if (!SHORTCUT_SLOTS.includes(slot)) return;
    const kind = mode === "metro" ? "metro" : "bus";
    const st = kind === "metro" ? metroAnchor : anchorStop();
    const id = st ? String(kind === "metro" ? st.Code : st.StopID) : "";
    if (!id) return;
    if (slot === "fav") {
        const route = kind === "metro"
            ? String((st.Lines && st.Lines[0]) || "")
            : String((st.Routes && st.Routes[0]) ||
                (st.Arrivals && st.Arrivals[0] && st.Arrivals[0].route) || "");
        toggleFavorite(kind, id, st.Name || "", route);
    } else {
        const route = kind === "metro"
            ? String((st.Lines && st.Lines[0]) || "")
            : String((st.Routes && st.Routes[0]) ||
                (st.Arrivals && st.Arrivals[0] && st.Arrivals[0].route) || "");
        if (shortcuts[slot] && String(shortcuts[slot].id) === id) {
            // Clearing Home/Work leaves the master favorites list alone.
            delete shortcuts[slot];
        } else {
            shortcuts[slot] = { id, name: st.Name || "", route };
            // Saving a Home or Work bookmark also adds the stop to favorites.
            if (!isFavorite(kind, id)) toggleFavorite(kind, id, st.Name || "", route);
        }
        writeShortcutCookie();
    }
    syncHeaderShortcuts();
    updateShortcutNav();
    if (gFavFavBody && !gFavFavBody.hidden) renderFavorites();
    if (bookmarkSlot === "fav") renderBookmarkList("fav");
    syncFavStars();
});
updateShortcutNav();
if (gMetroSelect) gMetroSelect.addEventListener("change", () => {
    if (mode === "metro") setMetroAnchor(gMetroSelect.value);
});

// ════════════════════════════════════════════════════════════════════
// Stop-name autocomplete (the single shared entry field above the view)
// ════════════════════════════════════════════════════════════════════
// The entry field is a combobox over the stop directory (the one jStops
// full dump, deduped by loadStopDirectory()). The factory owns the entry UI
// (suggestion list, ✕, keyboard); what the page does with a picked stop is
// up to its callbacks:
//   onPick(dirStop)  — a stop was chosen (Enter on the highlighted match,
//                      or a row click)
//   onClear()        — the ✕ was pressed
//   onPickLost()     — the user started typing while a pick was active
// Undo the bus pick. The board falls back to the default/nearby view.
function resetPick() {
    if (pickedStop === null && pickedStopObj === null) return;
    pickedStop = null;
    pickedStopObj = null;
    acStop.reset();
}

const acStop = {
    setPicked() { /* the board header is the selected-stop display */ },
    showPick() { /* no separate entry field to update */ },
    reset() { resetBusPickers(); },
};

function resetBusPickers() {
    if (gBusRoutePanel) {
        gBusRoutePanel.hidden = true;
        gBusRoutePanel.querySelectorAll(".route-chip.active").forEach(b => {
            b.classList.remove("active");
            b.setAttribute("aria-selected", "false");
        });
    }
    if (gBusRoutesToggle) gBusRoutesToggle.setAttribute("aria-expanded", "false");
    if (gBusStopSelect) {
        gBusStopSelect.hidden = true;
        gBusStopSelect.innerHTML = `<option value="">Select a stop…</option>`;
    }
}

function collapseBusRoutePanel() {
    if (gBusRoutePanel) gBusRoutePanel.hidden = true;
    if (gBusRoutesToggle) gBusRoutesToggle.setAttribute("aria-expanded", "false");
}

function collapseBusStopPicker() {
    if (gBusStopSelect) gBusStopSelect.hidden = true;
}

if (gBusRoutesToggle) gBusRoutesToggle.addEventListener("click", () => {
    const open = gBusRoutePanel ? gBusRoutePanel.hidden : false;
    if (open) {
        if (allStopsCache && (!gBusRoutePanel.innerHTML || !gBusRoutePanel.children.length))
            populateBusRoutes(allStopsCache);
        gBusRoutePanel.hidden = false;
    } else {
        gBusRoutePanel.hidden = true;
    }
    gBusRoutesToggle.setAttribute("aria-expanded", open ? "true" : "false");
});

function populateBusRoutes(all) {
    if (!gBusRoutePanel) return;
    const routes = new Set();
    for (const s of all || [])
        for (const r of s.Routes || [])
            if (r) routes.add(String(r).toUpperCase());
    const list = [...routes].sort((a, b) =>
        a.localeCompare(b, undefined, { numeric: true }));
    gBusRoutePanel.innerHTML = list.map(r =>
        `<button type="button" class="route-chip" data-route="${esc(r)}" role="option" aria-selected="false"`
        + ` style="background:${routeColor(r)}">${esc(r)}</button>`).join("");
    resetBusPickers();
}

function populateBusStops(route) {
    if (!gBusStopSelect) return;
    if (!route) { resetBusPickers(); return; }
    if (gBusRoutePanel) {
        gBusRoutePanel.querySelectorAll(".route-chip").forEach(b => {
            const on = b.dataset && b.dataset.route === route;
            b.classList.toggle("active", on);
            b.setAttribute("aria-selected", on ? "true" : "false");
        });
    }
    const list = (allStopsCache || [])
        .filter(s => (s.Routes || []).some(r => String(r).toUpperCase() === route))
        .sort((a, b) =>
            String(a.Name || "").localeCompare(String(b.Name || "")) ||
            String(a.StopID).localeCompare(String(b.StopID), undefined, { numeric: true }));
    gBusStopSelect.innerHTML = list.length
        ? `<option value="">Select a stop…</option>`
          + list.map(s => `<option value="${esc(s.StopID)}">${esc(stopName(s.Name) || "#" + s.StopID)} (${esc(s.StopID)})</option>`).join("")
        : `<option value="">No stops for this route</option>`;
    gBusStopSelect.hidden = false;
}

if (gBusRoutePanel) gBusRoutePanel.addEventListener("click", e => {
    const chip = e.target.closest ? e.target.closest(".route-chip") : null;
    if (!chip || !chip.dataset) return;
    populateBusStops(chip.dataset.route);
    collapseBusRoutePanel();
});
if (gBusStopSelect) gBusStopSelect.addEventListener("change", () => {
    const id = gBusStopSelect.value;
    if (id) {
        selectStop(id, true);
        collapseBusStopPicker();
    }
});

// ════════════════════════════════════════════════════════════════════
// The board (v5 — the single view)
// One row per route+direction+destination that boards the anchor stop,
// drawn on the REAL route geometry (jRouteDetails shapes): stops the bus
// passes before the anchor sit left of the shared boarding x, the terminal
// right, rows read left → right, and the anchor stands on one vertical
// guide at the same x in every row of both curb sections, so the whole
// board scrolls as one piece. Approaching buses mark the track from the
// live positions feed (filled when the sample is fresh, hollow when the
// ETA is extrapolated). A route whose published pattern doesn't board the
// anchor collapses to a header-only row; one with no route details at all
// keeps its ETA list with a note.
// The across-the-street resolver (≤1 unambiguous opposite stop) gets its
// own named section, riding the same scale and the same guide.
// ════════════════════════════════════════════════════════════════════

// A small distinguishable palette; routes hash into it (stable across loads).
const ROUTE_COLORS = ["#c62828", "#1565c0", "#2e7d32", "#ef6c00", "#6a1b9a", "#00838f",
    "#ad1457", "#5d4037", "#455a64", "#827717", "#37474f", "#9e9d24"];

function routeColor(routeId) {
    const key = String(routeId || "").toUpperCase();
    // Boston: MBTA publishes each route's own color; use it when known.
    if (typeof isBoston === "function" && isBoston()
        && typeof busRouteColors !== "undefined" && busRouteColors[key]) {
        return "#" + String(busRouteColors[key]).replace(/^#/, "");
    }
    let h = 0;
    for (const c of String(routeId)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return ROUTE_COLORS[h % ROUTE_COLORS.length];
}

// Bus hero stripe: the route's color on the left, grey on the right, with
// the shared 45° slice. Boston uses the MBTA route color; DC uses the
// app's stable route palette.
function busBandAttr(route) {
    if (!route || typeof routeColor !== "function") return "";
    const c = routeColor(route);
    return c ? ` style="--bus-band-color:${c}"` : "";
}

// Black text on light (yellow) MBTA bus colors; white otherwise.
function busTextColor(route) {
    if (typeof isBoston !== "function" || !isBoston()) return "#fff";
    const raw = typeof busRouteColors !== "undefined"
        && busRouteColors[String(route || "").toUpperCase()];
    const hex = String(raw || "").replace(/^#/, "");
    if (!/^[0-9a-f]{6}$/i.test(hex)) return "#fff";
    const r = parseInt(hex.slice(0, 2), 16);
    const g = parseInt(hex.slice(2, 4), 16);
    const b = parseInt(hex.slice(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? "#000" : "#fff";
}

function busBadgeClass() {
    return (typeof isBoston === "function" && isBoston()) ? " boston-bus" : "";
}
// The hover card: a stop's live arrivals, fetched once per page load and
// then cached (a hover is a peek — the arrivals table already refreshes the
// stops it tracks; the dots it peeks at are usually not among them).
const hoverPredictions = new Map();   // StopID → { name, predictions }
let hoverTok = 0;                     // invalidates in-flight card writes

function hideHoverTip() {
    hoverTok++;
    gHoverTip.hidden = true;
    gHoverTip.innerHTML = "";
}

// Floats above the hovered dot (below, when there is no room), clamped to
// the viewport. Measured while visibility:hidden so it never flickers at
// the corner before it lands.
function positionHoverTip(dot) {
    const r = dot.getBoundingClientRect();
    const w = gHoverTip.offsetWidth;
    const h = gHoverTip.offsetHeight;
    let x = r.left + r.width / 2 - w / 2;
    let y = r.top - h - 10;
    if (y < 8) y = r.bottom + 10;
    gHoverTip.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + "px";
    gHoverTip.style.top = y + "px";
}

function hoverTipHtml(st, pred) {
    const head = `${esc(stopName(st.Name) || "#" + st.StopID)} <small style="opacity:.75">(#${esc(st.StopID)})</small>`;
    if (!pred.predictions.length) return head + "<br><small>no arrivals scheduled</small>";
    const rows = pred.predictions.map(p =>
        `<div><b>${esc(p.route)}</b> · ${esc(p.min)} min <small style="opacity:.75">${esc(p.dir || "")}</small></div>`).join("");
    return head + "<br>" + rows;
}

async function hoverTipFor(dot) {
    const tok = ++hoverTok;
    const st = (allStopsCache || []).find(s => String(s.StopID) === String(dot.getAttribute("data-stop")));
    if (!st) return;
    const show = html => {
        gHoverTip.style.visibility = "hidden";
        gHoverTip.hidden = false;
        gHoverTip.innerHTML = html;
        positionHoverTip(dot);
        gHoverTip.style.visibility = "";
    };
    let pred = hoverPredictions.get(st.StopID);
    if (pred) { show(hoverTipHtml(st, pred)); return; }     // cached: instant
    show(`${esc(stopName(st.Name) || "#" + st.StopID)} <small style="opacity:.75">(#${esc(st.StopID)})</small><br>loading…`);
    try {
        pred = await fetchPredictions(st.StopID);
        hoverPredictions.set(st.StopID, pred);
    } catch (e) {
        pred = null;
    }
    if (tok !== hoverTok || !dot.isConnected) return;       // card moved on, or the row was redrawn
    show(pred ? hoverTipHtml(st, pred)
              : `${esc(stopName(st.Name) || "#" + st.StopID)}<br><small>couldn't load arrivals</small>`);
}

// Piece 11: the stop markers (dots + the anchor/terminal diamonds) reveal
// on hover, tap, and keyboard focus. They are redrawn on every
// renderLines(), so the card is driven by delegated handlers on the
// .lines-scroll wrapper (it survives re-renders). Overlapping dots stay
// reachable: every marker is tabbable, and the "View all stops" list
// names every occurrence anyway.
const BT_STOP = ".bt-stop";
gLinesScroll.addEventListener("mouseover", e => {
    const dot = e.target.closest(BT_STOP);
    if (dot) hoverTipFor(dot);
});
gLinesScroll.addEventListener("mouseout", e => {
    const from = e.target.closest(BT_STOP);
    if (!from) return;
    const to = e.relatedTarget;
    if (to && to.nodeType === 1 && to.closest(BT_STOP)) return;   // marker→marker: the new one takes over
    hideHoverTip();
});
gLinesScroll.addEventListener("click", e => {
    const dot = e.target.closest(BT_STOP);
    if (dot) hoverTipFor(dot);
    else hideHoverTip();   // tapping/clicking off a marker dismisses the card
});
gLinesScroll.addEventListener("focusin", e => {
    const dot = e.target.closest(BT_STOP);
    if (dot) hoverTipFor(dot);
});
gLinesScroll.addEventListener("focusout", e => {
    const from = e.target.closest(BT_STOP);
    if (!from) return;
    const to = e.relatedTarget;
    if (to && to.nodeType === 1 && to.closest(BT_STOP)) return;
    hideHoverTip();
});
gLinesScroll.addEventListener("keydown", e => {
    if (e.key === "Escape") hideHoverTip();
});
// The "View all stops" disclosure: toggle the row's list and remember the
// choice so the 30 s re-render keeps it open.
gLinesScroll.addEventListener("click", e => {
    const btn = e.target.closest(".bt-allstops");
    if (!btn) return;
    const rowEl = btn.closest(".board-row");
    const ul = rowEl ? rowEl.querySelector(".bt-stoplist") : null;
    const attr = rowEl ? rowEl.getAttribute("data-rowkey") : null;
    const key = attr ? decodeURIComponent(attr) : null;
    if (!ul || !key) return;
    const open = ul.hasAttribute("hidden");
    if (open) expandedStops.add(key); else expandedStops.delete(key);
    if (open) {
        ul.removeAttribute("hidden");
        if (ul.dataset && ul.dataset.metroFrom && !ul.dataset.loaded)
            loadMetroStops(ul);
    } else {
        ul.setAttribute("hidden", "");
    }
    btn.setAttribute("aria-expanded", open ? "true" : "false");
});
// A row scrolling out from under the cursor also retires the card.
gLinesScroll.addEventListener("scroll", hideHoverTip, true);

// Piece 12 (narrow screens): on a phone the board overflows the shared
// scroller, so center the boarding guide and its immediate approach on each
// paint. A user scroll takes precedence until the selection changes; a
// reduced-motion preference prefers the instant jump over the smooth one.
const REDUCE_MOTION = matchMedia("(prefers-reduced-motion: reduce)");
let boardUserScrolled = false;
let boardAuto = { at: 0, left: null };   // the page's own scroll, with a settling window

function centerBoard() {
    if (boardUserScrolled) return;
    const guide = gLinesScroll.querySelector(".bt-guide");
    if (!guide) return;
    const vw = gLinesScroll.clientWidth || 0;
    if (!vw || gLinesScroll.scrollWidth <= vw) return;   // no overflow: nothing to center
    const x = parseFloat(guide.getAttribute("x1")) || 0;
    const target = Math.max(0, x - vw / 2);
    if (Math.abs((gLinesScroll.scrollLeft || 0) - target) < 2) return;
    boardAuto = { at: Date.now(), left: target };
    if (REDUCE_MOTION.matches) gLinesScroll.scrollLeft = target;
    else gLinesScroll.scrollTo({ left: target, behavior: "smooth" });
}

// Clicking a nearby stop card selects that stop. The redraw puts its section
// FIRST, and this smooths the vertical travel up to the top of the arrivals
// view afterwards (the re-paint itself would jump).
function slideSectionToTop(headEl) {
    const view = document.getElementById("viewArrivals");
    if (!headEl || !headEl.getBoundingClientRect || !view || !view.scrollTo) return;
    const r = headEl.getBoundingClientRect();
    if (!r || !r.height) return;
    const dy = Math.max(0, r.top - (view.getBoundingClientRect().top + 10));
    if (!dy) return;
    try {
        if (REDUCE_MOTION.matches) view.scrollTop += dy;
        else view.scrollTo({ top: view.scrollTop + dy, behavior: "smooth" });
    } catch (e) { /* non-scrollable container: the repaint already moved it */ }
}

// A stop/station change returns the page to the top so the new header is
// immediately visible.
function scrollPageTop() {
    if (typeof window === "undefined" || typeof window.scrollTo !== "function") return;
    const behavior = REDUCE_MOTION.matches ? "auto" : "smooth";
    try { window.scrollTo({ top: 0, behavior }); }
    catch (e) { window.scrollTo(0, 0); }
}

// Re-anchor the board on `id`: update the pick, repaint, and refresh its
// predictions. Shared by nearby stop cards and the "View all stops" list.
function selectStop(id, keepPicker) {
    id = String(id || "");
    if (!id) return false;
    showBoardView();
    if (!keepPicker) resetBusPickers();
    if (String(pickedStop) === id) { refreshPredictions(); return true; }  // already the anchor
    pickedStop = id;
    const inList = stops.find(s => String(s.StopID) === id) || nearbyStopObjs.get(id);
    pickedStopObj = inList || (allStopsCache || []).find(s => String(s.StopID) === id)
        || makeStop(id, null, null, null);
    enterScreen({ type: "board", mode: "bus", id,
        name: pickedStopObj.Name || allStopsName(id) || "" });
    scrollPageTop();
    noteSelectionChange();     // void the old counterpart before its refresh
    renderLines();             // re-anchors the board: this section lands first…
    refreshPredictions();      // …and its predictions arrive on the next paint
    return true;
}

// Delegated across every paint: a nearby stop card selects the named stop
// (the redraw puts it first, then the view glides up). A stop in the expanded
// "View all stops" list re-anchors the board on that stop and refreshes it.
gLinesScroll.addEventListener("click", e => {
    const star = e.target.closest ? e.target.closest(".fav-star") : null;
    if (star) {
        e.preventDefault();
        e.stopPropagation();
        toggleFavorite(star.dataset.favKind, star.dataset.favId,
            star.dataset.favName, star.dataset.favRoute);
        updateShortcutNav();
        if (gFavFavBody && !gFavFavBody.hidden) renderFavorites();
        if (bookmarkSlot === "fav") renderBookmarkList("fav");
        syncFavStars();
        return;
    }
    const item = e.target.closest ? e.target.closest(".bt-stop-item") : null;
    if (item && item.dataset && item.dataset.stop) {
        if (mode === "metro") setMetroAnchor(item.dataset.stop);
        else selectStop(item.dataset.stop);
        return;
    }
    const head = e.target.closest ? e.target.closest(".nearby-stop-card") : null;
    if (!head || !head.dataset) return;
    if (mode === "metro" && head.dataset.metro) {
        setMetroAnchor(head.dataset.stop);
        return;
    }
    if (mode !== "bus") return;
    // Each nearby stop card names its stop; the across counterpart is simply
    // the first card, with "Across the street" as its location description.
    if (selectStop(head.dataset.stop)) slideSectionToTop(head);
});
gLinesScroll.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    // The star is a real button: let its native activation toggle the favorite.
    if (e.target.closest && e.target.closest(".fav-star")) return;
    const el = e.target.closest ? e.target.closest(".nearby-stop-card, .bt-stop-item") : null;
    if (!el || !el.dataset || !el.dataset.stop) return;
    e.preventDefault();
    el.click();
});

// A smooth animation crosses the gap gradually, so position alone cannot tell
// the page's own scroll from a user's: the 1 s window after the page
// initiated the scroll is the page, as is any event still sitting at the
// page's target (a real user scroll moves away from it).
function onBoardScroll() {
    if (boardAuto.left != null) {
        if (Date.now() - boardAuto.at < 1000) return;
        if (Math.abs((gLinesScroll.scrollLeft || 0) - boardAuto.left) < 2) return;
        boardAuto.left = null;
    }
    boardUserScrolled = true;
}
gLinesScroll.addEventListener("scroll", onBoardScroll);

// The stop the board anchors on: the picked stop, else the default corner
// (1002135) when it is in the shown list, else the closest nearby stop
// (shownStops()[0], distance-sorted). With the directory loaded, its entry is
// preferred (canonical name, coordinates, and the full Routes list the
// service rows need). A directory that is still loading or failed must never
// block the board (plan §2) — the stop object at hand is a sufficient
// fallback, and a name can also come from jPredictions.
function anchorStop() {
    const shown = shownStops();
    let want;
    if (pickedStop) {
        want = String(pickedStop);
    } else {
        const def = shown.find(s => String(s.StopID) === DEFAULT_STOP_ID);
        want = String((def || shown[0] || {}).StopID || "");
    }
    if (!want) return null;
    if (allStopsCache) {
        const hit = allStopsCache.find(s => String(s.StopID) === want);
        if (hit) return hit;
    }
    return shownStops().find(s => String(s.StopID) === want) || null;
}

// The home / work / favorite buttons in the stop header. Home and Work are
// single special bookmarks; the star toggles the master favorites list.
function shortcutButtonsHtml(id) {
    const kind = mode === "metro" ? "metro" : "bus";
    return `<div class="board-shortcuts">` + SHORTCUT_SLOTS.map(slot => {
        if (slot === "fav") {
            const on = isFavorite(kind, id);
            const text = on ? "Remove favorite" : "Add to favorites";
            return `<button type="button" class="board-shortcut${on ? " active" : ""}"`
                + ` data-shortcut="fav" aria-pressed="${on ? "true" : "false"}"`
                + ` title="${text}" aria-label="${text}">`
                + `<i class="fa-solid fa-star" aria-hidden="true"></i>`
                + `</button>`;
        }
        const saved = shortcuts[slot];
        const on = !!(saved && String(saved.id) === String(id));
        const label = shortcutLabel(slot);
        const text = on ? `Saved as ${label} — click to clear` : `Save this stop as ${label}`;
        return `<button type="button" class="board-shortcut${on ? " active" : ""}"`
            + ` data-shortcut="${slot}" aria-pressed="${on ? "true" : "false"}"`
            + ` title="${text}" aria-label="${text}">`
            + `<i class="fa-solid fa-${slot === "home" ? "house" : slot === "work" ? "briefcase" : "star"}" aria-hidden="true"></i>`
            + `</button>`;
    }).join("") + `</div>`;
}

// "Next bus" / "Next train" is represented by the mode icon; the label is
// kept for assistive technology and the hover tooltip.
function heroVerbHtml(metro) {
    const label = metro ? "Next train" : "Next bus";
    return `<span class="hero-verb" role="img" aria-label="${label}" title="${label}">`
        + `<i class="fa-solid ${metro ? "fa-train-subway" : "fa-bus"}" aria-hidden="true"></i></span>`;
}

// Stop header: a dark hero card — eyebrow, name + ID, then the next bus in
// one line. The ETA takes emphasis; the route is a white badge on the dark
// surface (the palette colors are dark enough for white text on them).
// Successive buses on the same route + direction follow the first ETA
// ("9 min then 13 min, 31 min").
function heroCardHtml(st, arrivals) {
    const id = String(st.StopID || "");
    const label = st.Name ? stopName(st.Name) : `#${id}`;
    const list = (arrivals || []).slice().sort((a, b) => a.min - b.min);
    const next = list[0] || null;
    const verb = heroVerbHtml(st.Metro);
    const badgeColor = (route) => st.Metro ? metroLineColor(route) : routeColor(route);
    const badgeLabel = (route) => st.Metro ? metroLineName(route) : route;
    let nextLine;
    if (next) {
        // Same service as the next vehicle: route plus direction.
        const svc = st.Metro
            ? (a) => `${a.route}|${a.heads || a.dir || ""}`
            : (a) => `${a.route}|${a.dirNum || a.heads || a.dir || ""}`;
        const mins = list.filter(a => svc(a) === svc(next)).map(a => a.min);
        const badgeCls = `row-badge${st.Metro ? " metro-line" : busBadgeClass()}`;
        const routeBadge = `<button type="button" class="${badgeCls} hero-route-toggle"`
            + ` aria-expanded="false" title="Show stops on this route"`
            + ` data-hero-kind="${st.Metro ? "metro" : "bus"}"`
            + ` data-hero-route="${esc(next.route)}"`
            + ` data-hero-trip="${esc(next.trip || "")}"`
            + ` data-hero-heads="${esc(next.heads || next.dir || "")}"`
            + ` data-hero-dir="${esc(next.dirNum == null ? "" : next.dirNum)}"`
            + ` data-hero-anchor="${esc(id)}"`
            + ` data-hero-to="${esc(st.Metro ? metroDestCode(next.heads || next.dir) : "")}"`
            + ` style="background:${badgeColor(next.route)};color:${st.Metro ? "#fff" : busTextColor(next.route)}">`
            + `${esc(badgeLabel(next.route))}`
            + `<i class="fa-solid fa-chevron-down bt-chevron" aria-hidden="true"></i></button>`;
        const bits = [
            routeBadge,
            esc(next.heads || next.dir || "")
        ].filter(Boolean).join(" ");
        nextLine = `${verb} ${bits} <span class="bt-next-eta">${esc(fmtEta(mins[0]))}</span>`;
        if (mins.length > 1)
            nextLine += ` <span class="bt-next-rest">then ${mins.slice(1).map(m => esc(fmtEta(m))).join(", ")}</span>`;
    } else if (st.Error) {
        nextLine = `${verb} <span class="text-muted">arrivals unavailable — retrying</span>`;
    } else {
        // No live prediction: test the schedule and show the next scheduled
        // arrival explicitly as "not seen".
        const sched = st.MetroScheduledNext || nextScheduledFor(id);
        if (sched) {
            const schedBits = [
                `<span class="row-badge${st.Metro ? " metro-line" : busBadgeClass()}" style="background:${badgeColor(sched.route)};color:${st.Metro ? "#fff" : busTextColor(sched.route)}">${esc(badgeLabel(sched.route))}</span>`,
                esc(sched.heads || sched.dirText || "")
            ].filter(Boolean).join(" ");
            nextLine = `${verb} ${schedBits} <span class="bt-next-eta">${esc(fmtScheduleTime(sched.at))}</span>`
                + ` <span class="bt-next-rest">not seen</span>`;
        } else {
            nextLine = `${verb} <span class="text-muted">no arrival or departure</span>`;
        }
    }
    const lineBand = st.Metro
        ? `<span class="hero-line-band" style="background:${metroLineColor(next ? next.route : ((st.Lines || [])[0] || ""))}"></span>`
        : `<span class="hero-line-band bus-band"${busBandAttr(next && next.route)}></span>`;
    return `<div class="hero-card${st.Metro ? " hero-metro" : " hero-bus"}">`
        + lineBand
        + shortcutButtonsHtml(id)
        + `<div><span class="board-stopname">${esc(label)}</span>`
        + (st.Name ? `<span class="board-stopid">#${esc(id)}</span>` : "")
        + `</div>`
        + `<div class="board-next">${nextLine}</div>`
        + `<button type="button" class="board-share" title="Open in Maps" aria-label="Open in Maps">`
        + `<i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i></button>`
        + `</div><div class="hero-route-stops" hidden></div>`;
}

// Piece 8: turn a row's predictions into track markers. Each prediction
// gets one marker: a FILLED circle at the vehicle's last sample when that
// sample is fresh (≤ 120 min) and projects close to the row's path,
// otherwise a HOLLOW circle estimated from the ETA (ETA × 8 mph upstream of
// the boarding stop; a 0-min ETA sits on the guide). Markers clamp to the
// row's drawn extent, so a long-ETA bus never lands off the track.
const BUS_EST_FT_PER_MIN = 704;          // 8 mph ≈ 704 ft/min
const BUS_SAMPLE_MAX_AGE_MS = 120 * 60000;   // plan §3: the freshness gate
const BUS_OFF_TOL_FT = 300;              // samples this far off the path (a
                                          // parallel road, another branch) are
                                          // not markers for this row

// The position row a prediction refers to: a TripID match is the exact run;
// a VehicleID match is the best effort (covers predictions without a trip).
// A route match is required, and a conflicting DirectionNum rejects (a
// vehicle switched to the opposite direction of the same route).
function posRowFor(pred, posRows) {
    if (!pred || !posRows || !posRows.length) return null;
    const rt = String(pred.route || "");
    const tt = String(pred.trip || "");
    const vt = String(pred.vehicle || "");
    let byVehicle = null;
    for (const r of posRows) {
        if (!r || String(r.route || "") !== rt) continue;
        if (pred.dirNum !== "" && pred.dirNum != null && r.dirNum !== "" &&
            String(pred.dirNum) !== String(r.dirNum)) continue;
        if (tt && r.trip && String(r.trip) === tt) return r;
        if (!byVehicle && vt && r.vehicle && String(r.vehicle) === vt) byVehicle = r;
    }
    return byVehicle;
}

// g = the row's boardGeometry entry; scale = the board's shared px/ft.
// posRows = [] when the feed is stale (renderBoardNow applies the gate).
function buildBusMarkers(row, g, scale, posRows, now) {
    const markers = [];
    if (!g || !g.hasTrack || !row.pattern || !g.stops.length || !(scale > 0)) return markers;
    let minFt = Infinity, maxFt = -Infinity;
    for (const s of g.stops) {
        const ft = s.x / scale;
        if (ft < minFt) minFt = ft;
        if (ft > maxFt) maxFt = ft;
    }
    const clamp = (ft) => Math.max(minFt, Math.min(maxFt, ft));
    for (const pred of row.preds || []) {
        if (!pred) continue;
        const min = Math.max(0, Number(pred.min));
        if (!Number.isFinite(min)) continue;
        const pr = posRowFor(pred, posRows);
        let m = null;
        if (pr && pr.lat != null && now - (pr.at || 0) <= BUS_SAMPLE_MAX_AGE_MS) {
            const pj = pointOnTrack(row.pattern, row.anchorIdx, g.mode, pr.lat, pr.lon);
            if (pj && pj.off <= BUS_OFF_TOL_FT) m = { x: clamp(pj.ft) * scale, min, live: true };
        }
        if (!m) m = { x: clamp(-min * BUS_EST_FT_PER_MIN) * scale, min, live: false };
        markers.push(m);
    }
    return markers;
}

// Paint the board from fully resolved inputs. Sections, top to bottom:
// the selected stop's rows (no heading — the boarding stop card above names
// it), then each nearby stop within 500 ft under its own dark separator bar.
// The confirmed opposite-side stop is the FIRST nearby stop and its bar reads
// "Across the street" instead of a distance.
// Sort live and scheduled-fallback rows together by the soonest time.
function sortRowsBySoonest(rows, anchorId, now) {
    for (const r of rows) {
        if (!r.departed && (!r.mins || !r.mins.length))
            r.scheduled = r.scheduled || nextScheduledFor(anchorId, r.route, r.dirNum, r.dest);
    }
    const effMin = (r) => {
        if (r.mins && r.mins.length) return r.mins[0];
        if (r.scheduled) return (r.scheduled.at - now) / 60000;
        return Infinity;
    };
    rows.sort((a, b) => effMin(a) - effMin(b)
        || String(a.route).localeCompare(String(b.route))
        || String(a.dirNum).localeCompare(String(b.dirNum)));
    return rows;
}

function renderBoardNow(anchorId, arrivals, routeDetails, posRows, across, anchorNearby, departedArrivals) {
    // Recently departed buses go above live rows, oldest departure first.
    const nowMs = Date.now();
    const departedPreds = (departedArrivals || []).filter(d => d && d.departed &&
        nowMs >= d.departedAt && nowMs - d.departedAt <= DEPARTED_WINDOW_MS);
    const departedRows = buildBoardRows(anchorId, departedPreds, routeDetails, posRows)
        .filter(r => r.mins && r.mins.length)
        .map(r => {
            r.departed = true;
            r.departedAt = Math.min(...r.preds.map(p => p.departedAt));
            return r;
        })
        .sort((a, b) => a.departedAt - b.departedAt);
    // The hero card already shows the first arriving service (route,
    // direction, destination) and its next times. Do not repeat that service
    // in the route/departure rows below.
    const serviceKey = p => p.route + "|" +
        ((p.dirNum == null || p.dirNum === "") ? "?" : String(p.dirNum)) + "|" +
        (p.heads || "");
    const heroNext = (arrivals || []).reduce((best, p) =>
        p && (!best || p.min < best.min) ? p : best, null);
    const heroKey = heroNext ? serviceKey(heroNext) : null;
    const rowPreds = heroKey
        ? (arrivals || []).filter(p => serviceKey(p) !== heroKey)
        : (arrivals || []);
    const liveRows = buildBoardRows(anchorId, rowPreds, routeDetails, posRows);
    sortRowsBySoonest(liveRows, anchorId, nowMs);
    const mainRows = [...departedRows, ...liveRows];
    // Merge the across-the-street counterpart into the nearby list (first)
    // so it is never shown twice.
    const acrossId = across ? String(across.StopID) : "";
    const nearbyBase = (anchorNearby || []).filter(n => String(n.id) !== acrossId);
    if (across) nearbyBase.unshift({
        id: acrossId, name: across.Name, lat: across.Lat, lon: across.Lon,
        routes: across.Routes || [], distFt: null
    });
    const nearbyRecs = nearbyBase.map(n => {
        const rec = nearbyStopObj(n);
        rec.distFt = n.distFt;
        return rec;
    });
    const nearbyRows = [];
    const nearbyRowCounts = [];
    for (const stp of nearbyRecs) {
        const rows = buildBoardRows(String(stp.StopID), stp.Arrivals || [], routeDetails, posRows);
        sortRowsBySoonest(rows, String(stp.StopID), nowMs);
        nearbyRowCounts.push(rows.length);
        nearbyRows.push(...rows);
    }
    // Board geometry supplies each row's ordered stop list for the
    // "View all stops" disclosure.
    const geo = boardGeometry([...mainRows, ...nearbyRows]);
    // Nearby stop cards. The selected stop is already named in the hero card
    // above the board, so its rows need no card of their own. Every nearby
    // STOP gets a card: title = the stop's name, sub = "Across the street ·
    // #id" for the counterpart or "N ft away · #id". Clicking a card selects
    // that stop — which slides its section (now first) to the top of the board.
    let nearbyParts = [];
    let off = 0;
    for (let i = 0; i < nearbyRecs.length; i++) {
        const rec = nearbyRecs[i];
        const id = String(rec.StopID);
        // per-stop row count; nearbyRows is already fully built.
        const sliceLen = nearbyRowCounts[i];
        const name = rec.Name || allStopsName(id);
        const where = id === acrossId
            ? "Across the street"
            : (rec.distFt != null ? `${Math.round(rec.distFt)} ft away` : "");
        const subBits = [where, `#${id}`].filter(Boolean);
        const busRoute = (rec.Routes && rec.Routes[0]) ||
            (rec.Arrivals && rec.Arrivals[0] && rec.Arrivals[0].route) || "";
        nearbyParts.push(`<div class="nearby-stop-card nearby-bus" role="button" tabindex="0" data-nearby="1" data-stop="${esc(id)}">`
            + `<span class="hero-line-band bus-band"${busBandAttr(busRoute)}></span>`
            + `<div class="nearby-card-head"><div class="nearby-card-main">`
            + `<div class="nearby-card-title">${esc(stopName(name) || "Nearby stop")}</div>`
            + `<div class="nearby-card-sub">${esc(subBits.join(" · "))}</div>`
            + `</div>`
            + `</div></div>`);
        off += sliceLen;
    }
    // Interleave: each nearby stop's rows directly under its own bar.
    let nearbyHtml = "";
    off = 0;
    for (let i = 0; i < nearbyRecs.length; i++) {
        const sliceLen = nearbyRowCounts[i];
        if (nearbyParts[i]) nearbyHtml += nearbyParts[i];
        if (sliceLen) {
            // Final guard: sort this stop's slice immediately before painting,
            // so scheduled fallbacks and predictions always share one order.
            const slice = nearbyRows.slice(off, off + sliceLen);
            sortRowsBySoonest(slice, String(nearbyRecs[i].StopID), nowMs);
            const body = boardHtml({ ...geo, rows: geo.rows.slice(mainRows.length + off) }, slice);
            nearbyHtml += `<div class="nearby-board">${body}</div>`;
        }
        off += sliceLen;
    }
    const mainHtml = mainRows.length
        ? `<div class="main-board">${boardHtml(geo, mainRows)}</div>`
        : "";
    gLinesScroll.innerHTML = (mainRows.length || nearbyRows.length)
        ? mainHtml + nearbyHtml
        : "";
    centerBoard();   // piece 12: boarding guide centered on narrow screens
    gLinesNote.textContent = "";   // no legend line: the board is self-describing
    refreshBoardStopConnections();
}

// (Re)draw the board: resolve the anchor, paint the header at once, then
// fetch whatever route details are not cached and paint. `boardToken` discards stale results when the
// selection changes mid-flight.
let boardToken = 0;

function renderLines() {
    hideHoverTip();
    const token = ++boardToken;
    const st = anchorStop();
    if (!st) {
        gBoardHeader.innerHTML = "";
        gLinesScroll.innerHTML = "";
        gLinesNote.textContent = "no stops to show — use a shortcut or search a stop name above";
        return;
    }
    const anchorId = String(st.StopID);
    if (currentScreen && currentScreen.type === "board" &&
        currentScreen.mode === "bus" && !currentScreen.name) {
        const known = st.Name || allStopsName(anchorId);
        if (known) {
            currentScreen.name = known;
            updateBackButton();
        }
    }
    // Boston bus stripes use the MBTA route color; warm the route directory
    // once, then repaint with the real colors.
    if (isBoston() && !Object.keys(busRouteColors).length) {
        loadBusRouteDirectory()
            .then(() => { if (token === boardToken) renderLines(); })
            .catch(() => {});
    }
    // Live arrivals live on the tracked list stop (what refreshPredictions
    // fills); a directory entry — a raw jStops row — never has them. Keep
    // the directory for identity/name/coords, take Arrivals + Error from
    // the tracked stop so the post-directory re-render keeps predictions.
    const tracked = (pickedStopObj && String(pickedStopObj.StopID) === anchorId)
        ? pickedStopObj
        : shownStops().find(s => String(s.StopID) === anchorId) || null;
    const arr = tracked ? (tracked.Arrivals || []) : [];
    const headSt = tracked
        ? Object.assign({}, st, { Error: tracked.Error || null, Arrivals: arr })
        : st;
    gBoardHeader.innerHTML = heroCardHtml(headSt, arr);
    // The directory is NOT a hard dependency (plan §2): if it is not loaded
    // yet, kick off the load and come back for a better name, the Routes
    // list (service rows) and the across-the-street section — but paint
    // whatever we have right now either way.
    if (!allStopsCache)
        loadStopDirectory()
            .then(() => {
                if (token !== boardToken) return;
                renderLines();
                // The directory just gave the anchor coordinates, so nearby
                // stops may be visible for the first time. Fetch their live
                // arrivals now rather than showing scheduled fallbacks until
                // the next 30-second tick.
                const a = anchorStop();
                if (a && nearbyStops(a).some(n => !nearbyStopObj(n).ArrivalsAt))
                    refreshPredictions();
            })
            .catch(() => {});
    // Every route the board should know: the anchor's directory routes, live
    // predictions, and routes that serve any nearby stop. Keeping the nearby
    // routes in the same fetch set makes a stop look the same whether it is
    // the anchor or a secondary section.
    const nearby = nearbyStops(st);
    const routes = [...new Set([
        ...(st.Routes || []),
        ...arr.map(p => p.route),
        ...(acrossStop ? (acrossStop.Routes || []) : []),
        ...nearby.flatMap(n => n.routes || [])
    ].map(r => String(r || "").toUpperCase()).filter(Boolean))];
    const have = {};
    const missing = [];
    for (const r of routes) {
        if (routeDetailsCache[r] !== undefined) have[r] = routeDetailsCache[r];
        else missing.push(r);
    }
    const paint = () => {
        if (token !== boardToken) return;    // the selection moved on mid-flight
        // Bus positions are no longer fetched: the vehicle markers are gone,
        // so the board matches directions from the predictions themselves.
        renderBoardNow(anchorId, arr, have, [], acrossStop, nearby,
            tracked ? (tracked.Departed || []) : []);
        // Plan §2.2: confirm the opposite-side counterpart once the patterns
        // are resolved (it needs them). Sticky — a re-confirmation is a no-op,
        // and a fresh confirmation prompts the counterpart's first fetch.
        confirmAcross(st, have);
    };
    if (!missing.length) {
        paint();
        return;
    }
    Promise.all(missing.map(r => fetchRouteDetails(r)))
        .then(list => {
            list.forEach((e, i) => { have[missing[i]] = e || null; });
            paint();
        });
}


// ════════════════════════════════════════════════════════════════════
// Distance between two GPS points (spherical law of cosines — plenty
// accurate at these scales). Units: "m" miles, "f" feet, "K" km, "N" nautical
// ════════════════════════════════════════════════════════════════════
function distance(lat1, lon1, lat2, lon2, unit) {
    if (lat1 === lat2 && lon1 === lon2) return 0;
    const radlat1 = Math.PI * lat1 / 180;
    const radlat2 = Math.PI * lat2 / 180;
    const radtheta = Math.PI * (lon1 - lon2) / 180;
    let d = Math.sin(radlat1) * Math.sin(radlat2) +
        Math.cos(radlat1) * Math.cos(radlat2) * Math.cos(radtheta);
    d = Math.acos(Math.max(-1, Math.min(1, d))) * 180 / Math.PI * 60 * 1.1515;   // US statute miles
    if (unit === "K") return Math.trunc(d * 1.609344 * 10) / 10;
    if (unit === "N") return Math.trunc(d * 0.8684 * 10) / 10;
    if (unit === "f") return Math.trunc(d * 5280);
    return Math.trunc(d * 10) / 10;        // "m" = miles
}

// ════════════════════════════════════════════════════════════════════
// Clock
// ════════════════════════════════════════════════════════════════════
function fmtClockTime(ms) {
    return new Date(ms).toLocaleTimeString("en-us",
        { hour: "numeric", minute: "2-digit", second: "2-digit" }).replace(/\s?[AP]M$/, "");
}

function tickClock() {
    // The clock is a freshness stamp: it shows when the page last refreshed
    // its data (or when the page loaded, before any stop is chosen).
    gClock.textContent = fmtClockTime(lastRefreshAt || PAGE_LOADED_AT);
    let meta = "";
    if (refreshInFlight) meta = "refreshing…";
    else if (!refreshEnabled) meta = "auto-refresh off";
    else if (nextRefreshAt)
        meta = `refresh in ${Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000))}s`;
    else if (!lastRefreshAt) meta = "waiting for a stop";
    gClockMeta.textContent = meta;
}

function setRefreshEnabled(on) {
    refreshEnabled = on;
    gRefreshToggle.setAttribute("aria-pressed", on ? "true" : "false");
    if (gRefreshState) gRefreshState.textContent = on ? "on" : "off";
    const label = on ? "Pause timed refresh" : "Resume timed refresh";
    gRefreshToggle.title = label;
    gRefreshToggle.setAttribute("aria-label", label);
    if (!on) {
        if (refreshTimer) clearTimeout(refreshTimer);
        refreshTimer = null;
        nextRefreshAt = 0;
    } else if (mode === "metro" ? metroAnchor : stops.length) {
        scheduleRefresh();
    }
    tickClock();
}
gRefreshToggle.addEventListener("click", () => setRefreshEnabled(!refreshEnabled));
if (gClearFavorites) gClearFavorites.addEventListener("click", resetFavorites);
if (gCitySelect) {
    gCitySelect.value = city;
    gCitySelect.addEventListener("change", () => setCity(gCitySelect.value));
}

// Access gate: check the password, decode the API key, then start the app.
const gateForm = document.getElementById("gateForm");
if (gateForm) gateForm.addEventListener("submit", async e => {
    e.preventDefault();
    const input = document.getElementById("gateInput");
    const err = document.getElementById("gateError");
    const ok = await unlockAccess(input ? input.value : "");
    if (!ok) {
        if (err) err.textContent = "Incorrect password";
        if (input) { input.value = ""; input.focus(); }
    }
});

// ════════════════════════════════════════════════════════════════════
// Go
// ════════════════════════════════════════════════════════════════════
tickClock();
setInterval(tickClock, 1000);
showGate();
</script>
