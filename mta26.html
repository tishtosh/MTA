<body style="height:1500px">

</div>

<div style="margin-top:100px" class="container">

        <li class="nav-item" role="presentation">

                    aria-controls="viewArrivals" aria-selected="true">Arrivals</button>

        <div id="tINSERTHERE"></div>
    </div>
    <div id="viewMap" role="tabpanel" aria-labelledby="tabBtnMap" style="display:none">
        <small id="mapnote" class="text-muted" aria-live="polite" style="display:block"></small>
        <div id="routelist" class="routelist" aria-label="Routes in view — click one to highlight it on the map"></div>
        <div id="map" class="border rounded-bottom" style="height:62vh;min-height:380px"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

<script>
// ════════════════════════════════════════════════════════════════════
// Configuration
// ════════════════════════════════════════════════════════════════════

// ⚠  This key ships inside a public static page — anyone who loads the
//    page (or the repo) can read it. See README.md → "API key handling".
//    This is the ONLY place the key appears in the file.
// const API_KEY = "REDACTED_WMATA_KEY";
const API_KEY = "REDACTED_WMATA_KEY";


// WMATA public API — WMATA operates the DC (Metrobus) bus system.
// Portal / docs / key registration: https://developer.wmata.com
const WMATA_API = "https://api.wmata.com";

// The 20010 corner (Cleveland Park), for building ?busstop= links:
//   1002135 / 1002130  Park Rd NW + 19 St NW        (C87, D72)
//   1002118            Adams Mill Rd NW + Klingle Rd NW (C61)
//   1002127 / 1002120  Park Rd NW + Mt Pleasant St NW (C87, D72)
// The 2025 "Better Bus" redesign renumbered stops — the old defaults
// 1002141/1002148 no longer exist (verified 2026-11). The no-param view
// does a live nearby search instead of using fixed IDs, so it self-heals
// if the IDs change again; see README → "Maintenance".

// Park Rd NW, Cleveland Park (20010) — the "home" corner
const HOME = { lat: 38.93468, lon: -77.04512 };
const DC_CENTER = { lat: 38.89790, lon: -77.03661 };

// ── URL parameters ───────────────────────────────────────────────────
//   ?busstop=1002135,1002130   explicit stops (lat/lon/radius ignored)
//   ?lat=38.934&lon=-77.045    search for stops near this point
//   ?radius=300                search radius in meters
//   ?refresh=30                prediction refresh interval, seconds (15..600)
// No params: live nearby search at the 20010 corner (HOME) above.
// Defaults: radius 300 m, refresh 30 s.
const params = new URLSearchParams(location.search);

function num(value, fallback) {
    const n = parseFloat(value);
    return Number.isFinite(n) ? n : fallback;
}

const stopListFromURL =
    params.get("busstop") ? params.get("busstop").split(",").map(s => s.trim()).filter(Boolean) : null;

// lat/lon: use the URL point only when BOTH are given, otherwise HOME
const hasLatLon = params.has("lat") && params.has("lon");
const urlPoint = hasLatLon
    ? { lat: num(params.get("lat"), HOME.lat), lon: num(params.get("lon"), HOME.lon) }
    : HOME;

const gRadius = num(params.get("radius"), 300);
const REFRESH_MS = Math.min(Math.max(num(params.get("refresh"), 30), 15), 600) * 1000;

// ════════════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════════════
let stops = [];               // [{ StopID, Name, Lat, Lon, Distance, Routes, Arrivals, Error }]
let mapStops = [];            // stops drawn on the map (= stops, plus context stops in ?busstop= mode)
let searchPoint = urlPoint;   // where to look for stops (updated by geolocation)
let searchAt = null;          // the point actually searched (may be DC_CENTER) — for the map
let refreshTimer = null;
let rateLimited = false;      // WMATA returned 429 → slow the refresh down
let busy = false;             // re-entrancy guard for runFlow()
let lastRefreshAt = 0;
// map tab
let mapVisible = false;       // which tab is showing
let mapDataReady = false;     // resolveMapStops() has loaded the map context (coords + neighborhood)
let mapDataPending = false;   // resolveMapStops() is in flight
let mapDataFailed = false;    // context load failed → no auto-retry (a tab click or runFlow retries)
let mapFitted = false;        // fit the viewport to the stops once per runFlow()
let selectedRoute = null;     // the route highlighted on the map (null = show all)
let selectedRouteStops = [];  // every stop on the picked route (from the full dump)
let drawnStops = [];          // the set renderMap() last drew (live stops + picked route's stops)
let allStopsCache = null;     // one-shot full-stops dump, cached per page load

const gStatus = document.getElementById("statusmessage");
const gClock = document.getElementById("clock");
const gTableHost = document.getElementById("tINSERTHERE");
const gMap = document.getElementById("map");
const gViewArrivals = document.getElementById("viewArrivals");
const gViewMap = document.getElementById("viewMap");
const gTabArrivals = document.getElementById("tabBtnArrivals");
const gTabMap = document.getElementById("tabBtnMap");
const gMapNote = document.getElementById("mapnote");
const gRouteList = document.getElementById("routelist");

// ════════════════════════════════════════════════════════════════════
// WMATA API
// ════════════════════════════════════════════════════════════════════
const sleep = ms => new Promise(r => setTimeout(r, ms));

// One GET against the WMATA API. One retry after backoff on 429/timeout.
// Never throws: returns { data, error } so callers decide how to surface it.
async function apiGet(path, query, timeoutMs = 10000) {
    const qs = new URLSearchParams(Object.assign({ api_key: API_KEY }, query));
    for (let attempt = 0; ; attempt++) {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), timeoutMs);
        try {
            const res = await fetch(`${WMATA_API}${path}?${qs}`, { signal: ctl.signal });
            const data = await res.json().catch(() => ({}));
            if (res.status === 429 && attempt === 0) {   // back off, retry once
                await sleep(1500);
                continue;
            }
            const error = res.ok ? null : Object.assign(
                new Error(data.Message || `HTTP ${res.status}`),
                { status: res.status, rateLimited: res.status === 429 });
            return { data, error };
        } catch (e) {                                     // network error / timeout
            if (attempt === 0) {
                await sleep(1500);
                continue;
            }
            return { data: null, error: e };
        } finally {
            clearTimeout(timer);
        }
    }
}

// Nearby stops:  GET /Bus.svc/json/jStops?Lat&Lon&Radius
// Returns [{ StopID, Name, Lat, Lon, Routes }] (or [] if none in range)
async function fetchStopsNear(lat, lon, radius) {
    const { data, error } = await apiGet("/Bus.svc/json/jStops", { Lat: lat, Lon: lon, Radius: radius });
    if (error) throw error;
    return (data && data.Stops) || [];
}

// All stops: GET /Bus.svc/json/jStops (no params)
// The API silently IGNORES a StopID-only query and returns every stop in the
// system (~7.5k, ~800 KB) — that full dump is the only way to resolve a
// stop's coordinates from its ID, since jPredictions returns no location.
// Used once per page load, and only in ?busstop= mode.
async function fetchAllStops() {
    const { data, error } = await apiGet("/Bus.svc/json/jStops", {}, 30000);
    if (error) throw error;
    return (data && data.Stops) || [];
}

// Arrival predictions:  GET /NextBusService.svc/json/jPredictions?StopID
// Returns { name, predictions: [{ min, route, dir, vehicle }] }.
// `name` (StopName) also labels stops given via ?busstop=, since there is
// no single-stop lookup in the nearby-search endpoint. `vehicle`
// (VehicleID) may be null — it identifies the physical bus, which is how
// "all buses on the picked route" is derived (there is no vehicle feed).
async function fetchPredictions(stopId) {
    const { data, error } = await apiGet("/NextBusService.svc/json/jPredictions", { StopID: stopId });
    if (error) throw error;
    return {
        name: (data && data.StopName) || null,
        predictions: ((data && data.Predictions) || []).map(p => ({
            min: p.Minutes, route: p.RouteID, dir: p.DirectionText,
            vehicle: p.VehicleID || null,
        })),
    };
}

// ════════════════════════════════════════════════════════════════════
// Flow
// ════════════════════════════════════════════════════════════════════

function makeStop(id, name, lat, lon) {
    return { StopID: id, Name: name, Lat: lat, Lon: lon, Distance: null, Routes: [], Arrivals: [], Error: null };
}

// Full (re)load: resolve the stop list, then fetch predictions for it.
async function runFlow() {
    if (busy) return;                    // don't stack flows when buttons are clicked
    busy = true;
    try {
        mapFitted = false;              // a full load may move the area → let the map re-fit
        selectedRoute = null;           // ...and a new area means a fresh, unfiltered map
        selectedRouteStops = [];
        if (stopListFromURL) {
            // ?busstop= given: use it as-is, ignore lat/lon (as documented).
            // Coordinates stay null until the map tab asks resolveMapStops()
            // for them (jStops ignores a StopID-only query; jPredictions
            // returns no location) — the arrivals list never needs them.
            gStatus.textContent = `${stopListFromURL.length} stop${stopListFromURL.length > 1 ? "s" : ""} from URL`;
            stops = stopListFromURL.map(id => makeStop(id, null, null, null));
            mapStops = stops.slice();   // resolveMapStops() grows this with a neighborhood context
            mapDataReady = false;
            mapDataFailed = false;      // a new flow clears a stale failure (the map tab retries)
        } else {
            // ?lat&lon (or HOME): find stops near the search point
            const d = distance(DC_CENTER.lat, DC_CENTER.lon, searchPoint.lat, searchPoint.lon, "m");
            const at = d > 50 ? DC_CENTER : searchPoint;     // far from DC → search DC center
            searchAt = at;
            gStatus.textContent = `${d.toFixed(1)} mi to the Whitehouse` + (at === DC_CENTER ? " (searching DC center)" : "") + " …";
            const raw = await fetchStopsNear(at.lat, at.lon, gRadius);
            // Distance is measured from the point we actually searched —
            // NOT from the HOME default, so the geolocation view is honest.
            stops = raw
                .map(s => {
                    const stop = makeStop(s.StopID, s.Name, s.Lat, s.Lon);
                    stop.Distance = distance(at.lat, at.lon, s.Lat, s.Lon, "f");
                    stop.Routes = s.Routes || [];
                    return stop;
                })
                .sort((a, b) => a.Distance - b.Distance);   // sorted; one array, so no index drift
            if (!stops.length) {
                gStatus.textContent = `No stops within ${gRadius} m — try ?radius=600`;
                stops = [];
            }
            mapStops = stops.slice();      // in ?busstop= mode, resolveMapStops() set this
            mapDataReady = true;           // nearby stops already have coordinates
        }
        await refreshPredictions();
    } catch (e) {
        // Stops lookup failed (bad key / network): keep whatever is shown
        gStatus.textContent = `Could not reach WMATA: ${e.message}`;
    } finally {
        busy = false;
        scheduleRefresh();
    }
}

// Re-fetch predictions for the current stops. Promise.all so the render
// happens exactly once, after every request has settled — including the
// ones that failed (the old code only rendered when the last request
// SUCCEEDED, so one 400/429 left a blank page). With a route picked, its
// stops are included too — that is what keeps the bus icons moving.
async function refreshPredictions() {
    const toFetch = new Map();              // StopID → stop object
    for (const s of selectedRouteStops) toFetch.set(s.StopID, s);
    for (const s of stops) toFetch.set(s.StopID, s);   // live copy wins on overlap
    if (!toFetch.size) return;
    let saw429 = false;
    await Promise.all([...toFetch.values()].map(async (stop) => {
        try {
            const { name, predictions } = await fetchPredictions(stop.StopID);
            if (name && !stop.Name) stop.Name = name;      // ?busstop= mode learns names here
            stop.Arrivals = predictions;
            stop.Error = null;
        } catch (e) {
            stop.Arrivals = [];
            stop.Error = e;                                 // rendered as a muted row
            if (e.rateLimited) saw429 = true;
        }
    }));
    rateLimited = saw429;          // → next refresh is delayed (self-throttling)
    lastRefreshAt = Date.now();
    render();
    scheduleRefresh();             // re-arm: the 30-second cycle continues after every tick
    const t = new Date().toLocaleTimeString("en-us", { hour: "numeric", minute: "2-digit", second: "2-digit" });
    gStatus.textContent = `${stops.length} stop${stops.length > 1 ? "s" : ""} · updated ${t}` +
        (rateLimited ? " · API rate limit hit, slowing refresh" : "");
}

// Periodic refresh: predictions only (the stop list itself rarely changes).
// After a 429 the interval stretches 5× to be polite to the shared key.
function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    const wait = rateLimited ? 5 * REFRESH_MS : REFRESH_MS;
    refreshTimer = setTimeout(() => refreshPredictions(), wait);
}

// Background tabs get throttled timers; refresh promptly when we come back.
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !busy && stops.length) {
        if (Date.now() - lastRefreshAt > REFRESH_MS / 2) {
            refreshPredictions();
        } else {
            scheduleRefresh();
        }
    }
});

// ════════════════════════════════════════════════════════════════════
// Rendering
// ════════════════════════════════════════════════════════════════════

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
}

function fmtDistance(ft) {
    if (ft == null) return "—";
    return ft < 5280 ? `${ft} ft` : `${(ft / 5280).toFixed(1)} mi`;
}

function render() {
    let rows = "";
    for (const s of stops) {
        rows += "<tr class='table-primary vert'>"
            + "<td class='text-center'><i class='fa-solid fa-person-walking'></i></td>"
            + `<td>${fmtDistance(s.Distance)}</td>`
            + `<td colspan="2">${esc(s.Name || s.StopID)} <small class="text-muted">(#${esc(s.StopID)})</small></td>`
            + "</tr>";

        if (s.Error) {
            const msg = s.Error.rateLimited ? "too many requests — will retry" : "predictions unavailable";
            rows += "<tr><td class='text-center'><i class='fa-solid fa-triangle-exclamation text-warning'></i></td>"
                + `<td colspan="3" class="text-muted">${esc(msg)}</td></tr>`;
        } else if (!s.Arrivals.length) {
            rows += "<tr><td class='text-center'><i class='fa-solid fa-clock'></i></td>"
                + "<td colspan='3' class='text-muted'>no arrivals scheduled</td></tr>";
        } else {
            for (const a of s.Arrivals) {
                rows += "<tr><td class='text-center'><i class='fa-solid fa-clock'></i></td>"
                    + `<td>${esc(a.min)}</td>`
                    + `<td><b>${esc(a.route)}</b></td>`
                    + `<td>${esc(a.dir)}</td></tr>`;
            }
        }
    }
    gTableHost.innerHTML = stops.length
        ? `<div class="container">
             <table class="table table-sm table-hover">
                 <thead><tr><th style="width:8%"></th><th style="width:18%"></th><th style="width:20%"></th><th>destination</th></tr></thead>
                 <tbody>${rows}</tbody>
             </table>
           </div>`
        : "";

    renderMap();     // keeps the map in sync with the data; no-op unless the tab is visible
}

// ════════════════════════════════════════════════════════════════════
// Navigation icons
// ════════════════════════════════════════════════════════════════════

document.getElementById("btnBus").addEventListener("click", () => location.reload());

document.getElementById("btnHome").addEventListener("click", () => {
    searchPoint = urlPoint;              // home = URL lat/lon, or the 20010 corner
    runFlow();
});

document.getElementById("btnLocate").addEventListener("click", () => {
    if (!navigator.geolocation) {
        gStatus.textContent = "Geolocation not supported by this browser";
        return;
    }
    gStatus.textContent = "Locating …";
    navigator.geolocation.getCurrentPosition(
        pos => {
            searchPoint = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            runFlow();
        },
        () => { gStatus.textContent = "Turn on location sharing."; },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
    );
});

// ════════════════════════════════════════════════════════════════════
// Map tab
// Leaflet + OpenStreetMap tiles — no API key, no geometry files. WMATA
// publishes no line geometry, so each route's line is synthesized as the
// nearest-neighbor chain through its own stops (approximate in shape, but
// self-heals if WMATA renumbers stops again).
// ════════════════════════════════════════════════════════════════════

let leaflet = null;           // the L.map instance, created lazily on first view
let mapLayer = null;          // the L.layerGroup that gets cleared + redrawn each render
const MAP_CONTEXT_RADIUS = 1600;   // meters (~1 mi) — neighborhood context for ?busstop=

// A small distinguishable palette; routes hash into it (stable across loads).
const ROUTE_COLORS = ["#c62828", "#1565c0", "#2e7d32", "#ef6c00", "#6a1b9a", "#00838f",
    "#ad1457", "#5d4037", "#455a64", "#827717", "#37474f", "#9e9d24"];

function routeColor(routeId) {
    let h = 0;
    for (const c of String(routeId)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return ROUTE_COLORS[h % ROUTE_COLORS.length];
}

// Order a route's stops as a chain: start at the first, repeatedly visit the
// nearest unvisited stop. (Squared degree distance is plenty for ordering.)
function chainStops(pts) {
    if (pts.length < 2) return pts.slice();
    const rest = pts.slice();
    const out = [rest.shift()];
    while (rest.length) {
        const last = out[out.length - 1];
        let bi = 0, bd = Infinity;
        for (let i = 0; i < rest.length; i++) {
            const d = (rest[i].Lat - last.Lat) ** 2 + (rest[i].Lon - last.Lon) ** 2;
            if (d < bd) { bd = d; bi = i; }
        }
        out.push(rest.splice(bi, 1)[0]);
    }
    return out;
}

// Give the map its coordinates. In nearby mode the stops already have them;
// in ?busstop= mode jStops ignores a StopID-only query, so pull the one-shot
// full dump (cached per page load), look the requested stops up in it, then
// add a ~1-mile neighborhood for context. Deliberately deferred: the arrivals
// flow never waits for it — it runs when the Map tab is shown.
async function resolveMapStops() {
    if (mapDataReady || mapDataPending) return;
    const needsCoords = stops.some(s => s.Lat == null || s.Lon == null);
    if (!needsCoords) {                       // already resolved (a re-run in ?busstop=)
        mapDataReady = true;
        if (mapVisible) renderMap();
        return;
    }
    mapDataPending = true;
    mapDataFailed = false;
    gMapNote.textContent = "Loading stops …";
    try {
        if (!allStopsCache) allStopsCache = await fetchAllStops();   // ~7.5k stops, once per load
        const byId = new Map(allStopsCache.map(s => [s.StopID, s]));
        let found = 0;
        for (const stop of stops) {
            const hit = byId.get(stop.StopID);
            if (hit) {
                stop.Lat = hit.Lat;
                stop.Lon = hit.Lon;
                if (!stop.Name) stop.Name = hit.Name;
                if (!stop.Routes.length) stop.Routes = hit.Routes || [];
                found++;
            }
        }
        mapStops = stops.filter(s => s.Lat != null && s.Lon != null);
        if (mapStops.length) {
            // Neighborhood context around the requested stops: the route lines
            // need nearby stops, and it makes the map feel like a place.
            const cLat = mapStops.reduce((a, s) => a + s.Lat, 0) / mapStops.length;
            const cLon = mapStops.reduce((a, s) => a + s.Lon, 0) / mapStops.length;
            for (const s of await fetchStopsNear(cLat, cLon, MAP_CONTEXT_RADIUS)) {
                if (!mapStops.some(t => t.StopID === s.StopID)) {
                    const ctx = makeStop(s.StopID, s.Name, s.Lat, s.Lon);
                    ctx.Routes = s.Routes || [];
                    ctx.Context = true;
                    mapStops.push(ctx);
                }
            }
        }
        mapDataReady = true;
        mapFitted = false;                   // new area → let renderMap() re-fit
        gMapNote.textContent = found === stops.length
            ? "Lines are drawn through each route's stops (WMATA publishes no geometry). Hover a circle for details."
            : `${found} of ${stops.length} requested stops found — the rest may have been renumbered.`;
    } catch (e) {
        mapDataFailed = true;                // no auto-retry; a tab click or new flow retries
        gMapNote.textContent = `Map data unavailable: ${e.message} — click the tab to retry.`;
    } finally {
        mapDataPending = false;
    }
    if (mapVisible) renderMap();
}

// One pill per route in view, colored like its line, plus an "All routes"
// reset. Rebuilt on every render — the list always mirrors the map.
function renderRouteList(pts) {
    const ids = [...new Set(pts.flatMap(s => s.Routes || []))]
        .sort((a, b) => a.localeCompare(b, "en", { numeric: true }));
    gRouteList.replaceChildren(
        routeChip("All routes", null, null),
        ...ids.map(id => routeChip(id, id, routeColor(id)))
    );
    for (const chip of gRouteList.children) {
        chip.classList.toggle("sel", selectedRoute !== null && chip.dataset.route === selectedRoute);
    }
}

function routeChip(label, routeId, color) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "routechip" + (color ? "" : " all");
    btn.textContent = label;
    btn.title = routeId ? "Show all of " + label + " — every stop on the route, and its buses" : "Show all routes";
    btn.dataset.route = routeId || "";
    if (color) btn.style.background = color;
    btn.addEventListener("click", () => toggleRoute(routeId));
    return btn;
}

// Pick a route: EVERY stop on that route is drawn (the full dump is the API's
// only source of a complete route), its buses appear as icons, and the view
// fits the whole line. Pick the same one again — or "All routes" — to undo.
async function toggleRoute(routeId) {
    const next = (selectedRoute === routeId) ? null : routeId;
    if (next === selectedRoute) return;          // "All routes" while already showing all
    selectedRoute = next;
    selectedRouteStops = [];
    if (next) {
        renderMap(null);                        // recolor now; the camera moves once the full route is known
    } else {
        renderMap("all");                       // unpick → zoom back to fit the whole set again
    }
    if (!next) return;
    try {
        if (!allStopsCache) allStopsCache = await fetchAllStops();   // one ~800 KB fetch per page load
        if (selectedRoute !== next) return;     // superseded by a newer pick while the dump was loading
        const have = new Set(mapStops.map(s => s.StopID));
        selectedRouteStops = allStopsCache
            .filter(s => (s.Routes || []).includes(next) && !have.has(s.StopID))
            .map(s => {
                const stop = makeStop(s.StopID, s.Name, s.Lat, s.Lon);
                stop.Routes = s.Routes || [];
                stop.RouteStop = true;          // a full-route stop — not live-tracked, no table row
                return stop;
            });
        if (selectedRoute !== next) return;
        await refreshPredictions();             // the route's buses show up now, not on the next 30-s tick
        if (selectedRoute !== next) return;
        renderMap(next);                        // fit the viewport to the whole route
    } catch (e) {
        if (selectedRoute !== next) return;
        gMapNote.textContent = `Full ${next} stop list unavailable: ${e.message}`;
        renderMap(null);
    }
}

// Redraw the map to match the current data. Called from render() on every
// pass, but a no-op unless the Map tab is showing. If Leaflet failed to load
// (CDN blocked / offline), the route list and the rest of the page keep
// working as-is. `fitTo` (a route id, or "all") re-fits the viewport — set
// by a route pick; the 30-second refresh passes nothing and keeps the view.
function renderMap(fitTo = null) {
    if (!mapVisible) return;
    if (!mapDataReady) {
        if (!mapDataPending && !mapDataFailed) resolveMapStops();   // map showing, data missing
        return;                                                     // the note is set by resolveMapStops
    }

    // The drawn set: the live-tracked stops (plus their neighborhood
    // context)… and, with a route picked, EVERY stop on that route, pulled
    // from the full dump — the API's only source of a route's complete
    // stop list. A stop already drawn keeps its live copy: it has real
    // arrivals, and the arrivals table is built from those.
    const pts = mapStops.filter(s => s.Lat != null && s.Lon != null);
    if (selectedRouteStops.length) {
        const have = new Set(pts.map(s => s.StopID));
        for (const s of selectedRouteStops) {
            if (s.Lat != null && s.Lon != null && !have.has(s.StopID)) pts.push(s);
        }
    }
    drawnStops = pts;
    renderRouteList(pts);
    if (!pts.length) {
        gMapNote.textContent = "No stops with coordinates to draw.";
        return;
    }
    if (typeof L === "undefined") {
        gMapNote.textContent = "Map unavailable — the Leaflet CDN could not be loaded.";
        return;
    }
    if (!leaflet) {
        leaflet = L.map(gMap, {
            zoomSnap: 0.25,     // wheel zoom in quarter-level steps…
            zoomDelta: 0.25,    // …so one notch nudges ~12% instead of a full 2× jump
        });
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a> contributors",
        }).addTo(leaflet);
        mapLayer = L.layerGroup().addTo(leaflet);
    }

    mapLayer.clearLayers();

    // Route lines: one thick colored polyline per route, through its stops.
    // With a route picked, the others recede so the pick reads at a glance.
    const byRoute = new Map();
    for (const s of pts) {
        for (const r of s.Routes || []) {
            if (!byRoute.has(r)) byRoute.set(r, []);
            byRoute.get(r).push(s);
        }
    }
    for (const [routeId, stopsForRoute] of byRoute) {
        const chain = chainStops(stopsForRoute);
        if (chain.length < 2) continue;               // one stop doesn't make a line
        const color = routeColor(routeId);
        const picked = selectedRoute === routeId;
        L.polyline(chain.map(s => [s.Lat, s.Lon]), {
            color,
            weight: picked ? 9 : 6,
            opacity: selectedRoute ? (picked ? 1 : 0.25) : 0.8,
            lineCap: "round", lineJoin: "round",
        }).addTo(mapLayer);
        if (!selectedRoute || picked) {               // one label at a time while a route is picked
            const mid = chain[Math.floor((chain.length - 1) / 2)];   // label above the line's middle
            L.marker([mid.Lat, mid.Lon], {
                icon: L.divIcon({
                    className: "routetag-wrap", iconSize: [0, 0],
                    html: `<span class="routetag" style="background:${color}">${esc(routeId)}</span>`,
                }),
                interactive: false,                       // the label must not block stop tooltips
            }).addTo(mapLayer);
        }
    }

    // Stops: circle markers; hover → address, routes, next arrivals.
    // Off-route stops fade back while a route is picked.
    for (const s of pts) {
        const onPick = selectedRoute === null || (s.Routes || []).includes(selectedRoute);
        const color = (s.Routes || []).length ? routeColor(s.Routes[0]) : "#455a64";
        const next = (s.Arrivals || []).slice(0, 3)
            .map(a => `${esc(a.route)} · ${esc(a.dir)} in ${esc(a.min)} min`)
            .join("<br>");
        L.circleMarker([s.Lat, s.Lon], {
            radius: s.Context ? 5 : 7,
            color: "#fff", weight: 1.5,
            fillColor: color,
            fillOpacity: onPick ? 1 : 0.3,
            opacity: onPick ? 1 : 0.3,
        }).bindTooltip(
            `<b>${esc(s.Name || s.StopID)}</b>`
            + (s.Routes && s.Routes.length ? `<br>${esc(s.Routes.join(", "))}` : "")
            + (next ? `<br>${next}` : "")
            + (s.Context ? "<br><i>context stop</i>" : ""),
            { direction: "top", opacity: 0.95 }
        ).addTo(mapLayer);
    }

    // Buses: with a route picked, every vehicle predicted ON that route is
    // drawn once — a bus icon at the stop of its nearest arrival. WMATA
    // publishes no live vehicle feed, so this is derived from the per-stop
    // predictions; the 30-second tick re-derives it, so the icons move.
    if (selectedRoute) {
        const color = routeColor(selectedRoute);
        const nearest = new Map();           // vehicle ID → { stop, min, dir }
        for (const s of pts) {
            for (const a of s.Arrivals || []) {
                if (a.route !== selectedRoute || !a.vehicle) continue;
                const cur = nearest.get(a.vehicle);
                if (!cur || a.min < cur.min) nearest.set(a.vehicle, { vehicle: a.vehicle, stop: s, min: a.min, dir: a.dir });
            }
        }
        for (const v of nearest.values()) {
            L.marker([v.stop.Lat, v.stop.Lon], {
                icon: L.divIcon({
                    className: "busicon-wrap",
                    iconSize: [24, 24], iconAnchor: [12, 12],
                    html: `<span class="busicon" style="background:${color}"><i class="fa-solid fa-bus"></i></span>`,
                }),
                zIndexOffset: 500,
                keyboard: false,
            }).bindTooltip(
                `<b>Bus #${esc(String(v.vehicle))}</b> · ${esc(v.dir)} in ${esc(v.min)} min`,
                { direction: "top", opacity: 0.95 }
            ).addTo(mapLayer);
        }
    }

    // Fit the viewport once per full load — not on every 30-second refresh.
    // An explicit route pick (fitTo) is a deliberate move, so it always fits.
    if (!mapFitted) {
        leaflet.fitBounds(L.latLngBounds(pts.map(s => [s.Lat, s.Lon])).pad(0.15), { maxZoom: 16 });
        mapFitted = true;
    } else if (fitTo) {
        const selPts = fitTo === "all" ? pts : pts.filter(s => (s.Routes || []).includes(fitTo));
        leaflet.fitBounds(
            L.latLngBounds((selPts.length ? selPts : pts).map(s => [s.Lat, s.Lon])).pad(0.2),
            { maxZoom: 17 });
    }
}

// Tab buttons (plain JS — no Bootstrap JS)
function showTab(which) {
    const showMap = which === "map";
    mapVisible = showMap;
    gViewArrivals.style.display = showMap ? "none" : "";
    gViewMap.style.display = showMap ? "" : "none";
    gTabArrivals.classList.toggle("active", !showMap);
    gTabArrivals.setAttribute("aria-selected", String(!showMap));
    gTabMap.classList.toggle("active", showMap);
    gTabMap.setAttribute("aria-selected", String(showMap));
    if (showMap) {
        if (!mapDataReady && !mapDataPending) resolveMapStops();   // explicit click → retry even after a failure
        if (leaflet) leaflet.invalidateSize();                    // the map was display:none while hidden
        renderMap();
    }
}

gTabArrivals.addEventListener("click", () => showTab("arrivals"));
gTabMap.addEventListener("click", () => showTab("map"));

// ════════════════════════════════════════════════════════════════════
// Distance between two GPS points (spherical law of cosines — plenty
// accurate at these scales). Units: "m" miles, "f" feet, "K" km, "N" nautical
// ════════════════════════════════════════════════════════════════════
function distance(lat1, lon1, lat2, lon2, unit) {
    if (lat1 === lat2 && lon1 === lon2) return 0;
    const radlat1 = Math.PI * lat1 / 180;
    const radlat2 = Math.PI * lat2 / 180;
    const radtheta = Math.PI * (lon1 - lon2) / 180;
    let d = Math.sin(radlat1) * Math.sin(radlat2) +
        Math.cos(radlat1) * Math.cos(radlat2) * Math.cos(radtheta);
    d = Math.acos(Math.max(-1, Math.min(1, d))) * 180 / Math.PI * 60 * 1.1515;   // US statute miles
    if (unit === "K") return Math.trunc(d * 1.609344 * 10) / 10;
    if (unit === "N") return Math.trunc(d * 0.8684 * 10) / 10;
    if (unit === "f") return Math.trunc(d * 5280);
    return Math.trunc(d * 10) / 10;        // "m" = miles
}

// ════════════════════════════════════════════════════════════════════
// Clock
// ════════════════════════════════════════════════════════════════════
function tickClock() {
    const s = new Date().toLocaleTimeString("en-us", { hour: "numeric", minute: "2-digit", second: "2-digit" });
    gClock.textContent = s.replace(/\s?[AP]M$/, "");       // no AM/PM
}

// ════════════════════════════════════════════════════════════════════
// Go
// ════════════════════════════════════════════════════════════════════
tickClock();
setInterval(tickClock, 1000);
runFlow();
</script>
