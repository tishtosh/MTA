<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="favicon.ico">
    <title>like a bus</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./css/all.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .fa-xl-mta {
            font-size: 3em;
            line-height: 0.02167em;
            margin-bottom: 5px;
            margin-top: 5px;
            width: 70px;
            text-align: center;
            vertical-align: -0.125em;
        }

        .fa-mta {
            font-size: 3em;
            line-height: 0.02167em;
            text-align: center;
            vertical-align: -0.125em;
        }

        .vert {
            vertical-align: middle;
        }

        /* icon buttons: look like the old <li> icons, but keyboard accessible */
        .navicon {
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
        }

        /* stop-name entry with autocomplete (drives the one view) */
        .ac-wrap {
            position: relative;
            max-width: 460px;
            margin: 10px 0 14px;
        }

        .ac-clear {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .ac-clear i { font-size: 14px; }

        .ac-clear:hover { color: #212529; }

        .ac-list {
            position: absolute;
            top: calc(100% + 2px);
            left: 0;
            right: 0;
            z-index: 1050;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0 0 .375rem .375rem;
            box-shadow: 0 6px 12px rgba(0, 0, 0, .12);
            max-height: 280px;
            overflow-y: auto;
            padding: 4px 0;
        }

        .ac-item {
            padding: 3px 12px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ac-item:hover,
        .ac-item.active { background: #e9ecef; }

        .ac-item .code { color: #6c757d; font-size: .85em; margin-left: 8px; }

        .ac-none { padding: 4px 12px; color: #6c757d; cursor: default; }

        /* The route picture (v4): one <svg> holds the whole picture — a
           scale strip, then one row per route through the anchor stop.
           Each row is an x-axis of travel time from the anchor stop: a
           45-minute window (40 min of approach behind, 5 min ahead);
           every route lives in the same svg, so the anchor stop sits at
           the same x in every route and the picture scrolls as one piece.
           The route code (colored, in the left gutter) replaces the old
           badge pill; each row's destination terminal reads in the right
           gutter. */
        .lines-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .lines-scroll svg { display: block; }

        .line-dot { cursor: help; }       /* a stop dot (an <g> in the svg) */

        .lines-routelabel { font: 700 13px/1 system-ui, -apple-system, sans-serif; }

        .lines-minlabel { font: 10px/1.4 system-ui, -apple-system, sans-serif; fill: #8a959e; }

        .line-bus { font-size: 17px; }

        /* minutes-to-arrival beneath the track (the bus rides just above) */
        .line-busmin { font: 700 10px/1 system-ui, -apple-system, sans-serif; fill: #343a40; }

        /* the row's destination terminal, in the right gutter (→ name) */
        .lines-dest { font: 600 12px/1 system-ui, -apple-system, sans-serif; }

        /* floating tooltip that follows a hovered stop dot */
        .hovertip {
            position: fixed;
            z-index: 2000;
            max-width: 340px;
            background: rgba(33, 37, 41, .95);
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.45;
            pointer-events: none;
        }

        /* Next arrivals: a dark LED board under the picture. The anchor
           stop's next arrivals scroll upward through a 3-line window, like
           the display at a real bus stop; the list (doubled for a seamless
           loop) translates −50% on the y-axis (see .ticker-inner). */
        .ticker {
            background: #101418;
            border: 1px solid #212529;
            border-radius: 6px;
            overflow: hidden;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: 15px;
            color: #ffc94d;              /* LED amber */
        }

        .ticker-label {
            display: block;
            padding: 4px 12px;
            background: #1b2129;
            border-bottom: 1px solid #2d333b;
            color: #8b949e;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .ticker-window { height: 66px; overflow: hidden; }   /* 3 lines × 22px */

        .ticker-inner {
            will-change: transform;
            animation: tickerscroll 15s linear infinite;    /* duration set per refresh */
        }

        .ticker-line {
            display: flex;
            align-items: center;
            height: 22px;
            padding: 0 12px;
            white-space: nowrap;
        }

        .ticker-rt { flex: none; width: 9px; height: 9px; border-radius: 2px; margin-right: 9px; }

        .ticker-route { flex: none; width: 58px; font-weight: 700; }

        .ticker-min { flex: none; width: 64px; color: #fff; font-weight: 700; }

        .ticker-dir { overflow: hidden; text-overflow: ellipsis; opacity: .85; }

        .ticker-blank .ticker-dir { color: #313843; }

        .ticker-static { display: block; height: 22px; line-height: 22px; padding: 0 12px; color: #8b949e; }

        @keyframes tickerscroll { to { transform: translateY(-50%); } }
    </style>
</head>

<body style="height:1500px">

    <div id="viewArrivals">

<div id="hovertip" class="hovertip" hidden></div>

<script>
// ════════════════════════════════════════════════════════════════════
// Configuration
// ════════════════════════════════════════════════════════════════════

// ⚠  This key ships inside a public static page — anyone who loads the
//    page (or the repo) can read it. See README.md → "API key handling".
//    This is the ONLY place the key appears in the file.
// const API_KEY = "REDACTED_WMATA_KEY";
const API_KEY = "REDACTED_WMATA_KEY";


// WMATA public API — WMATA operates the DC (Metrobus) bus system.
// Portal / docs / key registration: https://developer.wmata.com
const WMATA_API = "https://api.wmata.com";

// The 20010 corner (Cleveland Park), for building ?busstop= links:
//   1002135 / 1002130  Park Rd NW + 19 St NW        (C87, D72)
//   1002118            Adams Mill Rd NW + Klingle Rd NW (C61)
//   1002127 / 1002120  Park Rd NW + Mt Pleasant St NW (C87, D72)
// The 2025 "Better Bus" redesign renumbered stops — the old defaults
// 1002141/1002148 no longer exist (verified 2026-11). The no-param view
// does a live nearby search instead of using fixed IDs, so it self-heals
// if the IDs change again; see README → "Maintenance".

// Park Rd NW, Cleveland Park (20010) — the "home" corner
const HOME = { lat: 38.93468, lon: -77.04512 };
const DC_CENTER = { lat: 38.89790, lon: -77.03661 };

// ── URL parameters ───────────────────────────────────────────────────
//   ?busstop=1002135,1002130   explicit stops (lat/lon/radius ignored)
//   ?lat=38.934&lon=-77.045    search for stops near this point
//   ?radius=300                search radius in meters
//   ?refresh=30                prediction refresh interval, seconds (15..600)
// No params: live nearby search at the 20010 corner (HOME) above.
// Defaults: radius 300 m, refresh 30 s.
const params = new URLSearchParams(location.search);

function num(value, fallback) {
    const n = parseFloat(value);
    return Number.isFinite(n) ? n : fallback;
}

const stopListFromURL =
    params.get("busstop") ? params.get("busstop").split(",").map(s => s.trim()).filter(Boolean) : null;

// lat/lon: use the URL point only when BOTH are given, otherwise HOME
const hasLatLon = params.has("lat") && params.has("lon");
const urlPoint = hasLatLon
    ? { lat: num(params.get("lat"), HOME.lat), lon: num(params.get("lon"), HOME.lon) }
    : HOME;

const gRadius = num(params.get("radius"), 300);
const REFRESH_MS = Math.min(Math.max(num(params.get("refresh"), 30), 15), 600) * 1000;

// ════════════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════════════
let stops = [];               // [{ StopID, Name, Lat, Lon, Distance, Routes, Arrivals, Error }]
let searchPoint = urlPoint;   // where to look for stops (updated by geolocation)
let pickedStop = null;        // the stop chosen in the entry field (null = nearby search)
let pickedStopObj = null;     // the stop object actually shown (may be a directory stop outside the list)
let forceNearby = false;      // the user dismissed a ?busstop= prefill (✕) → search nearby even with the param
let refreshTimer = null;
let rateLimited = false;      // WMATA returned 429 → slow the refresh down
let busy = false;             // re-entrancy guard for runFlow()
let lastRefreshAt = 0;
// stop directory
// The full jStops dump (812 KB, ~7.5k stops) is fetched once per page load
// and feeds the shared entry field's autocomplete plus the route picture.
let allStopsCache = null;     // the full stop dump, cached per page load
let stopDirLoad = null;       // in-flight loadStopDirectory() promise (dedupes the fetch)

const gStatus = document.getElementById("statusmessage");
const gClock = document.getElementById("clock");
const gTableHost = document.getElementById("tINSERTHERE");
const gStopEntry = document.getElementById("stopEntry");
const gStopEntryClear = document.getElementById("stopEntryClear");
const gStopEntryList = document.getElementById("stopEntryList");
const gLinesNote = document.getElementById("linesNote");
const gLinesScroll = document.getElementById("linesScroll");
const gTickerHost = document.getElementById("tickerHost");
const gHoverTip = document.getElementById("hovertip");

// ════════════════════════════════════════════════════════════════════
// WMATA API
// ════════════════════════════════════════════════════════════════════
const sleep = ms => new Promise(r => setTimeout(r, ms));

// One GET against the WMATA API. One retry after backoff on 429/timeout.
// Never throws: returns { data, error } so callers decide how to surface it.
async function apiGet(path, query, timeoutMs = 10000) {
    const qs = new URLSearchParams(Object.assign({ api_key: API_KEY }, query));
    for (let attempt = 0; ; attempt++) {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), timeoutMs);
        try {
            const res = await fetch(`${WMATA_API}${path}?${qs}`, { signal: ctl.signal });
            const data = await res.json().catch(() => ({}));
            if (res.status === 429 && attempt === 0) {   // back off, retry once
                await sleep(1500);
                continue;
            }
            const error = res.ok ? null : Object.assign(
                new Error(data.Message || `HTTP ${res.status}`),
                { status: res.status, rateLimited: res.status === 429 });
            return { data, error };
        } catch (e) {                                     // network error / timeout
            if (attempt === 0) {
                await sleep(1500);
                continue;
            }
            return { data: null, error: e };
        } finally {
            clearTimeout(timer);
        }
    }
}

// Nearby stops:  GET /Bus.svc/json/jStops?Lat&Lon&Radius
// Returns [{ StopID, Name, Lat, Lon, Routes }] (or [] if none in range)
async function fetchStopsNear(lat, lon, radius) {
    const { data, error } = await apiGet("/Bus.svc/json/jStops", { Lat: lat, Lon: lon, Radius: radius });
    if (error) throw error;
    return (data && data.Stops) || [];
}

// All stops: GET /Bus.svc/json/jStops (no params)
// The API silently IGNORES a StopID-only query and returns every stop in the
// system (~7.5k, ~800 KB). Each entry is { StopID, Name, Lon, Lat, Routes[] }
// — that dump is the only source of stop names, coordinates and routes.
// Fetched once per page load via loadStopDirectory(); it powers the
// shared entry field's autocomplete and the route picture.
async function fetchAllStops() {
    const { data, error } = await apiGet("/Bus.svc/json/jStops", {}, 30000);
    if (error) throw error;
    return (data && data.Stops) || [];
}

// The stop directory, deduped: concurrent callers (the entry field, the
// picture) share one in-flight fetch, and failures are not retried.
function loadStopDirectory() {
    if (!stopDirLoad) {
        stopDirLoad = fetchAllStops()
            .then(stops => { allStopsCache = stops; return stops; })
            .catch(err => { stopDirLoad = null; throw err; });   // allow a later retry
    }
    return stopDirLoad;
}

// StopID → Name index over the directory dump (built lazily once): the
// route-details normalization and the board's dot reveals fall back to it
// when a stop's own Name is missing.
let dirNameIndex = null;
function allStopsName(id) {
    if (!allStopsCache) return "";
    if (!dirNameIndex)
        dirNameIndex = new Map(allStopsCache.map(s => [String(s.StopID), s.Name || ""]));
    return dirNameIndex.get(String(id)) || "";
}

// Arrival predictions:  GET /NextBusService.svc/json/jPredictions?StopID
// Returns { name, predictions: [{ min, route, dir, dirNum, heads, vehicle, trip }] }.
// `name` (StopName) also labels stops given via ?busstop=, since there is
// no single-stop lookup in the nearby-search endpoint. `route`, `vehicle`
// (VehicleID) and `trip` (TripID) are normalized to strings — trip is the
// authoritative key for joining live positions; `dir` is the feed's
// DirectionText ("North to Van Ness" — the live destination, per the plan)
// with `heads` preferring a TripHeadsign when one is ever supplied. `min`
// is a number; 0 ("Due") is legitimate; missing or malformed minutes drop
// the row. Rows are deduped per stop+trip, falling back to
// vehicle+route+direction when the trip is missing; rows with neither ID
// are kept (the ETA list stays whole).
async function fetchPredictions(stopId) {
    const { data, error } = await apiGet("/NextBusService.svc/json/jPredictions", { StopID: stopId });
    if (error) throw error;
    if (!data || !Array.isArray(data.Predictions)) throw new Error("malformed prediction response");
    const name = data.StopName || null;
    const preds = [];
    const seen = new Set();
    for (const p of data.Predictions) {
        const min = Number(p.Minutes);
        if (!Number.isFinite(min) || min < 0) continue;    // malformed / off-service artifact
        const route = String(p.RouteID || "").toUpperCase();
        if (!route) continue;
        const dirNum = p.DirectionNum != null ? String(p.DirectionNum) : "";
        const vehicle = p.VehicleID != null ? String(p.VehicleID) : "";
        const trip = p.TripID != null ? String(p.TripID) : "";
        const dir = String(p.DirectionText || "");
        const key = trip ? route + "|" + trip
                  : vehicle ? route + "|" + vehicle + "|" + dirNum
                  : null;
        if (key !== null) {
            if (seen.has(key)) continue;
            seen.add(key);
        }
        preds.push({ min, route, dir, dirNum, heads: String(p.TripHeadsign || "") || dir,
                     vehicle: vehicle || null, trip: trip || null });
    }
    preds.sort((a, b) => a.min - b.min || a.route.localeCompare(b.route));
    return { name, predictions: preds };
}

// Route details:  GET /Bus.svc/json/jRouteDetails?RouteID   (verified 2026-11:
// 200 from /Bus.svc, 404 from /NextBusService.svc; CORS *; jPredictions-style
// api_key auth). Returns { RouteID, Name, Direction0, Direction1 } where each
// DirectionN is a single object { TripHeadsign, DirectionText, DirectionNum,
// Shape: [{Lat, Lon, SeqNum}], Stops: [{StopID, Name, Lon, Lat, Routes[]}] }
// (arrays are accepted defensively). Each direction normalizes to a PATTERN —
// the ordered path the board draws — { route, dirNum, heads, dirText,
// stops: [{id, name, lat, lon}], shape: [{lat, lon}], byId }.
// Cached per route for the page load; concurrent callers share one in-flight
// fetch. Failures return null (never throw) so the board can fall back to a
// compact "Route details unavailable" row, and they retry on the next call.
const routeDetailsCache = {};      // routeId -> normalized route or null
const routeDetailsInflight = {};   // routeId -> in-flight promise

function normalizeRouteDetails(routeId, raw) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
    const route = String(raw.RouteID || routeId || "").toUpperCase();
    const dirs = [];
    [raw.Direction0, raw.Direction1].forEach((d, i) => {
        (Array.isArray(d) ? d : (d && typeof d === "object" ? [d] : [])).forEach((dd) => {
            if (!dd || typeof dd !== "object") return;
            const stops = [];
            const seenS = new Set();
            (Array.isArray(dd.Stops) ? dd.Stops : []).forEach((s) => {
                if (!s || !s.StopID) return;
                const k = String(s.StopID);
                if (seenS.has(k)) return;          // keep the FIRST occurrence (pattern order)
                seenS.add(k);
                stops.push({ id: k, name: String(s.Name || "") || allStopsName(k),
                             lat: Number(s.Lat), lon: Number(s.Lon) });
            });
            if (!stops.length) return;
            const shape = (Array.isArray(dd.Shape) ? dd.Shape : [])
                .filter(s => s && Number.isFinite(Number(s.Lat)) && Number.isFinite(Number(s.Lon)))
                .sort((a, b) => (Number(a.SeqNum) || 0) - (Number(b.SeqNum) || 0));
            const pts = [], seenP = new Set();
            shape.forEach(pt => {
                const k = pt.Lat + "|" + pt.Lon;
                if (seenP.has(k)) return;
                seenP.add(k);
                pts.push({ lat: Number(pt.Lat), lon: Number(pt.Lon) });
            });
            dirs.push({ route,
                         dirNum: dd.DirectionNum != null ? String(dd.DirectionNum) : String(i),
                         heads: String(dd.TripHeadsign || "").trim(),
                         dirText: String(dd.DirectionText || "").trim(),
                         stops, shape: pts,
                         byId: Object.fromEntries(stops.map(s => [s.id, s])) });
        });
    });
    const seenD = new Set();
    const out = [];
    dirs.forEach(d => {
        if (!d.dirNum || seenD.has(d.dirNum)) return;
        seenD.add(d.dirNum);
        out.push(d);
    });
    if (!out.length) return null;
    return { route, name: String(raw.Name || "").trim(), directions: out };
}

async function fetchRouteDetails(routeId) {
    routeId = String(routeId || "").toUpperCase();
    if (!routeId) return null;
    if (routeDetailsCache[routeId] !== undefined) return routeDetailsCache[routeId];
    if (routeDetailsInflight[routeId]) return routeDetailsInflight[routeId];
    routeDetailsInflight[routeId] = (async () => {
        try {
            const { data, error } = await apiGet("/Bus.svc/json/jRouteDetails", { RouteID: routeId });
            if (error) return null;
            const out = normalizeRouteDetails(routeId, data);
            if (out) routeDetailsCache[routeId] = out;
            return out;
        } finally {
            delete routeDetailsInflight[routeId];
        }
    })();
    return routeDetailsInflight[routeId];
}

// Live bus positions:  GET /Bus.svc/json/jBusPositions   (verified 2026-11:
// 200 from /Bus.svc; a RouteID filter only honors its FIRST value, so one
// unfiltered request is the shared feed — ~350 rows / ~110 KB system-wide).
// Returns { rows: [{ vehicle, lat, lon, trip, route, dirNum, heads, dirText,
// at }], fetchedAt, newestAt } with sample times as epoch ms (the feed is
// timezone-less ET); newestAt is the newest sample. On failure the last good
// feed is returned as-is — the board's 120-minute freshness gate decides
// whether the dots may move, so a dead feed freezes them rather than blanking.
// parseFeedTime: the feed's DateTime is timezone-less ET and comes in two
// shapes — with seconds (the current feed: 2026-11-10T22:26:14) and, in older
// captures, without (2026-11-10T22:26). Try the raw string first; normalize
// the no-seconds form as a fallback so a feed change can't silently drop
// every row. Interpreted as viewer-local time (the 120-min gate below is
// tolerant of the ET offset in practice).
function parseFeedTime(s) {
    if (typeof s !== "string" || !s) return NaN;
    const t = Date.parse(s);
    if (Number.isFinite(t)) return t;
    return Date.parse(s.replace(/:([0-9]{2})$/, ":$1:00"));
}

let posFeed = null;
let posInflight = null;
const POS_GAP_MS = 15000;

async function fetchBusPositions() {
    const now = Date.now();
    if (posFeed && now - posFeed.fetchedAt < POS_GAP_MS) return posFeed;
    if (posInflight) return posInflight;
    posInflight = (async () => {
        try {
            const { data, error } = await apiGet("/Bus.svc/json/jBusPositions", {});
            if (error || !data || !Array.isArray(data.BusPositions)) return posFeed;
            const rows = [];
            let newestAt = 0;
            for (const b of data.BusPositions) {
                const at = parseFeedTime(b.DateTime);
                if (!Number.isFinite(at) || !Number.isFinite(Number(b.Lat))) continue;
                rows.push({ vehicle: b.VehicleID != null ? String(b.VehicleID) : "",
                             lat: Number(b.Lat), lon: Number(b.Lon),
                             trip: b.TripID != null ? String(b.TripID) : "",
                             route: String(b.RouteID || "").toUpperCase(),
                             dirNum: b.DirectionNum != null ? String(b.DirectionNum) : "",
                             heads: String(b.TripHeadsign || ""), dirText: String(b.DirectionText || ""),
                             at });
                if (at > newestAt) newestAt = at;
            }
            posFeed = { rows, fetchedAt: now, newestAt };
            return posFeed;
        } finally {
            posInflight = null;
        }
    })();
    return posInflight;
}

// Prediction → pattern matching (plan §1).
// The prediction's DirectionText ("North to Van Ness") matches NEITHER the
// route-details DirectionText (NORTH/SOUTH) NOR the TripHeadsign (MT
// PLEASANT / LAFAYETTE SQ), so the match keys, in order, are:
//   1. the prediction's own DirectionNum (string "0"/"1");
//   2. the authoritative fallback — a live position row observed on the same
//      trip (or the same vehicle+route when the prediction has no trip)
//      supplies a DirectionNum;
//   3. a UNIQUE normalized headsign match (case and punctuation folded).
// The result is one PATTERN (one direction of a route); the caller then
// requires the pattern to CONTAIN the boarding anchor — a prediction whose
// route details don't serve the selected stop becomes a compact "Route
// details unavailable" row (plan §1), and an unresolved variant keeps its
// own ETA row rather than borrowing another pattern's geometry.
function normHeads(s) {
    return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function posDirFor(pred, posRows) {
    if (!Array.isArray(posRows)) return "";
    for (const r of posRows) {
        if (!r || r.route !== pred.route) continue;
        const tripHit = pred.trip && r.trip && r.trip === pred.trip;
        const vehHit = !pred.trip && pred.vehicle && r.vehicle && r.vehicle === pred.vehicle;
        if (tripHit || vehHit) return r.dirNum;
    }
    return "";
}

function matchPattern(routeDetails, pred, posRows) {
    if (!routeDetails || !Array.isArray(routeDetails.directions) || !pred || !pred.route) return null;
    const dirs = routeDetails.directions;
    if (pred.dirNum) {
        const hit = dirs.find(d => d.dirNum === pred.dirNum);   // dirNum is unique per normalized route
        if (hit) return hit;
    }
    const dirNum = posDirFor(pred, posRows);
    if (dirNum) {
        const hit = dirs.find(d => d.dirNum === dirNum);
        if (hit) return hit;
    }
    const h = normHeads(pred.heads || pred.dir);
    if (h) {
        const hits = dirs.filter(d => normHeads(d.heads) === h);
        if (hits.length === 1) return hits[0];
    }
    return null;
}

// Board model (plan §2): turn the anchor stop's predictions into rows.
// One row per route + direction + destination (headsign) variant boarding
// at the anchor stop. A row becomes a "track" only when its matched pattern
// CONTAINS the anchor stop; otherwise it stays a compact "Route details
// unavailable" row (the pattern matched but doesn't board here, or no route
// details exist). Directions whose pattern contains the anchor but has no
// current prediction get a service row (route + direction + destination, no
// ETAs, no dots). Pure; the renderer decides how each kind is drawn.
function containsStopId(pattern, stopId) {
    if (!pattern || !stopId) return false;
    const sid = String(stopId);
    if (pattern.byId && pattern.byId[sid]) return true;
    return (pattern.stops || []).some(s => s.id === sid);
}

function buildBoardRows(anchorId, predictions, routeDetails, posRows) {
    const anchor = String(anchorId || "");
    const rows = [];
    const variants = new Map();
    for (const p of predictions || []) {
        if (!p) continue;
        const dirNum = p.dirNum == null || p.dirNum === "" ? null : String(p.dirNum);
        const key = p.route + "|" + (dirNum == null ? "?" : dirNum) + "|" + (p.heads || "");
        let v = variants.get(key);
        if (!v) {
            v = { route: p.route, dirNum, heads: p.heads || "", mins: [], vehicles: [],
                  rep: { route: p.route, dirNum, heads: p.heads || "",
                         trip: p.trip || "", vehicle: p.vehicle || "" } };
            variants.set(key, v);
            rows.push(v);
        }
        v.mins.push(p.min);
        if (p.vehicle) v.vehicles.push(p.vehicle);
    }
    const covered = new Set(), ambiguous = new Set();
    for (const p of predictions || []) {
        if (!p) continue;
        const dn = p.dirNum == null || p.dirNum === "" ? "?" : String(p.dirNum);
        covered.add(p.route + "|" + dn);
        if (dn === "?") ambiguous.add(p.route);
    }
    for (const v of rows) {
        v.mins.sort((a, b) => a - b);
        v.first = v.mins.length ? v.mins[0] : 0;
        v.vehicles = [...new Set(v.vehicles)];
        v.pattern = matchPattern((routeDetails || {})[v.route] || null, v.rep, posRows);
        if (v.dirNum == null && v.pattern && v.pattern.dirNum) v.dirNum = v.pattern.dirNum;
        if (v.pattern && containsStopId(v.pattern, anchor)) {
            v.kind = "track";
            v.anchorIdx = v.pattern.stops.findIndex(s => s.id === anchor);
            v.anchorPatStop = v.pattern.stops[v.anchorIdx] || null;
            v.dest = v.heads || v.pattern.heads || "";   // live label wins over the plan
        } else if (v.pattern) {
            v.kind = "compact";
            v.note = "route details unavailable";   // matched a pattern, but it doesn't board here
            v.dest = v.heads || v.pattern.heads || "";
        } else {
            v.kind = "compact";
            v.note = "route details unavailable";
            v.dest = v.heads || v.dir || "";
        }
    }
    for (const route of Object.keys(routeDetails || {}).sort()) {
        const entry = routeDetails[route];
        if (!entry || ambiguous.has(route)) continue;
        for (const d of entry.directions) {
            if (covered.has(route + "|" + d.dirNum)) continue;
            if (!containsStopId(d, anchor)) continue;
            const idx = d.stops.findIndex(s => s.id === anchor);
            rows.push({ kind: "service", route, dirNum: d.dirNum,
                        heads: d.heads, dest: d.heads || d.dirText || "",
                        mins: [], vehicles: [], pattern: d,
                        anchorIdx: idx, anchorPatStop: d.stops[idx] || null });
        }
    }
    const rank = { track: 0, compact: 1, service: 2 };
    rows.sort((a, b) => rank[a.kind] - rank[b.kind]
        || a.first - b.first
        || a.route.localeCompare(b.route)
        || String(a.dirNum).localeCompare(String(b.dirNum)));
    return rows;
}

// ---- across-the-street resolver (plan §2.2) -----------------------------
// Finds at most ONE opposite-side stop the board may present in its own
// "Across the street" section. A nearby candidate is accepted only when ALL
// hold:
//   * within ACROSS_MAX_FT (~100 m) of the boarding anchor;
//   * its name matches the anchor's street/intersection (≥1 shared street
//     token, and each name's extra tokens contained in the other's — this
//     rejects successive stops along the same street, which carry a different
//     cross-street);
//   * at least one route is shared between the anchor's patterns and the
//     candidate's patterns (patterns = route-details directions);
//   * the two stops are not listed in the SAME pattern (same-direction bays
//     and consecutive stops on one side of a corridor);
//   * the ordered paths give opposing travel bearings at the two stops (≥
//     ACROSS_OPPOSE_DEG difference on a shared route).
// Anything short of exactly one accepted candidate is ambiguous: the caller
// keeps the primary board and lets riders pick the other stop via the lookup.
// `patterns` maps stopId → [route-details direction entries that list it].
const ACROSS_MAX_FT = 330;        // ~100 m
const ACROSS_OPPOSE_DEG = 120;    // local bearings must differ by at least this

function streetTokens(name) {
    const out = new Set();
    for (let part of String(name || "").split(/&|\band\b|\+/i)) {
        let t = part.toUpperCase().replace(/[^A-Z0-9 ]/g, " ");
        t = t.replace(/\b(NORTHWEST|NORTHEAST|SOUTHWEST|SOUTHEAST|NORTH|SOUTH|EAST|WEST|NW|NE|SW|SE|N|S|E|W)\b/g, " ");
        t = t.replace(/\b(STREET|ST|AVENUE|AVE|BLVD|DRIVE|DR|PLAZA|PL|ROAD|RD|LANE|LN|COURT|CT|SQUARE|SQ|CIRCLE|CIR)\b/g, " ");
        for (const w of t.split(/\s+/)) if (w) out.add(w);
    }
    return out;
}

function namesMatch(a, b) {
    const A = streetTokens(a), B = streetTokens(b);
    if (!A.size || !B.size) return false;
    let shared = 0;
    for (const t of A) if (B.has(t)) shared++;
    if (!shared) return false;
    const onlyA = [...A].filter(t => !B.has(t));
    const onlyB = [...B].filter(t => !A.has(t));
    return onlyA.every(t => onlyB.includes(t)) || onlyB.every(t => onlyA.includes(t));
}

function bearing(a, b) {
    if (!a || !b || !Number.isFinite(a.lat) || !Number.isFinite(a.lon) ||
        !Number.isFinite(b.lat) || !Number.isFinite(b.lon)) return null;
    if (a.lat === b.lat && a.lon === b.lon) return null;
    const dLon = (b.lon - a.lon) * Math.cos(a.lat * Math.PI / 180);
    return (Math.atan2(dLon, b.lat - a.lat) * 180 / Math.PI + 360) % 360;
}

function angleDiffDeg(x, y) {
    const d = Math.abs(x - y) % 360;
    return d > 180 ? 360 - d : d;
}

// Local direction of travel through one stop occurrence in a pattern
// (pattern stop order is travel order): toward the next occurrence, else
// arriving from the previous. null when the occurrence has no neighbor.
function localBearing(pattern, stopId) {
    const stops = (pattern && pattern.stops) || [];
    const i = stops.findIndex(s => s.id === String(stopId));
    if (i < 0) return null;
    const next = stops[i + 1], prev = stops[i - 1];
    return next ? bearing(stops[i], next) : (prev ? bearing(prev, stops[i]) : null);
}

function acrossTheStreet(anchor, candidates, patterns) {
    if (!anchor || anchor.lat == null || anchor.lon == null) return null;
    const aId = String(anchor.id || "");
    const pA = (patterns || {})[aId] || [];
    if (!pA.length) return null;   // no ordered path boards the anchor
    const accepted = [];
    for (const c of candidates || []) {
        const cId = String((c && c.id) || "");
        if (!c || !cId || cId === aId) continue;
        if (distance(anchor.lat, anchor.lon, c.lat, c.lon, "f") > ACROSS_MAX_FT) continue;
        if (!namesMatch(anchor.name, c.name)) continue;
        const pC = (patterns || {})[cId] || [];
        if (!pC.length) continue;   // no ordered path boards the candidate
        // Same pattern on both sides = same-direction bay / successive stops.
        if (pA.some(pa => pC.some(pc => pc.route === pa.route && pc.dirNum === pa.dirNum))) continue;
        // Opposing travel bearings, on a shared route, at the two stops.
        let opposed = false;
        for (const pa of pA) {
            const x = localBearing(pa, aId);
            if (x == null) continue;
            for (const pc of pC) {
                if (pc.route !== pa.route) continue;
                const y = localBearing(pc, cId);
                if (y != null && angleDiffDeg(x, y) >= ACROSS_OPPOSE_DEG) { opposed = true; break; }
            }
            if (opposed) break;
        }
        if (!opposed) continue;
        accepted.push(c);
    }
    return accepted.length === 1 ? accepted[0] : null;
}

// ════════════════════════════════════════════════════════════════════
// Flow
// ════════════════════════════════════════════════════════════════════

function makeStop(id, name, lat, lon) {
    return { StopID: id, Name: name, Lat: lat, Lon: lon, Distance: null, Routes: [], Arrivals: [], Error: null };
}

// Full (re)load: resolve the stop list, then fetch predictions for it.
async function runFlow() {
    if (busy) return;                    // don't stack flows when buttons are clicked
    busy = true;
    try {
        resetPick();                     // a new flow starts from the session's list (any picked stop is undone)
        if (stopListFromURL && !forceNearby) {
            // ?busstop= given: use it as-is, ignore lat/lon (as documented).
            // Coordinates stay null — the arrivals list never needs them,
            // and the stop directory (the jStops dump) is the coord source.
            gStatus.textContent = `${stopListFromURL.length} stop${stopListFromURL.length > 1 ? "s" : ""} from URL`;
            stops = stopListFromURL.map(id => makeStop(id, null, null, null));
        } else {
            // ?lat&lon (or HOME): find stops near the search point
            const d = distance(DC_CENTER.lat, DC_CENTER.lon, searchPoint.lat, searchPoint.lon, "m");
            const at = d > 50 ? DC_CENTER : searchPoint;     // far from DC → search DC center
            gStatus.textContent = `${d.toFixed(1)} mi to the Whitehouse` + (at === DC_CENTER ? " (searching DC center)" : "") + " …";
            const raw = await fetchStopsNear(at.lat, at.lon, gRadius);
            // Distance is measured from the point we actually searched —
            // NOT from the HOME default, so the geolocation view is honest.
            stops = raw
                .map(s => {
                    const stop = makeStop(s.StopID, s.Name, s.Lat, s.Lon);
                    stop.Distance = distance(at.lat, at.lon, s.Lat, s.Lon, "f");
                    stop.Routes = s.Routes || [];
                    return stop;
                })
                .sort((a, b) => a.Distance - b.Distance);   // sorted; one array, so no index drift
            if (!stops.length) {
                gStatus.textContent = `No stops within ${gRadius} m — try ?radius=600`;
                stops = [];
            }
        }
        await refreshPredictions();
        // ?busstop= deep link with a single stop: prefill the entry field so
        // the visitor sees where they are (✕ returns to the nearby search —
        // forceNearby, since the URL would otherwise just pick the same stop).
        if (stopListFromURL && stopListFromURL.length === 1 && !forceNearby && !pickedStop) {
            const s = stops[0];
            pickedStop = s.StopID;
            gStopEntry.value = s.Name || `#${s.StopID}`;
            acStop.setPicked(true);
        }
    } catch (e) {
        // Stops lookup failed (bad key / network): keep whatever is shown —
        // but re-render, since the pick was reset above (the table must match
        // the entry field).
        gStatus.textContent = `Could not reach WMATA: ${e.message}`;
        render();
    } finally {
        busy = false;
        scheduleRefresh();
    }
}

// Re-fetch predictions for the stops currently shown. Promise.all so the render
// happens exactly once, after every request has settled — including the
// ones that failed (the old code only rendered when the last request
// SUCCEEDED, so one 400/429 left a blank page). With a stop picked in the
// entry field, only that stop is fetched.
async function refreshPredictions() {
    const toFetch = new Map();              // StopID → stop object
    for (const s of shownStops()) toFetch.set(s.StopID, s);
    if (!toFetch.size) return;
    let saw429 = false;
    await Promise.all([...toFetch.values()].map(async (stop) => {
        try {
            const { name, predictions } = await fetchPredictions(stop.StopID);
            if (name && !stop.Name) stop.Name = name;      // ?busstop= mode learns names here
            stop.Arrivals = predictions;
            stop.Error = null;
        } catch (e) {
            stop.Arrivals = [];
            stop.Error = e;                                 // rendered as a muted row
            if (e.rateLimited) saw429 = true;
        }
    }));
    rateLimited = saw429;          // → next refresh is delayed (self-throttling)
    lastRefreshAt = Date.now();
    render();
    // The picture and the ticker ride on the same predictions: keep them
    // moving on every tick (single view — no tab to check for).
    renderLines();
    renderTicker();
    scheduleRefresh();             // re-arm: the 30-second cycle continues after every tick
    const t = new Date().toLocaleTimeString("en-us", { hour: "numeric", minute: "2-digit", second: "2-digit" });
    const shownCount = shownStops().length;
    gStatus.textContent = `${shownCount} stop${shownCount > 1 ? "s" : ""} · updated ${t}` +
        (rateLimited ? " · API rate limit hit, slowing refresh" : "");
}

// Periodic refresh: predictions only (the stop list itself rarely changes).
// After a 429 the interval stretches 5× to be polite to the shared key.
function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    const wait = rateLimited ? 5 * REFRESH_MS : REFRESH_MS;
    refreshTimer = setTimeout(() => refreshPredictions(), wait);
}

// Background tabs get throttled timers; refresh promptly when we come back.
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !busy && stops.length) {
        if (Date.now() - lastRefreshAt > REFRESH_MS / 2) {
            refreshPredictions();
        } else {
            scheduleRefresh();
        }
    }
});

// ════════════════════════════════════════════════════════════════════
// Rendering
// ════════════════════════════════════════════════════════════════════

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
}

function fmtDistance(ft) {
    if (ft == null) return "—";
    return ft < 5280 ? `${ft} ft` : `${(ft / 5280).toFixed(1)} mi`;
}

// The stops the arrivals table tracks. No pick: the nearby / ?busstop= list.
// With a pick: just that stop — resolved from the list when it's there, or
// materialized from the stop directory when the user picked a stop that is
// not in the list (it is then live-tracked like any other).
function shownStops() {
    if (!pickedStop) return stops;
    if (pickedStopObj) return [pickedStopObj];
    const inList = stops.find(s => s.StopID === pickedStop);
    return inList ? [inList] : stops;
}

function render() {
    const shown = shownStops();
    let rows = "";
    for (const s of shown) {
        rows += "<tr class='table-primary vert'>"
            + "<td class='text-center'><i class='fa-solid fa-person-walking'></i></td>"
            + `<td>${fmtDistance(s.Distance)}</td>`
            + `<td colspan="2">${esc(s.Name || s.StopID)} <small class="text-muted">(#${esc(s.StopID)})</small></td>`
            + "</tr>";

        if (s.Error) {
            const msg = s.Error.rateLimited ? "too many requests — will retry" : "predictions unavailable";
            rows += "<tr><td class='text-center'><i class='fa-solid fa-triangle-exclamation text-warning'></i></td>"
                + `<td colspan="3" class="text-muted">${esc(msg)}</td></tr>`;
        } else if (!s.Arrivals.length) {
            rows += "<tr><td class='text-center'><i class='fa-solid fa-clock'></i></td>"
                + "<td colspan='3' class='text-muted'>no arrivals scheduled</td></tr>";
        } else {
            for (const a of s.Arrivals) {
                rows += "<tr><td class='text-center'><i class='fa-solid fa-clock'></i></td>"
                    + `<td>${esc(a.min)}</td>`
                    + `<td><b>${esc(a.route)}</b></td>`
                    + `<td>${esc(a.dir)}</td></tr>`;
            }
        }
    }
    gTableHost.innerHTML = shown.length
        ? `<div class="container">
             <table class="table table-sm table-hover">
                 <thead><tr><th style="width:8%"></th><th style="width:18%"></th><th style="width:20%"></th><th>destination</th></tr></thead>
                 <tbody>${rows}</tbody>
             </table>
           </div>`
        : "";
}

// ════════════════════════════════════════════════════════════════════
// Navigation icons
// ════════════════════════════════════════════════════════════════════

document.getElementById("btnBus").addEventListener("click", () => location.reload());

document.getElementById("btnHome").addEventListener("click", () => {
    searchPoint = urlPoint;              // home = URL lat/lon, or the 20010 corner
    runFlow();
});

document.getElementById("btnLocate").addEventListener("click", () => {
    if (!navigator.geolocation) {
        gStatus.textContent = "Geolocation not supported by this browser";
        return;
    }
    gStatus.textContent = "Locating …";
    navigator.geolocation.getCurrentPosition(
        pos => {
            searchPoint = { lat: pos.coords.latitude, lon: pos.coords.longitude };
            runFlow();
        },
        () => { gStatus.textContent = "Turn on location sharing."; },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
    );
});

// ════════════════════════════════════════════════════════════════════
// Stop-name autocomplete (the single shared entry field above the view)
// ════════════════════════════════════════════════════════════════════
// The entry field is a combobox over the stop directory (the one jStops
// full dump, deduped by loadStopDirectory()). The factory owns the entry UI
// (suggestion list, ✕, keyboard); what the page does with a picked stop is
// up to its callbacks:
//   onPick(dirStop)  — a stop was chosen (Enter on the highlighted match,
//                      or a row click)
//   onClear()        — the ✕ was pressed
//   onPickLost()     — the user started typing while a pick was active
function makeAutocomplete(input, listEl, clearBtn, onPick, onClear, onPickLost) {
    let matches = [];
    let active = -1;
    let picked = false;

    function closeList() {
        listEl.hidden = true;
        listEl.innerHTML = "";
        input.setAttribute("aria-expanded", "false");
        active = -1;
    }

    function setPicked(v) {
        picked = v;
        clearBtn.hidden = !v;
        if (!v) closeList();
    }

    function openList(html) {
        listEl.innerHTML = html;
        listEl.hidden = false;
        input.setAttribute("aria-expanded", "true");
    }

    // Case-insensitive name search plus StopID prefix; at most 8 rows.
    // null = the directory isn't loaded yet.
    function matchesFor(q) {
        if (!allStopsCache) return null;
        const s = q.trim().toLowerCase();
        if (!s) return [];
        const out = [];
        for (const st of allStopsCache) {
            if (st.Name && st.Name.toLowerCase().includes(s)) out.push(st);
            else if (String(st.StopID).toLowerCase().startsWith(s)) out.push(st);
            if (out.length >= 8) break;
        }
        out.sort((a, b) => a.Name.localeCompare(b.Name) ||
            a.StopID.localeCompare(b.StopID, undefined, { numeric: true }));
        return out;
    }

    function renderMatches(items) {
        matches = items;
        active = items.length ? 0 : -1;
        openList(items.length
            ? items.map((s, i) =>
                `<div class="ac-item${i === active ? " active" : ""}" data-i="${i}" role="option" aria-selected="${i === active}">` +
                `${esc(s.Name || "#" + s.StopID)}<span class="code">#${esc(s.StopID)}</span></div>`).join("")
            : `<div class="ac-none">no matching stops</div>`);
    }

    function pick(st) {
        input.value = st.Name || `#${st.StopID}`;
        setPicked(true);
        if (onPick) onPick(st);
    }

    input.addEventListener("input", () => {
        if (picked) { setPicked(false); if (onPickLost) onPickLost(); }
        const q = input.value.trim();
        if (!q) { closeList(); return; }
        const items = matchesFor(q);
        if (items === null) {                       // directory not loaded yet
            matches = [];
            openList(`<div class="ac-none">loading stops…</div>`);
            loadStopDirectory().then(() => {
                if (input.value.trim() === q) renderMatches(matchesFor(q) || []);
            }).catch(() => {
                if (input.value.trim() === q) openList(`<div class="ac-none">could not load the stop list</div>`);
            });
        } else {
            renderMatches(items);
        }
    });

    input.addEventListener("keydown", e => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            if (listEl.hidden || !matches.length) return;
            e.preventDefault();
            if (active === -1) active = e.key === "ArrowDown" ? 0 : matches.length - 1;
            else active = (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
            [...listEl.children].forEach((el, i) => el.classList.toggle("active", i === active));
            if (listEl.children[active]) listEl.children[active].scrollIntoView({ block: "nearest" });
        } else if (e.key === "Enter" && !listEl.hidden && active >= 0 && matches[active]) {
            e.preventDefault();
            pick(matches[active]);
        } else if (e.key === "Escape" && !listEl.hidden) {
            closeList();
        }
    });

    // mousedown, not click: preventDefault keeps the input focused, so the
    // blur handler can't close the list before the row gets picked.
    listEl.addEventListener("mousedown", e => {
        const item = e.target.closest(".ac-item");
        if (!item) return;
        e.preventDefault();
        pick(matches[+item.dataset.i]);
    });

    input.addEventListener("blur", closeList);
    clearBtn.addEventListener("click", () => {
        setPicked(false);
        input.value = "";
        if (onClear) onClear();
    });

    return {
        setPicked,
        reset() { setPicked(false); input.value = ""; },
    };
}

// A directory stop (from the full dump) becomes a tracked stop. It may be
// outside the nearby list — it is then materialized with a null distance.
function materializeDirStop(st) {
    const s = makeStop(st.StopID, st.Name, st.Lat, st.Lon);
    s.Routes = st.Routes || [];
    return s;
}

// Undo the entry-field pick: state + field only. The caller decides what
// happens next — ✕ re-runs runFlow() (the nearby search); typing just
// re-renders the list that is already on screen.
function resetPick() {
    if (pickedStop === null && pickedStopObj === null) return;
    pickedStop = null;
    pickedStopObj = null;
    acStop.reset();
}

const acStop = makeAutocomplete(
    gStopEntry, gStopEntryList, gStopEntryClear,
    st => {                       // pick: track just this stop
        pickedStop = st.StopID;
        const inList = stops.find(s => s.StopID === st.StopID);
        pickedStopObj = inList || materializeDirStop(st);
        refreshPredictions();     // its predictions, then the 30 s cycle tracks it
    },
    () => {                       // ✕: back to the nearby search
        resetPick();
        forceNearby = true;       // matters when a ?busstop= deep link prefilled the field
        runFlow();
        renderLines();            // the picture falls back to the closest nearby stop
    },
    () => { resetPick(); render(); renderLines(); },
);

// ════════════════════════════════════════════════════════════════════
// Route picture (v4 — the single view)
// One row per route that serves the anchor stop, colored from the shared
// route palette. WMATA publishes no line geometry, so each route's stops
// are ordered as a chain (150-ft collapse + two-sided nearest-neighbor
// walk) and drawn on an x-axis of travel time from the anchor stop: a
// 45-minute window, 40 min behind (five 8-min bands — the approach) and
// 5 min ahead (one band — a bus stop sign cares about what is coming)
// with the anchor stop at the same fixed center in every row, so the rows
// line up vertically. A hand-drawn stop sign stands on the anchor. Each
// row is oriented with its destination arm on the right, and every 🚌 is
// drawn just above the stop dot, N minutes of chain distance back on the
// left, with its minutes beneath — so each bus runs left → right toward
// the anchor, the way a real bus approaches a sign. The destination
// terminal name(s) are written in the right gutter (one line per
// direction that serves the stop).
// Hovering any stop dot pulls its live arrivals once (cached for the page
// load).
//
// The whole picture is one <svg> (a scale strip, then one row per route)
// inside .lines-scroll: everything shares a single coordinate system and
// one horizontal scrollbar, so the anchor stop sits at the same x in every
// route and the bands/ticks/dots line up vertically. Route identity is a
// colored route code in the left gutter (the old badge pill is gone); the
// destination lives in the right gutter.
// ════════════════════════════════════════════════════════════════════

// A small distinguishable palette; routes hash into it (stable across loads).
const ROUTE_COLORS = ["#c62828", "#1565c0", "#2e7d32", "#ef6c00", "#6a1b9a", "#00838f",
    "#ad1457", "#5d4037", "#455a64", "#827717", "#37474f", "#9e9d24"];

function routeColor(routeId) {
    let h = 0;
    for (const c of String(routeId)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return ROUTE_COLORS[h % ROUTE_COLORS.length];
}

// ── Lines-v4 geometry ─────────────────────────────────────────────────
// x = travel time from the anchor stop across a 45-minute window: 40 min
// behind (the approach, five 8-min bands) and 5 min ahead (one band) — a
// bus stop sign cares mostly about what is coming, not what has gone.
// Stops past the window edge are clipped. Travel time = haversine chain
// distance ÷ 8 mph, the speed calibrated against live predictions (median
// ≈7.5 mph across 83 samples, range 3.8–16.8).
const BANDS_BEHIND = [0, 8, 16, 24, 32, 40];   // behind: five 8-min bands
const BANDS_AHEAD  = [0, 5];                   // ahead:  one 5-min band
const BAND_PX = 110;                           // each band this wide
const FT_PER_MIN = 8 * 5280 / 60;              // 8 mph

// Minutes from the anchor stop → px from the row's center. Piecewise
// linear: proportional within each of the side's bands. `side` −1 = behind
// (left), +1 = ahead (right); the side picks its band table.
function bandX(min, side) {
    const bands = side >= 0 ? BANDS_AHEAD : BANDS_BEHIND;
    const m = Math.max(0, Math.min(bands[bands.length - 1], min));
    for (let k = 0; k < bands.length - 1; k++) {
        if (m <= bands[k + 1])
            return (k + (m - bands[k]) / (bands[k + 1] - bands[k])) * BAND_PX;
    }
    return (bands.length - 1) * BAND_PX;
}

// Feet between two stops (the page's haversine, "f" = feet).
function distFt(a, b) {
    return distance(a.Lat, a.Lon, b.Lat, b.Lon, "f");
}

// Merge stops within 150 ft: WMATA publishes every busbay as its own stop,
// and a shared bay is not a leg of the line.
function collapse(pts, R = 150) {
    const out = [];
    for (const s of pts) {
        let twin = null, bd = R;
        for (const q of out) { const d = distFt(q, s); if (d < bd) { bd = d; twin = q; } }
        if (twin) { for (const r of s.Routes || []) if (!twin.Routes.includes(r)) twin.Routes.push(r); }
        else out.push(Object.assign({}, s));
    }
    return out;
}

// Order a route's collapsed stops as a chain from the anchor: repeatedly
// take the nearest unvisited stop. Each arm grows away from the anchor, so
// the route reads armB ← anchor → armA; a step's `d` is its leg length in
// feet. T = 5000 ft joins every leg WMATA publishes (the probe routes
// chain with 100% coverage); stops past it (rare off-route strays) are
// left out of the picture rather than drawing a fake jump.
function twoSidedWalk(anchor, pool, T = 5000) {
    const unv = pool.filter(p => p !== anchor);
    const take = (cur) => {
        let bi = -1, bd = Infinity;
        for (let i = 0; i < unv.length; i++) {
            const d = distFt(cur, unv[i]);
            if (d < bd) { bd = d; bi = i; }
        }
        if (bi < 0 || bd > T) return null;
        return { stop: unv.splice(bi, 1)[0], d: bd };
    };
    const armA = [], armB = [];
    let step = take(anchor);
    while (step) { armA.push(step); step = take(step.stop); }
    step = take(anchor);
    while (step) { armB.push(step); step = take(step.stop); }
    return { armA, armB, unv };
}

// Destination matching: the live feed's DirectionText is a terminal name
// ("Shady Grove", "Glenmont"); the collapsed stop whose name contains the
// most of its tokens is the bus's destination. (The picture orients each
// row with the matched arm on the right, so a bus — always drawn
// approaching from the left — runs toward its destination.)
const STOPW = new Set(["the", "and", "for", "from", "into", "onto", "with", "north", "south", "east", "west", "to"]);
function toksOf(text) {
    return String(text || "").toLowerCase().split(/[^a-z0-9]+/).filter(t => t.length >= 3 && !STOPW.has(t));
}
function destMatch(collapsed, destText) {
    const toks = toksOf(destText);
    if (!toks.length) return null;
    let best = null, bs = 0;
    for (const s of collapsed) {
        const n = (s.Name || "").toLowerCase();
        let sc = 0;
        for (const t of toks) if (n.includes(t)) sc++;
        if (sc > bs) { bs = sc; best = s; }
    }
    if (!bs) return null;
    // require the match to be "strong": at least half the tokens, or all but one
    const need = Math.min(2, Math.ceil(toks.length / 2));
    return bs >= need ? { stop: best, score: bs, toks } : null;
}

// ── The one picture: a single <svg> ───────────────────────────────────
// A scale strip, then one row per route, all inside one <svg> in
// .lines-scroll. One coordinate system and one horizontal scrollbar for
// the whole picture, so the anchor stop — the track's center — sits at the
// same x in every route.
const GUT = 60;                       // left gutter (route code)
const RH = 60;                        // route row height (room for the stop sign)
const SCALE_H = 36;                   // scale strip height
const CX = GUT + 5 * BAND_PX;         // anchor stop x (the track's center)
const DEST_X = CX + BAND_PX + 12;     // right gutter: the row's destination text
const DEST_W = 150;                   // right gutter width

// The track's shared furniture: five equal-width bands behind the anchor
// (nearer = darker), one ahead, and a tick at each band boundary. `cy` is
// the row's center line (relative to the row's top); every row draws the
// same, so the bands — and the track's center — line up vertically across
// rows.
function lineTrackBg(cy) {
    let bg = "";
    const alphas = [0.10, 0.075, 0.055, 0.04, 0.025];
    for (let k = 0; k < BANDS_BEHIND.length - 1; k++) {
        bg += `<rect x="${CX - (k + 1) * BAND_PX}" y="${cy - 12}" width="${BAND_PX}" height="24" fill="#6c757d" opacity="${alphas[k]}"></rect>`;
    }
    bg += `<rect x="${CX}" y="${cy - 12}" width="${BAND_PX}" height="24" fill="#6c757d" opacity="0.12"></rect>`;
    for (let k = 1; k <= BANDS_BEHIND.length - 1; k++) {
        bg += `<line x1="${CX - k * BAND_PX}" y1="${cy - 10}" x2="${CX - k * BAND_PX}" y2="${cy + 10}" stroke="#8a959e" opacity=".5"></line>`;
    }
    bg += `<line x1="${CX + BAND_PX}" y1="${cy - 10}" x2="${CX + BAND_PX}" y2="${cy + 10}" stroke="#8a959e" opacity=".5"></line>`;
    return bg;
}

// Scale strip above the routes: the same band/tick geometry, with the band
// boundaries labeled in minutes from the anchor stop (behind 8…40, ahead 5).
function lineScale() {
    const cy = 14;
    let labels = `<text class="lines-minlabel" x="${CX}" y="${SCALE_H - 3}" text-anchor="middle">0</text>`;
    for (let k = 1; k <= BANDS_BEHIND.length - 1; k++) {
        labels += `<text class="lines-minlabel" x="${CX - k * BAND_PX}" y="${SCALE_H - 3}" text-anchor="middle">${BANDS_BEHIND[k]}</text>`;
        if (k < BANDS_AHEAD.length)
            labels += `<text class="lines-minlabel" x="${CX + k * BAND_PX}" y="${SCALE_H - 3}" text-anchor="middle">${BANDS_AHEAD[k]}</text>`;
    }
    return `<text class="lines-minlabel" x="6" y="${cy}" dy=".35em">min</text>${lineTrackBg(cy)}${labels}`
        + `<text class="lines-minlabel" x="${DEST_X}" y="${cy}" dy=".35em">destination</text>`;
}

// One row per route: the route code (colored) in the left gutter, the
// track — the route's stops as dots on an x-axis of travel time from the
// anchor stop — a stop sign on the anchor, a 🚌 just above the track (its
// minutes beneath) for each live prediction, and the destination terminal
// name(s) in the right gutter. The row is oriented with the destination
// arm on the right, so every bus approaches left → right. Dots past the
// window edge (40 min behind / 5 ahead) are clipped.
function lineRow(route, st, arrivals) {
    const color = routeColor(route);
    const onRoute = (allStopsCache || []).filter(s => s.Lat != null && (s.Routes || []).includes(route));
    if (!onRoute.length) return "";                 // no coordinates — nothing to draw
    const collapsed = collapse(onRoute);
    // Anchor at the picture's stop (or the collapsed twin that swallowed it).
    let anchor = collapsed.find(c => String(c.StopID) === String(st.StopID));
    if (!anchor) {
        let bd = Infinity;
        for (const c of collapsed) {
            const d = distFt(c, st);
            if (d < bd) { bd = d; anchor = c; }
        }
    }
    if (!anchor) return "";
    const { armA, armB } = twoSidedWalk(anchor, collapsed);

    const cy = RH / 2;
    let row = `<text class="lines-routelabel" x="6" y="${cy}" dy=".35em" fill="${color}">${esc(route)}</text>`;
    row += lineTrackBg(cy);

    let dots = "";
    const dot = (s, cumMin, side, extra, title) => {
        const lim = side >= 0 ? BANDS_AHEAD[BANDS_AHEAD.length - 1]
                              : BANDS_BEHIND[BANDS_BEHIND.length - 1];
        if (cumMin > lim) return;
        const x = CX + side * bandX(cumMin, side);
        const t = title ? `<title>${esc(title)}</title>` : "";
        const cls = extra ? "line-dot " + extra : "line-dot";
        const c = `<circle cx="${x.toFixed(1)}" cy="${cy}" r="${extra === "here" ? 6 : 5}" fill="${color}" stroke="#fff" stroke-width="2"/>${t}`;
        // The anchor stop also gets a soft halo so it reads at a glance.
        const halo = extra === "here" ? `<circle cx="${x.toFixed(1)}" cy="${cy}" r="10" fill="${color}" opacity=".2"/>` : "";
        dots += `<g class="${cls}" data-stop="${esc(String(s.StopID))}">${halo}${c}</g>`;
    };
    let cum = 0;
    for (const s of armB) { cum += s.d / FT_PER_MIN; dot(s.stop, cum, -1); }
    dot(anchor, 0, 0, "here", `${st.Name || "#" + st.StopID} (anchor stop)`);
    cum = 0;
    for (const s of armA) { cum += s.d / FT_PER_MIN; dot(s.stop, cum, +1); }

    // A 🚌 per live prediction, deduped by vehicle (smallest Minutes). The
    // feed says "N min from this stop" and the bus is approaching, so it is
    // N min back — on the arm opposite its destination (DirectionText → best
    // name match; if that fails, the arm whose span still fits N min; else
    // the left arm). Buses outside the window are clipped like everything else.
    const spanA = armA.reduce((c, s) => c + s.d, 0) / FT_PER_MIN;
    const spanB = armB.reduce((c, s) => c + s.d, 0) / FT_PER_MIN;
    const seen = new Map();                        // VehicleID → { min, dir }
    for (const a of arrivals || []) {
        if (a.route !== route || a.vehicle == null || a.min == null) continue;
        const prev = seen.get(a.vehicle);
        if (!prev || a.min < prev.min) seen.set(a.vehicle, { min: a.min, dir: a.dir });
    }
    let buses = "";
    for (const b of seen.values()) {
        let side = -1;
        const dest = destMatch(collapsed, b.dir);
        if (dest) {
            const inA = armA.some(s => s.stop === dest.stop);
            const inB = armB.some(s => s.stop === dest.stop);
            side = inA ? -1 : (inB ? +1 : -1);    // approaching from the opposite arm
        } else if (b.min > spanB && b.min <= spanA) side = +1;   // left arm too short → right
        else if (b.min > spanA && b.min <= spanB) side = -1;     // right arm too short → left
        const lim = side >= 0 ? BANDS_AHEAD[BANDS_AHEAD.length - 1]
                              : BANDS_BEHIND[BANDS_BEHIND.length - 1];
        if (b.min > lim) continue;                 // outside the −40/+5 window
        const x = CX + side * bandX(b.min, side);
        buses += `<g class="line-bus" transform="translate(${x.toFixed(1)},${cy})">`
            + `<text text-anchor="middle" dy=".35em">🚌</text>`
            + `<text class="line-busmin" text-anchor="middle" y="17">${b.min} min</text>`
            + `<title>${esc(route)} — about ${b.min} min from this stop</title></g>`;
    }

    // The bus-stop sign on the anchor stop: a pole and a plate in the route's
    // color (the FA subset has no bus-stop glyph, so it is hand-drawn). It
    // stands over the dot; the minutes sit under each bus, clear of the pole.
    const sign = `<g class="line-sign">`
        + `<line x1="${CX}" y1="${cy - 1}" x2="${CX}" y2="${cy - 14}" stroke="#495057" stroke-width="2.5"/>`
        + `<rect x="${CX - 17}" y="${cy - 28}" width="34" height="14" rx="3" fill="${color}" stroke="#fff" stroke-width="1.5"/>`
        + `<text x="${CX}" y="${cy - 21}" dy=".35em" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">${esc(route)}</text>`
        + `</g>`;

    row += dots + sign + buses;
    return row;
}

// Assembles the whole picture into one <svg>: the scale strip, then one row
// per route. A route without coordinates returns "" and takes no space.
function linesSvg(st, routes, arrivals) {
    const rows = routes.map(r => lineRow(r, st, arrivals)).filter(r => r);
    const w = GUT + (BANDS_BEHIND.length - 1 + BANDS_AHEAD.length - 1) * BAND_PX + 8;
    const h = SCALE_H + rows.length * RH;
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`
        + `<g>${lineScale()}</g>`
        + rows.map((r, i) => `<g transform="translate(0,${SCALE_H + i * RH})">${r}</g>`).join("")
        + `</svg>`;
}

// The hover card: a stop's live arrivals, fetched once per page load and
// then cached (a hover is a peek — the arrivals table already refreshes the
// stops it tracks; the dots it peeks at are usually not among them).
const hoverPredictions = new Map();   // StopID → { name, predictions }
let hoverTok = 0;                     // invalidates in-flight card writes

function hideHoverTip() {
    hoverTok++;
    gHoverTip.hidden = true;
    gHoverTip.innerHTML = "";
}

// Floats above the hovered dot (below, when there is no room), clamped to
// the viewport. Measured while visibility:hidden so it never flickers at
// the corner before it lands.
function positionHoverTip(dot) {
    const r = dot.getBoundingClientRect();
    const w = gHoverTip.offsetWidth;
    const h = gHoverTip.offsetHeight;
    let x = r.left + r.width / 2 - w / 2;
    let y = r.top - h - 10;
    if (y < 8) y = r.bottom + 10;
    gHoverTip.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + "px";
    gHoverTip.style.top = y + "px";
}

function hoverTipHtml(st, pred) {
    const head = `${esc(st.Name || "#" + st.StopID)} <small style="opacity:.75">(#${esc(st.StopID)})</small>`;
    if (!pred.predictions.length) return head + "<br><small>no arrivals scheduled</small>";
    const rows = pred.predictions.map(p =>
        `<div><b>${esc(p.route)}</b> · ${esc(p.min)} min <small style="opacity:.75">${esc(p.dir || "")}</small></div>`).join("");
    return head + "<br>" + rows;
}

async function hoverTipFor(dot) {
    const tok = ++hoverTok;
    const st = (allStopsCache || []).find(s => String(s.StopID) === String(dot.getAttribute("data-stop")));
    if (!st) return;
    const show = html => {
        gHoverTip.style.visibility = "hidden";
        gHoverTip.hidden = false;
        gHoverTip.innerHTML = html;
        positionHoverTip(dot);
        gHoverTip.style.visibility = "";
    };
    let pred = hoverPredictions.get(st.StopID);
    if (pred) { show(hoverTipHtml(st, pred)); return; }     // cached: instant
    show(`${esc(st.Name || "#" + st.StopID)} <small style="opacity:.75">(#${esc(st.StopID)})</small><br>loading…`);
    try {
        pred = await fetchPredictions(st.StopID);
        hoverPredictions.set(st.StopID, pred);
    } catch (e) {
        pred = null;
    }
    if (tok !== hoverTok || !dot.isConnected) return;       // card moved on, or the row was redrawn
    show(pred ? hoverTipHtml(st, pred)
              : `${esc(st.Name || "#" + st.StopID)}<br><small>couldn't load arrivals</small>`);
}

// Dots are redrawn on every renderLines(), so the card is driven by
// delegated mouseover/mouseout on the .lines-scroll wrapper (it survives
// re-renders; the dots are <g class="line-dot"> in the svg).
gLinesScroll.addEventListener("mouseover", e => {
    const dot = e.target.closest(".line-dot");
    if (dot) hoverTipFor(dot);
});
gLinesScroll.addEventListener("mouseout", e => {
    const from = e.target.closest(".line-dot");
    if (!from) return;
    const to = e.relatedTarget;
    if (to && to.nodeType === 1 && to.closest(".line-dot")) return;   // dot→dot: the new dot takes over
    hideHoverTip();
});
// A row scrolling out from under the cursor also retires the card.
gLinesScroll.addEventListener("scroll", hideHoverTip, true);

// The stop the picture and the ticker anchor on: the picked stop, or (no
// pick — nearby mode) the closest nearby stop, shownStops()[0] (the list is
// distance-sorted, and the view never prompts). With the directory loaded,
// its entry is preferred (canonical name and coordinates).
function anchorStop() {
    if (pickedStop)
        return allStopsCache && allStopsCache.find(s => String(s.StopID) === String(pickedStop));
    const near = shownStops()[0];
    if (!near) return null;
    return (allStopsCache && allStopsCache.find(s => String(s.StopID) === String(near.StopID))) || near;
}

function renderLines() {
    hideHoverTip();
    if (!allStopsCache) {
        // The directory is still loading (or a previous attempt failed):
        // ask for it, then come back for the real picture.
        const want = pickedStop || ((shownStops()[0] || {}).StopID) || null;
        gLinesNote.textContent = "loading the stop list…";
        gLinesScroll.innerHTML = "";
        loadStopDirectory()
            .then(() => {
                const now = pickedStop || ((shownStops()[0] || {}).StopID) || null;
                if (now === want) renderLines();
            })
            .catch(() => {
                const now = pickedStop || ((shownStops()[0] || {}).StopID) || null;
                if (now === want) {
                    gLinesNote.textContent = "could not load the stop list — the picture needs it.";
                    gLinesScroll.innerHTML = "";
                }
            });
        return;
    }
    const st = anchorStop();
    if (!st) {
        gLinesNote.textContent = pickedStop
            ? `no stop #${pickedStop} in the DC system`
            : "no nearby stops to picture — use the locate button or search a stop name above";
        gLinesScroll.innerHTML = "";
        return;
    }
    const routes = (st.Routes || []).slice().sort((a, b) => a.localeCompare(b));
    if (!routes.length) {
        gLinesNote.textContent = `${st.Name || "#" + st.StopID} — no routes in the stop list (it may be out of date)`;
        gLinesScroll.innerHTML = "";
        return;
    }
    // The bus icons ride on the anchor stop's live predictions. A ?busstop=
    // deep link never materializes pickedStopObj, so fall back to the stop
    // the arrivals table tracks (the same stop in that mode).
    const arrivals = (pickedStopObj ? pickedStopObj.Arrivals : (shownStops()[0] || {}).Arrivals) || [];
    gLinesNote.innerHTML = `${esc(st.Name || "#" + st.StopID)} <span class="text-muted">(#${esc(st.StopID)})</span> · ${routes.length} line${routes.length > 1 ? "s" : ""}`
        + ` <span class="text-muted">· window: 40 min behind / 5 min ahead (8-min bands, edges clipped) · sign = this stop · 🚌 = estimated bus position, minutes below · hover a dot for its arrivals</span>`;
    gLinesScroll.innerHTML = linesSvg(st, routes, arrivals);
}

// The ticker: the anchor stop's next arrivals scrolling left like the
// departures board at a real bus stop. It rides on the same predictions as
// the picture's buses, so it moves on every 30 s refresh. Two identical
// phrases side by side, the inner strip translating −50% forever = seamless
// (see the .ticker CSS).
function renderTicker() {
    const st = pickedStopObj || shownStops()[0];
    const label = `<span class="ticker-label">NEXT ARRIVALS</span>`;
    if (!st) {
        gTickerHost.innerHTML = label
            + `<span class="ticker-static">no stops found — turn on location sharing, or search a stop name above</span>`;
        return;
    }
    const name = esc(st.Name || "#" + st.StopID);
    const preds = (st.Arrivals || []).slice().sort((a, b) => (a.min ?? 999) - (b.min ?? 999));
    if (!preds.length) {
        gTickerHost.innerHTML = label
            + `<span class="ticker-static">${name} — no arrivals predicted right now</span>`;
        return;
    }
    // Cap the marquee at a handful of arrivals so the loop stays readable.
    const phrase = `${name} · next: ` + preds.slice(0, 8).map(p =>
        `${esc(p.route)} <span class="ticker-min">${Math.max(0, Math.round(p.min))} min</span> ${esc(p.dir || "")}`
    ).join("   ✦   ");
    gTickerHost.innerHTML = label
        + `<div class="ticker-window"><div class="ticker-inner">`
        + `<span class="ticker-phrase">${phrase}</span><span class="ticker-phrase">${phrase}</span>`
        + `</div></div>`;
}

// ════════════════════════════════════════════════════════════════════
// Distance between two GPS points (spherical law of cosines — plenty
// accurate at these scales). Units: "m" miles, "f" feet, "K" km, "N" nautical
// ════════════════════════════════════════════════════════════════════
function distance(lat1, lon1, lat2, lon2, unit) {
    if (lat1 === lat2 && lon1 === lon2) return 0;
    const radlat1 = Math.PI * lat1 / 180;
    const radlat2 = Math.PI * lat2 / 180;
    const radtheta = Math.PI * (lon1 - lon2) / 180;
    let d = Math.sin(radlat1) * Math.sin(radlat2) +
        Math.cos(radlat1) * Math.cos(radlat2) * Math.cos(radtheta);
    d = Math.acos(Math.max(-1, Math.min(1, d))) * 180 / Math.PI * 60 * 1.1515;   // US statute miles
    if (unit === "K") return Math.trunc(d * 1.609344 * 10) / 10;
    if (unit === "N") return Math.trunc(d * 0.8684 * 10) / 10;
    if (unit === "f") return Math.trunc(d * 5280);
    return Math.trunc(d * 10) / 10;        // "m" = miles
}

// ════════════════════════════════════════════════════════════════════
// Clock
// ════════════════════════════════════════════════════════════════════
function tickClock() {
    const s = new Date().toLocaleTimeString("en-us", { hour: "numeric", minute: "2-digit", second: "2-digit" });
    gClock.textContent = s.replace(/\s?[AP]M$/, "");       // no AM/PM
}

// ════════════════════════════════════════════════════════════════════
// Go
// ════════════════════════════════════════════════════════════════════
tickClock();
setInterval(tickClock, 1000);
runFlow();
</script>
