<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="favicon.ico">
    <title>like a bus plus</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./css/all.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .fa-xl-mta {
            font-size: 3em;
            line-height: 0.02167em;
            margin-bottom: 5px;
            margin-top: 5px;
            width: 70px;
            text-align: center;
            vertical-align: -0.125em;
        }

        .fa-mta {
            font-size: 3em;
            line-height: 0.02167em;
            text-align: center;
            vertical-align: -0.125em;
        }

        .vert {
            vertical-align: middle;
        }

        /* icon buttons: look like the old <li> icons, but keyboard accessible */
        .navicon {
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
        }

        /* Piece 12: one clear, uniform keyboard focus ring. The SVG stop
           markers get a stroke-based ring instead (outline does not paint
           on SVG shapes in Blink — piece 11). */
        .navicon:focus-visible,
        .form-control:focus-visible {
            outline: 2px solid #0056b3;
            outline-offset: 2px;
        }
        .mode-icon i { color: #adb5bd; }
        .mode-icon.active i { color: #2e7d32; }
        .add-fav-btn { margin-right: 2px; }
        .add-fav-btn i { font-size: 1.6em; width: 36px; color: #3f2b1e; }

        /* Add-favorite picker */
        .fav-panel {
            position: fixed; top: 64px; left: 12px; z-index: 4000;
            width: min(92vw, 460px); max-height: 72vh; overflow-y: auto;
            padding: 10px 10px 12px; background: #fff;
            border: 1px solid #ced4da; border-radius: 10px;
            box-shadow: 0 12px 30px rgba(0,0,0,.22);
        }
        .fav-panel[hidden] { display: none; }
        .fav-header {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; margin-top: 8px; padding: 8px 10px;
            border: 1px solid #dee2e6; border-radius: 6px;
            background: #f8f9fa; color: #212529; cursor: pointer;
            font: 700 13px/1.4 system-ui, -apple-system, sans-serif;
        }
        .fav-header:hover { background: #f1f3f5; }
        .fav-header[hidden] { display: none; }
        .fav-header:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .fav-header .bt-chevron { font-size: 9px; transition: transform .15s ease; }
        .fav-header[aria-expanded="true"] .bt-chevron { transform: rotate(180deg); }
        .fav-body { padding: 6px 0 2px; }
        .fav-body[hidden] { display: none; }
        .fav-list { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
        .fav-route {
            display: flex; align-items: center; gap: 8px; width: 100%;
            padding: 5px 6px; border: 1px solid #e9ecef; border-radius: 6px;
            background: #fff; color: #343a40; cursor: pointer; text-align: left;
            font: 13px/1.4 system-ui, -apple-system, sans-serif;
        }
        .fav-route:hover { background: #f8f9fa; }
        .fav-route:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .fav-route .bt-chevron { flex: none; margin-left: auto; font-size: 9px; transition: transform .15s ease; }
        .fav-route[aria-expanded="true"] .bt-chevron { transform: rotate(180deg); }
        .fav-badge {
            flex: none; min-width: 52px; padding: 2px 8px; border-radius: 5px;
            color: #fff; font-weight: 700; font-size: 12px; text-align: center;
        }
        .fav-badge.boston-bus { min-width: 65px; }
        .fav-badge.line { min-width: 74px; }
        .fav-conns { display: inline-flex; flex-wrap: wrap; gap: 2px; margin-left: 4px; }
        .fav-conns .fav-badge,
        .fav-conns .fav-badge.line,
        .fav-conns .fav-badge.boston-bus {
            min-width: 0; padding: 0 4px; font-size: 10px; line-height: 1.5;
            border-radius: 4px;
        }
        .fav-desc { flex: 1; min-width: 0; }
        .fav-stops { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 6px 14px; }
        .fav-stops[hidden] { display: none; }
        .fav-stop {
            display: flex; align-items: center; gap: 6px;
            font: 12px/1.4 system-ui, -apple-system, sans-serif;
        }
        .fav-stop-name { flex: 1; min-width: 0; }
        button.fav-stop-name {
            border: 0; background: none; padding: 2px 0; text-align: left;
            color: #0b5ed7; cursor: pointer; font: inherit;
        }
        button.fav-stop-name:hover { text-decoration: underline; }
        button.fav-stop-name:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .fav-star {
            flex: none; border: 0; background: none; padding: 2px;
            color: #adb5bd; cursor: pointer; font-size: 13px; line-height: 1;
        }
        .fav-star.active { color: #e0a800; }
        .fav-star:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .fav-select {
            flex: none; border: 0; background: none; padding: 2px;
            color: #adb5bd; cursor: pointer; font-size: 12px; line-height: 1;
        }
        .fav-select.active { color: #2e7d32; }
        .fav-select:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .fav-dir-label {
            margin: 8px 0 2px 2px;
            font: 600 11px/1.3 system-ui, -apple-system, sans-serif;
            letter-spacing: .04em; text-transform: uppercase; color: #6c757d;
        }
        .fav-empty { padding: 4px; color: #6c757d; font-size: 12px; }
        .fav-dist { flex: none; color: #6c757d; font-size: 11px; white-space: nowrap; }
        .fav-setting {
            display: flex; align-items: center; gap: 8px; width: 100%;
            padding: 7px 8px; border: 1px solid #e9ecef; border-radius: 6px;
            background: #fff; color: #343a40; cursor: pointer; text-align: left;
            font: 13px/1.4 system-ui, -apple-system, sans-serif;
        }
        .fav-setting:hover { background: #f8f9fa; }
        .fav-setting:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .fav-setting i { color: #2e7d32; }
        .fav-setting[aria-pressed="false"] i { color: #adb5bd; }
        .fav-setting-name { flex: 1; }
        .fav-setting-state {
            font-size: 11px; font-weight: 700; letter-spacing: .05em;
            text-transform: uppercase; color: #adb5bd;
        }
        .fav-setting[aria-pressed="true"] .fav-setting-state { color: #2e7d32; }
        .fav-setting + .fav-setting { margin-top: 6px; }
        .fav-setting-static { cursor: default; }
        .fav-setting-static:hover { background: #fff; }
        .fav-city-select { width: auto; max-width: 150px; font-size: 12px; }
        .fav-setting-danger i { color: #c92a2a; }
        .fav-setting-danger:hover { background: #fff5f5; }

        /* Main-panel bookmark list (Home / Work / Favorites) */
        .bookmark-view {
            margin: 8px 0 18px; padding: 12px 14px;
            background: #fff; border: 1px solid #dee2e6; border-radius: 10px;
        }
        .bookmark-view[hidden] { display: none; }
        .bookmark-title { margin: 0 0 8px; font: 700 18px/1.3 system-ui, -apple-system, sans-serif; color: #182338; }
        .bookmark-list { gap: 8px; }
        .hero-card.bookmark-card {
            margin: 0; padding: 10px 84px 12px 16px; border-radius: 10px;
            cursor: pointer;
        }
        .hero-card.bookmark-card.hero-bus:hover { background: #cbcbcb; }
        .hero-card.bookmark-card.hero-metro:hover { background: #e4d7c1; }
        .bookmark-card:focus-visible { outline: 2px solid #2e7d32; outline-offset: 1px; }
        .bookmark-card .board-shortcuts { top: 8px; right: 10px; }
        .bookmark-card .fav-star {
            padding: 4px 5px; border-radius: 4px; font-size: 14px;
            color: #8a6f69; background: none;
        }
        .bookmark-card .fav-star:hover { color: #2c1a16; background: rgba(0,0,0,.06); }
        .bookmark-card .fav-star.active { color: #2e7d32; }
        .bookmark-card.hero-bus .fav-star { color: #6b6b6b; }
        .bookmark-card.hero-bus .fav-star:hover { color: #111; background: rgba(0,0,0,.08); }
        .bookmark-card.hero-bus .fav-star.active { color: #2e7d32; }

        /* clock block: current time over "at … ·refresh in Ns", with
           the auto-refresh toggle beside it. */
        /* full-page access gate */
        .gate {
            position: fixed; inset: 0; z-index: 5000;
            display: flex; align-items: center; justify-content: center;
            background: #182338;
        }
        .gate[hidden] { display: none; }
        .gate-card {
            width: min(90vw, 320px); background: #fff; padding: 22px;
            border-radius: 12px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,.35);
        }
        .gate-title { font: 700 18px/1.3 system-ui, -apple-system, sans-serif; color: #182338; }
        .gate-error { min-height: 18px; color: #c92a2a; font-size: 13px; }

        /* shortcut buttons keep the header compact on phones */
        .nav-shortcut i { font-size: 2em; width: 46px; color: #3f2b1e; }
        .nav-shortcut { position: relative; }
        .nav-shortcut:hover i, .add-fav-btn:hover i { color: #241710; }
        .nav-back i { font-size: 1.5em; width: 34px; color: #3f2b1e; }
        .nav-back:hover:not(:disabled) i { color: #241710; }
        .nav-back:disabled i { color: #cdbfb2; }
        .nav-back:disabled { cursor: default; }
        .nav-map:hover i { color: #495057; }

        .clock-meta {
            font: 500 11px/1.3 system-ui, -apple-system, sans-serif;
            color: #6c757d;
            white-space: nowrap;
        }
        .clock-refresh { margin-left: 0; }
        .clock-refresh i { font-size: 1.5em; color: #2e7d32; }
        .clock-refresh[aria-pressed="false"] i { color: #adb5bd; }

        /* stop-name entry with autocomplete (drives the one view) */
        .ac-wrap {
            position: relative;
            max-width: 460px;
            margin: 10px 0 14px;
        }
        .ac-wrap select + select { margin-top: 6px; }
        .route-panel {
            display: flex; flex-wrap: wrap; gap: 6px;
            max-height: 190px; overflow-y: auto;
            padding: 8px; border: 1px solid #dee2e6; border-radius: 8px;
            background: #fff;
        }
        .route-panel[hidden] { display: none; }
        .bus-routes-toggle {
            display: flex; align-items: center; gap: 6px;
            margin: 0 0 6px; padding: 6px 10px;
            border: 1px solid #ced4da; border-radius: 6px;
            background: #fff; color: #343a40; cursor: pointer;
            font: 600 13px/1.4 system-ui, -apple-system, sans-serif;
        }
        .bus-routes-toggle:hover { background: #f1f3f5; }
        .bus-routes-toggle:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .bus-routes-toggle .bt-chevron { font-size: 9px; transition: transform .15s ease; }
        .bus-routes-toggle[aria-expanded="true"] .bt-chevron { transform: rotate(180deg); }
        .route-chip {
            flex: none; padding: 3px 10px; border: 0; border-radius: 5px;
            color: #fff; cursor: pointer;
            font: 700 13px/1.4 system-ui, -apple-system, sans-serif;
        }
        .route-chip:hover { filter: brightness(1.08); }
        .route-chip:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .route-chip.active { outline: 3px solid #212529; outline-offset: 1px; }
        #busStopSelect { margin-top: 6px; }

        .ac-clear {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .ac-clear i { font-size: 14px; }

        .ac-clear:hover { color: #212529; }

        .ac-list {
            position: absolute;
            top: calc(100% + 2px);
            left: 0;
            right: 0;
            z-index: 1050;
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0 0 .375rem .375rem;
            box-shadow: 0 6px 12px rgba(0, 0, 0, .12);
            max-height: 280px;
            overflow-y: auto;
            padding: 4px 0;
        }

        .ac-item {
            padding: 3px 12px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ac-item:hover,
        .ac-item.active { background: #e9ecef; }

        .ac-item .code { color: #6c757d; font-size: .85em; margin-left: 8px; }

        .ac-none { padding: 4px 12px; color: #6c757d; cursor: default; }

        /* The board (v5): a quiet, high-contrast surface — saturated route
           accents do the talking, stop dots stay muted, numerals are big
           and tabular. One horizontal scroller (.lines-scroll) holds every
           row of both curb sections; they share one x origin (the boarding
           guide) and one px-per-foot scale, so the guides line up and the
           board scrolls as one piece. */
        .lines-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

        .board { margin: 4px 2px 8px; }

        /* The rows for the main stop and each nearby stop sit inside a
           bordered group whose top edge meets the dark heading above. */
        .main-board, .nearby-board {
            margin: 0 2px 8px; padding: 0;
            border: 1px solid #dee2e6; border-top: 0;
            border-radius: 0 0 10px 10px; background: #fff;
        }
        .main-board .board, .nearby-board .board { margin: 0; }
        /* A row with no live prediction: its scheduled fallback sits on a
           quieter surface so it reads as timetable information. */
        .board-row.is-scheduled { background: #f8f9fa; }
        .board-row.is-departed { background: #f8f9fa; }

        /* One row = one quiet card: white surface, hairline border, rounded.
           The header + sub-line sit in a flex column so a wrapping line and
           the ETA list stack cleanly on narrow screens. */
        .board-row {
            display: flex; flex-direction: column; gap: 2px;
            background: #fff; border: 1px solid #dee2e6; border-radius: 8px;
            padding: 8px 12px; margin: 6px 0;
        }
        /* Inside a stop group every route is the same stacked row: square
           edges, no side borders, single separators. The group itself
           supplies the rounded bottom. */
        .main-board .board-row, .nearby-board .board-row {
            margin: 0; border-radius: 0;
            border-left: 0; border-right: 0; border-bottom: 0;
        }
        .main-board .board-row + .board-row,
        .nearby-board .board-row + .board-row {
            border-top: 1px solid #dee2e6;
        }

        /* Nearby stop cards: the hero card's header-line format on a lighter
           tint of the hero color, with the stop's departure rows below. */
        .nearby-stop-card {
            position: relative; overflow: hidden;
            margin: 14px 2px 0; padding: 10px 16px; border-radius: 10px 10px 0 0;
            border: 1px solid #dee2e6; border-bottom: 0; cursor: pointer;
        }
        .nearby-stop-card.nearby-bus { background: #ececec; color: #2f2f2f; }
        .nearby-stop-card.nearby-metro { background: #f5efe4; color: #46301a; }
        .nearby-stop-card.nearby-bus:hover { background: #e3e3e3; }
        .nearby-stop-card.nearby-metro:hover { background: #efe7d8; }
        .nearby-stop-card:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .nearby-card-head { display: flex; align-items: center; gap: 16px; }
        .nearby-card-main { flex: 1 1 auto; min-width: 0; }
        .nearby-card-title {
            font: 600 15px/1.3 system-ui, -apple-system, sans-serif; color: inherit;
        }
        .nearby-card-sub { margin: 1px 0 0; font-size: 12px; color: #5f5f5f; }
        .nearby-stop-card.nearby-metro .nearby-card-sub { color: #7a6a55; }

        .board-head {
            display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px;
            font: 14px/1.4 system-ui, -apple-system, sans-serif;
        }
        .row-mainline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
        .board-routecode { flex: none; min-width: 36px; font-weight: 700; font-size: 14px; }
        /* Route badge: white code on the route's saturated color (the palette
           is dark enough to keep it legible). */
        .row-badge {
            flex: none; padding: 2px 9px; border-radius: 5px;
            color: #fff; font-weight: 700; font-size: 13px; line-height: 1.4;
        }
        .row-badge.boston-bus { padding-left: 11px; padding-right: 11px; }
        .row-badge.hollow {
            background: transparent; border: 2px solid currentColor;
            padding: 0 7px;
        }
        /* Metro line names share one rectangle width (fits "Orange"/"Yellow"
           plus the stop-list chevron). */
        .row-badge.metro-line {
            width: 84px; box-sizing: border-box;
            display: inline-flex; align-items: center; justify-content: center;
            text-align: center;
        }
        /* A badge with a stop list is the disclosure control itself. */
        .row-badge.bt-allstops {
            padding: 2px 9px; border: 0; border-radius: 5px;
            font: 700 13px/1.4 system-ui, -apple-system, sans-serif; color: #fff;
            display: inline-flex; align-items: center; gap: 4px;
            cursor: pointer;
        }
        .row-badge.bt-allstops:hover { filter: brightness(1.08); }
        .row-badge.hollow.bt-allstops {
            border: 2px solid currentColor; padding: 0 7px;
        }
        .row-badge.hollow.bt-allstops:hover { background: transparent; }
        .row-badge-wrap { display: inline-flex; align-items: center; gap: 5px; flex: none; }
        .row-mainline .bus-status { margin-left: 2px; vertical-align: middle; }
        .bus-status { font-size: 12px; }
        .bus-status.arriving { font-size: 17px; }
        .bus-status.departed { color: #adb5bd; }
        /* Final destination: bold and set on a quiet grey highlight, sitting
           immediately after the badge. */
        .board-dest {
            font-weight: 700; color: #182338;
            background: #e9ecef; padding: 1px 6px; border-radius: 3px;
        }
        /* The ETA group packs left, right after the destination. */
        .board-etas {
            white-space: nowrap;
            display: inline-flex; align-items: baseline; gap: 6px;
            font-variant-numeric: tabular-nums;
        }
        .board-eta-first { font-weight: 700; font-size: 18px; color: #182338; }
        .board-eta-rest { font-size: 13px; color: #6c757d; }

        .bt-allstops {
            flex: none; padding: 0 7px;
            font: 500 11px/1.6 system-ui, -apple-system, sans-serif;
            color: #343a40; background: none; border: 1px solid #ced4da; border-radius: 4px;
            cursor: pointer;
        }
        .bt-allstops:hover { background: #f1f3f5; }
        .bt-allstops:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .bt-allstops .bt-chevron {
            font-size: 9px; transition: transform .15s ease;
        }
        .bt-allstops[aria-expanded="true"] .bt-chevron { transform: rotate(180deg); }
        .bt-stoplist {
            margin: 6px 0 2px; padding-left: 0; list-style: none;
            font: 12px/1.55 system-ui, -apple-system, sans-serif;
            color: #343a40; font-variant-numeric: tabular-nums;
        }
        .bt-stoplist .bt-stop-item {
            display: flex; align-items: center; gap: 4px;
            padding: 2px 6px; margin: 1px 0; border-radius: 4px;
            cursor: pointer;
        }
        .bt-stoplist .bt-stop-name { flex: 1; min-width: 0; }
        .bt-stoplist .fav-star { font-size: 12px; }
        .bt-stoplist .bt-stop-item:hover { background: #f1f3f5; }
        .bt-stoplist .bt-stop-item:focus-visible { outline: 2px solid #0056b3; outline-offset: 1px; }
        .bt-stoplist .bt-mark { font-weight: 700; color: #0056b3; }

        /* the stop header: a dark hero card — name, next bus. Its bottom
           corners are square so it merges with the main-board group below. */
        .hero-card {
            position: relative;
            margin: 8px 2px 0; padding: 10px 92px 34px 16px;
            background: #182338; color: #fff;
            border-radius: 10px 10px 0 0;
        }
        /* Hero tint by mode: bus = medium-light grey, Metro = light brown. */
        .hero-card.hero-bus { background: #d8d8d8; color: #2f2f2f; }
        .hero-card.hero-metro { background: #ece1cd; color: #46301a; }
        .hero-line-band {
            position: absolute; top: 0; left: 0; right: 0; height: 7px;
            border-radius: 10px 10px 0 0; pointer-events: none;
            overflow: hidden;
        }
        /* Bus hero strip: red on the left 2/3, medium grey on the right,
           with a 45° transition (the 7 px band height is the offset). */
        .hero-line-band.bus-band { background: var(--bus-band-color, #c62828); }
        .hero-line-band.bus-band::after {
            content: ""; position: absolute; top: 0; right: 0; bottom: 0;
            left: 66.666%; background: #9e9e9e;
            clip-path: polygon(7px 0, 100% 0, 100% 100%, 0 100%);
        }
        .hero-card.hero-bus .board-stopid,
        .hero-card.hero-metro .board-stopid { color: #85706a; }
        .hero-card.hero-bus .bt-next-eta,
        .hero-card.hero-metro .bt-next-eta { color: #2e7d32; }
        .hero-card.hero-bus .bt-next-rest,
        .hero-card.hero-metro .bt-next-rest { color: #7d6f65; }
        .hero-card.hero-bus .board-next,
        .hero-card.hero-metro .board-next { color: #4a342f; }
        .hero-card.hero-bus .board-shortcut,
        .hero-card.hero-metro .board-shortcut { color: #8a6f69; }
        .hero-card.hero-bus .board-shortcut:hover,
        .hero-card.hero-metro .board-shortcut:hover {
            color: #2c1a16; background: rgba(0,0,0,.06);
        }
        .hero-card.hero-bus .board-shortcut.active,
        .hero-card.hero-metro .board-shortcut.active { color: #2e7d32; }
        .hero-card.hero-bus .board-share,
        .hero-card.hero-metro .board-share {
            background: rgba(0,0,0,.06); color: #5a3d38;
        }
        .hero-card.hero-bus .board-share:hover,
        .hero-card.hero-metro .board-share:hover {
            background: rgba(0,0,0,.12); color: #2c1a16;
        }
        /* Neutral ink for the grey bus hero. */
        .hero-card.hero-bus .board-stopid { color: #6b6b6b; }

<script>
// ════════════════════════════════════════════════════════════════════
// Configuration
// ════════════════════════════════════════════════════════════════════

// ⚠  Client-side gating raises the cost of casual inspection but is not a
//    substitute for server-side secrecy: after unlock the key is in memory.
//    The key is AES-GCM encrypted with a key derived from the access password
//    via PBKDF2-SHA-256 (salt and IV are stored with the ciphertext).
const KEY_BLOB = "5iUncaMBYE7uFbNF/sa4No2ZSSmC3OhN6cevnbrGAfnFyGRzaRvlN14ZCuRDjJxTz0OT+EGRuXJbjkp+m8ACl5Qkq6tF2EnR3MBw0g==";
const PBKDF2_ITERATIONS = 210000;
let API_KEY = "";

// WMATA public API — WMATA operates the DC (Metrobus) bus system.
// Portal / docs / key registration: https://developer.wmata.com
const WMATA_API = "https://api.wmata.com";

// MBTA v3 API — Boston's bus, subway, and light rail.
// Portal / docs / key registration: https://www.mbta.com/developers/v3-api
const MBTA_API = "https://api-v3.mbta.com";
const MBTA_KEY = "f0c9d27eb6774459b9ad9c009fa5457a";

function b64Bytes(b64) {
    return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

async function decryptKey(pass) {
    const blob = b64Bytes(KEY_BLOB);
    const salt = blob.slice(0, 16);
    const iv = blob.slice(16, 28);
    const ciphertext = blob.slice(28);
    const base = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
    return new TextDecoder().decode(plain);
}

async function unlockAccess(pass) {
    try {
        API_KEY = await decryptKey(pass);
    } catch (e) {
        return false;               // wrong password: AES-GCM auth failed
    }
    const gate = document.getElementById("gate");
    if (gate) gate.hidden = true;
    startApp();
    return true;
}

function startApp() {
    // Deep links still open their stop/location directly. With no parameters
    // the launch screen is the favorites list: nothing is fetched and no
    // stop or station is selected until the user picks one.
    if (stopListFromURL || urlPoint) {
        if (mode === "metro") runMetro();
        else runFlow();
        return;
    }
    renderBookmarkList("fav");
}

function showGate() {
    const input = document.getElementById("gateInput");
    if (input) input.focus();
}

// The 20010 corner (Cleveland Park), for building ?busstop= links:
//   1002135 / 1002130  Park Rd NW + 19 St NW        (C87, D72)
//   1002118            Adams Mill Rd NW + Klingle Rd NW (C61)
//   1002127 / 1002120  Park Rd NW + Mt Pleasant St NW (C87, D72)
// The 2025 "Better Bus" redesign renumbered stops — the old defaults
// 1002141/1002148 no longer exist (verified 2026-11). The no-param view
// does a live nearby search instead of using fixed IDs, so it self-heals
// if the IDs change again; see README → "Maintenance".
//

// Park Rd NW, Cleveland Park (20010) — the DC "home" corner
const HOME = { lat: 38.93468, lon: -77.04512 };
const DC_CENTER = { lat: 38.89790, lon: -77.03661 };

// ── Cities ───────────────────────────────────────────────────────────
// Each city has its own transport data source and its own favorites and
// Home/Work bookmarks. "Near me" auto-selects the city from geolocation.
const CITIES = {
    dc: {
        id: "dc", name: "Washington DC",
        center: HOME, metroCenter: DC_CENTER,
        defaultFavorite: { kind: "metro", id: "N10",
            name: "Washington Dulles International Airport", route: "SV" }
    },
    boston: {
        id: "boston", name: "Boston",
        center: { lat: 42.3601, lon: -71.0589 },
        metroCenter: { lat: 42.3564, lon: -71.0624 },
        defaultFavorite: { kind: "bus", id: "17091",
            name: "Boston Logan Airport Terminal A", route: "SL1" }
    }
};
const CITY_COOKIE = "mta_city";

function readCityCookie() {
    try {
        const hit = String(document.cookie || "").split("; ")
            .find(p => p.startsWith(CITY_COOKIE + "="));
        const v = hit ? decodeURIComponent(hit.slice(CITY_COOKIE.length + 1)) : "";
        return v === "boston" ? "boston" : "dc";
    } catch (e) { return "dc"; }
}

function writeCityCookie() {
    try {
        document.cookie = `${CITY_COOKIE}=${city}; max-age=31536000; path=/; SameSite=Lax`;
    } catch (e) { /* session-only */ }
}

let city = readCityCookie();
function cityCfg() { return CITIES[city] || CITIES.dc; }
function isBoston() { return city === "boston"; }
function cityHome() { return cityCfg().center; }
function defaultFavorite() { return Object.assign({}, cityCfg().defaultFavorite); }

function nearestCity(lat, lon) {
    let best = "dc", bestD = Infinity;
    for (const key of Object.keys(CITIES)) {
        const c = CITIES[key].center;
        const d = distance(lat, lon, c.lat, c.lon, "m");
        if (d < bestD) { bestD = d; best = key; }
    }
    return best;
}

// ── URL parameters ───────────────────────────────────────────────────
//   ?busstop=1002135,1002130   explicit stops (lat/lon/radius ignored)
//   ?lat=38.934&lon=-77.045    search for stops near this point
//   ?radius=300                search radius in meters
//   ?refresh=30                prediction refresh interval, seconds (15..600)
// No params: the favorites panel opens; no stop is fetched until one is picked.
// Defaults: radius 300 m, refresh 30 s.
const params = new URLSearchParams(location.search);

function num(value, fallback) {
    const n = parseFloat(value);
    return Number.isFinite(n) ? n : fallback;
}

const stopListFromURL =
    params.get("busstop") ? params.get("busstop").split(",").map(s => s.trim()).filter(Boolean) : null;

// lat/lon: use the URL point only when BOTH are given, otherwise no search
// point at all (null). The no-param view then defaults to DEFAULT_STOP_ID;
// "Home" restores the 20010 corner as the search point.
const hasLatLon = params.has("lat") && params.has("lon");
const urlPoint = hasLatLon
    ? { lat: num(params.get("lat"), HOME.lat), lon: num(params.get("lon"), HOME.lon) }
    : null;

const gRadius = num(params.get("radius"), 300);
const REFRESH_MS = Math.min(Math.max(num(params.get("refresh"), 30), 15), 600) * 1000;

// ════════════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════════════
let stops = [];               // [{ StopID, Name, Lat, Lon, Distance, Routes, Arrivals, Error }]
let searchPoint = urlPoint;   // ?lat/lon search point (null = default stop)
let pickedStop = null;        // the stop chosen in the entry field (null = nearby search)
let pickedStopObj = null;     // the stop object actually shown (may be a directory stop outside the list)
let forceNearby = false;      // the user dismissed a ?busstop= prefill (✕) → search nearby even with the param
let refreshTimer = null;
let refreshEnabled = true;    // auto-refresh toggle (the clock's refresh button)
let nextRefreshAt = 0;        // when the armed timer fires (for the countdown)
let rateLimited = false;      // WMATA returned 429 → slow the refresh down
let busy = false;             // re-entrancy guard for runFlow()
let lastRefreshAt = 0;
const PAGE_LOADED_AT = Date.now();
// stop directory
// The full jStops dump (812 KB, ~7.5k stops) is fetched once per page load
// and feeds the shared entry field's autocomplete plus the route picture.
let allStopsCache = null;     // the full stop dump, cached per page load
let stopDirLoad = null;       // in-flight loadStopDirectory() promise (dedupes the fetch)
const nearbyStopObjs = new Map();   // StopID → shared stop object for nearby sections

// Metro state. Stations/arrivals/schedules are kept separately from buses.
let metroStationsCache = null;
let metroStationsLoad = null;
let metroAnchor = null;
let metroNearby = [];
let metroAnchorCode = null;
let metroLive = {};                 // station Code → live trains
let metroLiveError = {};            // station Code → error
let metroSchedule = {};             // station Code → scheduled departures
let metroRefreshInFlight = false, metroRefreshQueued = false;
const METRO_NEARBY_FT = 1000;
const metroPathCache = {};
const metroPathInflight = {};

const METRO_COLORS = {
    RD: "#c62828", BL: "#1565c0", OR: "#ef6c00",
    SV: "#6c757d", GR: "#2e7d32", YL: "#9e9d24"
};
const METRO_LINE_NAMES = {
    RD: "Red", BL: "Blue", OR: "Orange",
    SV: "Silver", GR: "Green", YL: "Yellow"
};
// Boston subway/light-rail routes (loaded from MBTA /routes type 0,1).
let metroRoutesCache = null;
let metroRoutesLoad = null;

function metroLineColor(line) {
    const key = String(line || "");
    if (isBoston()) {
        const m = metroRoutesCache && metroRoutesCache[key];
        return m ? (m.color.startsWith("#") ? m.color : "#" + m.color) : "#5d4037";
    }
    return METRO_COLORS[key.toUpperCase()] || "#5d4037";
}
function metroLineName(line) {
    const key = String(line || "");
    if (isBoston()) {
        const m = metroRoutesCache && metroRoutesCache[key];
        return m ? m.name : key;
    }
    return METRO_LINE_NAMES[key.toUpperCase()] || key;
}

// ── Mode (bus / metro) and shortcut locations ─────────────────────────
// Bookmarks are stored per mode; home/work/favorite are not shared.
const MODE_COOKIE = "mta_mode";
const SHORTCUT_SLOTS = ["home", "work", "fav"];
let mode = readModeCookie();
let shortcuts = readShortcutCookie();

function readModeCookie() {
    try {
        const hit = String(document.cookie || "").split("; ")
            .find(p => p.startsWith(MODE_COOKIE + "="));
        const m = hit ? decodeURIComponent(hit.slice(MODE_COOKIE.length + 1)) : "";
        return m === "metro" ? "metro" : "bus";
    } catch (e) { return "bus"; }
}

function writeModeCookie() {
    try {
        document.cookie = `${MODE_COOKIE}=${mode}; max-age=31536000; path=/; SameSite=Lax`;
    } catch (e) { /* session-only fallback */ }
}

function shortcutCookieName(kind) {
    const modeKey = kind || mode;
    return isBoston() ? `mta_shortcuts_boston_${modeKey}` : `mta_shortcuts_${modeKey}`;
}

function readShortcutsFor(kind) {
    try {
        const name = shortcutCookieName(kind);
        let hit = String(document.cookie || "").split("; ")
            .find(p => p.startsWith(name + "="));
        // Legacy bus cookie from before per-mode bookmarks.
        if (!hit && kind === "bus" && !isBoston())
            hit = String(document.cookie || "").split("; ")
                .find(p => p.startsWith("mta_shortcuts="));
        if (!hit) return {};
        const at = hit.indexOf("=");
        return JSON.parse(decodeURIComponent(hit.slice(at + 1))) || {};
    } catch (e) { return {}; }
}

function readShortcutCookie() {
    return readShortcutsFor(mode);
}

function writeShortcutCookie() {
    try {
        document.cookie = `${shortcutCookieName()}=${encodeURIComponent(JSON.stringify(shortcuts))}`
            + "; max-age=31536000; path=/; SameSite=Lax";
    } catch (e) { /* cookies unavailable: shortcuts last for the session */ }
}

function writeShortcutsFor(kind, obj) {
    try {
        document.cookie = `${shortcutCookieName(kind)}=${encodeURIComponent(JSON.stringify(obj))}`
            + "; max-age=31536000; path=/; SameSite=Lax";
    } catch (e) { /* session-only */ }
    if (kind === mode) shortcuts = obj;
}

// Save/clear Home or Work from a summary card. Per-city, per-mode cookie.
function toggleBookmarkCardSlot(kind, id, name, route, slot) {
    if (slot !== "home" && slot !== "work") return;
    const cur = readShortcutsFor(kind);
    const same = cur[slot] && String(cur[slot].id) === String(id);
    if (same) {
        delete cur[slot];
    } else {
        cur[slot] = { id: String(id), name: name || "", route: route || "" };
        if (!isFavorite(kind, id)) toggleFavorite(kind, id, name, route);
    }
    writeShortcutsFor(kind, cur);

    return isBoston() ? "mta_favorites_boston" : FAVORITES_COOKIE;
}

}

function readFavorites() {
    const key = favoritesCookieName();
    try {
        if (typeof localStorage !== "undefined") {
            const raw = localStorage.getItem(key);
            if (raw) {
                const list = JSON.parse(raw);
                if (Array.isArray(list)) return list;
            }
        }
    } catch (e) { /* fall through to cookie */ }
    try {
        const hit = String(document.cookie || "").split("; ")
            .find(p => p.startsWith(key + "="));
        if (!hit) return [];
        const at = hit.indexOf("=");
        const list = JSON.parse(decodeURIComponent(hit.slice(at + 1)));
        return Array.isArray(list) ? list : [];
    } catch (e) { return []; }
}

function writeFavorites() {
    const key = favoritesCookieName();
    try {
        if (typeof localStorage !== "undefined")
            localStorage.setItem(key, JSON.stringify(favorites));
    } catch (e) { /* ignore storage failures */ }
    try {
        document.cookie = `${key}=${encodeURIComponent(JSON.stringify(favorites))}`
            + "; max-age=31536000; path=/; SameSite=Lax";
    } catch (e) { /* session-only fallback */ }
}

function isFavorite(kind, id) {
    return favorites.some(f => f.kind === kind && String(f.id) === String(id));
}

// Settings → Delete all favorites: drop every saved bus stop/station and

    favorites = [defaultFavorite()];
    writeFavorites();
    updateShortcutNav();
    closeFavPanel();
    renderBookmarkList("fav");

function toggleFavorite(kind, id, name, route) {
    const i = favorites.findIndex(f => f.kind === kind && String(f.id) === String(id));
    if (i >= 0) favorites.splice(i, 1);
    else favorites.push({ kind, id: String(id), name: name || "", route: route || "" });
    writeFavorites();
}

// ════════════════════════════════════════════════════════════════════
// WMATA API
// ════════════════════════════════════════════════════════════════════
const sleep = ms => new Promise(r => setTimeout(r, ms));

// One GET against the WMATA API. One retry after backoff on 429/timeout.
// Never throws: returns { data, error } so callers decide how to surface it.
async function apiGet(path, query, timeoutMs = 10000) {
    const qs = new URLSearchParams(Object.assign({ api_key: API_KEY }, query));
    for (let attempt = 0; ; attempt++) {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), timeoutMs);
        try {
            const res = await fetch(`${WMATA_API}${path}?${qs}`, { signal: ctl.signal });
            const data = await res.json().catch(() => ({}));
            if (res.status === 429 && attempt === 0) {   // back off, retry once
                await sleep(1500);
                continue;
            }
            const error = res.ok ? null : Object.assign(
                new Error(data.Message || `HTTP ${res.status}`),
                { status: res.status, rateLimited: res.status === 429 });
            return { data, error };
        } catch (e) {                                     // network error / timeout
            if (attempt === 0) {
                await sleep(1500);
                continue;
            }
            return { data: null, error: e };
        } finally {
            clearTimeout(timer);
        }
    }
}

// One GET against the MBTA v3 API (JSON:API). Same retry policy as apiGet.
async function mbtaGet(path, query, timeoutMs = 15000) {
    const qs = new URLSearchParams(Object.assign({ api_key: MBTA_KEY }, query || {}));
    for (let attempt = 0; ; attempt++) {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), timeoutMs);
        try {
            const res = await fetch(`${MBTA_API}${path}?${qs}`, { signal: ctl.signal });
            const data = await res.json().catch(() => ({}));
            if (res.status === 429 && attempt === 0) { await sleep(1500); continue; }
            const detail = data && data.errors && data.errors[0] && data.errors[0].detail;
            const error = res.ok ? null : Object.assign(
                new Error(detail || `HTTP ${res.status}`),
                { status: res.status, rateLimited: res.status === 429 });
            return { data, error };
        } catch (e) {
            if (attempt === 0) { await sleep(1500); continue; }
            return { data: null, error: e };
        } finally {
            clearTimeout(timer);
        }
    }
}

// MBTA's nearby radius is in degrees: 0.02° ≈ 1 mile.
function mbtaRadiusDeg(meters) {
    return Math.max(0.001, (meters / 1609.344) * 0.02);
}

function mbtaIncluded(data) {
    const by = new Map();
    for (const item of (data && data.included) || [])
        by.set(item.type + ":" + item.id, item);
    return by;
}

function mbtaStop(s) {
    return {
        StopID: String(s.id),
        Name: (s.attributes && s.attributes.name) || "",
        Lat: Number(s.attributes && s.attributes.latitude),
        Lon: Number(s.attributes && s.attributes.longitude),
        Routes: []
    };
}

function mbtaRouteShort(route, fallback) {
    const a = (route && route.attributes) || {};
    return String(a.short_name || (route && route.id) || fallback || "");
}

// Nearby stops: WMATA jStops, or MBTA /stops within the same radius.
// Returns [{ StopID, Name, Lat, Lon, Routes }] (or [] if none in range).
async function fetchStopsNear(lat, lon, radius) {
    if (isBoston()) {
        const { data, error } = await mbtaGet("/stops", {
            "filter[latitude]": lat,
            "filter[longitude]": lon,
            "filter[radius]": mbtaRadiusDeg(radius),
            "filter[route_type]": 3,
            "filter[location_type]": "0",
            "page[limit]": 200
        });
        if (error) throw error;
        return ((data && data.data) || []).map(mbtaStop);
    }
    const { data, error } = await apiGet("/Bus.svc/json/jStops", { Lat: lat, Lon: lon, Radius: radius });
    if (error) throw error;
    return (data && data.Stops) || [];
}

// All stops: GET /Bus.svc/json/jStops (no params)
// The API silently IGNORES a StopID-only query and returns every stop in the
// system (~7.5k, ~800 KB). Each entry is { StopID, Name, Lon, Lat, Routes[] }
// — that dump is the only source of stop names, coordinates and routes.
// Fetched once per page load via loadStopDirectory(); it powers the
// shared entry field's autocomplete and the route picture.
async function fetchAllStops() {
    if (isBoston()) {
        const out = [];
        for (let offset = 0; offset < 12000; offset += 1000) {
            const { data, error } = await mbtaGet("/stops", {
                "filter[route_type]": 3,
                "filter[location_type]": "0",
                "page[limit]": 1000,
                "page[offset]": offset
            }, 30000);
            if (error) throw error;
            out.push(...((data && data.data) || []).map(mbtaStop));
            if (!(data && data.links && data.links.next)) break;
        }
        return out;
    }
    const { data, error } = await apiGet("/Bus.svc/json/jStops", {}, 30000);
    if (error) throw error;
    return (data && data.Stops) || [];
}

// The stop directory, deduped: concurrent callers (the entry field, the
// picture) share one in-flight fetch, and failures are not retried.
function loadStopDirectory() {
    if (!stopDirLoad) {
        stopDirLoad = fetchAllStops()
            .then(stops => { allStopsCache = stops; populateBusRoutes(stops); return stops; })
            .catch(err => { stopDirLoad = null; throw err; });   // allow a later retry
    }
    return stopDirLoad;
}

// StopID → Name index over the directory dump (built lazily once): the
// route-details normalization and the board's dot reveals fall back to it
// when a stop's own Name is missing.
let dirNameIndex = null;
function allStopsName(id) {
    if (!allStopsCache) return "";
    if (!dirNameIndex)
        dirNameIndex = new Map(allStopsCache.map(s => [String(s.StopID), s.Name || ""]));
    return dirNameIndex.get(String(id)) || "";
}

// Arrival predictions:  GET /NextBusService.svc/json/jPredictions?StopID
// Returns { name, predictions: [{ min, route, dir, dirNum, heads, vehicle, trip }] }.
// `name` (StopName) also labels stops given via ?busstop=, since there is
// no single-stop lookup in the nearby-search endpoint. `route`, `vehicle`
// (VehicleID) and `trip` (TripID) are normalized to strings — trip is the
// authoritative key for joining live positions; `dir` is the feed's
// DirectionText ("North to Van Ness" — the live destination, per the plan)
// with `heads` preferring a TripHeadsign when one is ever supplied. `min`
// is a number; 0 ("Due") is legitimate; missing or malformed minutes drop
// the row. Rows are deduped per stop+trip, falling back to
// vehicle+route+direction when the trip is missing; rows with neither ID
// are kept (the ETA list stays whole).
async function fetchMbtaPredictions(stopId) {
    const { data, error } = await mbtaGet("/predictions", {
        "filter[stop]": stopId,
        "filter[route_type]": 3,
        "include": "route,trip",
        "sort": "departure_time",
        "page[limit]": 200
    });
    if (error) throw error;
    const inc = mbtaIncluded(data);
    const now = Date.now();
    const preds = [];
    for (const p of (data && data.data) || []) {
        const a = p.attributes || {};
        const at = Date.parse(a.departure_time || a.arrival_time || "");
        if (!Number.isFinite(at)) continue;
        const rels = p.relationships || {};
        const routeRel = rels.route && rels.route.data;
        const tripRel = rels.trip && rels.trip.data;
        const route = inc.get("route:" + (routeRel && routeRel.id));
        const trip = inc.get("trip:" + (tripRel && tripRel.id));
        const dir = Number(a.direction_id) || 0;
        const heads = (trip && trip.attributes && trip.attributes.headsign) ||
            ((route && route.attributes && (route.attributes.direction_destinations || [])[dir]) || "");
        preds.push({
            min: Math.max(0, Math.round((at - now) / 60000)),
            route: mbtaRouteShort(route).toUpperCase(),
            dir, dirNum: String(dir), heads, dirText: heads,
            vehicle: null,
            trip: (tripRel && tripRel.id) || null
        });
    }
    preds.sort((a, b) => a.min - b.min || a.route.localeCompare(b.route));
    return { name: allStopsName(stopId) || "", predictions: preds };
}

async function fetchPredictions(stopId) {
    if (isBoston()) return fetchMbtaPredictions(stopId);
    const { data, error } = await apiGet("/NextBusService.svc/json/jPredictions", { StopID: stopId });
    if (error) throw error;
    if (!data || !Array.isArray(data.Predictions)) throw new Error("malformed prediction response");
    const name = data.StopName || null;
    const preds = [];
    const seen = new Set();
    for (const p of data.Predictions) {
        const min = Number(p.Minutes);
        if (!Number.isFinite(min) || min < 0) continue;    // malformed / off-service artifact
        const route = String(p.RouteID || "").toUpperCase();
        if (!route) continue;
        const dirNum = p.DirectionNum != null ? String(p.DirectionNum) : "";
        const vehicle = p.VehicleID != null ? String(p.VehicleID) : "";
        const trip = p.TripID != null ? String(p.TripID) : "";
        const dir = String(p.DirectionText || "");
        const key = trip ? route + "|" + trip
                  : vehicle ? route + "|" + vehicle + "|" + dirNum
                  : null;
        if (key !== null) {
            if (seen.has(key)) continue;
            seen.add(key);
        }
        preds.push({ min, route, dir, dirNum, heads: String(p.TripHeadsign || "") || dir,
                     vehicle: vehicle || null, trip: trip || null });
    }
    preds.sort((a, b) => a.min - b.min || a.route.localeCompare(b.route));
    return { name, predictions: preds };
}

// Recently departed buses: WMATA drops a prediction once the bus leaves the
// stop, so keep the last sighting for two minutes. A bus that had an ETA of
// 0–2 minutes and disappeared is assumed to have departed at lastSeen + ETA.
// Only stable identities (trip, else vehicle+route+direction) qualify.
const DEPARTED_WINDOW_MS = 2 * 60000;

function predKey(p) {
    if (p.trip) return "t:" + p.route + "|" + p.trip;
    if (p.vehicle) return "v:" + p.route + "|" + p.vehicle + "|" + (p.dirNum || "");
    return null;
}

function updateDeparted(stop, nextPreds, at) {
    const prev = stop.Arrivals || [];
    const prevAt = stop.ArrivalsAt || at;
    const nextKeys = new Set(nextPreds.map(predKey).filter(Boolean));
    const keep = [];
    for (const d of stop.Departed || []) {
        const key = predKey(d);
        if (key && nextKeys.has(key)) continue;               // live again
        if (at - d.departedAt > DEPARTED_WINDOW_MS) continue; // too old
        keep.push(d);
    }
    for (const p of prev) {
        const key = predKey(p);
        if (!key || nextKeys.has(key)) continue;
        if (p.min > 2) continue;                              // not an imminent departure
        if (keep.some(d => predKey(d) === key)) continue;
        const departedAt = prevAt + Math.max(0, p.min) * 60000;
        if (at - departedAt > DEPARTED_WINDOW_MS) continue;
        keep.push(Object.assign({}, p, { departed: true, departedAt }));
    }
    stop.Departed = keep;
    stop.ArrivalsAt = at;
}

// Stop schedule:  GET /Bus.svc/json/jStopSchedule?StopID   (verified 2026-11)
// Returns { Stop: {...}, ScheduleArrivals: [{ ScheduleTime, RouteID,
// DirectionNum, TripHeadsign, TripDirectionText, TripID, ... }] } for the
// current service day. Cached per stop per day, so a route with no live
// prediction can fall back to its next scheduled arrival ("not seen").
const stopScheduleCache = {};      // StopID → { day, arrivals, ok, at }
const stopScheduleInflight = {};   // StopID → in-flight promise
const SCHEDULE_RETRY_MS = 5 * 60000;

function scheduleDayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function fetchStopSchedule(stopId) {
    const { data, error } = await apiGet("/Bus.svc/json/jStopSchedule", { StopID: stopId });
    if (error) throw error;
    const arrivals = ((data && data.ScheduleArrivals) || []).map(s => ({
        at: new Date(s.ScheduleTime).getTime(),
        route: String(s.RouteID || "").toUpperCase(),
        dirNum: s.DirectionNum != null ? String(s.DirectionNum) : "",
        heads: String(s.TripHeadsign || ""),
        dirText: String(s.TripDirectionText || ""),
    })).filter(s => s.route && Number.isFinite(s.at));
    arrivals.sort((a, b) => a.at - b.at);
    return arrivals;
}

function ensureStopSchedule(stopId) {
    if (isBoston()) return Promise.resolve([]);   // MBTA has no WMATA stop schedule
    const id = String(stopId || "");
    if (!id) return Promise.resolve([]);
    const day = scheduleDayKey();
    const hit = stopScheduleCache[id];
    if (hit && hit.day === day && (hit.ok || Date.now() - hit.at < SCHEDULE_RETRY_MS))
        return Promise.resolve(hit.arrivals);
    if (stopScheduleInflight[id]) return stopScheduleInflight[id];
    stopScheduleInflight[id] = fetchStopSchedule(id)
        .then(arrivals => {
            stopScheduleCache[id] = { day, arrivals, ok: true, at: Date.now() };
            return arrivals;
        })
        .catch(() => {
            stopScheduleCache[id] = { day, arrivals: [], ok: false, at: Date.now() };
            return [];
        })
        .finally(() => { delete stopScheduleInflight[id]; });
    return stopScheduleInflight[id];
}

// The next scheduled arrival at `stopId` (optionally for one route/direction),
// from today's cached schedule. Null when the schedule has none left.
function nextScheduledFor(stopId, route, dirNum, heads) {
    const hit = stopScheduleCache[String(stopId || "")];
    if (!hit || hit.day !== scheduleDayKey()) return null;
    const now = Date.now();
    const r = route ? String(route).toUpperCase() : "";
    const dn = dirNum == null || dirNum === "" ? "" : String(dirNum);
    const h = heads ? normHeads(heads) : "";
    for (const s of hit.arrivals) {
        if (s.at < now) continue;
        if (r && s.route !== r) continue;
        if (dn && s.dirNum && s.dirNum !== dn) continue;
        if (!dn && h && s.heads && normHeads(s.heads) !== h) continue;
        return s;
    }
    return null;
}

// "11:45 AM" for a scheduled arrival time.
function fmtScheduleTime(ms) {
    return new Date(ms).toLocaleTimeString("en-us", { hour: "numeric", minute: "2-digit" });
}

// Route details:  GET /Bus.svc/json/jRouteDetails?RouteID   (verified 2026-11:
// 200 from /Bus.svc, 404 from /NextBusService.svc; CORS *; jPredictions-style
// api_key auth). Returns { RouteID, Name, Direction0, Direction1 } where each
// DirectionN is a single object { TripHeadsign, DirectionText, DirectionNum,
// Shape: [{Lat, Lon, SeqNum}], Stops: [{StopID, Name, Lon, Lat, Routes[]}] }
// (arrays are accepted defensively). Each direction normalizes to a PATTERN —
// the ordered path the board draws — { route, dirNum, heads, dirText,
// stops: [{id, name, lat, lon}], shape: [{lat, lon}], byId }.
// Cached per route for the page load; concurrent callers share one in-flight
// fetch. Failures return null (never throw) so the board can fall back to a
// compact "Route details unavailable" row, and they retry on the next call.
const routeDetailsCache = {};      // routeId -> normalized route or null
const routeDetailsInflight = {};   // routeId -> in-flight promise

function normalizeRouteDetails(routeId, raw) {
    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;
    const route = String(raw.RouteID || routeId || "").toUpperCase();
    const dirs = [];
    [raw.Direction0, raw.Direction1].forEach((d, i) => {
        (Array.isArray(d) ? d : (d && typeof d === "object" ? [d] : [])).forEach((dd) => {
            if (!dd || typeof dd !== "object") return;
            const stops = [];
            const seenS = new Set();
            (Array.isArray(dd.Stops) ? dd.Stops : []).forEach((s) => {
                if (!s || !s.StopID) return;
                const k = String(s.StopID);
                if (seenS.has(k)) return;          // keep the FIRST occurrence (pattern order)
                seenS.add(k);
                stops.push({ id: k, name: String(s.Name || "") || allStopsName(k),
                             lat: Number(s.Lat), lon: Number(s.Lon) });
            });
            if (!stops.length) return;
            const shape = (Array.isArray(dd.Shape) ? dd.Shape : [])
                .filter(s => s && Number.isFinite(Number(s.Lat)) && Number.isFinite(Number(s.Lon)))
                .sort((a, b) => (Number(a.SeqNum) || 0) - (Number(b.SeqNum) || 0));
            const pts = [], seenP = new Set();
            shape.forEach(pt => {
                const k = pt.Lat + "|" + pt.Lon;
                if (seenP.has(k)) return;
                seenP.add(k);
                pts.push({ lat: Number(pt.Lat), lon: Number(pt.Lon) });
            });
            dirs.push({ route,
                         dirNum: dd.DirectionNum != null ? String(dd.DirectionNum) : String(i),
                         heads: String(dd.TripHeadsign || "").trim(),
                         dirText: String(dd.DirectionText || "").trim(),
                         stops, shape: pts,
                         byId: Object.fromEntries(stops.map(s => [s.id, s])) });
        });
    });
    const seenD = new Set();
    const out = [];
    dirs.forEach(d => {
        if (!d.dirNum || seenD.has(d.dirNum)) return;
        seenD.add(d.dirNum);
        out.push(d);
    });
    if (!out.length) return null;
    return { route, name: String(raw.Name || "").trim(), directions: out };
}

async function fetchRouteDetails(routeId) {
    if (isBoston()) return null;   // MBTA profiles do not expose WMATA-style patterns
    routeId = String(routeId || "").toUpperCase();
    if (!routeId) return null;
    if (routeDetailsCache[routeId] !== undefined) return routeDetailsCache[routeId];
    if (routeDetailsInflight[routeId]) return routeDetailsInflight[routeId];
    routeDetailsInflight[routeId] = (async () => {
        try {
            const { data, error } = await apiGet("/Bus.svc/json/jRouteDetails", { RouteID: routeId });
            if (error) return null;
            const out = normalizeRouteDetails(routeId, data);
            if (out) routeDetailsCache[routeId] = out;
            return out;
        } finally {
            delete routeDetailsInflight[routeId];
        }
    })();
    return routeDetailsInflight[routeId];
}

// parseFeedTime: the position feed's DateTime is timezone-less ET and comes in
// two shapes — with seconds (2026-11-10T22:26:14) and, in older captures,
// without (2026-11-10T22:26). Retained for the pure position-matching tests;
// the live jBusPositions call was removed because vehicle markers are gone.
function parseFeedTime(s) {
    if (typeof s !== "string" || !s) return NaN;
    const t = Date.parse(s);
    if (Number.isFinite(t)) return t;
    return Date.parse(s.replace(/:([0-9]{2})$/, ":$1:00"));
}

// Prediction → pattern matching (plan §1).
// The prediction's DirectionText ("North to Van Ness") matches NEITHER the
// route-details DirectionText (NORTH/SOUTH) NOR the TripHeadsign (MT
// PLEASANT / LAFAYETTE SQ), so the match keys, in order, are:
//   1. the prediction's own DirectionNum (string "0"/"1");
//   2. the authoritative fallback — a live position row observed on the same
//      trip (or the same vehicle+route when the prediction has no trip)
//      supplies a DirectionNum;
//   3. a UNIQUE normalized headsign match (case and punctuation folded).
// The result is one PATTERN (one direction of a route); the caller then
// requires the pattern to CONTAIN the boarding anchor — a prediction whose
// route details don't serve the selected stop becomes a compact "Route
// details unavailable" row (plan §1), and an unresolved variant keeps its
// own ETA row rather than borrowing another pattern's geometry.
function normHeads(s) {
    return String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function posDirFor(pred, posRows) {
    if (!Array.isArray(posRows)) return "";
    for (const r of posRows) {
        if (!r || r.route !== pred.route) continue;
        const tripHit = pred.trip && r.trip && r.trip === pred.trip;
        const vehHit = !pred.trip && pred.vehicle && r.vehicle && r.vehicle === pred.vehicle;
        if (tripHit || vehHit) return r.dirNum;
    }
    return "";
}

function matchPattern(routeDetails, pred, posRows) {
    if (!routeDetails || !Array.isArray(routeDetails.directions) || !pred || !pred.route) return null;
    const dirs = routeDetails.directions;
    if (pred.dirNum) {
        const hit = dirs.find(d => d.dirNum === pred.dirNum);   // dirNum is unique per normalized route
        if (hit) return hit;
    }
    const dirNum = posDirFor(pred, posRows);
    if (dirNum) {
        const hit = dirs.find(d => d.dirNum === dirNum);
        if (hit) return hit;
    }
    const h = normHeads(pred.heads || pred.dir);
    if (h) {
        const hits = dirs.filter(d => normHeads(d.heads) === h);
        if (hits.length === 1) return hits[0];
    }
    return null;
}

// Board model (plan §2): turn the anchor stop's predictions into rows.
// One row per route + direction + destination (headsign) variant boarding
// at the anchor stop. A row becomes a "track" only when its matched pattern
// CONTAINS the anchor stop; otherwise it stays a compact "Route details
// unavailable" row (the pattern matched but doesn't board here, or no route
// details exist). Directions whose pattern contains the anchor but has no
// current prediction get a service row (route + direction + destination, no
// ETAs, no dots). Pure; the renderer decides how each kind is drawn.
function containsStopId(pattern, stopId) {
    if (!pattern || !stopId) return false;
    const sid = String(stopId);
    if (pattern.byId && pattern.byId[sid]) return true;
    return (pattern.stops || []).some(s => s.id === sid);
}

function buildBoardRows(anchorId, predictions, routeDetails, posRows) {
    const anchor = String(anchorId || "");
    const compactNote = (typeof city !== "undefined" && city === "boston")
        ? "" : "route details unavailable";
    const rows = [];
    const variants = new Map();
    for (const p of predictions || []) {
        if (!p) continue;
        const dirNum = p.dirNum == null || p.dirNum === "" ? null : String(p.dirNum);
        const key = p.route + "|" + (dirNum == null ? "?" : dirNum) + "|" + (p.heads || "");
        let v = variants.get(key);
        if (!v) {
            v = { route: p.route, dirNum, heads: p.heads || "", mins: [], vehicles: [], preds: [],
                  rep: { route: p.route, dirNum, heads: p.heads || "",
                         trip: p.trip || "", vehicle: p.vehicle || "" } };
            variants.set(key, v);
            rows.push(v);
        }
        v.mins.push(p.min);
        v.preds.push(p);
        if (p.vehicle) v.vehicles.push(p.vehicle);
    }
    const covered = new Set(), ambiguous = new Set(), liveHeads = {};
    for (const p of predictions || []) {
        if (!p) continue;
        const dn = p.dirNum == null || p.dirNum === "" ? "?" : String(p.dirNum);
        covered.add(p.route + "|" + dn);
        if (dn === "?") ambiguous.add(p.route);
        const h = normHeads(p.heads || p.dir);
        if (h) (liveHeads[p.route] || (liveHeads[p.route] = [])).push(h);
    }
    for (const v of rows) {
        v.mins.sort((a, b) => a - b);
        v.first = v.mins.length ? v.mins[0] : 0;
        v.vehicles = [...new Set(v.vehicles)];
        v.pattern = matchPattern((routeDetails || {})[v.route] || null, v.rep, posRows);
        if (v.dirNum == null && v.pattern && v.pattern.dirNum) v.dirNum = v.pattern.dirNum;
        if (v.pattern && containsStopId(v.pattern, anchor)) {
            v.kind = "track";
            v.anchorIdx = v.pattern.stops.findIndex(s => s.id === anchor);
            v.anchorPatStop = v.pattern.stops[v.anchorIdx] || null;
            v.dest = v.heads || v.pattern.heads || "";   // live label wins over the plan
        } else if (v.pattern) {
            v.kind = "compact";
            v.note = compactNote;   // matched a pattern, but it doesn't board here
            v.dest = v.heads || v.pattern.heads || "";
        } else {
            v.kind = "compact";
            v.note = compactNote;
            v.dest = v.heads || v.dir || "";
        }
    }
    for (const route of Object.keys(routeDetails || {}).sort()) {
        const entry = routeDetails[route];
        if (!entry || ambiguous.has(route)) continue;
        for (const d of entry.directions) {
            if (covered.has(route + "|" + d.dirNum)) continue;
            if (!containsStopId(d, anchor)) continue;
            // Do not add a scheduled "not seen" row when a live prediction
            // already carries the same route + headsign (direction variants
            // and missing DirectionNum can otherwise duplicate the bus).
            const sh = normHeads(d.heads);
            if (sh && (liveHeads[route] || []).some(h => h === sh || h.includes(sh) || sh.includes(h)))
                continue;
            const idx = d.stops.findIndex(s => s.id === anchor);
            rows.push({ kind: "service", route, dirNum: d.dirNum,
                        heads: d.heads, dest: d.heads || d.dirText || "",
                        mins: [], vehicles: [], pattern: d,
                        anchorIdx: idx, anchorPatStop: d.stops[idx] || null });
        }
    }
    // Post-filter: any service row that duplicates a live row (same route plus
    // same direction, or a compatible headsign) is removed. This catches
    // direction-variant/missing-DirectionNum cases the covered-set missed.
    const liveRows = rows.filter(r => r.mins && r.mins.length);
    for (let i = rows.length - 1; i >= 0; i--) {
        const r = rows[i];
        if (r.kind !== "service") continue;
        const sh = normHeads(r.heads || r.dest);
        const dup = liveRows.some(l => {
            if (l === r || l.route !== r.route) return false;
            if (l.dirNum != null && r.dirNum != null &&
                String(l.dirNum) === String(r.dirNum)) return true;
            const lh = normHeads(l.heads || l.dest);
            return !!(sh && lh && (lh.includes(sh) || sh.includes(lh)));
        });
        if (dup) rows.splice(i, 1);
    }
    const rank = { track: 0, compact: 1, service: 2 };
    // Buses with live ETAs sort by departure time (soonest first); rows with
    // no prediction (service/scheduled fallback) follow them.
    rows.sort((a, b) => {
        const am = a.mins && a.mins.length, bm = b.mins && b.mins.length;
        if (am && !bm) return -1;
        if (!am && bm) return 1;
        if (am && bm) return a.first - b.first
            || a.route.localeCompare(b.route)
            || String(a.dirNum).localeCompare(String(b.dirNum));
        return rank[a.kind] - rank[b.kind]
            || a.route.localeCompare(b.route)
            || String(a.dirNum).localeCompare(String(b.dirNum));
    });
    return rows;
}

// ---- across-the-street resolver (plan §2.2) -----------------------------
// Finds at most ONE opposite-side stop the board may present in its own
// "Across the street" section. A nearby candidate is accepted only when ALL
// hold:
//   * within ACROSS_MAX_FT (~100 m) of the boarding anchor;
//   * its name matches the anchor's street/intersection (≥1 shared street
//     token, and each name's extra tokens contained in the other's — this
//     rejects successive stops along the same street, which carry a different
//     cross-street);
//   * at least one route is shared between the anchor's patterns and the
//     candidate's patterns (patterns = route-details directions);
//   * the two stops are not listed in the SAME pattern (same-direction bays
//     and consecutive stops on one side of a corridor);
//   * the ordered paths give opposing travel bearings at the two stops (≥
//     ACROSS_OPPOSE_DEG difference on a shared route).
// Anything short of exactly one accepted candidate is ambiguous: the caller
// keeps the primary board and lets riders pick the other stop via the lookup.
// `patterns` maps stopId → [route-details direction entries that list it].
const ACROSS_MAX_FT = 330;        // ~100 m
const ACROSS_OPPOSE_DEG = 120;    // local bearings must differ by at least this

// The board's default anchor when a ?busstop= deep link names no stop: the
// first corner of the 20010 intersection (C87 / D72). runFlow() uses it to
// keep the picture useful for a bare /mta26.html or an empty ?busstop=.
const DEFAULT_STOP_ID = "1002135";

// The default anchor as a jStops-shaped record. Coordinates come from the
// stop directory once it has loaded — until then the stop is nameless and
// unlocatable, exactly like any other URL-listed stop.
function defaultStopRec() {
    const id = String(DEFAULT_STOP_ID);
    const dir = allStopsCache && allStopsCache.find(s => String(s.StopID) === id);
    return makeStop(id, dir ? (dir.Name || null) : null,
                     dir ? dir.Lat : null, dir ? dir.Lon : null);
}

function streetTokens(name) {
    const out = new Set();
    for (let part of String(name || "").split(/&|\band\b|\+/i)) {
        let t = part.toUpperCase().replace(/[^A-Z0-9 ]/g, " ");
        t = t.replace(/\b(NORTHWEST|NORTHEAST|SOUTHWEST|SOUTHEAST|NORTH|SOUTH|EAST|WEST|NW|NE|SW|SE|N|S|E|W)\b/g, " ");
        t = t.replace(/\b(STREET|ST|AVENUE|AVE|BLVD|DRIVE|DR|PLAZA|PL|ROAD|RD|LANE|LN|COURT|CT|SQUARE|SQ|CIRCLE|CIR)\b/g, " ");
        for (const w of t.split(/\s+/)) if (w) out.add(w);
    }
    return out;
}

function namesMatch(a, b) {
    const A = streetTokens(a), B = streetTokens(b);
    if (!A.size || !B.size) return false;
    let shared = 0;
    for (const t of A) if (B.has(t)) shared++;
    if (!shared) return false;
    const onlyA = [...A].filter(t => !B.has(t));
    const onlyB = [...B].filter(t => !A.has(t));
    return onlyA.every(t => onlyB.includes(t)) || onlyB.every(t => onlyA.includes(t));
}

function bearing(a, b) {
    if (!a || !b || !Number.isFinite(a.lat) || !Number.isFinite(a.lon) ||
        !Number.isFinite(b.lat) || !Number.isFinite(b.lon)) return null;
    if (a.lat === b.lat && a.lon === b.lon) return null;
    const dLon = (b.lon - a.lon) * Math.cos(a.lat * Math.PI / 180);
    return (Math.atan2(dLon, b.lat - a.lat) * 180 / Math.PI + 360) % 360;
}

function angleDiffDeg(x, y) {
    const d = Math.abs(x - y) % 360;
    return d > 180 ? 360 - d : d;
}

// Local direction of travel through one stop occurrence in a pattern
// (pattern stop order is travel order): toward the next occurrence, else
// arriving from the previous. null when the occurrence has no neighbor.
function localBearing(pattern, stopId) {
    const stops = (pattern && pattern.stops) || [];
    const i = stops.findIndex(s => s.id === String(stopId));
    if (i < 0) return null;
    const next = stops[i + 1], prev = stops[i - 1];
    return next ? bearing(stops[i], next) : (prev ? bearing(prev, stops[i]) : null);
}

function acrossTheStreet(anchor, candidates, patterns) {
    if (!anchor || anchor.lat == null || anchor.lon == null) return null;
    const aId = String(anchor.id || "");
    const pA = (patterns || {})[aId] || [];
    if (!pA.length) return null;   // no ordered path boards the anchor
    const accepted = [];
    for (const c of candidates || []) {
        const cId = String((c && c.id) || "");
        if (!c || !cId || cId === aId) continue;
        if (distance(anchor.lat, anchor.lon, c.lat, c.lon, "f") > ACROSS_MAX_FT) continue;
        if (!namesMatch(anchor.name, c.name)) continue;
        const pC = (patterns || {})[cId] || [];
        if (!pC.length) continue;   // no ordered path boards the candidate
        // Same pattern on both sides = same-direction bay / successive stops.
        if (pA.some(pa => pC.some(pc => pc.route === pa.route && pc.dirNum === pa.dirNum))) continue;
        // Opposing travel bearings, on a shared route, at the two stops.
        let opposed = false;
        for (const pa of pA) {
            const x = localBearing(pa, aId);
            if (x == null) continue;
            for (const pc of pC) {
                if (pc.route !== pa.route) continue;
                const y = localBearing(pc, cId);
                if (y != null && angleDiffDeg(x, y) >= ACROSS_OPPOSE_DEG) { opposed = true; break; }
            }
            if (opposed) break;
        }
        if (!opposed) continue;
        accepted.push(c);
    }
    return accepted.length === 1 ? accepted[0] : null;
}

// The one confirmed opposite-side stop (plan §2.2), if the data supports
// exactly one. Reset on every selection change; its predictions ride along
// in refreshPredictions' deduped set, and its rows join the nearby list as
// its first entry, labeled "Across the street".
let acrossStop = null;

// Every selection change (a new search, a shortcut, a new or cleared
// entry-field pick) voids the confirmed counterpart and any in-flight
// refresh's right to render: the new selection's own refresh wins (plan §4).
let selectionVersion = 0;
function noteSelectionChange() {
    selectionVersion++;
    acrossStop = null;
    expandedStops.clear();       // a new stop starts with every list collapsed
    boardUserScrolled = false;   // piece 12: a new board re-claims centering
    boardAuto = { at: 0, left: null };
}

// The normalized seam (plan §4): jStops-shaped records — StopID/Name/Lat/Lon,
// what the nearby list and the directory carry — into the {id, name, lat,
// lon} records acrossTheStreet consumes.
function stopRec(s) {
    return { id: String(s.StopID), name: s.Name || allStopsName(s.StopID),
             lat: s.Lat, lon: s.Lon, routes: s.Routes || [], distFt: null };
}

// A nearby stop's live arrivals: the picked object (in-entry-field pick), else
// its list record (a nearby search carries every stop in range), else none.
// The board's per-stop heading uses this for its ETA summary; the section
// rows use the same source so the heading never disagrees with the board.
function nearbyArrivalsFor(stp) {
    const id = String(stp.StopID);
    if (pickedStopObj && String(pickedStopObj.StopID) === id) return pickedStopObj.Arrivals || [];
    return ((shownStops().find(s => String(s.StopID) === id) || { Arrivals: [] }).Arrivals) || [];
}

// Opposite-side candidates: the nearby results when they contain the anchor
// (a fresh, radius-bounded set); otherwise the cached directory filtered to
// ACROSS_MAX_FT around it. A ?busstop= deep link is not a nearby search —
// its `stops` is a URL list without coordinates, so the directory is the
// coord source there (no dedicated endpoint, plan §2.2).
function acrossCandidates(st) {
    if (!st || st.Lat == null || st.Lon == null) return [];
    const aId = String(st.StopID);
    const pool = !stopListFromURL && stops.some(s => String(s.StopID) === aId)
        ? stops
        : (allStopsCache || []).filter(s =>
            s.Lat != null && s.Lon != null &&
            distance(st.Lat, st.Lon, s.Lat, s.Lon, "f") <= ACROSS_MAX_FT);
    return pool.filter(s => String(s.StopID) !== aId).map(stopRec);
}

// stopId → the route-details direction entries that list it, over the
// patterns the board currently knows (the loaded jRouteDetails cache).
function patternsByStop(have) {
    const m = {};
    for (const r in have) {
        const e = have[r];
        if (!e) continue;
        for (const d of e.directions || [])
            for (const s of d.stops || [])
                (m[s.id] || (m[s.id] = [])).push(d);
    }
    return m;
}

// Confirm at most one opposite-side stop for the anchor. The result sticks
// until the selection changes (noteSelectionChange resets it). A fresh
// confirmation prompts the counterpart's first prediction fetch (plan §4),
// so its rows get live ETAs on the very next board paint.
function confirmAcross(st, have) {
    if (acrossStop) return acrossStop;
    const cands = acrossCandidates(st);
    if (!cands.length) return null;
    const hit = acrossTheStreet(stopRec(st), cands, patternsByStop(have));
    if (!hit) return null;
    const id = String(hit.id);
    // Share the same object as the nearby section so its predictions cannot
    // land on a different object and go stale/duplicated.
    acrossStop = nearbyStopObj({ id, name: hit.name, lat: hit.lat, lon: hit.lon,
                                 routes: hit.routes });
    nearbyStopObjs.set(id, acrossStop);
    acrossStop.Routes = hit.routes;
    refreshPredictions();               // the counterpart's first predictions, promptly
    return acrossStop;
}

// Nearby stops within 500 ft of the anchor (the board's third section):
// everything in the coord source but the anchor itself, nearest first. The
// nearby-search pool already carries Distance; the directory pool does not,
// so compute it there (feet, via distance()).
const NEARBY_MAX_FT = 1000;
function nearbyStops(st) {
    if (!st || st.Lat == null || st.Lon == null) return [];
    const aId = String(st.StopID);
    let pool;
    if (!stopListFromURL && stops.some(s => String(s.StopID) === aId)) {
        pool = stops.filter(s => String(s.StopID) !== aId).map(stopRec);
        for (const r of pool) {
            const t = stops.find(s => String(s.StopID) === r.id);
            r.distFt = t ? (typeof t.Distance === "number" ? t.Distance : 0)
                         : distance(st.Lat, st.Lon, r.lat, r.lon, "f");
        }
    } else {
        pool = (allStopsCache || []).filter(s =>
            s.Lat != null && s.Lon != null && String(s.StopID) !== aId)
             .map(stopRec)
             .map(r => Object.assign(r, { distFt: distance(st.Lat, st.Lon, r.lat, r.lon, "f") }));
    }
    return pool.filter(r => r.distFt <= NEARBY_MAX_FT)
               .sort((a, b) => a.distFt - b.distFt || a.name.localeCompare(b.name));
}

// ── Board geometry (plan §3) ──────────────────────────────────────────
// Schematic signed along-route distance from the boarding occurrence:
// stops the bus passes before the anchor sit LEFT of the shared boarding x
// (the approach), the terminal RIGHT, and every row of both curb sections
// shares ONE pixels-per-foot scale, so the boarding guides line up.
// Distance is the cumulative arc along the published shape when the stops'
// projections follow the published stop order; otherwise the straight-line
// distance between consecutive ordered stops (plan §3, first bullet).

const BOARD_MAX_SIDE_PX = 280;      // the board's longest path scales to this
const BOARD_MIN_EXTENT_FT = 3000;   // short/terminal-only routes: scale floor
const BOARD_MIN_EXTENT_PX = 120;    // …and the baseline extends at least this far each side
const LAT_FT_PER_DEG = 364000;      // feet per degree of latitude (local projection)

// Flat feet-space around a reference point — good enough for projection.
function localXY(pt, ref) {
    const kx = LAT_FT_PER_DEG * Math.cos(ref.lat * Math.PI / 180);
    return { x: (pt.lon - ref.lon) * kx, y: (pt.lat - ref.lat) * LAT_FT_PER_DEG };
}

// Arc position (ft along the shape polyline) of the nearest point on the
// shape to a stop; null when the shape is empty/too short.
function projArcOnShape(stop, shape, cum, ref) {
    if (shape.length < 2 || stop.lat == null || stop.lon == null) return null;
    const p = localXY(stop, ref);
    let best = null;
    for (let i = 1; i < shape.length; i++) {
        const a = localXY(shape[i - 1], ref), b = localXY(shape[i], ref);
        const dx = b.x - a.x, dy = b.y - a.y;
        const L2 = dx * dx + dy * dy;
        let t = L2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2 : 0;
        t = Math.max(0, Math.min(1, t));
        const qx = a.x + t * dx, qy = a.y + t * dy;
        const d2 = (qx - p.x) * (qx - p.x) + (qy - p.y) * (qy - p.y);
        if (!best || d2 < best.d2) best = { d2, arc: cum[i - 1] + t * (cum[i] - cum[i - 1]) };
    }
    return best ? best.arc : null;
}

// Cumulative distance (ft) to each stop occurrence of one pattern.
// mode "shape" = projected onto the published shape — accepted only when the
// projections follow the published stop order (50 ft tolerance); otherwise
// mode "stops" = accumulated straight-line legs between consecutive stops.
function trackArcs(pattern) {
    const stops = (pattern && pattern.stops) || [];
    if (!stops.length) return { arc: [], mode: "none" };
    const shape = (pattern && pattern.shape) || [];
    if (shape.length >= 2) {
        const ref = shape[0];
        const cum = [0];
        for (let i = 1; i < shape.length; i++)
            cum.push(cum[i - 1] + distance(shape[i - 1].lat, shape[i - 1].lon, shape[i].lat, shape[i].lon, "f"));
        const proj = stops.map(s => projArcOnShape(s, shape, cum, ref));
        if (proj.every(v => v != null)) {
            let mono = true;
            for (let i = 1; i < proj.length; i++)
                if (proj[i] < proj[i - 1] - 50) { mono = false; break; }
            if (mono) return { arc: proj, mode: "shape" };
        }
    }
    const arc = [0];
    for (let i = 1; i < stops.length; i++) {
        const leg = stops[i - 1].lat != null && stops[i].lat != null
            ? distance(stops[i - 1].lat, stops[i - 1].lon, stops[i].lat, stops[i].lon, "f") : 0;
        arc.push(arc[i - 1] + leg);
    }
    return { arc, mode: "stops" };
}

// One row's layout in feet: signed distance from the anchor occurrence to
// every stop occurrence, the extent on each side, and the terminal
// occurrence (the pattern's last stop).
function rowLayout(pattern, anchorIdx) {
    const { arc, mode } = trackArcs(pattern);
    const a = arc[anchorIdx] || 0;
    const signed = arc.map(v => v - a);
    let negFt = 0, posFt = 0;
    for (const v of signed) { if (v < 0) negFt = Math.max(negFt, -v); else posFt = Math.max(posFt, v); }
    return { mode, signed, negFt, posFt, termIdx: signed.length - 1 };
}

// One scale for the whole board: the longest path across all rows (both
// curb sections) maps to BOARD_MAX_SIDE_PX; a floor keeps short routes from
// collapsing to a dot.
function boardScale(layouts) {
    let maxFt = 0;
    for (const l of layouts || []) if (l) maxFt = Math.max(maxFt, l.negFt, l.posFt);
