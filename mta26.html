function applyBusRouteDirectory(list) {
    busRouteDirectory = list;
    busRouteDirectoryAt = Date.now();
    busRouteMbtaIds = {};
    busRouteColors = {};
    for (const r of list || []) {
        if (!r || !r.id) continue;
        if (r.mbtaId) busRouteMbtaIds[r.id] = r.mbtaId;
        if (r.color) busRouteColors[r.id] = r.color;
    }
    if (list && list.length) writeCache("busroutes", list);
    return list;
}

function fetchBusRouteDirectoryFresh() {
    if (busRouteLoad) return busRouteLoad;
    busRouteLoad = Promise.resolve(cityProvider().busRouteDirectory())
        .then(list => applyBusRouteDirectory(list))
        .catch(() => {
            // Offline fallback: derive what the stop directory already knows.
            const m = new Map();
            for (const s of allStopsCache || [])
                for (const r of s.Routes || []) {
                    const id = String(r || "").toUpperCase();
                    if (id && !m.has(id)) m.set(id, { id, name: id, desc: "" });
                }
            return applyBusRouteDirectory([...m.values()]
                .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true })));
        })
        .finally(() => { busRouteLoad = null; });
    return busRouteLoad;
}

function loadBusRouteDirectory() {
    if (busRouteDirectory) {
        if (Date.now() - busRouteDirectoryAt > TOPOLOGY_TTL_MS)
            fetchBusRouteDirectoryFresh().catch(() => {});
        return Promise.resolve(busRouteDirectory);
    }
    return fetchBusRouteDirectoryFresh();
}

// Bus stop-name filter: at 3+ characters, routes are expanded to just the
// stops whose names match. The directory loads lazily; the caller re-renders
// when it lands.
function stopsByRouteForQuery(q) {
    if (!q || q.length < 3 || !allStopsCache) return null;
    const by = new Map();
    for (const s of allStopsCache) {
        if (!String(s.Name || "").toLowerCase().includes(q)) continue;
        for (const r of s.Routes || []) {
            const id = String(r).toUpperCase();
            if (!id) continue;
            if (!by.has(id)) by.set(id, new Map());
            by.get(id).set(String(s.StopID), s);
        }
    }
    const out = new Map();
    for (const [id, stops] of by) {
        out.set(id, [...stops.values()].sort((a, b) =>
            String(a.Name || "").localeCompare(String(b.Name || ""))));
    }
    return out;
}

function favBusStopRow(s, route) {

}

// Connecting bus routes / metro lines at a stop, cached per page load.
const CROSS_CONNECTION_FT = 500;
const stopConnections = new Map();
const stopConnectionsAt = new Map();
const stopConnectionsInflight = new Map();
{
    const cached = readCache("connections");
    if (cached && Array.isArray(cached.v)) {
        for (const row of cached.v) {
            if (!Array.isArray(row) || row.length < 2) continue;
            const key = String(row[0] || "");
            const rec = row[1] || {};
            if (!key || !rec.v) continue;
            stopConnections.set(key, rec.v);
            stopConnectionsAt.set(key, Number(rec.at) || cached.at || 0);
        }
    }
}

function persistConnections() {
    const rows = [];
    for (const [key, value] of stopConnections) {
        if (!value) continue;
        rows.push([key, { at: stopConnectionsAt.get(key) || 0, v: value }]);
    }
    writeCache("connections", rows);
}

async function buildStopConnections(kind, id) {
    return cityProvider().connections(kind, id);
}

async function refreshStopConnections(kind, id) {
    const key = kind + ":" + String(id);
    if (stopConnectionsInflight.has(key)) return stopConnectionsInflight.get(key);
    const job = buildStopConnections(kind, id)
        .then(out => {
            // Don't cache an empty directory-backed result before it loads.
            const ready = typeof cityProvider().connectionsReady === "function"
                ? cityProvider().connectionsReady(kind) : true;
            if (ready) {
                stopConnections.set(key, out);
                stopConnectionsAt.set(key, Date.now());
                persistConnections();
            }
            return out;
        })
        .catch(() => ({ bus: [], metro: [] }))
        .finally(() => { stopConnectionsInflight.delete(key); });
    stopConnectionsInflight.set(key, job);
    return job;
}

async function fetchStopConnections(kind, id) {
    const key = kind + ":" + String(id);
    const hit = stopConnections.get(key);
    if (hit) {
        if (Date.now() - (stopConnectionsAt.get(key) || 0) > CONNECTION_TTL_MS)
            refreshStopConnections(kind, id).catch(() => {});
        return hit;
    }
    return refreshStopConnections(kind, id);
}

function connBadgeHtml(kind, route, place) {
    const r = String(route || "");
    const metro = kind === "metro";
    const label = metro ? metroLineName(r) : r;
    const color = metro ? metroLineColor(r) : routeColor(r);
    const text = metro ? "#fff" : busTextColor(r);
    const where = place && place.name ? ` at ${place.name}` : " on this board";
    const title = `Go to ${label}${where}`;
    return `<button type="button" class="fav-badge conn-badge${metro ? " line" : busBadgeClass()}"`
        + ` data-conn-kind="${metro ? "metro" : "bus"}" data-conn-route="${esc(r)}"`
        + (place && place.stopId
            ? ` data-conn-stop="${esc(place.stopId)}" data-conn-name="${esc(place.name || "")}"` : "")
        + ` title="${esc(title)}" aria-label="${esc(title)}"`
        + ` style="background:${color};color:${text}">${esc(label)}</button>`;
}

function connectionBadgesHtml(conns, kind, route) {
    if (!conns) return "";
    const places = conns.places || {};
    const placeFor = (k, r) => places[k + ":" + String(r || "").toUpperCase()] || null;
    const skip = route ? String(route).toUpperCase() : "";
    const bus = (conns.bus || [])
        .filter(r => !(kind === "bus" && skip && String(r).toUpperCase() === skip))
        .map(r => connBadgeHtml("bus", r, placeFor("bus", r)));
    const metro = (conns.metro || [])
        .filter(l => !(kind === "metro" && skip && String(l).toUpperCase() === skip))
        .map(l => connBadgeHtml("metro", l, placeFor("metro", l)));
    return [...bus, ...metro].join(" ");
}

// A connection badge names a route/line at a place. Navigate to that place
// when it is not the current board, then bring the matching row into view.
let pendingFocus = null;
let pendingFocusTimer = null;

function clearPendingFocus() {
    pendingFocus = null;
    if (pendingFocusTimer) {
        clearTimeout(pendingFocusTimer);
        pendingFocusTimer = null;
    }
}

function requestRouteFocus(route, kind) {
    pendingFocus = { route: String(route || ""), kind: kind === "metro" ? "metro" : "bus" };
    if (pendingFocusTimer) clearTimeout(pendingFocusTimer);
    pendingFocusTimer = setTimeout(clearPendingFocus, 8000);
    applyPendingFocus();
}

function applyPendingFocus() {
    if (!pendingFocus) return false;
    if ((mode === "metro") !== (pendingFocus.kind === "metro")) return false;
    const want = pendingFocus.route.toLowerCase();
    const rows = gLinesScroll ? gLinesScroll.querySelectorAll(".board-row[data-row-route]") : [];
    let hit = null;
    for (const el of rows) {
        const route = String((el.dataset && el.dataset.rowRoute) || "").toLowerCase();
        if (route === want) { hit = el; break; }
    }
    if (!hit) return false;
    clearPendingFocus();
    hit.classList.add("row-focus");
    if (typeof hit.scrollIntoView === "function") {
        try {
            hit.scrollIntoView({ block: "center",
                behavior: REDUCE_MOTION.matches ? "auto" : "smooth" });
        } catch (e) { /* no scrolling in tests */ }
    }
    setTimeout(() => { if (hit.classList) hit.classList.remove("row-focus"); }, 2400);
    return true;
}

async function navigateToConnection(el) {
    const ds = (el && el.dataset) || {};
    const kind = ds.connKind === "metro" ? "metro" : "bus";
    const route = ds.connRoute || "";
    if (!route) return;
    const stopId = ds.connStop || "";
    const current = kind === "metro"
        ? (metroAnchor && String(metroAnchor.Code || ""))
        : (anchorStop() && String(anchorStop().StopID || ""));
    if (stopId && stopId !== current) {
        if (kind === "metro") {
            if (mode !== "metro") applyMode("metro");
            await loadMetroStations().catch(() => null);
            setMetroAnchor(stopId);
        } else {
            if (mode !== "bus") applyMode("bus");
            selectStop(stopId, true);
        }
    }
    requestRouteFocus(route, kind);
}

function handleConnectionClick(e) {
    const badge = e.target && e.target.closest ? e.target.closest(".conn-badge") : null;
    if (!badge) return;
    e.preventDefault();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    else e.stopPropagation();
    navigateToConnection(badge);
}

gBoardHeader.addEventListener("click", handleConnectionClick, true);
gLinesScroll.addEventListener("click", handleConnectionClick, true);

async function loadStopConnections(rows) {
    const map = new Map();
    await Promise.all(rows.map(async s => {
        const id = String(s.StopID || s.id || "");
        if (!id) return;
        map.set(id, await fetchStopConnections(s.kind || "bus", id));
    }));
    return map;
}

function applyStopNameWidth(root) {
    if (!root) return;
    const names = [...root.querySelectorAll(".fav-stop-name, .bt-stop-name")];
    if (!names.length) return;
    const ctx = applyStopNameWidth._ctx ||
        (applyStopNameWidth._ctx = document.createElement("canvas").getContext("2d"));
    let max = 0;
    for (const el of names) {
        const s = getComputedStyle(el);
        ctx.font = `${s.fontWeight} ${s.fontSize} ${s.fontFamily}`;
        max = Math.max(max, ctx.measureText((el.textContent || "").trim()).width);
    }
    root.style.setProperty("--stop-name-width",
        Math.max(96, Math.ceil(max) + 10) + "px");
}

async function loadHeroRouteStops(btn) {
    const ds = btn.dataset || {};
    const route = ds.heroRoute || "";
    const anchor = ds.heroAnchor || "";
    if (typeof cityProvider().heroStops === "function") {
        const stops = await cityProvider().heroStops(ds);
        if (stops.length) return stops;
    }
    if (ds.heroKind === "metro") {
        if (!ds.heroTo) return [];
        const path = await fetchMetroPath(anchor, ds.heroTo, route);
        return path.map(p => ({ StopID: p.StationCode, Name: p.StationName }));
    }
    const details = await fetchRouteDetails(route);
    const dirs = (details && details.directions) || [];
    const heads = normHeads(ds.heroHeads || "");
    const dir = dirs.find(d => d.byId && d.byId[String(anchor)] && normHeads(d.heads) === heads)
        || dirs.find(d => d.byId && d.byId[String(anchor)])
        || dirs[0];
    return ((dir && dir.stops) || []).map(s => ({ StopID: s.id, Name: s.name }));
}

function heroRouteListHtml(stops, kind, route, anchor, connsMap) {
    if (!stops.length) return `<div class="fav-empty">no stops available</div>`;
    // Start after the selected stop; the current stop is not repeated.
    const at = stops.findIndex(s => String(s.StopID || s.id) === String(anchor));
    const list = at >= 0 ? stops.slice(at + 1) : stops;
    const anchorStopRow = at >= 0 ? stops[at] : null;
    const terminal = stops[stops.length - 1] || null;
    const label = at >= 0 ? `<span class="next-stops-label">Next stops…</span>` : "";
    const actions = routeActionsHtml(kind, route, anchor,
        (anchorStopRow && (anchorStopRow.Name || anchorStopRow.name)) || "",
        terminal ? (terminal.StopID || terminal.id) : "",
        terminal ? (terminal.Name || terminal.name) : "", label);
    if (!list.length) return actions + `<div class="fav-empty">no further stops</div>`;
    return actions + list.map(s => {
        const id = String(s.StopID || s.id || "");
        const name = s.Name || s.name || "";
        const conns = connsMap && connsMap.get(id);
        const badges = conns ? connectionBadgesHtml(conns, kind, route) : "";
        return `<div class="fav-stop">`
            + `${favStarHtml(kind, id, name, route)}`
            + `${favGotoHtml(kind, id, name, stopName(name) || "#" + id)}`
            + (badges ? `<span class="fav-conns">${badges}</span>` : "")
            + `</div>`;
    }).join("");
}

async function toggleHeroRouteStops(btn) {
    const card = btn.closest ? btn.closest(".hero-card") : null;
    const box = card && card.nextElementSibling;
    if (!box || !box.classList || !box.classList.contains("hero-route-stops")) return;
    const open = box.hidden;
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    if (!open) { box.hidden = true; return; }
    box.hidden = false;
    if (box.dataset.loaded) return;
    box.dataset.loaded = "1";
    box.innerHTML = `<div class="fav-empty">loading stops…</div>`;
    let stops = [];
    try { stops = await loadHeroRouteStops(btn); } catch (e) { stops = []; }
    const kind = btn.dataset.heroKind;
    const anchor = btn.dataset.heroAnchor;
    const at = stops.findIndex(s => String(s.StopID || s.id) === String(anchor));
    const shown = at >= 0 ? stops.slice(at) : stops;
    let conns = new Map();
    try {
        conns = await loadStopConnections(shown.map(s =>
            Object.assign({}, s, { kind })));
    } catch (e) { /* no badges */ }
    box.innerHTML = heroRouteListHtml(shown, kind, btn.dataset.heroRoute,
        anchor, conns);
    applyStopNameWidth(box);
}

let favBusFilterToken = 0;
let favBusDebounce = 0;

// Boston: routes are expanded from stop-name matches. MBTA has no cheap
// stop→routes index, so resolve the first 25 matching stops in parallel.
async function renderFavBusRoutesByStop(raw) {
    if (!gFavBusRoutes) return;
    const token = ++favBusFilterToken;
    const q = raw.toLowerCase();
    if (q && !allStopsCache) {
        loadStopDirectory()
            .then(() => {
                if (gFavBusFilter && gFavBusFilter.value.trim() === raw &&
                    !gFavBusRoutes.querySelector(".fav-stops:not([hidden])"))
                    renderFavBusRoutesByStop(raw);
            })
            .catch(() => {});
    }
    const byStop = new Map();
    if (q.length >= 3 && allStopsCache) {
        const matched = allStopsCache
            .filter(s => String(s.Name || "").toLowerCase().includes(q))
            .slice(0, 25);
        await Promise.all(matched.map(async s => {
            const { data } = await cityProvider().http("/routes", {
                "filter[stop]": s.StopID, "filter[type]": 3
            });
            for (const r of (data && data.data) || []) {
                const key = String(r.attributes.short_name || r.id).toUpperCase();
                if (!byStop.has(key)) byStop.set(key, new Map());
                byStop.get(key).set(s.StopID, {
                    StopID: s.StopID, Name: s.Name, Routes: [key]
                });
            }
        }));
    }
    if (token !== favBusFilterToken) return;
    const routes = (busRouteDirectory || []).filter(r => !q ||
        r.id.toLowerCase().includes(q) ||
        r.desc.toLowerCase().includes(q) ||
        r.name.toLowerCase().includes(q) ||
        byStop.has(r.id));
    gFavBusRoutes.innerHTML = routes.length ? routes.map(r => {
        const matches = byStop.has(r.id)
            ? [...byStop.get(r.id).values()]
                .sort((a, b) => String(a.Name || "").localeCompare(String(b.Name || "")))
            : [];
        const expanded = matches.length > 0;
        return `<button type="button" class="fav-route" data-fav-route="${esc(r.id)}" aria-expanded="${expanded ? "true" : "false"}">`
            + `<span class="fav-badge${busBadgeClass()}" style="background:${routeColor(r.id)};color:${busTextColor(r.id)}">${esc(r.id)}</span>`
            + `<span class="fav-desc">${esc(r.desc || "Bus route")}</span>`
            + `<i class="fa-solid fa-chevron-down bt-chevron" aria-hidden="true"></i></button>`
            + `<div class="fav-stops" data-fav-stops="bus" data-route="${esc(r.id)}"`
            + `${expanded ? ` data-loaded="1"` : " hidden"}>`
            + (expanded ? matches.map(s => favBusStopRow(s, r.id)).join("") : "")
            + `</div>`;
    }).join("") : `<div class="fav-empty">no matching bus routes</div>`;
    applyStopNameWidth(gFavBusRoutes);
}

async function renderFavBusRoutes(query) {
    if (!gFavBusRoutes) return;
    const raw = String(query || "").trim();
    const q = raw.toLowerCase();
    if (cityCfg().capabilities.routeSearchByStop) return renderFavBusRoutesByStop(raw);
    const token = ++favBusFilterToken;
    if (q && !allStopsCache && !cityCfg().capabilities.stopSearch) {
        loadStopDirectory()
            .then(() => {
                if (gFavBusFilter && gFavBusFilter.value.trim() === raw &&
                    !gFavBusRoutes.querySelector(".fav-stops:not([hidden])"))
                    renderFavBusRoutes(raw);
            })
            .catch(() => {});
    }
    let byStop = stopsByRouteForQuery(q);
    if (q.length >= 3 && typeof cityProvider().busRoutesForQuery === "function") {
        try { byStop = await cityProvider().busRoutesForQuery(q); }
        catch (e) { /* keep the local directory result */ }
    }
    if (token !== favBusFilterToken) return;
    const routes = (busRouteDirectory || []).filter(r => !q ||
        r.id.toLowerCase().includes(q) ||
        r.desc.toLowerCase().includes(q) ||
        r.name.toLowerCase().includes(q) ||
        !!(byStop && byStop.has(r.id)));
    gFavBusRoutes.innerHTML = routes.length ? routes.map(r => {
        const matches = byStop ? (byStop.get(r.id) || []) : [];
        const expanded = matches.length > 0;
        return `<button type="button" class="fav-route" data-fav-route="${esc(r.id)}" aria-expanded="${expanded ? "true" : "false"}">`
            + `<span class="fav-badge${busBadgeClass()}" style="background:${routeColor(r.id)};color:${busTextColor(r.id)}">${esc(r.id)}</span>`
            + `<span class="fav-desc">${esc(r.desc || "Bus route")}</span>`
            + `<i class="fa-solid fa-chevron-down bt-chevron" aria-hidden="true"></i></button>`
            + `<div class="fav-stops" data-fav-stops="bus" data-route="${esc(r.id)}"`
            + `${expanded ? ` data-loaded="1"` : " hidden"}>`
            + (expanded ? matches.map(s => favBusStopRow(s, r.id)).join("") : "")
            + `</div>`;
    }).join("") : `<div class="fav-empty">no matching bus routes</div>`;
    applyStopNameWidth(gFavBusRoutes);
}

// The master likes list is shared by both modes: bus likes first,
// then subway likes, each group sorted by name. Home and Work are
// separate special bookmarks and never appear here.
function favBadgeHtml(kind, route) {
    const r = String(route || "");
    if (kind === "metro") {

            + `${esc(r ? metroLineName(r) : "Metro")}</span>`;
    }
    return `<span class="fav-badge${busBadgeClass()}"`

function favRowHtml(f) {

function orderedLikes() {
    return likes.slice();
}

function renderLikes() {

// ── Main-panel bookmark list (Home / Work / Likes) ───────────────
function shortcutRoute(kind, id) {
    if (kind === "metro") {
        const st = (metroStationsCache || []).find(s => String(s.Code) === String(id));
        return st ? (st.Lines || [])[0] || "" : "";
    }
    const st = (allStopsCache || []).find(s => String(s.StopID) === String(id));
    return st ? (st.Routes || [])[0] || "" : "";
}

function bookmarkOrderStorageKey(slot) {
    return `mta_bookmark_order_${city}_${slot}`;
}

function readBookmarkOrder(slot) {
    try {
        if (typeof localStorage === "undefined") return [];
        const raw = localStorage.getItem(bookmarkOrderStorageKey(slot));
        const list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list.filter(k => typeof k === "string") : [];
    } catch (e) { return []; }
}

function writeBookmarkOrder(slot, keys) {
    try {
        if (typeof localStorage !== "undefined")
            localStorage.setItem(bookmarkOrderStorageKey(slot), JSON.stringify(keys));
    } catch (e) { /* ignore storage failures */ }
}

function orderedSlotEntries(slot) {
    const rows = allSlotEntries(slot);
    const order = readBookmarkOrder(slot);
    if (!order.length) return rows;
    const rank = new Map(order.map((k, i) => [k, i]));
    return rows.map((row, i) => ({ row, i }))
        .sort((a, b) => {
            const ak = bookmarkKey(a.row.kind, a.row.id);
            const bk = bookmarkKey(b.row.kind, b.row.id);
            return (rank.get(ak) ?? Infinity) - (rank.get(bk) ?? Infinity) ||
                a.i - b.i;
        })
        .map(x => x.row);
}

// Home/Work: that slot's bus stop and Metro station (both modes). Likes:
// the master list. Both preserve the user's drag order.
function bookmarkRows(slot) {
    if (slot === "fav") {
        return orderedLikes().map(f =>
            ({ kind: f.kind, id: String(f.id), name: f.name || "", route: f.route || "" }));
    }
    return orderedSlotEntries(slot).map(e => ({
        kind: e.kind, id: e.id, name: e.name || "",
        route: e.route || shortcutRoute(e.kind, e.id)
    }));
}

function nextArrivalHtml(kind, next) {
    if (!next) return `<span class="text-muted">no arrival or departure</span>`;
    refreshEtaMinutes([next]);
    const lineKey = kind === "metro" ? (next.routeRef || next.route) : next.route;
    const color = kind === "metro" ? metroLineColor(lineKey) : routeColor(lineKey);
    const label = kind === "metro" ? metroLineName(lineKey) : next.route;
    const status = next.min <= 1
        ? (next.status || (next.min === 0 ? "Arriving" : "")) : "";
    const showEta = !(next.min === 0 && statusReplacesDue(status));
    return `<span class="row-badge${kind === "metro" ? " metro-line" : busBadgeClass()}"`
        + ` style="background:${color};color:${kind === "metro" ? "#fff" : busTextColor(next.route)}">${esc(label)}</span> `
        + `${esc(next.heads || next.dir || "")}`
        + statusChipHtml(status)
        + (showEta ? ` <span class="bt-next-eta${next.min <= 5 ? " soon" : ""}">${esc(fmtEta(next.min))}</span>` : "");
}

// Match the selected-stop hero card: dark panel, name + ID, next arrival.
// Home / Work buttons shown beside the like heart on every summary card.
function bmSlotHtml(row, slot) {
    const on = slotHas(row.kind, slot, row.id);
    const label = shortcutLabel(slot);
    const text = on ? `Clear ${label} bookmark` : `Save as ${label}`;
    const icon = slot === "home" ? "house" : slot === "work" ? "briefcase" : "plane";
    return `<button type="button" class="board-shortcut bm-slot${on ? " active" : ""}"`
        + ` data-bookmark-slot="${slot}" data-fav-kind="${esc(row.kind)}"`
        + ` data-fav-id="${esc(row.id)}" data-fav-name="${esc(row.name || "")}"`
        + ` data-fav-route="${esc(row.route || "")}"`
        + ` aria-pressed="${on ? "true" : "false"}" title="${text}" aria-label="${text}">`
        + `<i class="fa-solid fa-${icon}" aria-hidden="true"></i>`
        + `</button>`;
}

function bookmarkCardHtml(row) {
    const label = stopName(row.name) || "#" + row.id;
    const route = row.route || shortcutRoute(row.kind, row.id);
    const commuter = row.kind === "metro" && isCommuterRoute(route);
    const modeIcon = nearbyModeIcon(row.kind === "metro", commuter,
        row.kind === "metro" ? metroLineColor(route) : "", true, route);
    const band = row.kind === "metro"
        ? `<span class="hero-line-band" data-band="${esc(row.kind)}:${esc(row.id)}"`
          + ` style="background:${metroLineColor(route)}"></span>`
        : `<span class="hero-line-band bus-band" data-band="${esc(row.kind)}:${esc(row.id)}"`
          + `${busBandAttr(route)}></span>`;
    return `<div class="hero-card bookmark-card hero-${esc(row.kind)}" data-bookmark-kind="${esc(row.kind)}"`
        + ` data-bookmark-id="${esc(row.id)}" data-bookmark-name="${esc(row.name || "")}"`
        + ` data-bookmark-route="${esc(row.route || "")}"`
        + ` role="button" tabindex="0" title="Go to ${esc(label)}">`
        + band
        + `<div class="board-shortcuts">`
        + `${bmSlotHtml(row, "home")}${bmSlotHtml(row, "work")}${bmSlotHtml(row, "airport")}`
        + `${favStarHtml(row.kind, row.id, row.name, row.route)}</div>`
        + `<div class="bookmark-title-line">`
        + `${modeIcon}<span class="board-stopname">${esc(label)}</span>`
        + (row.name ? `<span class="board-stopid">#${esc(row.id)}</span>` : "")
        + `</div>`
        + `<div class="board-next" data-for="${esc(row.kind)}:${esc(row.id)}">loading arrivals…</div>`
        + `</div>`;
}

let bookmarkSlot = null;
let bookmarkToken = 0;

async function fillBookmarkArrivals(rows, token) {
    await Promise.all(rows.map(async row => {
        let html, next = null;
        try {
            if (row.kind === "metro") {
                const by = await fetchMetroLive([row.id]);
                const list = (by[row.id] || []).slice().sort((a, b) => a.min - b.min);
                next = list[0] || null;
                html = nextArrivalHtml(row.kind, next);
            } else {
                const { predictions } = await fetchPredictions(row.id);
                const list = (predictions || []).slice().sort((a, b) => a.min - b.min);
                next = list[0] || null;
                html = nextArrivalHtml(row.kind, next);
            }
        } catch (e) {
            html = `<span class="text-muted">arrivals unavailable</span>`;
        }
        if (token !== bookmarkToken || !gBookmarkList) return;
        const el = gBookmarkList.querySelector(
            `.board-next[data-for="${row.kind}:${row.id}"]`);
        if (el) el.innerHTML = html;
        if (row.kind === "metro" && next) {
            const band = gBookmarkList.querySelector(
                `.hero-line-band[data-band="${row.kind}:${row.id}"]`);
            if (band) band.style.background = metroLineColor(next.route);
        } else if (row.kind === "bus" && next) {
            const band = gBookmarkList.querySelector(
                `.hero-line-band[data-band="${row.kind}:${row.id}"]`);
            if (band) band.style.setProperty("--bus-band-color", routeColor(next.route));
        }
        // The icon follows the next departure, not just the saved line. A
        // mixed station (e.g. Red Line + commuter rail) therefore switches
        // between train-subway and the circled commuter train.
        if (next) {
            const card = gBookmarkList.querySelector(
                `.bookmark-card[data-bookmark-kind="${row.kind}"][data-bookmark-id="${row.id}"]`);
            const icon = card && card.querySelector(".bookmark-title-line .nearby-mode-icon");
            if (icon) {
                const metro = row.kind === "metro";
                const commuter = metro && isCommuterRoute(next.route);
                icon.outerHTML = nearbyModeIcon(metro, commuter,
                    metro ? metroLineColor(next.route) : "", true, next.route);
            }
        }
    }));
}

// Update the visible bookmark list in place after a save/remove. No board
// rebuild, no scroll reset, and no re-fetch for cards that are still saved.
function bookmarkKey(kind, id) {
    return String(kind) + ":" + String(id);
}

function syncBookmarkSlotButtons() {
    if (!gBookmarkList) return;
    for (const btn of gBookmarkList.querySelectorAll(".bm-slot")) {
        const kind = btn.dataset.favKind;
        const id = btn.dataset.favId;
        const slot = btn.dataset.bookmarkSlot;
        if (!kind || !id || !slot) continue;
        const on = slotHas(kind, slot, id);
        const label = shortcutLabel(slot);
        const text = on ? `Clear ${label} bookmark` : `Save as ${label}`;
        btn.classList.toggle("active", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.title = text;
        btn.setAttribute("aria-label", text);
    }
}

function syncBookmarkView() {
    if (!bookmarkSlot || !gBookmarkList) return;
    const slot = bookmarkSlot;
    const rows = bookmarkRows(slot);
    const wanted = new Map(rows.map(r => [bookmarkKey(r.kind, r.id), r]));
    const present = new Set();
    for (const card of [...gBookmarkList.querySelectorAll(".bookmark-card")]) {
        const key = bookmarkKey(card.dataset.bookmarkKind, card.dataset.bookmarkId);
        present.add(key);
        if (!wanted.has(key)) card.remove();
    }
    for (const row of rows) {
        const key = bookmarkKey(row.kind, row.id);
        if (present.has(key)) continue;
        const html = bookmarkCardHtml(row);
        if (typeof gBookmarkList.insertAdjacentHTML === "function")
            gBookmarkList.insertAdjacentHTML("beforeend", html);
        else gBookmarkList.innerHTML += html;
        fillBookmarkArrivals([row], bookmarkToken);
    }
    const empty = gBookmarkList.querySelector(".fav-empty");
    const hasCards = !!gBookmarkList.querySelector(".bookmark-card");
    if (!hasCards && !empty) {
        const label = slot === "fav"
            ? "likes" : shortcutLabel(slot).toLowerCase() + " bookmark";
        gBookmarkList.innerHTML = `<div class="fav-empty">no ${label} saved yet</div>`;
    } else if (hasCards && empty) {
        empty.remove();
    }
    syncBookmarkSlotButtons();
    syncFavStars();
}

function saveBookmarkOrderFromDom() {
    if (!bookmarkSlot || !gBookmarkList) return;
    const keys = [...gBookmarkList.querySelectorAll(".bookmark-card")]
        .map(card => bookmarkKey(card.dataset.bookmarkKind, card.dataset.bookmarkId));
    if (bookmarkSlot === "fav") {
        const by = new Map(likes.map(f => [bookmarkKey(f.kind, f.id), f]));
        const next = [];
        for (const key of keys) {
            const f = by.get(key);
            if (!f) continue;
            next.push(f);
            by.delete(key);
        }
        for (const f of likes) {
            if (by.has(bookmarkKey(f.kind, f.id))) next.push(f);
        }
        likes = next;
        writeLikes();
    } else {
        writeBookmarkOrder(bookmarkSlot, keys);
    }
    if (gFavFavBody && !gFavFavBody.hidden) renderLikes();
}

const bookmarkReflowAnimations = new Map();

// FLIP animation for a live reorder: rows slide from their old position to
// the new one instead of jumping when the dragged card changes index.
function animateBookmarkReflow(beforeRects) {
    if (!gBookmarkList) return;
    if (typeof REDUCE_MOTION !== "undefined" && REDUCE_MOTION.matches) return;
    for (const card of gBookmarkList.querySelectorAll(".bookmark-card")) {
        const before = beforeRects.get(card);
        if (!before || typeof card.animate !== "function") continue;
        const prior = bookmarkReflowAnimations.get(card);
        if (prior) prior.cancel();
        const after = card.getBoundingClientRect();
        const dy = before.top - after.top;
        if (Math.abs(dy) < 1) continue;
        const anim = card.animate(
            [{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }],
            { duration: 170, easing: "cubic-bezier(.2,.7,.3,1)" }
        );
        bookmarkReflowAnimations.set(card, anim);
        if (anim.finished) anim.finished.catch(() => {}).then(() => {
            if (bookmarkReflowAnimations.get(card) === anim)
                bookmarkReflowAnimations.delete(card);
        });
    }
}

// ── Screen history (last 10 views) ───────────────────────────────────
const SCREEN_HISTORY_MAX = 10;
let screenHistory = [];
let currentScreen = null;
let historyGuard = false;

function screenKey(s) {
    if (!s) return "";
    return [s.type, s.slot || "", s.mode || "", s.id || ""].join(":");
}

function screenLabel(s) {
    if (!s) return "previous screen";
    if (s.type === "bookmarks")
        return s.slot === "fav" ? "Likes" : shortcutLabel(s.slot);
    return s.name || (s.id ? `#${s.id}` : "previous stop");
}

function updateBackButton() {
    if (!gBackBtn) return;
    const prev = screenHistory[screenHistory.length - 1];
    gBackBtn.disabled = !prev;
    const label = prev ? `Back to ${screenLabel(prev)}` : "Back";
    gBackBtn.title = label;
    gBackBtn.setAttribute("aria-label", label);
}

function enterScreen(screen) {
    if (historyGuard || !screen) return;
    if (currentScreen && screenKey(currentScreen) === screenKey(screen)) {
        currentScreen = screen;
        updateBackButton();
        return;
    }
    if (currentScreen) {
        screenHistory.push(currentScreen);
        if (screenHistory.length > SCREEN_HISTORY_MAX) screenHistory.shift();
    }
    currentScreen = screen;
    updateBackButton();
}

async function goBack() {
    if (!screenHistory.length) return;
    const prev = screenHistory.pop();
    historyGuard = true;
    try {
        if (prev.type === "bookmarks") {
            closeFavPanel();
            await renderBookmarkList(prev.slot);
        } else if (prev.type === "board") {
            await gotoLike(prev.mode, prev.id, prev.name || "");
        }
        currentScreen = prev;
    } finally {
        historyGuard = false;
        updateBackButton();
    }
}

// "Near me": bus stops and Metro stations within 1,000 ft of the device's
// current position, nearest first.
const NEAR_ME_FT = 1000;
const NEAR_ME_M = 305;           // WMATA jStops radius is meters
let favNearToken = 0;

function getUserPosition() {
    return new Promise(resolve => {
        if (!navigator || !navigator.geolocation) return resolve(null);
        navigator.geolocation.getCurrentPosition(
            pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
            () => resolve(null),
            { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
    });
}

async function populateNearMe() {
    if (!gFavNearList) return;
    const token = ++favNearToken;
    gFavNearList.innerHTML = `<div class="fav-empty">locating…</div>`;
    const pos = await getUserPosition();
    if (token !== favNearToken) return;
    if (!pos) {
        gFavNearList.innerHTML = `<div class="fav-empty">location unavailable — allow location access and try again</div>`;
        return;
    }
    // "Near me" selects the city automatically from the device location.
    const targetCity = nearestCity(pos.lat, pos.lon);
    if (targetCity !== city) setCity(targetCity, { keepPanel: true });
    try {
        const [busStops, stations] = await Promise.all([
            fetchStopsNear(pos.lat, pos.lon, NEAR_ME_M),
            loadMetroStations()
        ]);
        if (token !== favNearToken) return;
        const rows = [];
        for (const s of busStops || []) {
            const d = distance(pos.lat, pos.lon, s.Lat, s.Lon, "f");
            if (d > NEAR_ME_FT) continue;
            rows.push({
                kind: "bus", id: s.StopID, name: s.Name,
                route: (s.Routes || [])[0] || "", dist: d
            });
        }
        for (const s of stations || []) {
            const d = distance(pos.lat, pos.lon, s.Lat, s.Lon, "f");
            if (d > NEAR_ME_FT) continue;
            rows.push({
                kind: "metro", id: s.Code, name: s.Name,
                route: (s.Lines || [])[0] || "", dist: d
            });
        }
        rows.sort((a, b) => a.dist - b.dist);
        gFavNearList.innerHTML = rows.length ? rows.map(r =>
            `<div class="fav-stop">${favBadgeHtml(r.kind, r.route)}`
            + `${favStarHtml(r.kind, r.id, r.name, r.route)}`
            + `${favGotoHtml(r.kind, r.id, r.name, stopName(r.name) || "#" + r.id)}`
            + `<small class="fav-dist">${Math.round(r.dist)} ft</small></div>`
        ).join("") : `<div class="fav-empty">nothing within 1,000 ft</div>`;
    } catch (e) {
        gFavNearList.innerHTML = `<div class="fav-empty">could not load nearby stops</div>`;
    }
}

async function populateFavStops(container, kind, key) {
    if (container.dataset.loaded) return;
    container.dataset.loaded = "1";
    container.innerHTML = `<div class="fav-empty">loading stops…</div>`;
    try {
        if (kind === "bus") {
            if (typeof cityProvider().routeStops === "function") {
                const groups = await fetchMbtaRouteStops(key);
                let conns = new Map();
                if (groups.length) {
                    const rows = groups.flatMap(g => g.stops)
                        .map(s => ({ StopID: s.StopID, kind: "bus" }));
                    conns = await loadStopConnections(rows);
                }
                container.innerHTML = groups.length ? groups.map(g => {
                    const term = g.stops[g.stops.length - 1];
                    const selRow = g.stops.find(s =>
                        String(s.StopID) === String(pickedStop || ""));
                    const actions = selRow && term
                        ? routeActionsHtml("bus", key, selRow.StopID, selRow.Name,
                            term.StopID, term.Name)
                        : "";
                    return (actions || "")
                        + `<div class="fav-dir-label">${esc(g.name || ("Direction " + g.dir))}</div>`
                        + g.stops.map(s => favOrderedBusRow(s, key, conns.get(String(s.StopID)))).join("");
                }).join("") : `<div class="fav-empty">no stops for this route</div>`;
                return;
            }
            let list;
            if (cityCfg().capabilities.routeStopsOnDemand && typeof cityProvider().stopsForRoute === "function") {
                list = await cityProvider().stopsForRoute(key);
            } else {
                const all = await loadStopDirectory();
                list = (all || [])
                    .filter(s => (s.Routes || []).some(r => String(r).toUpperCase() === key));
            }
            list = (list || []).sort((a, b) => String(a.Name || "").localeCompare(String(b.Name || "")));
            container.innerHTML = list.length ? list.map(s =>
                `<div class="fav-stop">${favStarHtml("bus", s.StopID, s.Name, key)}${favGotoHtml("bus", s.StopID, s.Name, stopName(s.Name) || "#" + s.StopID)}</div>`
            ).join("") : `<div class="fav-empty">no stops for this route</div>`;
        } else {
            const all = await loadMetroStations();
            const list = (all || [])
                .filter(s => s.Lines.includes(key))
                .sort((a, b) => String(a.Name || "").localeCompare(String(b.Name || "")));
            container.innerHTML = list.length ? list.map(s =>
                `<div class="fav-stop">${favStarHtml("metro", s.Code, s.Name, key)}${favGotoHtml("metro", s.Code, s.Name, stopName(s.Name) || s.Code)}</div>`
            ).join("") : `<div class="fav-empty">no stations on this line</div>`;
        }
    } catch (e) {
        container.innerHTML = `<div class="fav-empty">could not load stops</div>`;
    }
    applyStopNameWidth(container);
}

// flow), then anchor exactly once on the chosen stop/station.
async function gotoLike(kind, id, name) {

        if (mode !== "metro") applyMode("metro");

    if (mode !== "bus") applyMode("bus");
    if (!stops.length) await runFlow();
    await gotoStop(id, name);
}

if (gBookmarkList) gBookmarkList.addEventListener("pointerdown", e => {
    const handle = e.target.closest ? e.target.closest(".bookmark-drag") : null;
    if (!handle) return;
    const card = handle.closest(".bookmark-card");
    if (!card) return;
    e.preventDefault();
    e.stopPropagation();
    bookmarkDragCard = card;
    bookmarkDragMoved = false;
    card.classList.add("dragging");
    const move = ev => {
        if (!bookmarkDragCard) return;
        ev.preventDefault();
        const under = document.elementFromPoint
            ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
        const target = under && under.closest ? under.closest(".bookmark-card") : null;
        if (!target || target === bookmarkDragCard || !gBookmarkList.contains(target))
            return;
        const rect = target.getBoundingClientRect();
        const before = ev.clientY < rect.top + rect.height / 2;
        const beforeRects = new Map(
            [...gBookmarkList.querySelectorAll(".bookmark-card")]
                .map(card => [card, card.getBoundingClientRect()]));
        gBookmarkList.insertBefore(bookmarkDragCard,
            before ? target : target.nextSibling);
        animateBookmarkReflow(beforeRects);
        bookmarkDragMoved = true;
    };
    const end = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", end);
        document.removeEventListener("pointercancel", end);
        if (bookmarkDragCard) bookmarkDragCard.classList.remove("dragging");
        if (bookmarkDragMoved) {
            saveBookmarkOrderFromDom();
            setTimeout(() => { bookmarkDragMoved = false; }, 350);
        }
        bookmarkDragCard = null;
    };
    document.addEventListener("pointermove", move, { passive: false });
    document.addEventListener("pointerup", end);
    document.addEventListener("pointercancel", end);
});
