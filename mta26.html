            // NOT from the HOME default, so the URL-point view is honest.
            stops = raw
                .map(s => {
                    const stop = makeStop(s.StopID, s.Name, s.Lat, s.Lon);
                    stop.Distance = distance(at.lat, at.lon, s.Lat, s.Lon, "f");
                    stop.Routes = s.Routes || [];
                    return stop;
                })
                .sort((a, b) => a.Distance - b.Distance);   // sorted; one array, so no index drift
            if (!stops.length) {
                gStatus.textContent = `No stops within ${gRadius} m — try ?radius=600`;
                stops = [];
            }
        }
        // ?busstop= deep link: prefill the entry field with the FIRST listed
        // stop before the first paint, so the initial anchor is correct even
        // while arrivals are still loading. ✕ returns to the nearby search
        // (forceNearby, since the URL would otherwise pick the same stop).
        if (stopListFromURL && stopListFromURL.length && !forceNearby && !pickedStop && stops[0]) {
            const s = stops[0];
            pickedStop = s.StopID;
            acStop.setPicked(true);
        }
        // Paint the stop names immediately; arrivals are fetched in the
        // background and repaint when they land.
        renderLines();
        refreshPredictions().catch(() => {});
    } catch (e) {
        // Stops lookup failed (bad key / network): keep whatever is shown.
        gStatus.textContent = `Could not reach WMATA: ${e.message}`;
    } finally {
        busy = false;
        scheduleRefresh();
    }
}

// ════════════════════════════════════════════════════════════════════
// Metro rail
// ════════════════════════════════════════════════════════════════════

function normalizeMetroStation(s) {
    const lines = [s.LineCode1, s.LineCode2, s.LineCode3, s.LineCode4].filter(Boolean);
    return { Code: String(s.Code || ""), Name: s.Name || "",
             Lat: Number(s.Lat), Lon: Number(s.Lon), Lines: lines, distFt: null };
}

function loadMetroStations() {
    if (metroStationsCache) return Promise.resolve(metroStationsCache);
    if (metroStationsLoad) return metroStationsLoad;
    metroStationsLoad = apiGet("/Rail.svc/json/jStations", {})
        .then(({ data, error }) => {
            if (error) throw error;
            metroStationsCache = ((data && data.Stations) || [])
                .map(normalizeMetroStation)
                .filter(s => s.Code && Number.isFinite(s.Lat) && Number.isFinite(s.Lon));
            return metroStationsCache;
        })
        .finally(() => { metroStationsLoad = null; });
    return metroStationsLoad;
}

function metroRefPoint() {
    if (searchPoint) return searchPoint;
    const st = anchorStop();
    if (st && st.Lat != null && st.Lon != null)
        return { lat: Number(st.Lat), lon: Number(st.Lon) };
    return HOME;
}

function populateMetroSelect(stations) {
    if (!gMetroSelect) return;
    gMetroSelect.innerHTML = stations.slice()
        .sort((a, b) => String(a.Name).localeCompare(String(b.Name)))
        .map(s => `<option value="${esc(s.Code)}">${esc(stopName(s.Name) || s.Code)}</option>`)
        .join("");
    if (metroAnchor) gMetroSelect.value = metroAnchor.Code;
}

function updateModeIcons() {
    if (gBusBtn) {
        gBusBtn.classList.toggle("active", mode === "bus");
        gBusBtn.setAttribute("aria-pressed", mode === "bus" ? "true" : "false");
    }
    if (gMetroBtn) {
        gMetroBtn.classList.toggle("active", mode === "metro");
        gMetroBtn.setAttribute("aria-pressed", mode === "metro" ? "true" : "false");
    }
}

// Switch mode and update the chrome. Deliberately starts no data flow, so a
// caller can pick the destination first and then run exactly one flow.
function applyMode(next) {
    if (next !== "bus" && next !== "metro") return false;
    const changed = next !== mode;
    mode = next;
    writeModeCookie();
    shortcuts = readShortcutCookie();
    updateShortcutNav();
    updateModeIcons();
    if (changed) {
        expandedStops.clear();
        gBoardHeader.innerHTML = "";
        gLinesScroll.innerHTML = "";
        gLinesNote.textContent = "";
        scrollPageTop();
    }
    return changed;
}

function setMode(next) {
    if (next !== "bus" && next !== "metro") return;
    if (next === mode) return;
    applyMode(next);
    if (mode === "bus") {
        if (allStopsCache) populateBusRoutes(allStopsCache);
        runFlow();
    } else { metroAnchorCode = null; runMetro(); }
}

async function runMetro() {
    gLinesNote.textContent = "loading Metro stations…";
    try {
        const all = await loadMetroStations();
        populateMetroSelect(all);
        const ref = metroRefPoint();
        let anchor = metroAnchorCode ? all.find(s => s.Code === metroAnchorCode) : null;
        if (!anchor) {
            anchor = all.slice().sort((a, b) =>
                distance(ref.lat, ref.lon, a.Lat, a.Lon, "f") -
                distance(ref.lat, ref.lon, b.Lat, b.Lon, "f"))[0];
        }
        if (!anchor) { gLinesNote.textContent = "no Metro stations found"; return; }
        setMetroAnchor(anchor.Code);
    } catch (e) {
        gStatus.textContent = `Could not load Metro: ${e.message}`;
        gLinesNote.textContent = "Metro data unavailable";
    }
}

function setMetroAnchor(code) {
    const all = metroStationsCache || [];
    const anchor = all.find(s => s.Code === String(code));
    if (!anchor) return;
    metroAnchorCode = anchor.Code;
    metroAnchor = Object.assign({}, anchor, { distFt: 0 });
    if (gMetroSelect) gMetroSelect.value = anchor.Code;
    expandedStops.clear();
    scrollPageTop();
    metroNearby = all.filter(s => s.Code !== anchor.Code)
        .map(s => Object.assign({}, s, {
            distFt: distance(anchor.Lat, anchor.Lon, s.Lat, s.Lon, "f")
        }))
        .filter(s => s.distFt <= METRO_NEARBY_FT)
        .sort((a, b) => a.distFt - b.distFt)
        .slice(0, 3);
    renderMetro();
    refreshMetro();
}

function metroMin(v) {
    if (v === "BRD" || v === "ARR") return 0;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
}

async function fetchMetroLive(codes) {
    const { data, error } = await apiGet(
        "/StationPrediction.svc/json/GetPrediction/" + codes.join(","), {});
    if (error) throw error;
    const by = {};
    for (const t of (data && data.Trains) || []) {
        const min = metroMin(t.Min);
        const code = String(t.LocationCode || "");
        const line = String(t.Line || "").toUpperCase();
        const dest = t.DestinationName || t.Destination || "";
        if (min == null || !code || !line || line === "NO" || /no passenger/i.test(dest))
            continue;
        (by[code] || (by[code] = [])).push({
            min, route: line,
            dir: dest, heads: dest,
            dirNum: t.Group != null ? String(t.Group) : "",
            vehicle: null, trip: null
        });
    }
    for (const code of Object.keys(by)) by[code].sort((a, b) => a.min - b.min);
    return by;
}

function metroRowsFor(station) {
    const now = Date.now();
    const live = metroLive[station.Code] || [];
    const rows = [];
    const groups = new Map();
    for (const t of live) {
        const key = t.route + "|" + (t.dirNum || "") + "|" + t.heads;
        let r = groups.get(key);
        if (!r) {
            r = { kind: "compact", route: t.route, dirNum: t.dirNum || "",
                  dest: t.heads, mins: [], first: 0, metro: true,
                  fromCode: station.Code, toCode: metroDestCode(t.heads) };
            groups.set(key, r);
            rows.push(r);
        }
        r.mins.push(t.min);
    }
    for (const r of rows) {
        r.mins.sort((a, b) => a - b);
        r.first = r.mins[0];
    }
    const liveHeads = rows.map(r => ({ route: r.route, heads: normHeads(r.dest) }));
    const sched = (metroSchedule[station.Code] || [])
        .filter(d => d.at >= now).sort((a, b) => a.at - b.at);
    const schedGroups = new Map();
    for (const d of sched) {
        const dh = normHeads(d.heads);
        if (liveHeads.some(l => l.route === d.route &&
            metroHeadsMatch(l.heads, dh))) continue;
        const key = d.route + "|" + dh;
        const prev = schedGroups.get(key);
        if (!prev || d.at < prev.scheduled.at)
            schedGroups.set(key, {
                kind: "service", route: d.route, dirNum: d.dirNum || "",
                dest: d.heads, mins: [], first: 0, metro: true,
                fromCode: station.Code, toCode: metroDestCode(d.heads),
                scheduled: { at: d.at }
            });
    }
    rows.push(...schedGroups.values());
    sortRowsBySoonest(rows, station.Code, now);
    return rows;
}

function metroDestCode(name) {
    const stations = metroStationsCache || [];
    const hit = stations.find(s => metroHeadsMatch(s.Name, name));
    return hit ? hit.Code : "";
}

async function fetchMetroPath(from, to) {
    const key = from + "|" + to;
    if (metroPathCache[key]) return metroPathCache[key];
    if (metroPathInflight[key]) return metroPathInflight[key];
    const p = apiGet("/Rail.svc/json/jPath", { FromStationCode: from, ToStationCode: to })
        .then(({ data, error }) => {
            if (error) throw error;
            const path = (data && data.Path) || [];
            metroPathCache[key] = path;
            return path;
        })
        .finally(() => { delete metroPathInflight[key]; });
    metroPathInflight[key] = p;
    return p;
}

async function loadMetroStops(ul) {
    const from = ul.dataset.metroFrom, to = ul.dataset.metroTo;
    if (!from || !to) { ul.innerHTML = ""; return; }
    ul.dataset.loaded = "1";
    ul.innerHTML = `<li class="bt-stop-item">loading stops…</li>`;
    try {
        const path = await fetchMetroPath(from, to);
        ul.innerHTML = path.map(p => {
            const mark = p.StationCode === from ? ` <b class="bt-mark">your stop</b>`
                : p.StationCode === to ? ` <b class="bt-mark">terminal</b>` : "";
            return `<li class="bt-stop-item" role="button" tabindex="0" data-stop="${esc(p.StationCode)}">`
                + `${esc(stopName(p.StationName))} <small>(${esc(p.StationCode)})</small>${mark}</li>`;
        }).join("");
    } catch (e) {
        ul.innerHTML = `<li class="bt-stop-item">could not load stops</li>`;
    }
}

function metroHeadsMatch(a, b) {
    const A = normHeads(a), B = normHeads(b);
    if (!A || !B) return false;
    if (A === B || A.includes(B) || B.includes(A)) return true;
    const n = Math.min(6, A.length, B.length);
    return n >= 5 && A.slice(0, n) === B.slice(0, n);
}

function renderMetro() {
    const station = metroAnchor;
    if (!station) {
        gBoardHeader.innerHTML = "";
        gLinesScroll.innerHTML = "";
        gLinesNote.textContent = "no Metro station selected";
        return;
    }
    const now = Date.now();
    const live = (metroLive[station.Code] || []).slice().sort((a, b) => a.min - b.min);
    const nextSched = (metroSchedule[station.Code] || [])
        .filter(d => d.at >= now).sort((a, b) => a.at - b.at)[0] || null;
    const headSt = {
        StopID: station.Code, Name: station.Name, Metro: true,
        MetroScheduledNext: nextSched
            ? { at: nextSched.at, route: nextSched.route, heads: nextSched.heads }
            : null,
        Error: metroLiveError[station.Code] || null
    };
    gBoardHeader.innerHTML = boardHeaderHtml(headSt, live);
    const rowsHtml = (rows) => rows.map(r => {
        const key = rowKey(r);
        const open = expandedStops.has(key);
        const list = r.metro && r.toCode
            ? `<ul class="bt-stoplist"${open ? "" : " hidden"}`
              + ` data-metro-from="${esc(r.fromCode || "")}" data-metro-to="${esc(r.toCode)}">`
              + (open ? `<li class="bt-stop-item">loading stops…</li>` : "")
              + `</ul>`
            : "";
        return `<div class="board-row${r.scheduled ? " is-scheduled" : ""}"`
            + ` data-rowkey="${encodeURIComponent(key)}">`
            + boardRowHead(r, metroLineColor(r.route), null, key, r.scheduled)
            + list + `</div>`;
    }).join("");
    const mainRows = metroRowsFor(station);
    const mainHtml = mainRows.length
        ? `<div class="main-board"><div class="board">${rowsHtml(mainRows)}</div></div>`
        : "";
    let nearbyHtml = "";
    for (const stn of metroNearby) {
        const dist = stn.distFt == null ? ""
            : (stn.distFt < 5280 ? `${Math.round(stn.distFt)} ft away`
                                 : `${(stn.distFt / 5280).toFixed(1)} mi away`);
        nearbyHtml += `<div class="curb-head" role="button" tabindex="0" data-metro="1" data-stop="${esc(stn.Code)}">`
            + `<div class="curb-head-stop"><div class="curb-main">`
            + `<div class="curb-title">${esc(stopName(stn.Name) || stn.Code)}</div>`
            + `<div class="curb-sub">${esc([dist, "#" + stn.Code].filter(Boolean).join(" · "))}</div>`
            + `</div></div></div>`;
        const rows = metroRowsFor(stn);
        if (rows.length)
            nearbyHtml += `<div class="nearby-board"><div class="board">${rowsHtml(rows)}</div></div>`;
    }
    gLinesScroll.innerHTML = mainHtml + nearbyHtml;
    gLinesNote.textContent = "";
    if (gLinesScroll.querySelectorAll) {
        gLinesScroll.querySelectorAll(".bt-stoplist[data-metro-from]").forEach(ul => {
            if (!ul.hidden && !ul.dataset.loaded) loadMetroStops(ul);
        });
    }
}

async function refreshMetro() {
    if (metroRefreshInFlight) { metroRefreshQueued = true; return; }
    metroRefreshInFlight = true;
    try {
        const stations = [metroAnchor, ...metroNearby].filter(Boolean);
        if (!stations.length) return;
        const codes = [...new Set(stations.map(s => s.Code))];
        const liveP = fetchMetroLive(codes)
            .then(live => { metroLive = live; metroLiveError = {}; })
            .catch(e => { for (const c of codes) metroLiveError[c] = e; });
        const schedP = ensureMetroSchedule(codes)
            .then(sched => { metroSchedule = sched; })
            .catch(() => {});
        await liveP;
        if (mode !== "metro") return;
        lastRefreshAt = Date.now();
        renderMetro();
        tickClock();
        scheduleRefresh();
        await schedP;
        if (mode !== "metro") return;
        renderMetro();
    } finally {
        metroRefreshInFlight = false;
        if (metroRefreshQueued) {
            metroRefreshQueued = false;
            if (mode === "metro") refreshMetro();
        }
    }
}

function refreshActive() {
    return mode === "metro" ? refreshMetro() : refreshPredictions();
}

// ── Rail GTFS schedules (for "not seen" departures) ───────────────────
// The rail GTFS static zip is downloaded once per page session; schedule
// rows are cached per station/day.
let metroGtfs = null;
let metroGtfsLoad = null;
const metroScheduleCache = {};
const GTFS_LINES = { RED: "RD", BLUE: "BL", ORANGE: "OR",
                     SILVER: "SV", GREEN: "GR", YELLOW: "YL" };

function gtfsCsvFields(line) {
    const out = [];
    let cur = "", quoted = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (quoted) {
            if (c === '"') {
                if (line[i + 1] === '"') { cur += '"'; i++; }
                else quoted = false;
            } else cur += c;
        } else if (c === '"') quoted = true;
        else if (c === ",") { out.push(cur); cur = ""; }
        else cur += c;
    }
    out.push(cur);
    return out;
}

function zipU32(dv, off) {
    return dv.getUint32(off, true);
}

async function inflateRaw(bytes) {
    if (typeof DecompressionStream !== "function") return null;
    const ds = new DecompressionStream("deflate-raw");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzipEntries(buf) {
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
        if (zipU32(dv, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("bad zip");
    const count = dv.getUint16(eocd + 10, true);
    let p = zipU32(dv, eocd + 16);
    const entries = {};
    for (let i = 0; i < count; i++) {
        if (zipU32(dv, p) !== 0x02014b50) break;
        const method = dv.getUint16(p + 10, true);
        const compSize = zipU32(dv, p + 20);
        const nameLen = dv.getUint16(p + 28, true);
        const extraLen = dv.getUint16(p + 30, true);
        const commentLen = dv.getUint16(p + 32, true);
        const localOff = zipU32(dv, p + 42);
        const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nameLen));
        p += 46 + nameLen + extraLen + commentLen;
        const lNameLen = dv.getUint16(localOff + 26, true);
        const lExtraLen = dv.getUint16(localOff + 28, true);
        const dataStart = localOff + 30 + lNameLen + lExtraLen;
        entries[name] = { method, comp: new Uint8Array(buf, dataStart, compSize) };
    }
    return entries;
}

async function gtfsText(entries, name) {
    const e = entries[name];
    if (!e) return "";
    if (e.method === 0) return new TextDecoder().decode(e.comp);
    const raw = await inflateRaw(e.comp);
    return raw ? new TextDecoder().decode(raw) : "";
}

function gtfsTimeToMs(hms) {
    const parts = String(hms || "").split(":").map(Number);
    if (parts.length < 2 || parts.some(n => !Number.isFinite(n))) return NaN;
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime() + ((parts[0] * 3600 + parts[1] * 60 + (parts[2] || 0)) * 1000);
}

async function loadMetroGtfs() {
    if (metroGtfs) return metroGtfs;
    if (metroGtfsLoad) return metroGtfsLoad;
    metroGtfsLoad = (async () => {
        const res = await fetch(`${WMATA_API}/gtfs/rail-gtfs-static.zip?api_key=${encodeURIComponent(API_KEY)}`);
        if (!res.ok) throw new Error("GTFS " + res.status);
        const entries = await unzipEntries(await res.arrayBuffer());
        const [tripsText, stopTimesText, calText] = await Promise.all([
            gtfsText(entries, "trips.txt"),
            gtfsText(entries, "stop_times.txt"),
            gtfsText(entries, "calendar_dates.txt")
        ]);
        const d = new Date();
        const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
        const active = new Set();
        for (const line of calText.split("\n")) {
            if (!line.trim()) continue;
            const f = gtfsCsvFields(line);
            if (f[1] !== ymd) continue;
            if (f[2] === "1") active.add(f[0]);
            else if (f[2] === "2") active.delete(f[0]);
        }
        const trips = new Map();
        for (const line of tripsText.split("\n")) {
            if (!line.trim()) continue;
            const f = gtfsCsvFields(line);
            if (!active.has(f[1])) continue;
            trips.set(f[2], {
                route: GTFS_LINES[f[0]] || f[0],
                heads: f[3] || "",
                dir: f[4] || ""
            });
        }
        return { stopTimesText, trips };
    })()
      .then(g => { metroGtfs = g; return g; })
      .finally(() => { metroGtfsLoad = null; });
    return metroGtfsLoad;
}

async function ensureMetroSchedule(codes) {
    const d = new Date();
    const day = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    if (codes.every(c => metroScheduleCache[c] && metroScheduleCache[c].day === day)) {
        const out = {};
        for (const c of codes) out[c] = metroScheduleCache[c].departures;
        return out;
    }
    const gtfs = await loadMetroGtfs();
    const codeSet = new Set(codes);
    const by = {};
    for (const c of codes) by[c] = [];
    const now = Date.now(), horizon = now + 4 * 3600 * 1000;
    for (const line of gtfs.stopTimesText.split("\n")) {
        if (!line) continue;
        const f = line.split(",");
        if (f.length < 4) continue;
        const m = /^(?:PF|PLF)_([A-Z][0-9]{2})_/.exec(f[3]);
        if (!m || !codeSet.has(m[1])) continue;
        const trip = gtfs.trips.get(f[0]);
        if (!trip) continue;
        const at = gtfsTimeToMs(f[2] || f[1]);
        if (!Number.isFinite(at) || at < now || at > horizon) continue;
        by[m[1]].push({ at, route: trip.route, heads: trip.heads, dirNum: trip.dir });
    }
    const out = {};
    for (const c of codes) {
        by[c].sort((a, b) => a.at - b.at);
        metroScheduleCache[c] = { day, departures: by[c] };
        out[c] = by[c];
    }
    return out;
}


// Re-fetch bus predictions for the stops currently shown, plus the confirmed
// across-the-street counterpart. Promise.all so the render happens once after
// every request has settled, including failures.
let refreshInFlight = false, refreshQueued = false;

async function refreshPredictions() {
    // Plan §4 coalescing: a timer tick, a tab return, and a selection change
    // can land together — they collapse into one request set per endpoint.
    if (refreshInFlight) { refreshQueued = true; return; }
    refreshInFlight = true;
    const v = selectionVersion;      // captured up front for the stale-result guard
    try {
        const toFetch = new Map();              // StopID → stop object
        for (const s of shownStops()) toFetch.set(String(s.StopID), s);
        if (acrossStop) toFetch.set(String(acrossStop.StopID), acrossStop);
        // Nearby sections need their own live predictions too; otherwise the
        // same stop looks different as the anchor vs a secondary section.
        const anchor = anchorStop();
        if (anchor) {
            for (const n of nearbyStops(anchor)) {
                const stp = nearbyStopObj(n);
                toFetch.set(String(stp.StopID), stp);
            }
        }
        if (!toFetch.size) return;
        let saw429 = false;
        await Promise.all([
            ...[...toFetch.values()].map(async (stop) => {
                try {
                    const { name, predictions } = await fetchPredictions(stop.StopID);
                    if (name && !stop.Name) stop.Name = name;      // ?busstop= mode learns names here
                    const at = Date.now();
                    updateDeparted(stop, predictions, at);
                    stop.Arrivals = predictions;
                    stop.ArrivalsAt = at;
                    stop.Error = null;
                } catch (e) {
                    stop.Arrivals = [];
                    stop.Error = e;                                 // rendered as a muted row
                    if (e.rateLimited) saw429 = true;
                }
            }),
            // Schedule fallback for rows with no live prediction. Cached per
            // stop/day; failures never block the predictions render.
            ...[...toFetch.keys()].map(id => ensureStopSchedule(id)),
        ]);
        rateLimited = saw429;          // → next refresh is delayed (self-throttling)
        lastRefreshAt = Date.now();
        // Plan §4: a stale result must not land after a new selection —
        // the new selection's own refresh wins; this one only re-arms the cycle.
        if (v !== selectionVersion) {
            scheduleRefresh();
            return;
        }
        if (mode !== "bus") { scheduleRefresh(); return; }
        // Keep the board moving on every tick.
        renderLines();
        scheduleRefresh();             // re-arm: the 30-second cycle continues after every tick
        tickClock();                   // reflect this update + the new countdown at once
        gStatus.textContent = rateLimited
            ? "API rate limit hit, slowing refresh"
            : (stops.length ? "" : gStatus.textContent);
    } finally {
        refreshInFlight = false;
        if (refreshQueued) {
            refreshQueued = false;
            // A prompt trigger (confirmAcross' first fetch) runs as soon as the
            // in-flight cycle settles; one that belonged to the old selection
            // simply re-arms the cycle for the new one.
            if (v === selectionVersion) refreshPredictions();
            else scheduleRefresh();
        }
    }
}

// Periodic refresh: predictions only (the stop list itself rarely changes).
// After a 429 the interval stretches 5× to be polite to the shared key.
function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = null;
    if (!refreshEnabled) { nextRefreshAt = 0; return; }
    const wait = rateLimited ? 5 * REFRESH_MS : REFRESH_MS;
    nextRefreshAt = Date.now() + wait;
    refreshTimer = setTimeout(() => {
        refreshTimer = null;
        refreshActive();
    }, wait);
}

// Background tabs get throttled timers; refresh promptly when we come back.
document.addEventListener("visibilitychange", () => {
    const haveData = mode === "metro" ? !!metroAnchor : stops.length > 0;
    if (document.visibilityState === "visible" && refreshEnabled && !busy && haveData) {
        if (Date.now() - lastRefreshAt > REFRESH_MS / 2) {
            refreshActive();
        } else {
            scheduleRefresh();
        }
    }
});

// ════════════════════════════════════════════════════════════════════
// Rendering
// ════════════════════════════════════════════════════════════════════

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
}

// Stop names use "+" in the WMATA feed; display it as " and ".
function stopName(name) {
    return String(name || "").replace(/\s*\+\s*/g, " and ");
}

// The stops the board tracks. No pick: the nearby / ?busstop= list.
// With a pick: just that stop — resolved from the list when it's there, or
// materialized from the stop directory when the user picked a stop that is
// not in the list (it is then live-tracked like any other).
function shownStops() {
    if (!pickedStop) return stops;
    // A ?busstop= deep link keeps every requested ID in the tracked set
    // until the user explicitly picks another stop (pickedStopObj is set by
    // that pick; the URL prefill leaves it null).
    if (stopListFromURL && !forceNearby && !pickedStopObj) return stops;
    if (pickedStopObj) return [pickedStopObj];
    const inList = stops.find(s => s.StopID === pickedStop);
    return inList ? [inList] : stops;
}

// ════════════════════════════════════════════════════════════════════
// Navigation icons
// ════════════════════════════════════════════════════════════════════

// Re-anchor on a stop and put its name in the entry field. Home/work/
// favorite shortcuts all funnel through here.
async function gotoStop(id, name) {
    searchPoint = null;                 // explicit stop, not a nearby search
    forceNearby = false;
    id = String(id);
    const st = (allStopsCache || []).find(s => String(s.StopID) === id)
        || stops.find(s => String(s.StopID) === id)
        || makeStop(id, name || null, null, null);
    acStop.showPick(st);
    selectStop(id);
    if (!allStopsCache) {
        try {
            await loadStopDirectory();
            const dir = (allStopsCache || []).find(s => String(s.StopID) === id);
            if (dir && String(pickedStop) === id) acStop.showPick(dir);
        } catch (e) { /* the board retries the directory on its next paint */ }
    }
    updateShortcutNav();
}

function updateShortcutNav() {
    const noun = mode === "metro" ? "station" : "stop";
    for (const slot of SHORTCUT_SLOTS) {
        const btn = gShortcutBtns[slot];
        if (!btn) continue;
        if (slot === "fav") {
            // The nav star is the master favorites list, not a single slot.
            const n = favorites.length;
            btn.classList.toggle("is-set", n > 0);
            btn.title = n ? `All favorites (${n})` : "All favorites";
            btn.setAttribute("aria-label", btn.title);
            continue;
        }
        const saved = shortcuts[slot];
        const label = shortcutLabel(slot);
        btn.classList.toggle("is-set", !!(saved && saved.id));
        if (saved && saved.id) {
            const name = stopName(saved.name) || `#${saved.id}`;
            btn.title = `${label}: ${name}`;
            btn.setAttribute("aria-label", `Go to ${label}: ${name}`);
        } else if (slot === "home") {
            btn.title = mode === "metro" ? "Nearest Metro station" : `Home stop (${DEFAULT_STOP_ID})`;
            btn.setAttribute("aria-label", btn.title);
        } else {
            btn.title = `No ${label} ${noun} saved`;
            btn.setAttribute("aria-label", btn.title);
        }
    }
}

function goShortcut(slot) {
    if (mode === "metro") {
        const saved = shortcuts[slot];
        if (saved && saved.id) { metroAnchorCode = saved.id; runMetro(); return; }
        if (slot === "home") { metroAnchorCode = null; runMetro(); return; }
        gStatus.textContent = `No ${shortcutLabel(slot)} station saved — open a station and tap its ${shortcutLabel(slot).toLowerCase()} icon.`;
        return;
    }
    const saved = shortcuts[slot];
    if (saved && saved.id) { gotoStop(saved.id, saved.name); return; }
    if (slot === "home") { gotoStop(DEFAULT_STOP_ID, null); return; }
    gStatus.textContent = `No ${shortcutLabel(slot)} stop saved — open a stop and tap its ${shortcutLabel(slot).toLowerCase()} icon.`;
}

function nearestByDistance(list, lat, lon) {
    let best = null, bestDist = Infinity;
    for (const s of list || []) {
        if (s.Lat == null || s.Lon == null) continue;
        const d = distance(lat, lon, Number(s.Lat), Number(s.Lon), "f");
        if (d < bestDist) { bestDist = d; best = s; }
    }
    return best;
}

function goCurrentLocation() {
    if (!navigator || !navigator.geolocation) {
        gStatus.textContent = "Geolocation not supported by this browser";
        return;
    }
    gStatus.textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        searchPoint = { lat, lon };
        try {
            if (mode === "metro") {
                const stations = await loadMetroStations();
                const hit = nearestByDistance(stations, lat, lon);
                if (!hit) { gStatus.textContent = "No Metro station found"; return; }
                setMetroAnchor(hit.Code);
            } else {
                const all = await loadStopDirectory();
                const hit = nearestByDistance(all, lat, lon);
                if (!hit) { gStatus.textContent = "No bus stop found"; return; }
                selectStop(hit.StopID);
            }
            gStatus.textContent = "";
        } catch (e) {
            gStatus.textContent = `Could not find the nearest stop: ${e.message}`;
        }
    }, () => {
        gStatus.textContent = "Turn on location sharing.";
    }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
}

if (gCurrentBtn) gCurrentBtn.addEventListener("click", goCurrentLocation);

function openSelectedInMaps() {
    let lat, lon, name;
    if (mode === "metro") {
        if (!metroAnchor) { gStatus.textContent = "No Metro station selected"; return; }
        lat = metroAnchor.Lat; lon = metroAnchor.Lon; name = metroAnchor.Name;
    } else {
        const st = anchorStop();
        if (!st || st.Lat == null || st.Lon == null) {
            gStatus.textContent = "No mapped location for the selected stop";
            return;
        }
        lat = st.Lat; lon = st.Lon; name = st.Name;
    }
    const ua = navigator.userAgent || "";
    const coords = `${encodeURIComponent(lat)},${encodeURIComponent(lon)}`;
    const label = encodeURIComponent(stopName(name) || `${lat},${lon}`);
    if (/Android/.test(ua)) {
        // geo: lets Android open the user's default maps app (Maps, Waze, etc.).
        window.location.href = `geo:${coords}?q=${coords}(${label})`;
        return;
    }
    const url = /iPhone|iPad|iPod|Macintosh/.test(ua)
        ? `https://maps.apple.com/?ll=${coords}&q=${label}`
        : `https://www.google.com/maps/search/?api=1&query=${coords}`;
    window.open(url, "_blank", "noopener");
}

// ── Add Favorite picker ──────────────────────────────────────────────
function loadBusRouteDirectory() {
    if (busRouteDirectory) return Promise.resolve(busRouteDirectory);
    if (busRouteLoad) return busRouteLoad;
    busRouteLoad = apiGet("/Bus.svc/json/jRoutes", {})
        .then(({ data, error }) => {
            if (error) throw error;
            busRouteDirectory = ((data && data.Routes) || [])
                .map(r => ({ id: String(r.RouteID || "").toUpperCase(),
                             name: r.Name || "",
                             desc: r.LineDescription || r.Name || "" }))
                .filter(r => r.id)
                .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            return busRouteDirectory;
        })
        .catch(() => {
            const m = new Map();
            for (const s of allStopsCache || [])
                for (const r of s.Routes || []) {
                    const id = String(r || "").toUpperCase();
                    if (id && !m.has(id)) m.set(id, { id, name: id, desc: "" });
                }
            busRouteDirectory = [...m.values()]
                .sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            return busRouteDirectory;
        })
        .finally(() => { busRouteLoad = null; });
    return busRouteLoad;
}

async function populateFavStops(container, kind, key) {
    if (container.dataset.loaded) return;
    container.dataset.loaded = "1";
    container.innerHTML = `<div class="fav-empty">loading stops…</div>`;
    try {
        if (kind === "bus") {
            const all = await loadStopDirectory();
            const list = (all || [])
                .filter(s => (s.Routes || []).some(r => String(r).toUpperCase() === key))
                .sort((a, b) => String(a.Name || "").localeCompare(String(b.Name || "")));
            container.innerHTML = list.length ? list.map(s =>
                `<div class="fav-stop">${favGotoHtml("bus", s.StopID, s.Name, stopName(s.Name) || "#" + s.StopID)}${favStarHtml("bus", s.StopID, s.Name, key)}</div>`
            ).join("") : `<div class="fav-empty">no stops for this route</div>`;
        } else {
            const all = await loadMetroStations();
            const list = (all || [])
                .filter(s => s.Lines.includes(key))
                .sort((a, b) => String(a.Name || "").localeCompare(String(b.Name || "")));
            container.innerHTML = list.length ? list.map(s =>
                `<div class="fav-stop">${favGotoHtml("metro", s.Code, s.Name, stopName(s.Name) || s.Code)}${favStarHtml("metro", s.Code, s.Name, key)}</div>`
            ).join("") : `<div class="fav-empty">no stations on this line</div>`;
        }
    } catch (e) {
        container.innerHTML = `<div class="fav-empty">could not load stops</div>`;
    }
}

// flow), then anchor exactly once on the chosen stop/station.
async function gotoFavorite(kind, id, name) {

        if (mode !== "metro") applyMode("metro");
        await loadMetroStations();
        setMetroAnchor(id);

// ════════════════════════════════════════════════════════════════════
// The board (v5 — the single view)
// One row per route+direction+destination that boards the anchor stop,
// drawn on the REAL route geometry (jRouteDetails shapes): stops the bus
// passes before the anchor sit left of the shared boarding x, the terminal
// right, rows read left → right, and the anchor stands on one vertical
// guide at the same x in every row of both curb sections, so the whole
// board scrolls as one piece. Approaching buses mark the track from the
// live positions feed (filled when the sample is fresh, hollow when the
// ETA is extrapolated). A route whose published pattern doesn't board the
// anchor collapses to a header-only row; one with no route details at all
// keeps its ETA list with a note.
// The across-the-street resolver (≤1 unambiguous opposite stop) gets its
// own named section, riding the same scale and the same guide.
// ════════════════════════════════════════════════════════════════════

// A small distinguishable palette; routes hash into it (stable across loads).
const ROUTE_COLORS = ["#c62828", "#1565c0", "#2e7d32", "#ef6c00", "#6a1b9a", "#00838f",
    "#ad1457", "#5d4037", "#455a64", "#827717", "#37474f", "#9e9d24"];

function routeColor(routeId) {
    let h = 0;
    for (const c of String(routeId)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return ROUTE_COLORS[h % ROUTE_COLORS.length];
}
// The hover card: a stop's live arrivals, fetched once per page load and
// then cached (a hover is a peek — the arrivals table already refreshes the
// stops it tracks; the dots it peeks at are usually not among them).
const hoverPredictions = new Map();   // StopID → { name, predictions }
let hoverTok = 0;                     // invalidates in-flight card writes

function hideHoverTip() {
    hoverTok++;
    gHoverTip.hidden = true;
    gHoverTip.innerHTML = "";
}

// Floats above the hovered dot (below, when there is no room), clamped to
// the viewport. Measured while visibility:hidden so it never flickers at
// the corner before it lands.
function positionHoverTip(dot) {
    const r = dot.getBoundingClientRect();
    const w = gHoverTip.offsetWidth;
    const h = gHoverTip.offsetHeight;
    let x = r.left + r.width / 2 - w / 2;
    let y = r.top - h - 10;
    if (y < 8) y = r.bottom + 10;
    gHoverTip.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + "px";
    gHoverTip.style.top = y + "px";
}

function hoverTipHtml(st, pred) {
    const head = `${esc(stopName(st.Name) || "#" + st.StopID)} <small style="opacity:.75">(#${esc(st.StopID)})</small>`;
    if (!pred.predictions.length) return head + "<br><small>no arrivals scheduled</small>";
    const rows = pred.predictions.map(p =>
        `<div><b>${esc(p.route)}</b> · ${esc(p.min)} min <small style="opacity:.75">${esc(p.dir || "")}</small></div>`).join("");
    return head + "<br>" + rows;
}

async function hoverTipFor(dot) {
    const tok = ++hoverTok;
    const st = (allStopsCache || []).find(s => String(s.StopID) === String(dot.getAttribute("data-stop")));
    if (!st) return;
    const show = html => {
        gHoverTip.style.visibility = "hidden";
        gHoverTip.hidden = false;
        gHoverTip.innerHTML = html;
        positionHoverTip(dot);
        gHoverTip.style.visibility = "";
    };
    let pred = hoverPredictions.get(st.StopID);
    if (pred) { show(hoverTipHtml(st, pred)); return; }     // cached: instant
    show(`${esc(stopName(st.Name) || "#" + st.StopID)} <small style="opacity:.75">(#${esc(st.StopID)})</small><br>loading…`);
    try {
        pred = await fetchPredictions(st.StopID);
        hoverPredictions.set(st.StopID, pred);
    } catch (e) {
        pred = null;
    }
    if (tok !== hoverTok || !dot.isConnected) return;       // card moved on, or the row was redrawn
    show(pred ? hoverTipHtml(st, pred)
              : `${esc(stopName(st.Name) || "#" + st.StopID)}<br><small>couldn't load arrivals</small>`);
}

// Piece 11: the stop markers (dots + the anchor/terminal diamonds) reveal
// on hover, tap, and keyboard focus. They are redrawn on every
// renderLines(), so the card is driven by delegated handlers on the
// .lines-scroll wrapper (it survives re-renders). Overlapping dots stay
// reachable: every marker is tabbable, and the "View all stops" list
// names every occurrence anyway.
const BT_STOP = ".bt-stop";
gLinesScroll.addEventListener("mouseover", e => {
    const dot = e.target.closest(BT_STOP);
    if (dot) hoverTipFor(dot);
});
gLinesScroll.addEventListener("mouseout", e => {
    const from = e.target.closest(BT_STOP);
    if (!from) return;
    const to = e.relatedTarget;
    if (to && to.nodeType === 1 && to.closest(BT_STOP)) return;   // marker→marker: the new one takes over
    hideHoverTip();
});
gLinesScroll.addEventListener("click", e => {
    const dot = e.target.closest(BT_STOP);
    if (dot) hoverTipFor(dot);
    else hideHoverTip();   // tapping/clicking off a marker dismisses the card
});
gLinesScroll.addEventListener("focusin", e => {
    const dot = e.target.closest(BT_STOP);
    if (dot) hoverTipFor(dot);
});
gLinesScroll.addEventListener("focusout", e => {
    const from = e.target.closest(BT_STOP);
    if (!from) return;
    const to = e.relatedTarget;
    if (to && to.nodeType === 1 && to.closest(BT_STOP)) return;
    hideHoverTip();
});
gLinesScroll.addEventListener("keydown", e => {
    if (e.key === "Escape") hideHoverTip();
});
// The "View all stops" disclosure: toggle the row's list and remember the
// choice so the 30 s re-render keeps it open.
gLinesScroll.addEventListener("click", e => {
    const btn = e.target.closest(".bt-allstops");
    if (!btn) return;
    const rowEl = btn.closest(".board-row");
    const ul = rowEl ? rowEl.querySelector(".bt-stoplist") : null;
    const attr = rowEl ? rowEl.getAttribute("data-rowkey") : null;
    const key = attr ? decodeURIComponent(attr) : null;
    if (!ul || !key) return;
    const open = ul.hasAttribute("hidden");
    if (open) expandedStops.add(key); else expandedStops.delete(key);
    if (open) {
        ul.removeAttribute("hidden");
        if (ul.dataset && ul.dataset.metroFrom && !ul.dataset.loaded)
            loadMetroStops(ul);
    } else {
        ul.setAttribute("hidden", "");
    }
    btn.setAttribute("aria-expanded", open ? "true" : "false");
});
// A row scrolling out from under the cursor also retires the card.
gLinesScroll.addEventListener("scroll", hideHoverTip, true);

// Piece 12 (narrow screens): on a phone the board overflows the shared
// scroller, so center the boarding guide and its immediate approach on each
// paint. A user scroll takes precedence until the selection changes; a
// reduced-motion preference prefers the instant jump over the smooth one.
const REDUCE_MOTION = matchMedia("(prefers-reduced-motion: reduce)");
let boardUserScrolled = false;
let boardAuto = { at: 0, left: null };   // the page's own scroll, with a settling window

function centerBoard() {
    if (boardUserScrolled) return;
    const guide = gLinesScroll.querySelector(".bt-guide");
    if (!guide) return;
    const vw = gLinesScroll.clientWidth || 0;
    if (!vw || gLinesScroll.scrollWidth <= vw) return;   // no overflow: nothing to center
    const x = parseFloat(guide.getAttribute("x1")) || 0;
    const target = Math.max(0, x - vw / 2);
    if (Math.abs((gLinesScroll.scrollLeft || 0) - target) < 2) return;
    boardAuto = { at: Date.now(), left: target };
    if (REDUCE_MOTION.matches) gLinesScroll.scrollLeft = target;
    else gLinesScroll.scrollTo({ left: target, behavior: "smooth" });
}

// Clicking a secondary section heading selects that stop. The redraw puts
// its section FIRST, and this smooths the vertical travel up to the top of
// the arrivals view afterwards (the re-paint itself would jump).
function slideSectionToTop(headEl) {
    const view = document.getElementById("viewArrivals");
    if (!headEl || !headEl.getBoundingClientRect || !view || !view.scrollTo) return;
    const r = headEl.getBoundingClientRect();
    if (!r || !r.height) return;
    const dy = Math.max(0, r.top - (view.getBoundingClientRect().top + 10));
    if (!dy) return;
    try {
        if (REDUCE_MOTION.matches) view.scrollTop += dy;
        else view.scrollTo({ top: view.scrollTop + dy, behavior: "smooth" });
    } catch (e) { /* non-scrollable container: the repaint already moved it */ }
}

// A stop/station change returns the page to the top so the new header is
// immediately visible.
function scrollPageTop() {
    if (typeof window === "undefined" || typeof window.scrollTo !== "function") return;
    const behavior = REDUCE_MOTION.matches ? "auto" : "smooth";
    try { window.scrollTo({ top: 0, behavior }); }
    catch (e) { window.scrollTo(0, 0); }
}

// Re-anchor the board on `id`: update the pick, repaint, and refresh its
// predictions. Shared by the nearby bars and the "View all stops" list.
function selectStop(id, keepPicker) {
    id = String(id || "");
    if (!id) return false;
    if (!keepPicker) resetBusPickers();
    if (String(pickedStop) === id) { refreshPredictions(); return true; }  // already the anchor
    pickedStop = id;
    const inList = stops.find(s => String(s.StopID) === id) || nearbyStopObjs.get(id);
    pickedStopObj = inList || (allStopsCache || []).find(s => String(s.StopID) === id)
        || makeStop(id, null, null, null);
    scrollPageTop();
    noteSelectionChange();     // void the old counterpart before its refresh
    renderLines();             // re-anchors the board: this section lands first…
    refreshPredictions();      // …and its predictions arrive on the next paint
    return true;
}

// Delegated across every paint: a nearby bar selects the named stop (the
// redraw puts it first, then the view glides up). A stop in the expanded
// "View all stops" list re-anchors the board on that stop and refreshes it.
gLinesScroll.addEventListener("click", e => {
    const item = e.target.closest ? e.target.closest(".bt-stop-item") : null;
    if (item && item.dataset && item.dataset.stop) {
        if (mode === "metro") setMetroAnchor(item.dataset.stop);
        else selectStop(item.dataset.stop);
        return;
    }
    const head = e.target.closest ? e.target.closest(".curb-head") : null;
    if (!head || !head.dataset) return;
    if (mode === "metro" && head.dataset.metro) {
        setMetroAnchor(head.dataset.stop);
        return;
    }
    if (mode !== "bus") return;
    // Each nearby bar names its stop; the across counterpart is simply the
    // first bar, with "Across the street" as its location description.
    if (selectStop(head.dataset.stop)) slideSectionToTop(head);
});
gLinesScroll.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const el = e.target.closest ? e.target.closest(".curb-head, .bt-stop-item") : null;
    if (!el || !el.dataset || !el.dataset.stop) return;
    e.preventDefault();
    el.click();
});

// A smooth animation crosses the gap gradually, so position alone cannot tell
// the page's own scroll from a user's: the 1 s window after the page
// initiated the scroll is the page, as is any event still sitting at the
// page's target (a real user scroll moves away from it).
function onBoardScroll() {
    if (boardAuto.left != null) {
        if (Date.now() - boardAuto.at < 1000) return;
        if (Math.abs((gLinesScroll.scrollLeft || 0) - boardAuto.left) < 2) return;
        boardAuto.left = null;
    }
    boardUserScrolled = true;
}
gLinesScroll.addEventListener("scroll", onBoardScroll);

// The stop the board anchors on: the picked stop, else the default corner
// (1002135) when it is in the shown list, else the closest nearby stop
// (shownStops()[0], distance-sorted). With the directory loaded, its entry is
// preferred (canonical name, coordinates, and the full Routes list the
// service rows need). A directory that is still loading or failed must never
// block the board (plan §2) — the stop object at hand is a sufficient
// fallback, and a name can also come from jPredictions.
function anchorStop() {
    const shown = shownStops();
    let want;
    if (pickedStop) {
        want = String(pickedStop);
    } else {
        const def = shown.find(s => String(s.StopID) === DEFAULT_STOP_ID);
        want = String((def || shown[0] || {}).StopID || "");
    }
    if (!want) return null;
    if (allStopsCache) {
        const hit = allStopsCache.find(s => String(s.StopID) === want);
        if (hit) return hit;
    }
    return shownStops().find(s => String(s.StopID) === want) || null;
}

// The home / work / favorite checkboxes in the stop header. Clicking one
// saves this stop in that slot (cookie) and lights the icon up.
function shortcutButtonsHtml(id) {
    return `<div class="board-shortcuts">` + SHORTCUT_SLOTS.map(slot => {
        const saved = shortcuts[slot];
        const on = !!(saved && String(saved.id) === String(id));
        const label = shortcutLabel(slot);
        const text = on ? `Saved as ${label} — click to clear` : `Save this stop as ${label}`;
        return `<button type="button" class="board-shortcut${on ? " active" : ""}"`
            + ` data-shortcut="${slot}" aria-pressed="${on ? "true" : "false"}"`
            + ` title="${text}" aria-label="${text}">`
            + `<i class="fa-solid fa-${slot === "home" ? "house" : slot === "work" ? "briefcase" : "star"}" aria-hidden="true"></i>`
            + `</button>`;
    }).join("") + `</div>`;
}

// Stop header: a dark hero card — eyebrow, name + ID, then the next bus in
// one line. The ETA takes emphasis; the route is a white badge on the dark
// surface (the palette colors are dark enough for white text on them).
// Successive buses on the same route + direction follow the first ETA
// ("9 min then 13 min, 31 min").
function boardHeaderHtml(st, arrivals) {
    const id = String(st.StopID || "");
    const label = st.Name ? stopName(st.Name) : `#${id}`;
    const list = (arrivals || []).slice().sort((a, b) => a.min - b.min);
    const next = list[0] || null;
    const verb = st.Metro ? "Next train" : "Next bus";
    const badgeColor = (route) => st.Metro ? metroLineColor(route) : routeColor(route);
    const badgeLabel = (route) => st.Metro ? metroLineName(route) : route;
    let nextLine;
    if (next) {
        // Same service as the next vehicle: route plus direction.
        const svc = st.Metro
            ? (a) => `${a.route}|${a.heads || a.dir || ""}`
            : (a) => `${a.route}|${a.dirNum || a.heads || a.dir || ""}`;
        const mins = list.filter(a => svc(a) === svc(next)).map(a => a.min);
        const badgeCls = `row-badge${st.Metro ? " metro-line" : ""}`;
        const bits = [
            `<span class="${badgeCls}" style="background:${badgeColor(next.route)}">${esc(badgeLabel(next.route))}</span>`,
            esc(next.heads || next.dir || "")
        ].filter(Boolean).join(" ");
        nextLine = `${verb} ${bits} <span class="bt-next-eta">${esc(fmtEta(mins[0]))}</span>`;
        if (mins.length > 1)
            nextLine += ` <span class="bt-next-rest">then ${mins.slice(1).map(m => esc(fmtEta(m))).join(", ")}</span>`;
    } else if (st.Error) {
        nextLine = `${verb} <span class="text-muted">arrivals unavailable — retrying</span>`;
    } else {
        // No live prediction: test the schedule and show the next scheduled
        // arrival explicitly as "not seen".
        const sched = st.MetroScheduledNext || nextScheduledFor(id);
        if (sched) {
            const schedBits = [
                `<span class="row-badge${st.Metro ? " metro-line" : ""}" style="background:${badgeColor(sched.route)}">${esc(badgeLabel(sched.route))}</span>`,
                esc(sched.heads || sched.dirText || "")
            ].filter(Boolean).join(" ");
            nextLine = `${verb} ${schedBits} <span class="bt-next-eta">${esc(fmtScheduleTime(sched.at))}</span>`
                + ` <span class="bt-next-rest">not seen</span>`;
        } else {
            nextLine = `${verb} <span class="text-muted">no arrival or departure</span>`;
        }
    }
    return `<div class="board-stophead">`
        + shortcutButtonsHtml(id)
        + `<div><span class="board-stopname">${esc(label)}</span>`
        + (st.Name ? `<span class="board-stopid">#${esc(id)}</span>` : "")
        + `</div>`
        + `<div class="board-next">${nextLine}</div>`
        + `<button type="button" class="board-share" title="Open in Maps" aria-label="Open in Maps">`
        + `<i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i></button>`
        + `</div>`;
}

// Piece 8: turn a row's predictions into track markers. Each prediction
// gets one marker: a FILLED circle at the vehicle's last sample when that
// sample is fresh (≤ 120 min) and projects close to the row's path,
// otherwise a HOLLOW circle estimated from the ETA (ETA × 8 mph upstream of
// the boarding stop; a 0-min ETA sits on the guide). Markers clamp to the
// row's drawn extent, so a long-ETA bus never lands off the track.
const BUS_EST_FT_PER_MIN = 704;          // 8 mph ≈ 704 ft/min
const BUS_SAMPLE_MAX_AGE_MS = 120 * 60000;   // plan §3: the freshness gate
const BUS_OFF_TOL_FT = 300;              // samples this far off the path (a
                                          // parallel road, another branch) are
                                          // not markers for this row

// The position row a prediction refers to: a TripID match is the exact run;
// a VehicleID match is the best effort (covers predictions without a trip).
// A route match is required, and a conflicting DirectionNum rejects (a
// vehicle switched to the opposite direction of the same route).
function posRowFor(pred, posRows) {
    if (!pred || !posRows || !posRows.length) return null;
    const rt = String(pred.route || "");
    const tt = String(pred.trip || "");
    const vt = String(pred.vehicle || "");
    let byVehicle = null;
    for (const r of posRows) {
        if (!r || String(r.route || "") !== rt) continue;
        if (pred.dirNum !== "" && pred.dirNum != null && r.dirNum !== "" &&
            String(pred.dirNum) !== String(r.dirNum)) continue;
        if (tt && r.trip && String(r.trip) === tt) return r;
        if (!byVehicle && vt && r.vehicle && String(r.vehicle) === vt) byVehicle = r;
    }
    return byVehicle;
}

// g = the row's boardGeometry entry; scale = the board's shared px/ft.
// posRows = [] when the feed is stale (renderBoardNow applies the gate).
function buildBusMarkers(row, g, scale, posRows, now) {
    const markers = [];
    if (!g || !g.hasTrack || !row.pattern || !g.stops.length || !(scale > 0)) return markers;
    let minFt = Infinity, maxFt = -Infinity;
    for (const s of g.stops) {
        const ft = s.x / scale;
        if (ft < minFt) minFt = ft;
        if (ft > maxFt) maxFt = ft;
    }
    const clamp = (ft) => Math.max(minFt, Math.min(maxFt, ft));
    for (const pred of row.preds || []) {
        if (!pred) continue;
        const min = Math.max(0, Number(pred.min));
        if (!Number.isFinite(min)) continue;
        const pr = posRowFor(pred, posRows);
        let m = null;
        if (pr && pr.lat != null && now - (pr.at || 0) <= BUS_SAMPLE_MAX_AGE_MS) {
            const pj = pointOnTrack(row.pattern, row.anchorIdx, g.mode, pr.lat, pr.lon);
            if (pj && pj.off <= BUS_OFF_TOL_FT) m = { x: clamp(pj.ft) * scale, min, live: true };
        }
        if (!m) m = { x: clamp(-min * BUS_EST_FT_PER_MIN) * scale, min, live: false };
        markers.push(m);
    }
    return markers;
}

// Paint the board from fully resolved inputs. Sections, top to bottom:
// the selected stop's rows (no heading — the boarding stop card above names
// it), then each nearby stop within 500 ft under its own dark separator bar.
// The confirmed opposite-side stop is the FIRST nearby stop and its bar reads
// "Across the street" instead of a distance.
// Sort live and scheduled-fallback rows together by the soonest time.
function sortRowsBySoonest(rows, anchorId, now) {
    for (const r of rows) {
        if (!r.departed && (!r.mins || !r.mins.length))
            r.scheduled = r.scheduled || nextScheduledFor(anchorId, r.route, r.dirNum, r.dest);
    }
    const effMin = (r) => {
        if (r.mins && r.mins.length) return r.mins[0];
        if (r.scheduled) return (r.scheduled.at - now) / 60000;
        return Infinity;
    };
    rows.sort((a, b) => effMin(a) - effMin(b)
        || String(a.route).localeCompare(String(b.route))
        || String(a.dirNum).localeCompare(String(b.dirNum)));
    return rows;
}

function renderBoardNow(anchorId, arrivals, routeDetails, posRows, across, anchorNearby, departedArrivals) {
    // Recently departed buses go above live rows, oldest departure first.
    const nowMs = Date.now();
    const departedPreds = (departedArrivals || []).filter(d => d && d.departed &&
        nowMs >= d.departedAt && nowMs - d.departedAt <= DEPARTED_WINDOW_MS);
    const departedRows = buildBoardRows(anchorId, departedPreds, routeDetails, posRows)
        .filter(r => r.mins && r.mins.length)
        .map(r => {
            r.departed = true;
            r.departedAt = Math.min(...r.preds.map(p => p.departedAt));
            return r;
        })
        .sort((a, b) => a.departedAt - b.departedAt);
    const liveRows = buildBoardRows(anchorId, arrivals, routeDetails, posRows);
    sortRowsBySoonest(liveRows, anchorId, nowMs);
    const mainRows = [...departedRows, ...liveRows];
    // Merge the across-the-street counterpart into the nearby list (first)
    // so it is never shown twice.
    const acrossId = across ? String(across.StopID) : "";
    const nearbyBase = (anchorNearby || []).filter(n => String(n.id) !== acrossId);
    if (across) nearbyBase.unshift({
        id: acrossId, name: across.Name, lat: across.Lat, lon: across.Lon,
        routes: across.Routes || [], distFt: null
    });
    const nearbyRecs = nearbyBase.map(n => {
        const rec = nearbyStopObj(n);
        rec.distFt = n.distFt;
        return rec;
    });
    const nearbyRows = [];
    const nearbyRowCounts = [];
    for (const stp of nearbyRecs) {
        const rows = buildBoardRows(String(stp.StopID), stp.Arrivals || [], routeDetails, posRows);
        sortRowsBySoonest(rows, String(stp.StopID), nowMs);
        nearbyRowCounts.push(rows.length);
        nearbyRows.push(...rows);
    }
    // Board geometry supplies each row's ordered stop list for the
    // "View all stops" disclosure.
    const geo = boardGeometry([...mainRows, ...nearbyRows]);
    // Section headings. The selected stop is already named in the boarding
    // stop card above the board, so its rows need no heading of their own.
    // Every nearby STOP gets its own dark bar: title = the stop's name, sub =
    // "Across the street · #id" for the counterpart or "N ft away · #id".
    // Clicking a bar selects that stop — which slides its section (now first)
    // to the top of the board.
    let nearbyParts = [];
    let off = 0;
    for (let i = 0; i < nearbyRecs.length; i++) {
        const rec = nearbyRecs[i];
        const id = String(rec.StopID);
        // per-stop row count; nearbyRows is already fully built.
        const sliceLen = nearbyRowCounts[i];
        const name = rec.Name || allStopsName(id);
        const where = id === acrossId
            ? "Across the street"
            : (rec.distFt != null ? `${Math.round(rec.distFt)} ft away` : "");
        const subBits = [where, `#${id}`].filter(Boolean);
        nearbyParts.push(`<div class="curb-head" role="button" tabindex="0" data-nearby="1" data-stop="${esc(id)}">`
            + `<div class="curb-head-stop"><div class="curb-main">`
            + `<div class="curb-title">${esc(stopName(name) || "Nearby stop")}</div>`
            + `<div class="curb-sub">${esc(subBits.join(" · "))}</div>`
            + `</div>`
            + `</div></div>`);
        off += sliceLen;
    }
    // Interleave: each nearby stop's rows directly under its own bar.
    let nearbyHtml = "";
    off = 0;
    for (let i = 0; i < nearbyRecs.length; i++) {
        const sliceLen = nearbyRowCounts[i];
        if (nearbyParts[i]) nearbyHtml += nearbyParts[i];
        if (sliceLen) {
            // Final guard: sort this stop's slice immediately before painting,
            // so scheduled fallbacks and predictions always share one order.
            const slice = nearbyRows.slice(off, off + sliceLen);
            sortRowsBySoonest(slice, String(nearbyRecs[i].StopID), nowMs);
            const body = boardHtml({ ...geo, rows: geo.rows.slice(mainRows.length + off) }, slice);
            nearbyHtml += `<div class="nearby-board">${body}</div>`;
        }
        off += sliceLen;
    }
    const mainHtml = mainRows.length
        ? `<div class="main-board">${boardHtml(geo, mainRows)}</div>`
        : "";
    gLinesScroll.innerHTML = (mainRows.length || nearbyRows.length)
        ? mainHtml + nearbyHtml
        : "";
    centerBoard();   // piece 12: boarding guide centered on narrow screens
    gLinesNote.textContent = "";   // no legend line: the board is self-describing
}

// (Re)draw the board: resolve the anchor, paint the header at once, then
// fetch whatever route details are not cached and paint. `boardToken` discards stale results when the
// selection changes mid-flight.
let boardToken = 0;

function renderLines() {
    hideHoverTip();
    const token = ++boardToken;
    const st = anchorStop();
    if (!st) {
        gBoardHeader.innerHTML = "";
        gLinesScroll.innerHTML = "";
        gLinesNote.textContent = "no stops to show — use a shortcut or search a stop name above";
        return;
    }
    const anchorId = String(st.StopID);
    // Live arrivals live on the tracked list stop (what refreshPredictions
    // fills); a directory entry — a raw jStops row — never has them. Keep
    // the directory for identity/name/coords, take Arrivals + Error from
    // the tracked stop so the post-directory re-render keeps predictions.
    const tracked = (pickedStopObj && String(pickedStopObj.StopID) === anchorId)
        ? pickedStopObj
        : shownStops().find(s => String(s.StopID) === anchorId) || null;
    const arr = tracked ? (tracked.Arrivals || []) : [];
    const headSt = tracked
        ? Object.assign({}, st, { Error: tracked.Error || null, Arrivals: arr })
        : st;
    gBoardHeader.innerHTML = boardHeaderHtml(headSt, arr);
    // The directory is NOT a hard dependency (plan §2): if it is not loaded
    // yet, kick off the load and come back for a better name, the Routes
    // list (service rows) and the across-the-street section — but paint
    // whatever we have right now either way.
    if (!allStopsCache)
        loadStopDirectory()
            .then(() => {
                if (token !== boardToken) return;
                renderLines();
                // The directory just gave the anchor coordinates, so nearby
                // stops may be visible for the first time. Fetch their live
                // arrivals now rather than showing scheduled fallbacks until
                // the next 30-second tick.
                const a = anchorStop();
                if (a && nearbyStops(a).some(n => !nearbyStopObj(n).ArrivalsAt))
                    refreshPredictions();
            })
            .catch(() => {});
    // Every route the board should know: the anchor's directory routes, live
    // predictions, and routes that serve any nearby stop. Keeping the nearby
    // routes in the same fetch set makes a stop look the same whether it is
    // the anchor or a secondary section.
    const nearby = nearbyStops(st);
    const routes = [...new Set([
        ...(st.Routes || []),
        ...arr.map(p => p.route),
        ...(acrossStop ? (acrossStop.Routes || []) : []),
        ...nearby.flatMap(n => n.routes || [])
    ].map(r => String(r || "").toUpperCase()).filter(Boolean))];
    const have = {};
    const missing = [];
    for (const r of routes) {
        if (routeDetailsCache[r] !== undefined) have[r] = routeDetailsCache[r];
        else missing.push(r);
    }
    const paint = () => {
        if (token !== boardToken) return;    // the selection moved on mid-flight
        // Bus positions are no longer fetched: the vehicle markers are gone,
        // so the board matches directions from the predictions themselves.
        renderBoardNow(anchorId, arr, have, [], acrossStop, nearby,
            tracked ? (tracked.Departed || []) : []);
        // Plan §2.2: confirm the opposite-side counterpart once the patterns
        // are resolved (it needs them). Sticky — a re-confirmation is a no-op,
        // and a fresh confirmation prompts the counterpart's first fetch.
        confirmAcross(st, have);
    };
    if (!missing.length) {
        paint();
        return;
    }
    Promise.all(missing.map(r => fetchRouteDetails(r)))
        .then(list => {
            list.forEach((e, i) => { have[missing[i]] = e || null; });
            paint();
        });
}


// ════════════════════════════════════════════════════════════════════
// Distance between two GPS points (spherical law of cosines — plenty
// accurate at these scales). Units: "m" miles, "f" feet, "K" km, "N" nautical
// ════════════════════════════════════════════════════════════════════
function distance(lat1, lon1, lat2, lon2, unit) {
    if (lat1 === lat2 && lon1 === lon2) return 0;
    const radlat1 = Math.PI * lat1 / 180;
    const radlat2 = Math.PI * lat2 / 180;
    const radtheta = Math.PI * (lon1 - lon2) / 180;
    let d = Math.sin(radlat1) * Math.sin(radlat2) +
        Math.cos(radlat1) * Math.cos(radlat2) * Math.cos(radtheta);
    d = Math.acos(Math.max(-1, Math.min(1, d))) * 180 / Math.PI * 60 * 1.1515;   // US statute miles
    if (unit === "K") return Math.trunc(d * 1.609344 * 10) / 10;
    if (unit === "N") return Math.trunc(d * 0.8684 * 10) / 10;
    if (unit === "f") return Math.trunc(d * 5280);
    return Math.trunc(d * 10) / 10;        // "m" = miles
}

// ════════════════════════════════════════════════════════════════════
// Clock
// ════════════════════════════════════════════════════════════════════
function fmtClockTime(ms) {
    return new Date(ms).toLocaleTimeString("en-us",
        { hour: "numeric", minute: "2-digit", second: "2-digit" }).replace(/\s?[AP]M$/, "");
}

function tickClock() {
    gClock.textContent = fmtClockTime(Date.now());
    const bits = [lastRefreshAt ? `at ${fmtClockTime(lastRefreshAt)}` : "at —"];
    if (!refreshEnabled) bits.push("auto-refresh off");
    else if (nextRefreshAt)
        bits.push(`refresh in ${Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000))}s`);
    else if (refreshInFlight) bits.push("refreshing…");
    gClockMeta.textContent = bits.join(" ·");
}

function setRefreshEnabled(on) {
    refreshEnabled = on;
    gRefreshToggle.setAttribute("aria-pressed", on ? "true" : "false");
    const label = on ? "Pause timed refresh" : "Resume timed refresh";
    gRefreshToggle.title = label;
    gRefreshToggle.setAttribute("aria-label", label);
    if (!on) {
        if (refreshTimer) clearTimeout(refreshTimer);
        refreshTimer = null;
        nextRefreshAt = 0;
    } else if (mode === "metro" ? metroAnchor : stops.length) {
        scheduleRefresh();
    }
    tickClock();
}
gRefreshToggle.addEventListener("click", () => setRefreshEnabled(!refreshEnabled));

// Access gate: check the password, decode the API key, then start the app.
const gateForm = document.getElementById("gateForm");
if (gateForm) gateForm.addEventListener("submit", async e => {
    e.preventDefault();
    const input = document.getElementById("gateInput");
    const err = document.getElementById("gateError");
    const ok = await unlockAccess(input ? input.value : "");
    if (!ok) {
        if (err) err.textContent = "Incorrect password";
        if (input) { input.value = ""; input.focus(); }
    }
});

// ════════════════════════════════════════════════════════════════════
// Go
// ════════════════════════════════════════════════════════════════════
tickClock();
setInterval(tickClock, 1000);
showGate();
</script>
