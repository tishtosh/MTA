function nearbyStops(st) {
    if (!st || st.Lat == null || st.Lon == null) return [];
    const aId = String(st.StopID);
    let pool;
    if (!stopListFromURL && stops.some(s => String(s.StopID) === aId)) {
        pool = stops.filter(s => String(s.StopID) !== aId).map(stopRec);
        for (const r of pool) {
            const t = stops.find(s => String(s.StopID) === r.id);
            r.distFt = t ? (typeof t.Distance === "number" ? t.Distance : 0)
                         : distance(st.Lat, st.Lon, r.lat, r.lon, "f");
        }
    } else {
        pool = (allStopsCache || []).filter(s =>
            s.Lat != null && s.Lon != null && String(s.StopID) !== aId)
             .map(stopRec)
             .map(r => Object.assign(r, { distFt: distance(st.Lat, st.Lon, r.lat, r.lon, "f") }));
    }
    return pool.filter(r => r.distFt <= NEARBY_MAX_FT)
               .sort((a, b) => a.distFt - b.distFt || a.name.localeCompare(b.name));
}

// ── Board geometry (plan §3) ──────────────────────────────────────────
// Schematic signed along-route distance from the boarding occurrence:
// stops the bus passes before the anchor sit LEFT of the shared boarding x
// (the approach), the terminal RIGHT, and every row of both curb sections
// shares ONE pixels-per-foot scale, so the boarding guides line up.
// Distance is the cumulative arc along the published shape when the stops'
// projections follow the published stop order; otherwise the straight-line
// distance between consecutive ordered stops (plan §3, first bullet).

const BOARD_MAX_SIDE_PX = 280;      // the board's longest path scales to this
const BOARD_MIN_EXTENT_FT = 3000;   // short/terminal-only routes: scale floor
const BOARD_MIN_EXTENT_PX = 120;    // …and the baseline extends at least this fa-regular each side
const LAT_FT_PER_DEG = 364000;      // feet per degree of latitude (local projection)

// Flat feet-space around a reference point — good enough for projection.
function localXY(pt, ref) {
    const kx = LAT_FT_PER_DEG * Math.cos(ref.lat * Math.PI / 180);
    return { x: (pt.lon - ref.lon) * kx, y: (pt.lat - ref.lat) * LAT_FT_PER_DEG };
}

// Arc position (ft along the shape polyline) of the nearest point on the
// shape to a stop; null when the shape is empty/too short.
function projArcOnShape(stop, shape, cum, ref) {
    if (shape.length < 2 || stop.lat == null || stop.lon == null) return null;
    const p = localXY(stop, ref);
    let best = null;
    for (let i = 1; i < shape.length; i++) {
        const a = localXY(shape[i - 1], ref), b = localXY(shape[i], ref);
        const dx = b.x - a.x, dy = b.y - a.y;
        const L2 = dx * dx + dy * dy;
        let t = L2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2 : 0;
        t = Math.max(0, Math.min(1, t));
        const qx = a.x + t * dx, qy = a.y + t * dy;
        const d2 = (qx - p.x) * (qx - p.x) + (qy - p.y) * (qy - p.y);
        if (!best || d2 < best.d2) best = { d2, arc: cum[i - 1] + t * (cum[i] - cum[i - 1]) };
    }
    return best ? best.arc : null;
}

// Cumulative distance (ft) to each stop occurrence of one pattern.
// mode "shape" = projected onto the published shape — accepted only when the
// projections follow the published stop order (50 ft tolerance); otherwise
// mode "stops" = accumulated straight-line legs between consecutive stops.
function trackArcs(pattern) {
    const stops = (pattern && pattern.stops) || [];
    if (!stops.length) return { arc: [], mode: "none" };
    const shape = (pattern && pattern.shape) || [];
    if (shape.length >= 2) {
        const ref = shape[0];
        const cum = [0];
        for (let i = 1; i < shape.length; i++)
            cum.push(cum[i - 1] + distance(shape[i - 1].lat, shape[i - 1].lon, shape[i].lat, shape[i].lon, "f"));
        const proj = stops.map(s => projArcOnShape(s, shape, cum, ref));
        if (proj.every(v => v != null)) {
            let mono = true;
            for (let i = 1; i < proj.length; i++)
                if (proj[i] < proj[i - 1] - 50) { mono = false; break; }
            if (mono) return { arc: proj, mode: "shape" };
        }
    }
    const arc = [0];
    for (let i = 1; i < stops.length; i++) {
        const leg = stops[i - 1].lat != null && stops[i].lat != null
            ? distance(stops[i - 1].lat, stops[i - 1].lon, stops[i].lat, stops[i].lon, "f") : 0;
        arc.push(arc[i - 1] + leg);
    }
    return { arc, mode: "stops" };
}

// One row's layout in feet: signed distance from the anchor occurrence to
// every stop occurrence, the extent on each side, and the terminal
// occurrence (the pattern's last stop).
function rowLayout(pattern, anchorIdx) {
    const { arc, mode } = trackArcs(pattern);
    const a = arc[anchorIdx] || 0;
    const signed = arc.map(v => v - a);
    let negFt = 0, posFt = 0;
    for (const v of signed) { if (v < 0) negFt = Math.max(negFt, -v); else posFt = Math.max(posFt, v); }
    return { mode, signed, negFt, posFt, termIdx: signed.length - 1 };
}

// One scale for the whole board: the longest path across all rows (both
// curb sections) maps to BOARD_MAX_SIDE_PX; a floor keeps short routes from
// collapsing to a dot.
function boardScale(layouts) {
    let maxFt = 0;
    for (const l of layouts || []) if (l) maxFt = Math.max(maxFt, l.negFt, l.posFt);
    return BOARD_MAX_SIDE_PX / Math.max(maxFt, BOARD_MIN_EXTENT_FT);
}

// Pixel geometry for every board row: per-stop x (shared scale, anchor at 0),
// the baseline extents (padded to the minimum), and the terminal x.
// Compact rows (no pattern) carry no track.
function boardGeometry(rows) {
    const trackable = (r) => r && (r.kind === "track" || r.kind === "service") && r.pattern;
    const layouts = (rows || []).map(r => trackable(r) ? rowLayout(r.pattern, Math.max(0, r.anchorIdx | 0)) : null);
    const scale = boardScale(layouts.filter(Boolean));
    return {
        scale,
        rows: (rows || []).map((r, i) => {
            const l = layouts[i];
            if (!l || !r) return { row: r, hasTrack: false };
            const aIdx = Math.max(0, r.anchorIdx | 0);
            const stops = l.signed.map((v, j) => {
                const s = r.pattern.stops[j] || {};
                return { id: s.id, name: s.name, x: v * scale,
                         anchor: j === aIdx, terminal: j === l.termIdx };
            });
            return {
                row: r, hasTrack: true, mode: l.mode, stops,
                negPx: Math.max(l.negFt * scale, BOARD_MIN_EXTENT_PX),
                posPx: Math.max(l.posFt * scale, BOARD_MIN_EXTENT_PX),
                termX: stops[l.termIdx] ? stops[l.termIdx].x : 0,
                termId: stops[l.termIdx] ? stops[l.termIdx].id : ""
            };
        })
    };
}

// Piece 8: project an arbitrary (lat, lon) — a live vehicle sample — onto a
// row's track axis. Same convention as rowLayout: signed feet from the
// anchor along the path rowLayout used (the published shape in mode
// "shape", the ordered stop chain in mode "stops"); positive = past the
// anchor, negative = the approach side where approaching buses sit. Also
// returns `off`, the perpendicular distance (ft) from the sample to that
// path, so callers can reject samples that are really on a parallel road or
// a different branch of the same route.
function pointOnTrack(pattern, anchorIdx, mode, lat, lon) {
    if (!pattern || !Number.isFinite(lat) || !Number.isFinite(lon)) return null;
    const aIdx = Math.max(0, anchorIdx | 0);
    const useShape = mode === "shape" && pattern.shape && pattern.shape.length >= 2;
    let src = useShape ? pattern.shape : pattern.stops;
    if (useShape) src = src.filter(p => p && Number.isFinite(p.lat) && Number.isFinite(p.lon));
    if (src.length < 2) return null;
    const refPt = src.find(p => Number.isFinite(p.lat) && Number.isFinite(p.lon)) || src[0];
    const ref = { lat: refPt.lat, lon: refPt.lon };
    const cum = [0];
    for (let i = 1; i < src.length; i++) {
        const leg = Number.isFinite(src[i - 1].lat) && Number.isFinite(src[i].lat)
            ? distance(src[i - 1].lat, src[i - 1].lon, src[i].lat, src[i].lon, "f") : 0;
        cum.push(cum[i - 1] + leg);
    }
    const nearest = (pl, pn) => {
        const p = localXY({ lat: pl, lon: pn }, ref);
        let best = null;
        for (let i = 1; i < src.length; i++) {
            const a = localXY(src[i - 1], ref), b = localXY(src[i], ref);
            const dx = b.x - a.x, dy = b.y - a.y;
            const L2 = dx * dx + dy * dy;
            let t = L2 ? ((p.x - a.x) * dx + (p.y - a.y) * dy) / L2 : 0;
            // off = perpendicular distance to the segment's LINE (unclamped
            // t), so a sample axially past an endpoint — a bus that has run
            // past the terminal — is not misread as off-route; the arc below
            // still uses the clamped t.
            const off = L2
                ? Math.abs((p.y - a.y) * dx - (p.x - a.x) * dy) / Math.sqrt(L2)
                : Math.hypot(p.x - a.x, p.y - a.y);
            const tc = Math.max(0, Math.min(1, t));
            const qx = a.x + tc * dx, qy = a.y + tc * dy;
            const d2 = (qx - p.x) * (qx - p.x) + (qy - p.y) * (qy - p.y);
            if (!best || d2 < best.d2)
                best = { d2, off, arc: cum[i - 1] + tc * (cum[i] - cum[i - 1]) };
        }
        return best ? { arc: best.arc, off: best.off } : null;
    };
    const n = nearest(lat, lon);
    if (!n) return null;
    const aStop = pattern.stops[aIdx];
    // In shape mode the anchor's arc is its projection on the shape — exactly
    // what trackArcs/projArcOnShape used to place the stop dots, so the
    // marker shares their scale; in stops mode the anchor IS a chain vertex.
    const anchorArc = useShape
        ? (aStop && Number.isFinite(aStop.lat) ? (nearest(aStop.lat, aStop.lon) || { arc: 0 }).arc : 0)
        : cum[aIdx] || 0;
    return { ft: n.arc - anchorArc, off: n.off };
}

// ── Board drawing (plan §3) ──────────────────────────────────────────
// One HTML row per pattern: a route badge, the final destination below it,
// then the ETAs (the first emphasized, the rest ascending), all left-aligned.
// The "View all stops" disclosure reveals the ordered stop list.

// "3 min" / "Due" — a zero-minute prediction reads "Due" (plan §2).
function fmtEta(min) {
    const m = Math.max(0, Math.round(min));
    return m === 0 ? "Due" : `${m} min`;
}

// The first ETA emphasized, the later ones muted after it
// ("6 min then 14 min, 29 min"). With no prediction but a scheduled arrival,
// show that clock time with a "not seen" suffix instead.
function statusChipHtml(status) {
    if (!status) return "";
    const cls = status.toLowerCase().replace(/\s+/g, "-");
    return ` <span class="status-chip status-${esc(cls)}">${esc(status)}</span>`;
}

// Sub-minute hero departure: 1 s countdown plus a 10 s API poll until the
// prediction is replaced or disappears.
let heroCountdownTimer = null;
let heroPollTimer = null;
let heroCountdownKey = "";
let heroCountdownDeadline = 0;

function clearHeroCountdown() {
    if (heroCountdownTimer) clearInterval(heroCountdownTimer);
    if (heroPollTimer) clearTimeout(heroPollTimer);
    heroCountdownTimer = null;
    heroPollTimer = null;
    heroCountdownKey = "";
    heroCountdownDeadline = 0;
}

function startHeroCountdown(st, arrivals) {
    refreshEtaMinutes(arrivals);
    const next = (arrivals || []).slice().sort((a, b) => a.min - b.min)[0];
    const span = document.querySelector("#boardHeader .hero-countdown");
    if (!next || next.min > 1 || !span) { clearHeroCountdown(); return; }
    const id = st && (st.Code || st.StopID);
    const key = [mode, id, next.route, next.trip || "", next.heads || next.dir || ""].join("|");
    if (key !== heroCountdownKey) {
        heroCountdownKey = key;
        heroCountdownDeadline = Number.isFinite(etaAtOf(next)) && etaAtOf(next) > Date.now() + 500
            ? etaAtOf(next) : Date.now() + 60000;
    }
    if (heroCountdownTimer) clearInterval(heroCountdownTimer);
    const tick = () => {
        const el = document.querySelector("#boardHeader .hero-countdown");
        if (!el) { clearHeroCountdown(); return; }
        const ms = heroCountdownDeadline - Date.now();
        const chip = document.querySelector("#boardHeader .status-chip:not(.hero-countdown)");
        if (ms <= 0) {
            const chipText = chip ? chip.textContent.trim() : "";
            if (/arriving|boarding/i.test(chipText)) {
                // The API still says the vehicle is arriving/boarding; the
                // local timer is only an estimate. Keep the server status and
                // mark the time as NOW until the feed changes or drops it.
                chip.style.display = "";
                el.style.display = "";
                el.className = "status-chip status-now hero-countdown";
                el.textContent = "Now";
                return;
            }
            if (/departing/i.test(chipText)) {
                // Server already says departing: keep that single chip.
                el.style.display = "none";
                return;
            }
            if (chip) chip.style.display = "none";
            el.style.display = "";
            el.className = "status-chip status-departing hero-countdown";
            el.textContent = "Departing";
            return;
        }
        el.style.display = "";
        const secs = Math.max(0, Math.ceil(ms / 1000));
        el.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
    };
    tick();
    heroCountdownTimer = setInterval(tick, 1000);
    if (heroPollTimer) clearTimeout(heroPollTimer);
    const poll = () => {
        heroPollTimer = setTimeout(() => {
            heroPollTimer = null;
            if (!document.querySelector("#boardHeader .hero-countdown")) {
                clearHeroCountdown();
                return;
            }
            Promise.resolve(refreshActive()).finally(() => {
                if (document.querySelector("#boardHeader .hero-countdown") && !heroPollTimer)
                    poll();
            });
        }, 10000);
    };
    poll();
}

function etaToken(m) {
    return m === 0 ? "Due" : String(m);
}

// Absolute arrival time is the source of truth. Providers set etaAt (epoch
// ms); min is a presentation value recomputed from it at every paint so a
// 30 s poll still counts down correctly between requests.
function etaAtOf(p) {
    if (!p || typeof p !== "object") return NaN;
    if (Number.isFinite(p.etaAt)) return p.etaAt;
    if (Number.isFinite(p.at)) return p.at;
    if (Number.isFinite(p.min)) {
        const base = Number.isFinite(p.observedAt) ? p.observedAt
            : (Number.isFinite(p.fetchedAt) ? p.fetchedAt : NaN);
        if (Number.isFinite(base)) return base + p.min * 60000;
    }
    return NaN;
}

function etaMinutes(p, now) {
    const at = etaAtOf(p);
    if (Number.isFinite(at)) return Math.max(0, Math.round((at - (now || Date.now())) / 60000));
    const n = Number(p && p.min);
    return Number.isFinite(n) ? Math.max(0, n) : 0;
}

function refreshEtaMinutes(list, now) {
    const at = now || Date.now();
    for (const p of list || []) {
        if (!p) continue;
        p.min = etaMinutes(p, at);
    }
    return list;
}

function predictionRank(p) {
    if (!p || etaMinutes(p) > 1) return 3;
    const s = String(p.status || "").toLowerCase();
    if (/departing/.test(s)) return 0;
    if (/arriving/.test(s)) return 1;
    if (/boarding/.test(s)) return 2;
    return 3;
}

function heroStatusRank(row) {
    const s = String((row && row.status) || "").toLowerCase();
    if (row && row.departed) return 9;
    if (/departing/.test(s)) return 1;
    if (/arriving/.test(s)) return 2;
    if (/boarding/.test(s)) return 2;
    return 3;
}

function sortHeroRows(rows, anchorId, now) {
    sortRowsBySoonest(rows, anchorId, now);
    rows.sort((a, b) => heroStatusRank(a) - heroStatusRank(b));
    return rows;
}

function statusReplacesDue(status) {
    return /arriving|boarding|departing/i.test(String(status || ""));
}

function boardEtasHtml(mins, scheduled, departedAt, status) {
    if (departedAt) {
        const ago = Math.max(0, Math.round((Date.now() - departedAt) / 60000));
        return `<span class="status-chip status-departed">Departed</span>`
            + (ago ? ` <span class="board-eta-note">${ago} min ago</span>` : "");
    }
    let list = (mins || []).slice(0, 8);
    if (list.length && list[0] === 0 && statusReplacesDue(status)) list = list.slice(1);
    if (!list.length) {
        if (statusReplacesDue(status)) return "";
        if (scheduled)
            return `<span class="board-eta">${esc(fmtScheduleTime(scheduled.at))}</span>`
                + ` <span class="board-eta-note">not seen</span>`;
        return `<span class="board-eta-note">no arrival or departure</span>`;
    }
    const first = list[0];
    const soon = Number.isFinite(first) && first <= 5;
    let h = `<span class="${soon ? "board-eta-soon" : "board-eta"}">${esc(fmtEta(first))}</span>`;
    if (list.length > 1) {
        h += ` <span class="board-eta">then `
            + `${list.slice(1).map(etaToken).join(", ")} min</span>`;
    }
    return h;
}

// Piece 11: which rows the user expanded in the "View all stops" disclosure.
// The board re-renders every 30 s, so the open rows are remembered by key.
const expandedStops = new Set();
const rowKey = (r) => `${r.route}\u0000${String(r.dirNum ?? "")}\u0000${r.dest || ""}${r.departed ? "\u0000departed" : ""}`;

// One row's header: a route badge (white on the route color), the final
// destination below it, then the ETA list, all left-aligned from the badge.
// Track rows also carry the stop-list chevron on the route badge (piece 11).
function boardRowHead(row, color, g, k, scheduled) {
    const dest = (row.kind === "track" || row.kind === "service")
        ? (row.dest ? esc(row.dest) : "")
        : esc(row.dest || row.dir || "");
    const departed = !!row.departed;
    const badgeText = row.metro ? metroLineName(row.routeRef || row.route) : row.route;
    const hasMbtaTrip = typeof cityProvider().tripStops === "function" &&
        !row.metro && row.rep && row.rep.trip;
    const hasList = (g && g.hasTrack && (g.stops || []).length >= 2) ||
        (row.metro && row.toCode) || hasMbtaTrip;
    const chevron = hasList
        ? ` <i class="fa-solid fa-chevron-down bt-chevron" aria-hidden="true"></i>`
        : "";
    const badgeClass = `row-badge${row.metro ? " metro-line" : busBadgeClass()}${departed ? " hollow" : ""}${hasList ? " bt-allstops" : ""}`;
    const badgeTag = hasList ? "button" : "span";
    const badgeAttrs = hasList
        ? ` type="button" class="${badgeClass}" aria-expanded="${expandedStops.has(k)}"`
        : ` class="${badgeClass}"`;
    const badgeInner = `${esc(badgeText)}${chevron}`;
    const hollowColor = row.metro ? color
        : (busTextColor(row.route) === "#000" ? "#000" : color);
    const badge = departed
        ? `<${badgeTag}${badgeAttrs} style="color:${hollowColor};border-color:${color}">${badgeInner}</${badgeTag}>`
        : `<${badgeTag}${badgeAttrs} style="background:${color};color:${row.metro ? "#fff" : busTextColor(row.route)}">${badgeInner}</${badgeTag}>`;
    return `<div class="board-head">`
        + `<span class="row-badge-wrap">${badge}</span>`
        + `<div class="row-mainline">`
        + (dest ? `<span class="board-dest">${dest}</span>` : `<span class="board-dest">Destination unavailable</span>`)
        + `</div>`
        + (departed ? "" : statusChipHtml(row.status))
        + ((row.mins && row.mins.length) || (g && g.hasTrack) || scheduled || departed
            ? `<span class="board-etas">${boardEtasHtml(row.mins, scheduled, row.departedAt, row.status)}</span>` : "")
        + `</div>`;
}

// The whole board as HTML: one row block per pattern (badge, destination,
// ETAs, and the optional stop list). The caller wraps the result in the
// shared scroll container.
function boardHtml(geom, rows) {
    let out = "";
    for (let i = 0; i < (rows || []).length; i++) {
        const row = rows[i], g = geom.rows[i];
        const color = routeColor(row.route);
        row.anchorId = (row.anchorPatStop || {}).id || row.anchorId;
        const k = rowKey(row);
        const open = expandedStops.has(k);
        // No live prediction for this row? Fall back to the stop's next
        // scheduled arrival, matched by route (+ direction). Departed rows
        // keep their own status instead.
        const scheduled = (!row.departed && (!row.mins || !row.mins.length))
            ? (row.scheduled || nextScheduledFor(row.anchorId, row.route, row.dirNum, row.dest))
            : null;
        // Piece 11: the ordered stop list behind the badge chevron.
        // No numeric index; each stop is a button that re-anchors the board.
        const trip = row.rep && row.rep.trip;
        const mbtaList = (typeof cityProvider().tripStops === "function" &&
            !row.metro && trip)
            ? `<ul class="bt-stoplist"${open ? "" : " hidden"}`
              + ` data-trip="${esc(trip)}" data-line="${esc(row.route)}"`
              + ` data-anchor="${esc(row.anchorId || "")}">`
              + (open ? `<li class="bt-stop-item">loading stops…</li>` : "")
              + `</ul>`
            : "";
        const list = g && g.hasTrack && (g.stops || []).length >= 2
            ? (() => {
                const term = g.stops.find(s => s.terminal)
                    || g.stops[g.stops.length - 1];
                const originRow = g.stops.find(s => s.anchor)
                    || g.stops.find(s => String(s.id) === String(row.anchorId));
                const actions = term ? routeActionsHtml("bus", row.route,
                    row.anchorId, originRow ? originRow.name : "",
                    term.id, term.name) : "";
                return `<ul class="bt-stoplist"${open ? "" : " hidden"}>`
                  + (actions ? `<li class="route-actions-item">${actions}</li>` : "")
                  + g.stops.map(s => {
                      const mark = s.anchor ? ` <b class="bt-mark">your stop</b>`
                         : s.terminal ? ` <b class="bt-mark">terminal</b>` : "";
                      return `<li class="bt-stop-item" role="button" tabindex="0" data-stop="${esc(s.id)}">`
                          + `${favStarHtml("bus", s.id, s.name, row.route)}`
                          + `<span class="bt-stop-name">${esc(stopName(s.name) || "#" + s.id)} <small>(${esc(s.id)})</small>${mark}</span>`
                          + `<span class="fav-conns" data-conn="${esc(s.id)}" data-conn-kind="bus" data-conn-route="${esc(row.route)}"></span></li>`;
                }).join("") + `</ul>`;
              })() : mbtaList;
        const rowClass = row.departed ? " is-departed" : (scheduled ? " is-scheduled" : "");
        out += `<div class="board-row${rowClass}" data-rowkey="${encodeURIComponent(k)}" data-row-route="${esc(row.metro ? (row.routeRef || row.route) : row.route)}">`
            + `${boardRowHead(row, color, g, k, scheduled)}${list}</div>`;
    }
    return `<div class="board">${out}</div>`;
}

// Flow
// ════════════════════════════════════════════════════════════════════

function makeStop(id, name, lat, lon) {
    return { StopID: id, Name: name, Lat: lat, Lon: lon, Distance: null, Routes: [], Arrivals: [], Departed: [], ArrivalsAt: 0, Error: null };
}

// One shared object per nearby stop, so predictions fetched for a secondary
// section survive re-renders and match what that stop shows when selected.
function nearbyStopObj(n) {
    const id = String(n.id);
    let s = stops.find(x => String(x.StopID) === id) || nearbyStopObjs.get(id);
    if (!s) {
        s = makeStop(id, n.name || null, n.lat, n.lon);
        nearbyStopObjs.set(id, s);
    }
    if (!s.Name && n.name) s.Name = n.name;
    if (s.Lat == null && n.lat != null) s.Lat = n.lat;
    if (s.Lon == null && n.lon != null) s.Lon = n.lon;
    if (n.routes) s.Routes = n.routes;
    return s;
}

// Full (re)load: resolve the stop list, paint the stop names immediately, then
// fetch its arrivals in the background and repaint when they land.
async function runFlow() {
    if (busy) return;                    // don't stack flows when buttons are clicked
    busy = true;
    try {
        resetPick();                     // a new flow starts from the session's list (any picked stop is undone)
        noteSelectionChange();           // void the old counterpart + any in-flight refresh
        scrollPageTop();
        // Cities without a fixed default stop start from their center when
        // there is no saved Home bookmark and no URL/search point.
        if (!stopListFromURL && !searchPoint && cityCfg().nearbyByDefault
            && !shortcutList(shortcuts.home).length) {
            searchPoint = { lat: cityHome().lat, lon: cityHome().lon };
        }
        if (stopListFromURL && !forceNearby) {
            // ?busstop= given: use it as-is, ignore lat/lon (as documented).
            // Coordinates stay null — the arrivals list never needs them,
            // and the stop directory (the jStops dump) is the coord source.
            stops = stopListFromURL.map(id => makeStop(id, null, null, null));
        } else if (!searchPoint) {
            // First load (or a cleared view): the first saved home bookmark if
            // one exists, otherwise the default stop.
            const home = shortcutList(shortcuts.home)[0];
            stops = home && home.id
                ? [makeStop(String(home.id), home.name || null, null, null)]
                : [defaultStopRec()];
        } else {
            // ?lat&lon URL point: find stops near the search point
            const center = cityCfg().metroCenter || cityCfg().center;
            const d = distance(center.lat, center.lon, searchPoint.lat, searchPoint.lon, "m");
            const at = d > 50 ? center : searchPoint;     // far from the city → search its center
            const where = cityCfg().nearbyLabel || cityCfg().name;
            gStatus.textContent = `${d.toFixed(1)} mi to ${where}` + (at === center ? " (searching city center)" : "") + " …";
            const raw = await fetchStopsNear(at.lat, at.lon, gRadius);
            // Distance is measured from the point we actually searched —
            // NOT from the HOME default, so the URL-point view is honest.
            stops = raw
                .map(s => {
                    const stop = makeStop(s.StopID, s.Name, s.Lat, s.Lon);
                    stop.Distance = distance(at.lat, at.lon, s.Lat, s.Lon, "f");
                    stop.Routes = s.Routes || [];
                    return stop;
                })
                .sort((a, b) => a.Distance - b.Distance);   // sorted; one array, so no index drift
            if (!stops.length) {
                gStatus.textContent = `No stops within ${gRadius} m — try ?radius=600`;
                stops = [];
            }
        }
        // ?busstop= deep link: prefill the entry field with the FIRST listed
        // stop before the first paint, so the initial anchor is correct even
        // while arrivals are still loading. ✕ returns to the nearby search
        // (forceNearby, since the URL would otherwise pick the same stop).
        if (stopListFromURL && stopListFromURL.length && !forceNearby && !pickedStop && stops[0]) {
            const s = stops[0];
            pickedStop = s.StopID;
            acStop.setPicked(true);
        }
        // Paint the stop names immediately; arrivals are fetched in the
        // background and repaint when they land.
        renderLines();
        refreshPredictions().catch(() => {});
    } catch (e) {
        // Stops lookup failed (bad key / network): keep whatever is shown.
        gStatus.textContent = `Could not reach ${cityCfg().agency}: ${e.message}`;
    } finally {
        busy = false;
        scheduleRefresh();
    }
}

function fetchMetroRoutesFresh() {
    if (metroRoutesLoad) return metroRoutesLoad;
    metroRoutesLoad = Promise.resolve(cityProvider().metroRoutes())
        .then(map => {
            if (!map) return null;
            metroRoutesCache = map;
            metroRoutesCacheAt = Date.now();
            writeCache("metroroutes", map);
            return map;
        })
        .finally(() => { metroRoutesLoad = null; });
    return metroRoutesLoad;
}

function loadMetroRoutes() {
    if (!cityCfg().capabilities.metroRoutes) return Promise.resolve(null);
    if (metroRoutesCache) {
        if (Date.now() - metroRoutesCacheAt > TOPOLOGY_TTL_MS)
            fetchMetroRoutesFresh().catch(() => {});
        return Promise.resolve(metroRoutesCache);
    }
    return fetchMetroRoutesFresh();
}

function fetchMetroStationsFresh() {
    if (metroStationsLoad) return metroStationsLoad;
    metroStationsLoad = Promise.resolve(cityProvider().metroStations())
        .then(list => {
            metroStationsCache = (list || [])
                .filter(s => s.Code && Number.isFinite(s.Lat) && Number.isFinite(s.Lon));
            metroStationsCacheAt = Date.now();
            writeCache("stations", metroStationsCache);
            return metroStationsCache;
        })
        .finally(() => { metroStationsLoad = null; });
    return metroStationsLoad;
}

function loadMetroStations() {
    if (metroStationsCache) {
        if (Date.now() - metroStationsCacheAt > TOPOLOGY_TTL_MS)
            fetchMetroStationsFresh().catch(() => {});
        return Promise.resolve(metroStationsCache);
    }
    return fetchMetroStationsFresh();
}

function metroRefPoint() {
    if (searchPoint) return searchPoint;
    const st = anchorStop();
    if (st && st.Lat != null && st.Lon != null)
        return { lat: Number(st.Lat), lon: Number(st.Lon) };
    return cityCfg().metroCenter || cityCfg().center;
}

function populateMetroSelect(stations) {
    if (!gMetroSelect) return;
    gMetroSelect.innerHTML = stations.slice()
        .sort((a, b) => String(a.Name).localeCompare(String(b.Name)))
        .map(s => `<option value="${esc(s.Code)}">${esc(stopName(s.Name) || s.Code)}</option>`)
        .join("");
    if (metroAnchor) gMetroSelect.value = metroAnchor.Code;
}

// Switch mode and update the chrome. Deliberately starts no data flow, so a
// caller can pick the destination first and then run exactly one flow.
function applyMode(next) {
    if (next !== "bus" && next !== "metro") return false;
    const changed = next !== mode;
    mode = next;
    writeModeCookie();
    shortcuts = readShortcutCookie();
    updateShortcutNav();
    clearPendingFocus();
    if (changed) {
        expandedStops.clear();
        gBoardHeader.innerHTML = "";
        gLinesScroll.innerHTML = "";
        gLinesNote.textContent = "";
        showBoardView();
        scrollPageTop();
    }
    return changed;
}

function setMode(next) {
    if (next !== "bus" && next !== "metro") return;
    if (next === mode) return;
    applyMode(next);
    if (mode === "bus") {
        if (allStopsCache) populateBusRoutes(allStopsCache);
        runFlow();
    } else { metroAnchorCode = null; runMetro(); }
}

// City switching: every city has its own data caches, likes, and
// Home/Work bookmarks. Called from Settings and from "Near me".
function hydrateCityCaches() {
    const stops = readCache("stops");
    if (stops && Array.isArray(stops.v)) {
        allStopsCache = stops.v;
        allStopsCacheAt = stops.at;
    }
    const routes = readCache("busroutes");
    if (routes && Array.isArray(routes.v)) {
        busRouteDirectory = routes.v;
        busRouteDirectoryAt = routes.at;
        for (const r of routes.v) {
            if (!r || !r.id) continue;
            if (r.mbtaId) busRouteMbtaIds[r.id] = r.mbtaId;
            if (r.color) busRouteColors[r.id] = r.color;
        }
    }
    const stations = readCache("stations");
    if (stations && Array.isArray(stations.v)) {
        metroStationsCache = stations.v;
        metroStationsCacheAt = stations.at;
    }
    const metroRoutes = readCache("metroroutes");
    if (metroRoutes && metroRoutes.v && typeof metroRoutes.v === "object") {
        metroRoutesCache = metroRoutes.v;
        metroRoutesCacheAt = metroRoutes.at;
    }
    const details = readCache("routedetails");
    if (details && details.v && typeof details.v === "object") {
        for (const id of Object.keys(details.v)) {
            const rec = details.v[id];
            if (!rec || !rec.d) continue;
            routeDetailsCache[id] = rec.d;
            routeDetailsAt[id] = rec.at || details.at;
        }
    }
    const stopSched = readCache("stopschedule");
    if (stopSched && stopSched.v && typeof stopSched.v === "object") {
        for (const id of Object.keys(stopSched.v)) {
            const rec = stopSched.v[id];
            if (rec && rec.day) stopScheduleCache[id] = rec;
        }
    }
    const metroSched = readCache("metroschedule");
    if (metroSched && metroSched.v && typeof metroSched.v === "object") {
        for (const id of Object.keys(metroSched.v)) {
            const rec = metroSched.v[id];
            if (rec && rec.day) metroScheduleCache[id] = rec;
        }
    }
}

function clearCityCaches() {
    allStopsCache = null;
    allStopsCacheAt = 0;
    stopDirLoad = null;
    busRoutesPopulated = false;
    dirNameIndex = null;
    busRouteDirectory = null;
    busRouteDirectoryAt = 0;
    busRouteLoad = null;
    busRouteMbtaIds = {};
    busRouteColors = {};
    metroStationsCache = null;
    metroStationsCacheAt = 0;
    metroStationsLoad = null;
    metroRoutesCache = null;
    metroRoutesCacheAt = 0;
    metroRoutesLoad = null;
    metroLive = {};
    metroLiveAt = {};
    metroLiveError = {};
    metroSchedule = {};
    metroAnchor = null;
    metroNearby = [];
    metroAnchorCode = null;
    for (const k of Object.keys(metroPathCache)) delete metroPathCache[k];
    for (const k of Object.keys(routeDetailsCache)) delete routeDetailsCache[k];
    for (const k of Object.keys(routeDetailsAt)) delete routeDetailsAt[k];
    for (const k of Object.keys(stopScheduleCache)) delete stopScheduleCache[k];
    for (const k of Object.keys(metroScheduleCache)) delete metroScheduleCache[k];
    nearbyStopObjs.clear();
    expandedStops.clear();
    stopConnections.clear();
    stopConnectionsAt.clear();
    stopConnectionsInflight.clear();
    if (typeof cityProvider().resetCaches === "function") cityProvider().resetCaches();
    MTA.http.clearMemo();
    hydrateCityCaches();
    crossNearbyKey = "";
    crossMetroNearby = [];
    crossBusNearby = [];
    favBusFilterToken++;
    stops = [];
    pickedStop = null;
    pickedStopObj = null;
    searchPoint = null;
    forceNearby = false;
    boardToken++;
}

function setCity(next, opts) {
    if (!CITIES[next]) return;
    if (next === city) {
        if (gCitySelect) gCitySelect.value = city;
        return;
    }
    city = next;

    screenHistory = [];

    refreshTimer = null;
    nextRefreshAt = 0;
    gBoardHeader.innerHTML = "";
    gLinesScroll.innerHTML = "";
    gLinesNote.textContent = "";

    tickClock();

        closeFavPanel();
    }

}

async function runMetro() {
    gLinesNote.textContent = "loading Metro stations…";
    try {
        const all = await loadMetroStations();
        populateMetroSelect(all);
        const ref = metroRefPoint();
        let anchor = metroAnchorCode ? all.find(s => s.Code === metroAnchorCode) : null;
        if (!anchor) {
            anchor = all.slice().sort((a, b) =>
                distance(ref.lat, ref.lon, a.Lat, a.Lon, "f") -
                distance(ref.lat, ref.lon, b.Lat, b.Lon, "f"))[0];
        }
        if (!anchor) { gLinesNote.textContent = "no Metro stations found"; return; }
        setMetroAnchor(anchor.Code);
    } catch (e) {
        gStatus.textContent = `Could not load Metro: ${e.message}`;
        gLinesNote.textContent = "Metro data unavailable";
    }
}

function setMetroAnchor(code) {
    const all = metroStationsCache || [];
    const anchor = all.find(s => s.Code === String(code));
    if (!anchor) return;
    showBoardView();
    metroAnchorCode = anchor.Code;
    metroAnchor = Object.assign({}, anchor, { distFt: 0 });
    enterScreen({ type: "board", mode: "metro", id: anchor.Code, name: anchor.Name || "" });
    if (gMetroSelect) gMetroSelect.value = anchor.Code;
    expandedStops.clear();
    scrollPageTop();
    metroNearby = all.filter(s => s.Code !== anchor.Code)
        .map(s => Object.assign({}, s, {
            distFt: distance(anchor.Lat, anchor.Lon, s.Lat, s.Lon, "f")
        }))
        .filter(s => s.distFt <= METRO_NEARBY_FT)
        .sort((a, b) => a.distFt - b.distFt)
        .slice(0, 3);
    renderMetro();
    refreshMetro();
}

// Rail departures: provider-owned (WMATA StationPrediction, MBTA
// /predictions with parent stations, TfL StopPoint arrivals).
async function fetchMetroLive(codes) {
    return cityProvider().metroLive(codes);
}

function metroRowsFor(station, skipFirst) {
    const now = Date.now();
    let live = metroLive[station.Code] || [];
    if (skipFirst && live.length) {
        const next = live.reduce((best, t) =>
            !best || t.min < best.min ? t : best, null);
        const key = t => t.route + "|" + (t.dirNum || "") + "|" + t.heads;
        live = live.filter(t => key(t) !== key(next));
    }
    const rows = [];
    const groups = new Map();
    for (const t of live) {
        const key = t.route + "|" + (t.dirNum || "") + "|" + t.heads;
        let r = groups.get(key);
        if (!r) {
            r = { kind: "compact", route: t.route, routeRef: t.routeRef || t.route,
                  dirNum: t.dirNum || "", dest: t.heads, mins: [], first: 0, metro: true,
                  status: t.status || "",
                  fromCode: station.Code,
                  toCode: metroDestCode(t.heads, t.routeRef || t.route) };
            groups.set(key, r);
            rows.push(r);
        }
        r.mins.push(t.min);
    }
    for (const r of rows) {
        r.mins.sort((a, b) => a - b);
        r.first = r.mins[0];
    }
    const liveHeads = rows.map(r => ({ route: r.route, heads: normHeads(r.dest) }));
    const sched = (metroSchedule[station.Code] || [])
        .filter(d => d.at >= now).sort((a, b) => a.at - b.at);
    const schedGroups = new Map();
    for (const d of sched) {
        const dh = normHeads(d.heads);
        if (liveHeads.some(l => l.route === d.route &&
            metroHeadsMatch(l.heads, dh))) continue;
        const key = d.route + "|" + dh;
        const prev = schedGroups.get(key);
        if (!prev || d.at < prev.scheduled.at)
            schedGroups.set(key, {
                kind: "service", route: d.route, routeRef: d.routeRef || d.route,
                dirNum: d.dirNum || "", dest: d.heads, mins: [], first: 0, metro: true,
                fromCode: station.Code,
                toCode: metroDestCode(d.heads, d.routeRef || d.route),
                scheduled: { at: d.at }
            });
    }
    rows.push(...schedGroups.values());
    sortRowsBySoonest(rows, station.Code, now);
    return rows;
}

function metroDestCode(name, line) {
    const stations = metroStationsCache || [];
    const key = line ? String(line).toLowerCase() : "";
    const onLine = key
        ? stations.filter(s => (s.Lines || []).some(l => String(l).toLowerCase() === key))
        : [];
    const hit = (onLine.length ? onLine : stations)
        .find(s => metroHeadsMatch(s.Name, name));
    return hit ? hit.Code : "";
}

// Rail path: provider-owned. The page keeps the 24 h in-memory cache.
async function fetchMetroPath(from, to, line) {
    const key = from + "|" + to + "|" + (line || "");
    if (metroPathCache[key]) return metroPathCache[key];
    if (metroPathInflight[key]) return metroPathInflight[key];
    const p = cityProvider().metroPath(from, to, line)
        .then(path => {
            metroPathCache[key] = path;
            return path;
        })
        .finally(() => { delete metroPathInflight[key]; });
    metroPathInflight[key] = p;
    return p;
}

async function loadMbtaRowStops(ul) {
    const trip = ul.dataset.trip;
    if (!trip) return;
    ul.dataset.loaded = "1";
    ul.innerHTML = `<li class="bt-stop-item">loading stops…</li>`;
    try {
        const stops = await mbtaTripStops(trip, false);
        const anchor = String(ul.dataset.anchor || "");
        const at = stops.findIndex(s => String(s.StopID) === anchor);
        const shown = at >= 0 ? stops.slice(at + 1) : stops;
        const conns = await loadStopConnections(
            shown.map(s => ({ StopID: s.StopID, kind: "bus" })));
        const line = ul.dataset.line || "";
        const anchorRow = stops.find(s => String(s.StopID) === anchor);
        const terminal = stops[stops.length - 1];
        const label = at >= 0 ? `<span class="bt-next-label">Next stops…</span>` : "";
        const actions = routeActionsHtml("bus", line, anchor,
            anchorRow ? anchorRow.Name : "", terminal ? terminal.StopID : "",
            terminal ? terminal.Name : "", label);
        ul.innerHTML = (actions ? `<li class="route-actions-item">${actions}</li>` : "")
            + (shown.length ? shown.map(s => {
            const id = String(s.StopID);
            const badges = connectionBadgesHtml(conns.get(id), "bus", line);
            return `<li class="bt-stop-item" role="button" tabindex="0" data-stop="${esc(id)}">`
                + `${favStarHtml("bus", id, s.Name, line)}`
                + `<span class="bt-stop-name">${esc(stopName(s.Name) || "#" + id)} <small>(${esc(id)})</small></span>`
                + (badges ? `<span class="fav-conns">${badges}</span>` : "")
                + `</li>`;
        }).join("") : `<li class="bt-stop-item">no further stops</li>`);
    } catch (e) {
        ul.innerHTML = `<li class="bt-stop-item">could not load stops</li>`;
    }
    applyStopNameWidth(ul);
}

async function refreshBoardStopConnections() {
    const hero = gBoardHeader
        ? [...gBoardHeader.querySelectorAll(".fav-conns[data-conn]")] : [];
    const rows = gLinesScroll
        ? [...gLinesScroll.querySelectorAll(".fav-conns[data-conn]")] : [];
    for (const el of [...hero, ...rows]) {
        const conns = await fetchStopConnections(
            el.dataset.connKind || "bus", el.dataset.conn);
        if (el.parentNode) {
            const html = connectionBadgesHtml(conns,
                el.dataset.connKind || "bus", el.dataset.connRoute || "");
            el.innerHTML = html;
            const wrap = el.closest && el.closest(".hero-connections");
            if (wrap) wrap.hidden = !html;
        }
    }
}

async function loadMetroStops(ul) {
    const from = ul.dataset.metroFrom, to = ul.dataset.metroTo;
    if (!from || !to) { ul.innerHTML = ""; return; }
    ul.dataset.loaded = "1";
    ul.innerHTML = `<li class="bt-stop-item">loading stops…</li>`;
    try {
        const line = ul.dataset.line || "";
        const path = await fetchMetroPath(from, to, line);
        const next = path.slice(1);
        const conns = new Map();
        await Promise.all(next.map(async p => {
            conns.set(p.StationCode, await fetchStopConnections("metro", p.StationCode));
        }));
        const fromRow = path[0];
        const toRow = path[path.length - 1];
        const label = path.length ? `<span class="bt-next-label">Next stops…</span>` : "";
        const actions = routeActionsHtml("metro", line, from,
            fromRow ? fromRow.StationName : "",
            to, toRow ? toRow.StationName : "", label);
        ul.innerHTML = (actions ? `<li class="route-actions-item">${actions}</li>` : "")
            + (next.length ? next.map(p => {
            const mark = p.StationCode === to ? ` <b class="bt-mark">terminal</b>` : "";
            const badges = connectionBadgesHtml(conns.get(p.StationCode), "metro", line);
            return `<li class="bt-stop-item" role="button" tabindex="0" data-stop="${esc(p.StationCode)}">`
                + `${favStarHtml("metro", p.StationCode, p.StationName, line)}`
                + `<span class="bt-stop-name">${esc(stopName(p.StationName))} <small>(${esc(p.StationCode)})</small>${mark}</span>`
                + (badges ? `<span class="fav-conns">${badges}</span>` : "")
                + `</li>`;
        }).join("") : `<li class="bt-stop-item">no further stops</li>`);
    } catch (e) {
        ul.innerHTML = `<li class="bt-stop-item">could not load stops</li>`;
    }
    applyStopNameWidth(ul);
}

function metroHeadsMatch(a, b) {
    const A = normHeads(a), B = normHeads(b);
    if (!A || !B) return false;
    // Different terminal numbers mean different places (Heathrow T4 vs T5).
    const na = A.match(/\d+/g) || [];
    const nb = B.match(/\d+/g) || [];
    if (na.length && nb.length && !na.some(n => nb.includes(n))) return false;
    if (A === B || A.includes(B) || B.includes(A)) return true;
    const n = Math.min(6, A.length, B.length);
    return n >= 5 && A.slice(0, n) === B.slice(0, n);
}

function renderMetro() {
    const station = metroAnchor;
    if (!station) {
        gBoardHeader.innerHTML = "";
        gLinesScroll.innerHTML = "";
        gLinesNote.textContent = "no Metro station selected";
        return;
    }
    const now = Date.now();
    for (const code of Object.keys(metroLive)) refreshEtaMinutes(metroLive[code], now);
    const live = (metroLive[station.Code] || []).slice().sort((a, b) => a.min - b.min);
    const nextSched = (metroSchedule[station.Code] || [])
        .filter(d => d.at >= now).sort((a, b) => a.at - b.at)[0] || null;
    const headSt = {
        StopID: station.Code, Name: station.Name, Metro: true,
        Lines: station.Lines || [],
        MetroScheduledNext: nextSched
            ? { at: nextSched.at, route: nextSched.route, heads: nextSched.heads }
            : null,
        Error: metroLiveError[station.Code] || null
    };
    gBoardHeader.innerHTML = heroCardHtml(headSt, live);
    startHeroCountdown(station, live);
    const rowsHtml = (rows) => rows.map(r => {
        const key = rowKey(r);
        const open = expandedStops.has(key);
        const list = r.metro && r.toCode
            ? `<ul class="bt-stoplist"${open ? "" : " hidden"}`
              + ` data-metro-from="${esc(r.fromCode || "")}" data-metro-to="${esc(r.toCode)}"`
              + ` data-line="${esc(r.routeRef || r.route || "")}">`
              + (open ? `<li class="bt-stop-item">loading stops…</li>` : "")
              + `</ul>`
            : "";
        return `<div class="board-row${r.scheduled ? " is-scheduled" : ""}"`
            + ` data-rowkey="${encodeURIComponent(key)}" data-row-route="${esc(r.routeRef || r.route)}">`
            + boardRowHead(r, metroLineColor(r.routeRef || r.route), null, key, r.scheduled)
            + list + `</div>`;
    }).join("");
    const mainRows = metroRowsFor(station, true);
    sortHeroRows(mainRows, station.Code, Date.now());
    const mainHtml = mainRows.length
        ? `<div class="main-board metro-board"><div class="board">${rowsHtml(mainRows)}</div></div>`
        : "";
    let nearbyHtml = "";
    const sections = [];
    for (const stn of metroNearby) {
        const dist = stn.distFt == null ? ""
            : (stn.distFt < 5280 ? `${Math.round(stn.distFt)} ft away`
                                 : `${(stn.distFt / 5280).toFixed(1)} mi away`);
        const rows = metroRowsFor(stn);
        const primaryRoute = (rows[0] && rows[0].route) ||
            (stn.Lines && stn.Lines[0]) || "";
        const commuter = isCommuterRoute(primaryRoute);
        let html = `<div class="nearby-stop-card nearby-metro" role="button" tabindex="0" data-metro="1" data-stop="${esc(stn.Code)}">`
            + `<span class="hero-line-band" style="background:${metroLineColor(primaryRoute)}"></span>`
            + `<div class="nearby-card-head"><div class="nearby-card-main">`
            + `<div class="nearby-card-title">${nearbyModeIcon(true, commuter, metroLineColor(primaryRoute), false, primaryRoute)}${esc(stopName(stn.Name) || stn.Code)}</div>`
            + `<div class="nearby-card-sub">${esc([dist, "#" + stn.Code].filter(Boolean).join(" · "))}</div>`
            + `</div></div></div>`;
        if (rows.length)
            html += `<div class="nearby-board"><div class="board">${rowsHtml(rows)}</div></div>`;
        sections.push({ dist: stn.distFt == null ? Infinity : stn.distFt, html });
    }
    const crossKey = crossNearbyKeyFor("metro", station);
    if (crossKey && crossKey === crossNearbyKey) {
        for (const bs of crossBusNearby) sections.push(crossBusSectionHtml(bs));
    }
    sections.sort((a, b) => a.dist - b.dist);
    nearbyHtml = sections.map(s => s.html).join("");
    gLinesScroll.innerHTML = mainHtml + nearbyHtml;
    gLinesNote.textContent = "";
    if (gLinesScroll.querySelectorAll) {
        gLinesScroll.querySelectorAll(".bt-stoplist[data-metro-from]").forEach(ul => {
            if (!ul.hidden && !ul.dataset.loaded) loadMetroStops(ul);
        });
    }
    refreshBoardStopConnections();
    applyPendingFocus();
}

async function refreshMetro() {
    if (metroRefreshInFlight) { metroRefreshQueued = true; return; }
    metroRefreshInFlight = true;
    const anchor = metroAnchor;
    if (!anchor) { metroRefreshInFlight = false; return; }
    const anchorCode = String(anchor.Code);
    const nearby = metroNearby.filter(s => String(s.Code) !== anchorCode);
    let saw429 = false;
    try {
        const setLive = (code, live) => {
            metroLive[code] = live || [];
            metroLiveAt[code] = Date.now();
            delete metroLiveError[code];
        };
        const setError = (code, e) => {
            metroLive[code] = [];
            metroLiveAt[code] = Date.now();
            metroLiveError[code] = e;
            if (e && e.rateLimited) saw429 = true;
        };
        // 1) The current station's trains first, then its connections.
        try {
            const live = await fetchMetroLive([anchorCode]);
            setLive(anchorCode, live[anchorCode]);
        } catch (e) { setError(anchorCode, e); }
        if (mode !== "metro" || !metroAnchor || String(metroAnchor.Code) !== anchorCode)
            return;
        lastRefreshAt = Date.now();
        renderMetro();
        tickClock();
        await refreshBoardStopConnections();
        try {
            const sched = await ensureMetroSchedule([anchorCode]);
            Object.assign(metroSchedule, sched || {});
        } catch (e) { /* no schedule fallback */ }
        if (mode !== "metro" || !metroAnchor || String(metroAnchor.Code) !== anchorCode)
            return;
        renderMetro();

        // 2) Nearby stations in one batch, and only on their slower tier.
        const due = nearby.filter(stn => {
            const code = String(stn.Code);
            return !metroLiveAt[code] ||
                Date.now() - metroLiveAt[code] >= NEAR_REFRESH_MS;
        });
        if (due.length) {
            try {
                const live = await fetchMetroLive(due.map(s => String(s.Code)));
                for (const stn of due) {
                    const code = String(stn.Code);
                    setLive(code, live[code]);
                }
            } catch (e) {
                for (const stn of due) setError(String(stn.Code), e);
            }
            if (mode !== "metro" || !metroAnchor ||
                String(metroAnchor.Code) !== anchorCode) return;
            lastRefreshAt = Date.now();
            renderMetro();
            tickClock();
        }

        // 3) Schedules are secondary; then cross-mode nearby bus stops.
        const needSched = nearby.filter(stn =>
            !(metroLive[String(stn.Code)] || []).length).map(s => s.Code);
        if (needSched.length) {
            try {
                const sched = await ensureMetroSchedule(needSched);
                Object.assign(metroSchedule, sched || {});
            } catch (e) { /* no schedule fallback */ }
        }
        if (mode === "metro" && metroAnchor && String(metroAnchor.Code) === anchorCode) {
            renderMetro();
            ensureCrossBusNearby(anchor).catch(() => {});
        }
        rateLimited = saw429;
        scheduleRefresh();
    } finally {
        metroRefreshInFlight = false;
        if (metroRefreshQueued) {
            metroRefreshQueued = false;
            if (mode === "metro") refreshMetro();
        }
    }
}

function refreshActive() {
    if (typeof document !== "undefined" && document.visibilityState === "hidden") {
        scheduleRefresh();
        return;
    }
    return mode === "metro" ? refreshMetro() : refreshPredictions();
}

// ── Rail GTFS schedules (for "not seen" departures) ───────────────────
// The rail GTFS static zip is downloaded once per page session; schedule
// rows are cached per station/day.
let metroGtfs = null;
let metroGtfsLoad = null;
const metroScheduleCache = {};
{
    const cached = readCache("metroschedule");
    if (cached && cached.v && typeof cached.v === "object") {
        for (const id of Object.keys(cached.v)) {
            const rec = cached.v[id];
            if (rec && rec.day) metroScheduleCache[id] = rec;
        }
    }
}
const GTFS_LINES = { RED: "RD", BLUE: "BL", ORANGE: "OR",
                     SILVER: "SV", GREEN: "GR", YELLOW: "YL" };

function gtfsCsvFields(line) {
    const out = [];
    let cur = "", quoted = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (quoted) {
            if (c === '"') {
                if (line[i + 1] === '"') { cur += '"'; i++; }
                else quoted = false;
            } else cur += c;
        } else if (c === '"') quoted = true;
        else if (c === ",") { out.push(cur); cur = ""; }
        else cur += c;
    }
    out.push(cur);
    return out;
}

function zipU32(dv, off) {
    return dv.getUint32(off, true);
}

async function inflateRaw(bytes) {
    if (typeof DecompressionStream !== "function") return null;
    const ds = new DecompressionStream("deflate-raw");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzipEntries(buf) {
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
        if (zipU32(dv, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("bad zip");
    const count = dv.getUint16(eocd + 10, true);
    let p = zipU32(dv, eocd + 16);
    const entries = {};
    for (let i = 0; i < count; i++) {
        if (zipU32(dv, p) !== 0x02014b50) break;
        const method = dv.getUint16(p + 10, true);
        const compSize = zipU32(dv, p + 20);
        const nameLen = dv.getUint16(p + 28, true);
        const extraLen = dv.getUint16(p + 30, true);
        const commentLen = dv.getUint16(p + 32, true);
        const localOff = zipU32(dv, p + 42);
        const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nameLen));
        p += 46 + nameLen + extraLen + commentLen;
        const lNameLen = dv.getUint16(localOff + 26, true);
        const lExtraLen = dv.getUint16(localOff + 28, true);
        const dataStart = localOff + 30 + lNameLen + lExtraLen;
        entries[name] = { method, comp: new Uint8Array(buf, dataStart, compSize) };
    }
    return entries;
}

async function gtfsText(entries, name) {
    const e = entries[name];
    if (!e) return "";
    if (e.method === 0) return new TextDecoder().decode(e.comp);
    const raw = await inflateRaw(e.comp);
    return raw ? new TextDecoder().decode(raw) : "";
}

function gtfsTimeToMs(hms) {
    const parts = String(hms || "").split(":").map(Number);
    if (parts.length < 2 || parts.some(n => !Number.isFinite(n))) return NaN;
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime() + ((parts[0] * 3600 + parts[1] * 60 + (parts[2] || 0)) * 1000);
}

async function loadMetroGtfs() {
    if (metroGtfs) return metroGtfs;
    if (metroGtfsLoad) return metroGtfsLoad;
    metroGtfsLoad = (async () => {
        const res = await fetch(`${WMATA_API}/gtfs/rail-gtfs-static.zip?api_key=${encodeURIComponent(API_KEY)}`);
        if (!res.ok) throw new Error("GTFS " + res.status);
        const entries = await unzipEntries(await res.arrayBuffer());
        const [tripsText, stopTimesText, calText] = await Promise.all([
            gtfsText(entries, "trips.txt"),
            gtfsText(entries, "stop_times.txt"),
            gtfsText(entries, "calendar_dates.txt")
        ]);
        const d = new Date();
        const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
        const active = new Set();
        for (const line of calText.split("\n")) {
            if (!line.trim()) continue;
            const f = gtfsCsvFields(line);
            if (f[1] !== ymd) continue;
            if (f[2] === "1") active.add(f[0]);
            else if (f[2] === "2") active.delete(f[0]);
        }
        const trips = new Map();
        for (const line of tripsText.split("\n")) {
            if (!line.trim()) continue;
            const f = gtfsCsvFields(line);
            if (!active.has(f[1])) continue;
            trips.set(f[2], {
                route: GTFS_LINES[f[0]] || f[0],
                heads: f[3] || "",
                dir: f[4] || ""
            });
        }
        return { stopTimesText, trips };
    })()
      .then(g => { metroGtfs = g; return g; })
      .finally(() => { metroGtfsLoad = null; });
    return metroGtfsLoad;
}

async function ensureMetroSchedule(codes) {
    if (!cityCfg().capabilities.metroGtfs) return {};   // live-only rail feeds
    const d = new Date();
    const day = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
    if (codes.every(c => metroScheduleCache[c] && metroScheduleCache[c].day === day)) {
        const out = {};
        for (const c of codes) out[c] = metroScheduleCache[c].departures;
        return out;
    }
    const gtfs = await loadMetroGtfs();
    const codeSet = new Set(codes);
    const by = {};
    for (const c of codes) by[c] = [];
    const now = Date.now(), horizon = now + 4 * 3600 * 1000;
    for (const line of gtfs.stopTimesText.split("\n")) {
        if (!line) continue;
        const f = line.split(",");
        if (f.length < 4) continue;
        const m = /^(?:PF|PLF)_([A-Z][0-9]{2})_/.exec(f[3]);
        if (!m || !codeSet.has(m[1])) continue;
        const trip = gtfs.trips.get(f[0]);
        if (!trip) continue;
        const at = gtfsTimeToMs(f[2] || f[1]);
        if (!Number.isFinite(at) || at < now || at > horizon) continue;
        by[m[1]].push({ at, route: trip.route, heads: trip.heads, dirNum: trip.dir });
    }
    const out = {};
    for (const c of codes) {
        by[c].sort((a, b) => a.at - b.at);
        metroScheduleCache[c] = { day, departures: by[c] };
        out[c] = by[c];
    }
    writeCache("metroschedule", metroScheduleCache);
    return out;
}


// Re-fetch bus predictions for the stops currently shown, plus the confirmed
// across-the-street counterpart. Promise.all so the render happens once after
// every request has settled, including failures.
let refreshInFlight = false, refreshQueued = false;

async function refreshPredictions() {
    // Plan §4 coalescing: a timer tick, a tab return, and a selection change
    // can land together — they collapse into one request set per endpoint.
    if (refreshInFlight) { refreshQueued = true; return; }
    refreshInFlight = true;
    const v = selectionVersion;      // captured up front for the stale-result guard
    try {
        const target = new Map();               // StopID → stop object
        const anchor = anchorStop();
        if (anchor) target.set(String(anchor.StopID), anchor);
        if (acrossStop) target.set(String(acrossStop.StopID), acrossStop);
        for (const s of shownStops()) target.set(String(s.StopID), s);
        // Nearby sections need their own live predictions too; otherwise the
        // same stop looks different as the anchor vs a secondary section.
        const nearby = anchor
            ? nearbyStops(anchor).map(n => nearbyStopObj(n))
            : [];
        for (const stp of nearby) target.set(String(stp.StopID), stp);
        if (!target.size) return;

        const priorityIds = new Set();
        if (anchor) priorityIds.add(String(anchor.StopID));
        if (acrossStop) priorityIds.add(String(acrossStop.StopID));
        const priority = [...target.values()]
            .filter(s => priorityIds.has(String(s.StopID)));

        let saw429 = false;
        const applyResult = (stop, result) => {
            const { name, predictions } = result;
            if (name && !stop.Name) stop.Name = name;      // ?busstop= mode learns names here
            const at = Date.now();
            updateDeparted(stop, predictions, at);
            stop.Arrivals = predictions;
            stop.ArrivalsAt = at;
            stop.Error = null;
        };
        const applyError = (stop, e) => {
            stop.Arrivals = [];
            stop.Error = e;                                 // rendered as a muted row
            if (e && e.rateLimited) saw429 = true;
        };
        const fetchOne = async (stop) => {
            try {
                const result = await fetchPredictions(stop.StopID);
                applyResult(stop, result);
                return result.predictions || [];
            } catch (e) {
                applyError(stop, e);
                return [];
            }
        };
        const paint = () => {
            if (mode !== "bus") return;
            renderLines();
            tickClock();
        };

        if (cityCfg().capabilities.batchDepartures) {
            // One provider request covers the whole stop cluster.
            try {
                const batch = await cityProvider().departures([...target.keys()]);
                for (const stop of target.values()) {
                    const result = batch.get(String(stop.StopID));
                    if (result) applyResult(stop, result);
                    else applyError(stop, new Error("missing prediction result"));
                }
            } catch (e) {
                for (const stop of target.values()) applyError(stop, e);
            }
            if (v !== selectionVersion) { scheduleRefresh(); return; }
            lastRefreshAt = Date.now();
            paint();
            await refreshBoardStopConnections();
            if (v !== selectionVersion) { scheduleRefresh(); return; }
            paint();
        } else {
            // 1) The current stop (and its across-the-street counterpart) first.
            await Promise.all(priority.map(fetchOne));
            if (v !== selectionVersion) { scheduleRefresh(); return; }
            lastRefreshAt = Date.now();
            paint();
            // Hero connections are the next priority after the current arrivals.
            await refreshBoardStopConnections();
            if (v !== selectionVersion) { scheduleRefresh(); return; }
            // Schedule fallback for the current stop can arrive after the live rows.
            await Promise.all(priority.map(s => ensureStopSchedule(s.StopID)))
                .catch(() => {});
            if (v !== selectionVersion) { scheduleRefresh(); return; }
            paint();

            // 2) Then work through nearby stops in distance order. A stop is
            // polled on its own tier: selected rows every cycle, the nearest
            // nearby rows a minute or two, the rest only every few minutes.
            const nearbyIds = new Set(nearby.map(s => String(s.StopID)));
            const ordered = [...target.values()].filter(s =>
                !priorityIds.has(String(s.StopID)));
            ordered.sort((a, b) => {
                const ai = nearbyIds.has(String(a.StopID)) ? nearby.indexOf(a) : 1e9;
                const bi = nearbyIds.has(String(b.StopID)) ? nearby.indexOf(b) : 1e9;
                return (ai < 0 ? 1e9 : ai) - (bi < 0 ? 1e9 : bi);
            });
            for (const stop of ordered) {
                if (v !== selectionVersion) { scheduleRefresh(); return; }
                const ni = nearby.findIndex(s =>
                    String(s.StopID) === String(stop.StopID));
                const wait = ni >= 0 && ni < 3 ? NEAR_REFRESH_MS : FAR_REFRESH_MS;
                if (stop.ArrivalsAt && Date.now() - stop.ArrivalsAt < wait)
                    continue;
                const predictions = await fetchOne(stop);
                // Schedules are a fallback, not a first choice: only ask for
                // one when this stop has no live predictions for its rows.
                if (!predictions.length)
                    await ensureStopSchedule(stop.StopID).catch(() => {});
                if (v !== selectionVersion) { scheduleRefresh(); return; }
                lastRefreshAt = Date.now();
                paint();
            }
        }

        rateLimited = saw429;          // → next refresh is delayed (self-throttling)
        lastRefreshAt = Date.now();
        if (mode !== "bus") { scheduleRefresh(); return; }
        // Cross-mode nearby stops load after the same-mode current/nearby set.
        if (anchor) ensureCrossMetroNearby(anchor).catch(() => {});
        scheduleRefresh();             // re-arm: the refresh cycle continues after every tick
        tickClock();                   // reflect this update + the new countdown at once
        gStatus.textContent = rateLimited
            ? "API rate limit hit, slowing refresh"
            : (stops.length ? "" : gStatus.textContent);
    } finally {
        refreshInFlight = false;
        if (refreshQueued) {
            refreshQueued = false;
            // A selection change during the cycle queued its own refresh; run
            // that now against the new selection instead of waiting a tick.
            refreshPredictions();
        }
    }
}

// Periodic refresh: predictions only (the stop list itself rarely changes).
// After a 429 the interval stretches 5× to be polite to the shared key.
function scheduleRefresh() {
    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = null;
    if (!refreshEnabled) { nextRefreshAt = 0; return; }
    // Hidden tabs do not poll. Returning to the tab triggers an immediate
    // refresh from the visibilitychange handler below.
    if (typeof document !== "undefined" && document.visibilityState === "hidden") {
        nextRefreshAt = 0;
        return;
    }
    const base = rateLimited ? 5 * REFRESH_MS : REFRESH_MS;
    const wait = Math.max(1000, Math.round(base * (0.94 + Math.random() * 0.12)));
    nextRefreshAt = Date.now() + wait;
    refreshTimer = setTimeout(() => {
        refreshTimer = null;
        refreshActive();
    }, wait);
}

// Background tabs get throttled timers; refresh promptly when we come back.
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
        if (refreshTimer) clearTimeout(refreshTimer);
        refreshTimer = null;
        nextRefreshAt = 0;
        return;
    }
    const haveData = mode === "metro" ? !!metroAnchor : stops.length > 0;
    if (document.visibilityState === "visible" && refreshEnabled && !busy && haveData) {
        if (Date.now() - lastRefreshAt > REFRESH_MS / 2) {
            refreshActive();
        } else {
            scheduleRefresh();
        }
    }
});

// ════════════════════════════════════════════════════════════════════
// Rendering

function esc(s) {
    return String(s).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
}

// Stop names use "+" in the WMATA feed; display it as " and ".
function stopName(name) {
    return String(name || "").replace(/\s*\+\s*/g, " and ");
}

// The stops the board tracks. No pick: the nearby / ?busstop= list.
// With a pick: just that stop — resolved from the list when it's there, or
// materialized from the stop directory when the user picked a stop that is
// not in the list (it is then live-tracked like any other).
function shownStops() {
    if (!pickedStop) return stops;
    // A ?busstop= deep link keeps every requested ID in the tracked set
    // until the user explicitly picks another stop (pickedStopObj is set by
    // that pick; the URL prefill leaves it null).
    if (stopListFromURL && !forceNearby && !pickedStopObj) return stops;
    if (pickedStopObj) return [pickedStopObj];
    const inList = stops.find(s => s.StopID === pickedStop);
    return inList ? [inList] : stops;
}

// Re-anchor on a stop and put its name in the entry field. Home/work/
// like shortcuts all funnel through here.
async function gotoStop(id, name) {
    searchPoint = null;                 // explicit stop, not a nearby search
    forceNearby = false;
    id = String(id);
    const st = (allStopsCache || []).find(s => String(s.StopID) === id)
        || stops.find(s => String(s.StopID) === id)
        || makeStop(id, name || null, null, null);
    acStop.showPick(st);
    selectStop(id);
    if (!allStopsCache) {
        try {
            await loadStopDirectory();
            const dir = (allStopsCache || []).find(s => String(s.StopID) === id);
            if (dir && String(pickedStop) === id) acStop.showPick(dir);
        } catch (e) { /* the board retries the directory on its next paint */ }
    }
    updateShortcutNav();
}

function updateShortcutNav() {
    const noun = mode === "metro" ? "station" : "stop";
    for (const slot of SHORTCUT_SLOTS) {
        const btn = gShortcutBtns[slot];
        if (!btn) continue;
        if (slot === "fav") {
            btn.title = likes.length
                ? `All likes (${likes.length})` : "All likes";
            btn.setAttribute("aria-label", btn.title);
            continue;
        }
        const entries = allSlotEntries(slot);
        const label = shortcutLabel(slot);
        if (entries.length) {
            const names = entries.slice(0, 2).map(e => stopName(e.name) || `#${e.id}`);
            btn.title = `${label}: ${names.join(", ")}${entries.length > 2 ? ` +${entries.length - 2}` : ""}`;
            btn.setAttribute("aria-label", btn.title);
        } else if (slot === "home") {
            btn.title = mode === "metro" ? "Nearest Metro station" : `Home stop (${cityCfg().defaultStopId})`;
            btn.setAttribute("aria-label", btn.title);
        } else {
            btn.title = `No ${label} ${noun}s saved`;
            btn.setAttribute("aria-label", btn.title);
        }
    }
}

function goShortcut(slot) {
    const saved = shortcutList(shortcuts[slot])[0];
    if (mode === "metro") {
        if (saved && saved.id) { metroAnchorCode = saved.id; runMetro(); return; }
        if (slot === "home") { metroAnchorCode = null; runMetro(); return; }
        gStatus.textContent = `No ${shortcutLabel(slot)} station saved — open a station and tap its ${shortcutLabel(slot).toLowerCase()} icon.`;
        return;
    }
    if (saved && saved.id) { gotoStop(saved.id, saved.name); return; }
    if (slot === "home") { gotoStop(cityCfg().defaultStopId, null); return; }
    gStatus.textContent = `No ${shortcutLabel(slot)} stop saved — open a stop and tap its ${shortcutLabel(slot).toLowerCase()} icon.`;
}

function nearestByDistance(list, lat, lon) {
    let best = null, bestDist = Infinity;
    for (const s of list || []) {
        if (s.Lat == null || s.Lon == null) continue;
        const d = distance(lat, lon, Number(s.Lat), Number(s.Lon), "f");
        if (d < bestDist) { bestDist = d; best = s; }
    }
    return best;
}

function goCurrentLocation() {
    if (!navigator || !navigator.geolocation) {
        gStatus.textContent = "Geolocation not supported by this browser";
        return;
    }
    gStatus.textContent = "Locating…";
    navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        searchPoint = { lat, lon };
        try {
            if (mode === "metro") {
                const stations = await loadMetroStations();
                const hit = nearestByDistance(stations, lat, lon);
                if (!hit) { gStatus.textContent = "No Metro station found"; return; }
                setMetroAnchor(hit.Code);
            } else {
                const all = await loadStopDirectory();
                const hit = nearestByDistance(all, lat, lon);
                if (!hit) { gStatus.textContent = "No bus stop found"; return; }
                selectStop(hit.StopID);
            }
            gStatus.textContent = "";
        } catch (e) {
            gStatus.textContent = `Could not find the nearest stop: ${e.message}`;
        }
    }, () => {
        gStatus.textContent = "Turn on location sharing.";
    }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
}

function openSelectedInMaps() {
    let lat, lon, name;
    if (mode === "metro") {
        if (!metroAnchor) { gStatus.textContent = "No Metro station selected"; return; }
        lat = metroAnchor.Lat; lon = metroAnchor.Lon; name = metroAnchor.Name;
    } else {
        const st = anchorStop();
        if (!st || st.Lat == null || st.Lon == null) {
            gStatus.textContent = "No mapped location for the selected stop";
            return;
        }
        lat = st.Lat; lon = st.Lon; name = st.Name;
    }
    const label = stopName(name) || `${lat},${lon}`;
    const coords = `${encodeURIComponent(lat)},${encodeURIComponent(lon)}`;
    const center = { lat: Number(lat), lon: Number(lon) };
    const url = mapsProvider === "apple"
        ? appleFrameUrl(center, center)
        : (label && label !== `${lat},${lon}`
            ? `https://www.google.com/maps/place/${encodeURIComponent(label)}/@${lat},${lon},17z`
            : `https://www.google.com/maps/search/?api=1&query=${coords}`);
    window.open(url, "_blank", "noopener");
}

// Resolve a stop/station to a maps point. Coordinates make the route start
// and end exactly at the stops; the name is the fallback when none are known.
async function stopMapPoint(kind, id, name, line) {
    id = String(id || "");
    let label = stopName(name) || allStopsName(id) || id;
    let lat = null, lon = null;
    const fromCache = kind === "metro"
        ? (metroStationsCache || []).find(s => String(s.Code) === id)
        : (allStopsCache || []).find(s => String(s.StopID) === id);
    if (fromCache) {
        lat = Number(fromCache.Lat); lon = Number(fromCache.Lon);
        label = stopName(fromCache.Name) || label;
    }
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        lat = null; lon = null;
        try {
            const provider = cityProvider();
            if (provider.place) {
                const p = await provider.place(id).catch(() => null);
                if (p && Number.isFinite(p.lat) && Number.isFinite(p.lon)) {
                    lat = p.lat; lon = p.lon;
                    label = stopName(p.name) || label;
                }
            }
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
                if (kind === "metro") {
                    await loadMetroStations();
                    const st = (metroStationsCache || [])
                        .find(s => String(s.Code) === id);
                    if (st) { lat = Number(st.Lat); lon = Number(st.Lon); }
                } else if (line) {
                    const details = await fetchRouteDetails(line);
                    for (const d of (details && details.directions) || []) {
                        const s = d.byId && d.byId[id];
                        if (!s) continue;
                        if (Number.isFinite(s.lat) && Number.isFinite(s.lon)) {
                            lat = s.lat; lon = s.lon;
                            label = stopName(s.name) || label;
                        }
                        break;
                    }
                }
            }
        } catch (e) { /* name-only directions */ }
    }
    return { id, label, lat, lon };
}

function routeActionsHtml(kind, line, originId, originName, destId, destName, labelHtml) {
    const label = labelHtml || "";
    if (!originId || !destId || String(originId) === String(destId)) return label;
    const attrs = `data-route-kind="${esc(kind)}" data-route-line="${esc(line || "")}"`
        + ` data-route-origin="${esc(originId)}"`
        + ` data-route-origin-name="${esc(originName || "")}"`
        + ` data-route-dest="${esc(destId)}"`
        + ` data-route-dest-name="${esc(destName || "")}"`;
    return `<div class="route-actions">`
        + `<button type="button" class="route-action" ${attrs} data-route-action="see">`
        + `<i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>See route</button>`
        + label
        + `</div>`;
}

// Apple's frame endpoint shows a transit map covering both ends of the trip.
function appleFrameUrl(from, to) {
    const has = p => p && Number.isFinite(p.lat) && Number.isFinite(p.lon);
    if (!has(from) && !has(to))
        return "https://maps.apple.com/frame?map=transit";
    if (!has(from) || !has(to)) {
        const p = has(from) ? from : to;
        return `https://maps.apple.com/frame?map=transit&center=${p.lat},${p.lon}`
            + `&span=0.03,0.03`;
    }
    const lat = (from.lat + to.lat) / 2;
    const lon = (from.lon + to.lon) / 2;
    const span = Math.max(0.01,
        Math.abs(from.lat - to.lat) * 1.6,
        Math.abs(from.lon - to.lon) * 1.6);
    const n = v => Number(v.toFixed(5));
    return `https://maps.apple.com/frame?map=transit&center=${n(lat)},${n(lon)}`
        + `&span=${n(span)},${n(span)}`;
}

// Transit directions from the selected stop to the route's terminal stop.
async function openRouteInMaps(ds) {
    const kind = ds.routeKind || "bus";
    const line = ds.routeLine || "";
    const [from, to] = await Promise.all([
        stopMapPoint(kind, ds.routeOrigin, ds.routeOriginName, line),
        stopMapPoint(kind, ds.routeDest, ds.routeDestName, line)
    ]);
    const point = p => (p.lat != null && p.lon != null)
        ? `${p.lat},${p.lon}`
        : (p.label || p.id);
    const origin = encodeURIComponent(point(from));
    const dest = encodeURIComponent(point(to));
    const url = mapsProvider === "apple"
        ? appleFrameUrl(from, to)
        : `https://www.google.com/maps/dir/?api=1&origin=${origin}`
          + `&destination=${dest}&travelmode=transit`;
    window.open(url, "_blank", "noopener");
}
