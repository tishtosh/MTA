# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the
# in-progress and latest queued run. Do not cancel in-progress runs: production
# deployments should be allowed to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build/upload runs separately from deploy. This also avoids the intermittent
  # artifact-listing race when upload and deploy share one job.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pages must be enabled for this repository:
      #   Settings → Pages → Build and deployment → Source: GitHub Actions
      # GITHUB_TOKEN cannot create the Pages site. To enable it from CI,
      # add a repository secret PAGES_TOKEN (a PAT with Pages write /
      # administration access); configure-pages will then use it and try to
      # enable Pages automatically.
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.PAGES_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_TOKEN != '' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the entire repository
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
